itaalverkeer oplevert die niet proportioneel gerechtvaardigd is. De conclusie strekt tot gegrondverklaring van het cassatieberoep.", "rechtsregel": "Het uitsluiten van in een derde land wonende verkrijgers van de bedrijfsopvolgingsfaciliteiten omdat zij geen fictief aanmerkelijk belang kunnen verkrijgen, vormt een niet-proportioneel gerechtvaardigde belemmering van het vrije kapitaalverkeer (art. 56 EG-Verdrag).", "wetsartikelen": ["art. 25 Invorderingswet 1990", "art. 26 Invorderingswet 1990", "art. 35b SW 1956", "art. 4.10 Wet IB 2001", "art. 4.11 Wet IB 2001", "art. 4.17 Wet IB 2001", "art. 56 EG-Verdrag", "art. 26 IVBPR", "art. 14 EVRM"], "belang": "middel", "oordeel": "gegrond", "achterhaald": true, "achterhaald_reden": "De eis dat de aandelen ook bij de verkrijger tot een aanmerkelijk belang gaan behoren is per 1 januari 2002 vervallen en de faciliteit is naar hoofdstuk IIIA SW 1956 verplaatst, zodat het beslechte onderscheid zich onder het huidige recht niet meer voordoet.", "gerelateerd": ["ECLI:NL:HR:2009:BD0239"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2009:BD0239"}, {"ecli": "ECLI:NL:HR:2009:BG6455", "instantie": "Hoge Raad", "datum": "2009-06-19", "gepubliceerd": "2025-07-30", "zaaknummer": "08/01165", "onderwerp": "Turbotestament valt onder het bereik van art. 10 SW 1956", "samenvatting": "Bij het overlijden van de moeder in 1990 verkreeg de vader krachtens legaat het vruchtgebruik van haar helft van de huwelijksgoederengemeenschap, onder de last zijn eigen helft in de nalatenschap in te brengen onder voorbehoud van vruchtgebruik; de kinderen verkregen daardoor van beide helften de blote eigendom en betaalden daarover in 1993 successierecht (blote eigendom gewaardeerd op 52 percent). Na het overlijden van de vader in 2002 belastte de inspecteur bij belanghebbende op grond van art. 10 SW een verkrijging van EUR 125.358 (recht van successie onder de SW zoals die tot 2010 luidde). De Hoge Raad verwerpt het cassatieberoep: de aanvaarding van het legaat en de uitvoering van de last zijn rechtshandelingen waarbij de vader partij was en die ertoe hebben geleid dat belanghebbende ten laste van diens vermogen de blote eigendom verkreeg, zodat aan de eisen van art. 10 lid 1 SW is voldaan. Dat over die blote eigendom bij het eerste overlijden al successierecht is betaald, doet daaraan niet af; de wet biedt geen mogelijkheid dat recht in mindering te brengen.", "rechtsregel": "Een turbotestament valt onder art. 10 SW 1956: de aanvaarding van het legaat van vruchtgebruik en de uitvoering van de daaraan verbonden last zijn rechtshandelingen waarbij de erflater partij was en waardoor de verkrijger ten laste van diens vermogen de blote eigendom heeft verkregen, en de bij het eerste overlijden reeds geheven belasting kan niet in mindering worden gebracht.", "wetsartikelen": ["art. 10 lid 1 SW 1956"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2009:BG6455", "ECLI:NL:HR:2009:BJ5986"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2009:BG6455"}, {"ecli": "ECLI:NL:PHR:2009:BG6455", "instantie": "Parket bij de Hoge Raad", "datum": "2009-06-19", "gepubliceerd": "2025-07-30", "zaaknummer": "08/01165", "onderwerp": "Turbotestament valt onder art. 10 SW; geen verrekening eerder successierecht", "samenvatting": "Bij het overlijden van de moeder in 1990 verkreeg de vader krachtens legaat het vruchtgebruik van haar nalatenschap onder de last de blote eigendom van zijn eigen helft van de huwelijksgemeenschap in te brengen, hetgeen in de akte van boedelscheiding van 1994 is uitgevoerd; na zijn overlijden in 2002 belastte de inspecteur het aldus omgezette vermogen van EUR 250.716 op grond van art. 10 SW 1956 (regime van voor 2010). De A-G concludeert dat het begrip rechtshandeling in art. 10 niet is beperkt tot verbintenisscheppende overeenkomsten maar alle meerzijdige rechtshandelingen omvat, waaronder de verdeling en de levering waaraan de langstlevende meewerkte, zodat het turbotestament naar tekst, wetsgeschiedenis en strekking onder de fictiebepaling valt. Voor verrekening van het bij het eerste overlijden geheven successierecht biedt art. 10, lid 3 en lid 4, SW 1956 geen grondslag; alleen voor zover meer dan het gehele vermogen wordt belast acht hij een tegemoetkoming door de inspecteur op haar plaats.", "rechtsregel": "Onder rechtshandeling in de zin van art. 10 SW 1956 valt iedere meerzijdige rechtshandeling, waaronder de verdeling en de levering ter uitvoering van een testamentaire inbrengverplichting, zodat het bij een turbotestament omgezette eigen vermogen van de langstlevende bij diens overlijden fictief krachtens erfrecht wordt verkregen, zonder dat de wet verrekening van eerder geheven successierecht toelaat.", "wetsartikelen": ["art. 10 SW 1956", "art. 5 SW 1956", "art. 21 SW 1956", "art. 3:33 BW", "art. 3:182 BW", "art. 3:186 BW", "art. 4:19 BW", "art. 6:213 BW", "art. 13 WBR"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:HR:2009:BG6455"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2009:BG6455"}, {"ecli": "ECLI:NL:HR:2009:BI3761", "instantie": "Hoge Raad", "datum": "2009-05-15", "gepubliceerd": "2025-07-30", "zaaknummer": "41556", "onderwerp": "Art. 20 lid 3 SW: conserverende IB-aanslag niet aftrekbaar van de nalatenschap", "samenvatting": "Erflater overleed op 6 december 1998 met een aanmerkelijk belang in een N.V.; zijn in Belgie wonende enige erfgenaam werd voor een verkrijging van f 7.042.546 in het recht van successie aangeslagen (SW zoals die tot 2010 luidde). Ter zake van de fictieve vervreemding van art. 20a lid 6 letter f Wet IB 1964 werd ten name van erflater een navorderingsaanslag IB 1998 opgelegd, waarvoor de ontvanger uitstel van betaling tot 17 oktober 2011 verleende. In geschil was of die belastingschuld op grond van art. 20 lid 3 letter b SW van de nalatenschap kon worden afgetrokken. De Hoge Raad oordeelt van niet: de bepaling verhindert aftrek voor zover een recht op ontheffing geldend kan worden gemaakt (vgl. HR 16 oktober 1996, BNB 1996/406) en geldt naar haar strekking ook voor conserverende aanslagen waarvan na verloop van tijd onder voorwaarden kwijtschelding kan worden verleend; dat daarvoor een verzoek nodig is en dat eerst een aanslag moet zijn opgelegd, doet daaraan niet af. Wordt de schuld alsnog invorderbaar, dan wordt daarmee via art. 53 SW alsnog rekening gehouden.", "rechtsregel": "Art. 20 lid 3 letter b SW 1956 sluit aftrek van belastingschulden uit voor zover daarvoor ontheffing kan worden verkregen, en geldt naar zijn strekking ook voor een conserverende aanslag waarvoor na verloop van tijd onder voorwaarden kwijtschelding kan worden verleend; wordt die schuld alsnog invorderbaar, dan wordt daarmee alsnog rekening gehouden op de voet van art. 53 SW 1956.", "wetsartikelen": ["art. 20 lid 3 letter b SW 1956", "art. 53 SW 1956", "art. 20a lid 3 Wet IB 1964", "art. 20a lid 6 letter f Wet IB 1964"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHSHE:2004:AQ9861"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2009:BI3761"}, {"ecli": "ECLI:NL:HR:2009:BF3840", "instantie": "Hoge Raad", "datum": "2009-04-10", "gepubliceerd": "2025-07-30", "zaaknummer": "07/11724", "onderwerp": "Art. 12 SW: 180-dagenregeling ook bij niet-erfgenaam en buitenlandse schenker", "samenvatting": "Belanghebbende ontving op 27 april 2004 een schenking van haar oom, die vanaf 23 december 1974 in Belgie woonde, op 11 mei 2004 naar Nederland verhuisde en op 19 mei 2004 overleed; enig erfgenaam was zijn zuster, de moeder van belanghebbende. De inspecteur merkte de schenking met toepassing van art. 12 SW aan als een verkrijging krachtens erfrecht en legde een aanslag in het recht van successie op (SW zoals die tot 2010 luidde). De Hoge Raad verwerpt het cassatieberoep: de schenking is binnen 180 dagen voor het overlijden gedaan door een erflater die ten tijde van het overlijden in Nederland woonde, zodat art. 12 SW naar zijn tekst van toepassing is, en noch de totstandkomingsgeschiedenis noch de strekking van de bepaling biedt steun voor de eis dat de begiftigde tevens erfgenaam is of dat de schenker ten tijde van de schenking al in Nederland woonde.", "rechtsregel": "Voor toepassing van art. 12 SW 1956 is beslissend dat de schenking binnen 180 dagen voor het overlijden is gedaan door een erflater die ten tijde van het overlijden in Nederland woonde; niet vereist is dat de begiftigde tevens krachtens erfrecht verkrijgt, noch dat de erflater ten tijde van de schenking al in Nederland woonde.", "wetsartikelen": ["art. 12 SW 1956"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2009:BF3840", "ECLI:NL:RBARN:2007:BB2088"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2009:BF3840"}, {"ecli": "ECLI:NL:PHR:2009:BF3840", "instantie": "Parket bij de Hoge Raad", "datum": "2009-04-10", "gepubliceerd": "2025-07-30", "zaaknummer": "07/11724", "onderwerp": "180-dagenregeling art. 12 SW bij schenking door destijds in Belgie wonende erflater", "samenvatting": "Belanghebbende ontving op 27 april 2004 een schenking van EUR 1.317.052 van haar oom, die sinds 1974 in Belgie woonde, op 11 mei 2004 naar Nederland verhuisde en op 19 mei 2004 overleed; zij was geen erfgenaam. De aanslag successierecht van EUR 824.765 berust op art. 12 SW 1956. In cassatie betoogt zij dat de fictie niet geldt omdat zij geen erfgenaam is en de schenker ten tijde van de schenking niet in Nederland woonde. De A-G verwerpt beide standpunten: uit het woord erflater volgt niets over de kwalificatie van de verkrijger, en hoewel er argumenten zijn om de fictie beperkt uit te leggen omdat Nederland ten tijde van de schenking geen heffingsrecht had, zijn de verschillen met art. 10 SW 1956 te gering om anders te oordelen dan HR 25 september 1996, BNB 1996/377; ambtshalve merkt hij op dat buitenlands recht op de voet van art. 12, lid 2, juncto art. 10, lid 4, SW 1956 moet worden verrekend.", "rechtsregel": "Voor toepassing van art. 12 SW 1956 is beslissend dat de erflater ten tijde van zijn overlijden in Nederland woonde en dat de schenking binnen 180 dagen daarvoor is gedaan; niet vereist is dat de begiftigde tevens erfgenaam is, noch dat de erflater ten tijde van de schenking in Nederland woonde, waarbij in het buitenland geheven schenkingsrecht wordt verrekend.", "wetsartikelen": ["art. 1 SW 1956", "art. 3 SW 1956", "art. 5 SW 1956", "art. 10 SW 1956", "art. 12 SW 1956", "art. 27 SW 1956"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBARN:2007:BB2088", "ECLI:NL:HR:2009:BF3840"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2009:BF3840"}, {"ecli": "ECLI:NL:HR:2009:BF1029", "instantie": "Hoge Raad", "datum": "2009-03-20", "gepubliceerd": "2026-02-18", "zaaknummer": "43393", "onderwerp": "Geen schenking bij overname maatschapsaandeel tegen voortzettingswaarde", "samenvatting": "Belanghebbende zette het veehouderijbedrijf van de per 31 december 1999 ontbonden maatschap met zijn vader voort met gebruikmaking van een voortzettingsbeding, waarbij is uitgegaan van boekwaarde respectievelijk de waarde in verpachte staat en een melkquotum op nihil, tegen een overnamesom van f 96.602; de inspecteur stelde de schenking vast op f 250.919. De Hoge Raad oordeelt dat het hof ten onrechte aan de hand van het waarderingsvoorschrift van artikel 21 SW 1956 heeft beoordeeld of sprake is van een schenking, nu artikel 1, lid 2, SW destijds voor het schenkingsbegrip naar het Burgerlijk Wetboek verwees. Uit HR 13 februari 2004, NJ 2004/653 volgt dat voor zover waardering op een lagere dan de economische waarde noodzakelijk is om voortgezette bedrijfsuitoefening te verzekeren, in het algemeen sprake is van nakoming van een verplichting en niet van de vereiste bevoordelingsbedoeling; nu de inspecteur die noodzaak niet had weersproken, vernietigt de Hoge Raad de aanslag.", "rechtsregel": "Voor zover waardering van een over te nemen ondernemingsvermogen op een lagere dan de economische waarde noodzakelijk is om voortgezette bedrijfsuitoefening te verzekeren, is in het algemeen sprake van nakoming van een uit redelijkheid en billijkheid voortvloeiende verplichting en ontbreekt de voor een schenking vereiste bevoordelingsbedoeling.", "wetsartikelen": ["art. 1 SW 1956", "art. 21 SW 1956"], "belang": "hoog", "oordeel": "cassatie", "parallelzaken": ["ECLI:NL:HR:2009:BF1043"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2009:BF1029"}, {"ecli": "ECLI:NL:PHR:2009:BF1029", "instantie": "Parket bij de Hoge Raad", "datum": "2009-03-20", "gepubliceerd": "2026-02-18", "zaaknummer": "43393", "onderwerp": "Overname boerenbedrijf tegen agrarische waarde; schenking art. 1 lid 2 SW", "samenvatting": "Belanghebbende zette per 31 december 1999 de veehouderijmaatschap met zijn vader voort en nam op grond van het voortzettings- en overnemingsbeding de activa over tegen boekwaarde respectievelijk waarde in verpachte staat (melkquotum op nihil), tegen een overnamesom van f 96.602, onder een meerwaardeclausule van tien jaar; de Inspecteur stelde de schenking vast op f 250.919. A-G Van Ballegooijen betoogt dat art. 21 SW 1956 pas aan de orde komt nadat een schenking in de zin van art. 1, lid 2, SW 1956 is vastgesteld, maar dat het Hof terecht uit het aanmerkelijke verschil tussen overnamesom en waarde in het economische verkeer een materiële bevoordeling heeft afgeleid. Uit HR 13 februari 2004, NJ 2004/653 volgt niet dat een overdracht tegen agrarische waarde die voortvloeit uit redelijkheid en billijkheid tussen deelgenoten een schenking uitsluit; blijkens HR 4 maart 2005, NJ 2005/162 moet het geheel van de maatschapsverhouding worden meegewogen, en de voorwaardelijke meerwaardeclausule heeft geen waardedrukkend effect. De conclusie strekt tot ongegrondverklaring van het eerste middel.", "rechtsregel": "De overname door een kind van een agrarische onderneming tegen de agrarische waarde op grond van een overnemings- of verblijvensbeding sluit een bevoordeling uit vrijgevigheid in de zin van art. 1, lid 2, SW 1956 niet uit; beslissend is het geheel van de maatschapsverhouding, waarbij een reële meerwaardeclausule wegens haar voorwaardelijke karakter niet waardedrukkend werkt.", "wetsartikelen": ["art. 1 lid 2 SW 1956", "art. 21 SW 1956", "art. 21 lid 5 SW 1956", "art. 35c SW 1956", "art. 26 Invorderingswet 1990", "art. 8:69 Awb", "art. 8:77 Awb"], "belang": "hoog", "oordeel": "ongegrond", "parallelzaken": ["ECLI:NL:PHR:2009:BF1043"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2009:BF1029"}, {"ecli": "ECLI:NL:HR:2008:BF3807", "instantie": "Hoge Raad", "datum": "2008-10-03", "gepubliceerd": "2025-07-30", "zaaknummer": "42993", "onderwerp": "Persoon van de schenker is essentieel element van de aanslag schenkingsrecht", "samenvatting": "In een onderhandse akte van 22 december 2003 schonk de grootmoeder EUR 20.000 aan de moeder onder de last dat deze hetzelfde bedrag vrij van recht aan belanghebbende (de kleindochter) zou schenken. De inspecteur legde eerst aanslagen in het recht van schenking op uitgaande van een schenking door de moeder, verminderde die tot nihil en legde vervolgens aan belanghebbende een nieuwe aanslag op uitgaande van een verkrijging als lastbevoordeelde van de grootmoeder. Het Hof achtte dat een verkapte tweede aanslag voor dezelfde verkrijging waarvoor niet aan de navorderingsvoorwaarden was voldaan; de Hoge Raad casseert: nu de persoon van de schenker een essentieel element van de aanslag is (HR 3 februari 1988, BNB 1988/131), zien aanslagen die van verschillende schenkers uitgaan niet op dezelfde verkrijging. Ook het incidentele beroep over de proceskosten slaagt, omdat het gebruik van briefpapier met beconnummer meebrengt dat sprake was van beroepsmatig verleende rechtsbijstand. Het arrest ziet op het recht van schenking onder de SW zoals die tot 2010 luidde.", "rechtsregel": "De persoon van de schenker is een essentieel element van de aanslag in het schenkingsrecht, zodat twee aanslagen die van verschillende schenkers uitgaan niet dezelfde verkrijging betreffen en de inspecteur - zonder dat aan de navorderingsvoorwaarden hoeft te zijn voldaan - opnieuw kan aanslaan wanneer de eerst belaste schenking in werkelijkheid niet heeft plaatsgevonden.", "wetsartikelen": ["art. 40 lid 2 SW 1956", "art. 8:75 Awb"], "belang": "hoog", "oordeel": "verwijzing", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2008:BF3807"}, {"ecli": "ECLI:NL:RBHAA:2008:BF0254", "instantie": "Rechtbank Haarlem", "datum": "2008-09-05", "gepubliceerd": "2026-02-18", "zaaknummer": "07/8586, 07/8588 en 07/8590", "onderwerp": "Bedrijfsopvolgingsfaciliteit; financieringsvennootschap als beleggingslichaam", "samenvatting": "Tot de nalatenschap van de in 2005 overleden erflater behoorden (certificaten van) aandelen in een BV die haar vastgoedonderneming in de jaren tachtig had overgedragen aan drie vennootschappen van de kinderen en zich sindsdien uitsluitend bezighield met hypothecair gedekte financiering van die vennootschappen (vorderingen € 28.398.995, daarnaast effecten en liquiditeiten). In geschil was of de bedrijfsopvolgingsfaciliteit van art. 35b, tweede lid, onderdeel b, SW 1956 van toepassing was op de verkrijging van € 8.939.158 per erfgenaam. De rechtbank oordeelt dat de feitelijke werkzaamheid bestaat in het beleggen van vermogen of een daarmee overeenkomende werkzaamheid: door de hypothecaire zekerheid en een rendement van circa 4% zijn geen risico's aanvaard die een normale vermogensbeheerder niet zou aanvaarden, en er is geen actieve betrokkenheid bij de gelieerde ondernemingen. Beroepen ongegrond.", "rechtsregel": "Een vennootschap die haar onderneming heeft overgedragen en zich nog slechts bezighoudt met hypothecair gedekte financiering van gelieerde vennootschappen zonder actieve betrokkenheid bij hun ondernemingen, belegt vermogen in de zin van art. 35b, tweede lid, onderdeel b, SW 1956, zodat de bedrijfsopvolgingsfaciliteit niet van toepassing is.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 2 Wet Vpb 1969"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBHAA:2008:BF0254"}, {"ecli": "ECLI:NL:HR:2008:BD6835", "instantie": "Hoge Raad", "datum": "2008-07-11", "gepubliceerd": "2013-04-05", "onderwerp": "Schenkingsrecht: beroep niet-ontvankelijk (verkeerde procespartij)", "samenvatting": "Beroep ingesteld door een ander dan degene die bezwaar heeft gemaakt en tot wie de uitspraak op bezwaar was gericht, is niet-ontvankelijk. Formeel belastingrecht (procesrecht). Oud arrest opnieuw gepubliceerd.", "rechtsregel": "Het beroep in een schenkingsrechtzaak is niet-ontvankelijk als het wordt ingesteld door een andere belastingplichtige dan degene die bezwaar heeft gemaakt.", "wetsartikelen": ["art. 6:13 Awb", "art. 26a AWR"], "belang": "laag", "oordeel": "n.v.t.", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2008:BD6835"}, {"ecli": "ECLI:NL:HR:2008:BB3898", "instantie": "Hoge Raad", "datum": "2008-07-11", "gepubliceerd": "2025-07-30", "zaaknummer": "43547", "onderwerp": "Levensverzekering met erflater als verzekeraar: uitkering onbelast", "samenvatting": "Erflater sloot in december 1995 met belanghebbende (met wie hij in 1996 buiten gemeenschap huwde) een overlijdensrisicoverzekering waarbij hij zelf als verzekeraar en verzekerde optrad en zij als verzekeringnemer; verzekerd was f 2.000.000 tegen een zakelijk berekende jaarpremie van f 15.475, die zij uit door erflater geschonken bedragen voldeed. Na zijn overlijden in 2000 werd f 2.000.000 uitgekeerd; in geschil was of daarover recht van successie was verschuldigd (SW zoals die tot 2010 luidde). De Hoge Raad verwerpt alle vijf middelen: het aangaan van de overeenkomst verminderde de te verwachten omvang van de nalatenschap niet en vormde dus geen bevoordeling, art. 9 SW mist toepassing omdat belanghebbende de begunstiging kon wijzigen, art. 11 lid 2 SW ziet niet op een verbintenis tot betaling van een geldsom, en art. 13 SW stuit af op het premieschenkingsarrest (HR 17 februari 1954, BNB 1954/140) en de zinsnede 'tenzij voor de verkrijging niets aan het vermogen van de erflater is onttrokken'. Het feitelijke oordeel dat belastingbesparing niet doorslaggevend was, blokkeert het beroep op fraus legis.", "rechtsregel": "Een op zakelijke premie gesloten overlijdensrisicoverzekering waarbij de erflater zelf als verzekeraar en verzekerde optreedt, leidt niet tot een bevoordeling van de verzekeringnemer, zodat voor de uitkering niets aan het vermogen van de erflater is onttrokken in de zin van art. 13 SW 1956 en de uitkering - ook via art. 1, 9 of 11 SW of fraus legis - niet in de erfbelasting kan worden betrokken.", "wetsartikelen": ["art. 1 SW 1956", "art. 9 SW 1956", "art. 11 lid 2 SW 1956", "art. 13 SW 1956"], "belang": "hoog", "oordeel": "ongegrond", "parallelzaken": ["ECLI:NL:HR:2008:BB4363"], "gerelateerd": ["ECLI:NL:PHR:2008:BB3898", "ECLI:NL:GHSHE:2006:AY7739"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2008:BB3898"}, {"ecli": "ECLI:NL:PHR:2008:BB4363", "instantie": "Parket bij de Hoge Raad", "datum": "2008-07-11", "gepubliceerd": "2025-07-30", "zaaknummer": "43527", "onderwerp": "Art. 13 SW; erflater als verzekeraar bij overlijdensrisicoverzekering; fraus legis", "samenvatting": "Erflater sloot in december 1995 met elk van zijn twee kinderen een overlijdensrisicoverzekering waarbij hij zelf als verzekeraar en verzekerd lijf optrad en waarbij bij zijn overlijden voor 21 december 2005 f 3.000.000 per kind zou worden uitgekeerd; hij schonk hun jaarlijks het premiebedrag van f 23.175. Na zijn overlijden in 2000 is in geschil of de uitkeringen onder de SW zoals die tot 2010 luidde met successierecht zijn belast. De A-G oordeelt dat ook een overeenkomst met een natuurlijk persoon als verzekeraar, die tevens verzekerde is, een levensverzekering is en dat art. 11, lid 2, SW 1956 niet van toepassing is, maar dat art. 13 SW 1956 wel geldt: nu de uitkeringen uit het vermogen van de erflater zijn gedaan, is niet aangetoond dat voor de verkrijging niets aan zijn vermogen is onttrokken. Het oordeel van het Hof dat fraus legis van toepassing is, acht de A-G ondeugdelijk gemotiveerd omdat de bewijslast ten onrechte bij belanghebbenden is gelegd en het strijd-met-doel-en-strekkingvereiste niet is vervuld.", "rechtsregel": "Een overeenkomst waarbij een natuurlijk persoon zowel verzekeraar als verzekerd lijf is, is een overeenkomst van levensverzekering in de zin van art. 13 SW 1956, en de uitzondering dat voor de verkrijging niets aan het vermogen van de erflater is onttrokken gaat niet op indien de uitkering zelf ten laste van diens vermogen komt, ook als de premies uit geschonken middelen zijn voldaan.", "wetsartikelen": ["art. 1 SW 1956", "art. 9 SW 1956", "art. 11 SW 1956", "art. 13 SW 1956", "art. 4:4 BW", "art. 4:82 BW", "art. 3.116 Wet IB 2001", "art. 3.126 Wet IB 2001"], "belang": "hoog", "oordeel": "gegrond", "parallelzaken": ["ECLI:NL:PHR:2008:BB3898"], "gerelateerd": ["ECLI:NL:GHSHE:2006:AY7711", "ECLI:NL:HR:2008:BB4363"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2008:BB4363"}, {"ecli": "ECLI:NL:HR:2008:BB3392", "instantie": "Hoge Raad", "datum": "2008-06-06", "gepubliceerd": "2025-07-30", "zaaknummer": "43209", "onderwerp": "Art. 10 SW niet van toepassing bij koop woning met uitgestelde levering", "samenvatting": "Erflater verkocht in 1996 zijn woning voor f 150.000 aan zijn zoon, waarbij levering en betaling van de koopsom werden uitgesteld tot uiterlijk zes maanden na zijn overlijden; hij overleed in 1998, de woning was toen f 850.000 waard. De inspecteur belastte het verschil van f 700.000 als fictieve verkrijging op grond van art. 10 SW (recht van successie onder de SW zoals die tot 2010 luidde). De Hoge Raad bevestigt het Hof: art. 10 SW ziet op rechtshandelingen die een vermogensbestanddeel omzetten in een bij overlijden eindigend genotsrecht, en nu de woning zowel juridisch als economisch tot erflaters vermogen bleef behoren (de lasten en het risico van tenietgaan gingen niet over), is van zo'n omzetting - ook in economische zin - geen sprake. Het oordeel is niet onverenigbaar met de jurisprudentie over schuldigerkenningen zonder rentebetaling (HR 17 juni 1959, BNB 1959/306) of met HR 25 februari 1981, BNB 1981/101, en art. 3:85 lid 2 BW ziet niet op koop op termijn; de Hoge Raad ziet ook geen aanleiding terug te komen van HR 22 juli 1980, BNB 1981/332 (art. 11 SW).", "rechtsregel": "Van een fictieve verkrijging op grond van art. 10 SW 1956 is geen sprake bij een verkoop met uitgestelde levering en uitgestelde betaling van de koopsom tot na het overlijden, indien het verkochte goed tot het overlijden zowel in juridische als in economische zin (lasten en risico van tenietgaan) tot het vermogen van de erflater is blijven behoren, zodat geen omzetting van eigendom in een genotsrecht heeft plaatsgevonden.", "wetsartikelen": ["art. 10 SW 1956", "art. 11 SW 1956", "art. 1 SW 1956", "art. 3:85 lid 2 BW", "art. 81 Wet RO"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2008:BB3392", "ECLI:NL:GHAMS:2006:AV7951"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2008:BB3392"}, {"ecli": "ECLI:NL:PHR:2008:BB3392", "instantie": "Parket bij de Hoge Raad", "datum": "2008-06-06", "gepubliceerd": "2025-07-30", "zaaknummer": "43209", "onderwerp": "Art. 10 SW bij verkoop woning met levering en betaling na overlijden", "samenvatting": "Erflater verkocht in 1996 zijn woning aan zijn zoon voor f 150.000, met levering en betaling uiterlijk zes maanden na zijn overlijden; na het overlijden in 1998 merkte de inspecteur het verschil met de leegwaarde van f 850.000, dus f 700.000, aan als fictieve erfrechtelijke verkrijging op grond van art. 10 SW 1956 (regime van voor 2010). De A-G concludeert dat art. 10 naar letter noch naar doel en strekking van toepassing is: de erflater bleef eigenaar en heeft het genot ontleend aan zijn eigendomsrecht, zodat hij niet in verband met de rechtshandeling het genot van een vruchtgebruik heeft gehad dat ten laste van de verkrijger kwam, en er geen omzetting van eigendom in een genotsrecht met waardeaangroei van bloot naar vol eigendom plaatsvond. Ook art. 3:85, lid 2, BW mist toepassing omdat de gehele obligatoire overeenkomst onder opschortende tijdsbepaling is gesloten, en art. 11, lid 2, SW 1956 blijft buiten toepassing conform HR 22 juli 1980, BNB 1981/332; heroverweging van dat arrest is aan de wetgever.", "rechtsregel": "Bij verkoop van een goed waarbij zowel levering als betaling zijn uitgesteld tot na het overlijden van de verkoper heeft de erflater het genot ontleend aan zijn eigendom en niet aan een vruchtgebruik, zodat art. 10 SW 1956 toepassing mist, terwijl art. 11, lid 2, SW 1956 evenmin van toepassing is omdat het recht op levering reeds tijdens leven was verkregen.", "wetsartikelen": ["art. 1 SW 1956", "art. 10 SW 1956", "art. 11 SW 1956", "art. 18 SW 1956", "art. 21 SW 1956", "art. 3:84 BW", "art. 3:85 BW", "art. 3:89 BW", "art. 3:186 BW", "art. 13 WBR"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHAMS:2006:AV7951", "ECLI:NL:HR:2008:BB3392"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2008:BB3392"}, {"ecli": "ECLI:NL:HR:2008:BB0428", "instantie": "Hoge Raad", "datum": "2008-03-21", "gepubliceerd": "2025-07-30", "zaaknummer": "43126", "onderwerp": "Buitenlandse ANBI heeft ook recht op het verlaagde tarief (EG-recht)", "samenvatting": "Een in het Verenigd Koninkrijk gevestigde instelling die materieel een het algemeen nut beogende instelling was, verkreeg in 2002 uit een Nederlandse nalatenschap en werd — onder de SW zoals die tot 2010 luidde — belast naar tariefgroep III (circa 50 percent) in plaats van naar het ANBI-tarief van 11 percent van art. 24, lid 4, SW 1956, omdat het Verenigd Koninkrijk geen wederkerigheidsverklaring als bedoeld in art. 67, lid 2, letter d, SW had afgelegd. De Hoge Raad bevestigt dat het tariefsonderscheid naar vestigingsplaats een beperking van het kapitaalverkeer in de zin van art. 56 EG is, en oordeelt dat het ontbreken van een wederkerigheidsverklaring geen rechtvaardiging op grond van art. 58 EG oplevert, reeds omdat art. 56 EG die wederkerigheid zelf bewerkstelligt. Ook de doeltreffendheid van de fiscale controle rechtvaardigt geen categorische uitsluiting, nu de Belastingdienst van de buitenlandse instelling bewijsstukken kan verlangen waarmee de ANBI-status wordt geverifieerd (vgl. HvJ EG Centro di Musicologia Walter Stauffer, C-386/04). De Hoge Raad doet de zaak zelf af en vermindert de aanslag.", "rechtsregel": "Een verschil in behandeling tussen binnen en buiten Nederland gevestigde het algemeen nut beogende instellingen vormt een beperking van het vrije kapitaalverkeer die niet kan worden gerechtvaardigd door het ontbreken van een wederkerigheidsverklaring of door de doeltreffendheid van de fiscale controle, omdat de fiscus van de buitenlandse instelling bewijsstukken kan verlangen; het concrete tariefsonderscheid van art. 24 lid 4 SW 1956 bestaat inmiddels niet meer.", "wetsartikelen": ["art. 24 lid 4 SW 1956", "art. 67 lid 2 letter d SW 1956", "art. 56 EG", "art. 58 EG"], "belang": "middel", "oordeel": "cassatie", "achterhaald": true, "achterhaald_reden": "Het tariefsonderscheid van art. 24 lid 4 SW 1956 bestaat niet meer: ANBI's zijn sinds 1 januari 2010 geheel vrijgesteld van erf- en schenkbelasting en de ANBI-status staat ook open voor in de EU/EER gevestigde instellingen, waarmee de wetgever aan dit arrest gevolg heeft gegeven.", "gerelateerd": ["ECLI:NL:PHR:2008:BB0428"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2008:BB0428"}, {"ecli": "ECLI:NL:PHR:2008:BB0428", "instantie": "Parket bij de Hoge Raad", "datum": "2008-03-21", "gepubliceerd": "2025-03-22", "zaaknummer": "43126", "onderwerp": "Vestigingseis art. 24, lid 4, SW voor buitenlandse anbi en vrij kapitaalverkeer", "samenvatting": "Een in het Verenigd Koninkrijk gevestigde trust verkreeg in 2002 EUR 150.524 uit een Nederlandse nalatenschap en werd belast naar het algemene tarief (EUR 74.348), terwijl twee in Nederland gevestigde algemeen nut beogende instellingen met eenzelfde verkrijging het tarief van 11% van art. 24, lid 4, SW 1956 genoten; het VK had geen wederkerigheidsverklaring als bedoeld in art. 67, lid 2, SW 1956 afgegeven. Onder de SW zoals die tot 2010 luidde is in geschil of de eis van vestiging binnen het Rijk verenigbaar is met het vrije kapitaalverkeer. De A-G concludeert - in het voetspoor van HvJ EG 14 september 2006, C-386/04 (Stauffer) - dat de vestigingseis een niet te rechtvaardigen belemperking van art. 56 EG-Verdrag oplevert: de wederkerigheidseis is onverenigbaar met het onvoorwaardelijke karakter van de verdragsvrijheden, doeltreffende fiscale controle rechtvaardigt geen absolute uitsluiting en van coherentie is geen sprake omdat ook van binnenlandse instellingen geen binnenlandse gerichtheid wordt geeist.", "rechtsregel": "De eis dat een algemeen nut beogende instelling binnen het Rijk is gevestigd om voor het verlaagde successietarief in aanmerking te komen, vormt een door geen rechtvaardigingsgrond gedekte beperking van het vrije kapitaalverkeer, ook wanneer een discretionaire kwijtscheldingsregeling met wederkerigheidseis bestaat; de betrokken bepalingen zijn inmiddels vervallen.", "wetsartikelen": ["art. 24 SW 1956", "art. 32 SW 1956", "art. 33 SW 1956", "art. 67 SW 1956", "art. 56 EG-Verdrag", "art. 58 EG-Verdrag", "art. 6 EVRM"], "belang": "middel", "oordeel": "gegrond", "achterhaald": true, "achterhaald_reden": "Het proportionele anbi-tarief van art. 24, lid 4, SW 1956 met vestigingseis is vervangen door een algehele vrijstelling (thans art. 32, lid 1, onder 3, en art. 33, onder 4, SW 1956 juncto art. 5b AWR), die ook openstaat voor in andere lidstaten gevestigde instellingen.", "gerelateerd": ["ECLI:NL:HR:2008:BB0428"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2008:BB0428"}, {"ecli": "ECLI:NL:HR:2008:AZ6924", "instantie": "Hoge Raad", "datum": "2008-01-18", "gepubliceerd": "2025-07-30", "zaaknummer": "43181", "onderwerp": "Gemeenschappelijke huishouding eindigt bij opname in verzorgingstehuis", "samenvatting": "Belanghebbende voerde vanaf 1963 een gemeenschappelijke huishouding met erflaatster, later samen met zijn echtgenote; erflaatster, lijdend aan multiple sclerose, werd in 1993 in een verzorgingstehuis opgenomen, waarna de gezamenlijke woning werd verkocht en het echtpaar verhuisde, met een kamer die voor erflaatster beschikbaar bleef. Bij haar overlijden in 2001 was in geschil of belanghebbende voor het recht van successie — onder de SW zoals die tot 2010 luidde — op grond van art. 24, lid 2, letter b, SW 1956 onder tariefgroep I viel dan wel onder tariefgroep III. De Hoge Raad laat het oordeel van het Hof in stand dat de gedragingen van betrokkenen er onvoldoende blijk van gaven dat bij hen in werkelijkheid nog de wil bestond het feitelijk samenwonen te hervatten, zodat de gemeenschappelijke huishouding niet tot het overlijden heeft voortgeduurd; dat oordeel is van feitelijke aard en kan in cassatie niet op juistheid worden getoetst. Het beroep is ongegrond.", "rechtsregel": "Een gemeenschappelijke huishouding duurt na opname van een van de betrokkenen in een verzorgingstehuis alleen voort indien uit hun gedragingen blijkt dat bij hen in werkelijkheid nog de wil bestond het feitelijk samenwonen te hervatten; het antwoord daarop is een feitelijk oordeel.", "wetsartikelen": ["art. 24 lid 2 SW 1956", "art. 81 Wet RO"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "De tariefgroepindeling op grond van een gemeenschappelijke huishouding (art. 24 lid 2 SW 1956) is per 1 januari 2010 vervangen door het partnerbegrip van art. 1a SW 1956, dat andere en aanmerkelijk strengere eisen stelt.", "gerelateerd": ["ECLI:NL:PHR:2008:AZ6924", "ECLI:NL:GHARN:2006:AV6380"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2008:AZ6924"}, {"ecli": "ECLI:NL:PHR:2008:AZ6924", "instantie": "Parket bij de Hoge Raad", "datum": "2008-01-18", "gepubliceerd": "2025-07-30", "zaaknummer": "43181", "onderwerp": "Gemeenschappelijke huishouding art. 24, lid 2, SW na opname in verzorgingstehuis", "samenvatting": "Belanghebbende voerde vanaf 1963 met zijn tante (erflaatster) een gemeenschappelijke huishouding; in 1993 werd zij wegens multiple sclerose opgenomen in een verzorgingstehuis, waarna de woning is verkocht en belanghebbende verhuisde, met behoud van een kamer voor haar spullen. Na haar overlijden in 2001 werd de verkrijging van f 340.538 belast naar tariefgroep III omdat het Hof - uitsluitend op objectieve factoren - oordeelde dat de gemeenschappelijke huishouding in de zin van art. 24, lid 2, SW 1956 (zoals dat tot 2010 luidde) was verbroken. De A-G acht dat oordeel in strijd met HR BNB 1986/135, waaruit volgt dat aan de wil van betrokkenen tot voortzetting doorslaggevende betekenis toekomt, en acht ook het beroep op de door de staatssecretaris in de Eerste Kamer gedane toezegging over toepassing van art. 63 AWR in schrijnende gevallen gegrond; nu de gestelde wil niet is weersproken kan de Hoge Raad de zaak zelf afdoen.", "rechtsregel": "Bij opname van een partner in een ziekenhuis, verpleeg- of verzorgingstehuis eindigt de gemeenschappelijke huishouding pas wanneer sprake is van een als definitief bedoeld uiteengaan, zodat de rechter niet mag volstaan met objectieve omstandigheden maar ook de op voortzetting gerichte wil van betrokkenen moet meewegen; de bepaling zelf is per 2010 vervangen door het partnerbegrip van art. 1a SW 1956.", "wetsartikelen": ["art. 24 SW 1956", "art. 63 AWR", "art. 29e AWR", "art. 1.2 Wet IB 2001"], "belang": "middel", "oordeel": "gegrond", "achterhaald": true, "achterhaald_reden": "Het begrip gemeenschappelijke huishouding van art. 24, lid 2, SW 1956 is per 1 januari 2010 vervallen en vervangen door het geobjectiveerde partnerbegrip van art. 1a SW 1956, dat een notarieel samenlevingscontract met wederzijdse zorgverplichting eist.", "gerelateerd": ["ECLI:NL:GHARN:2006:AV6380", "ECLI:NL:HR:2008:AZ6924"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2008:AZ6924"}, {"ecli": "ECLI:NL:HR:2007:AZ1715", "instantie": "Hoge Raad", "datum": "2007-10-19", "gepubliceerd": "2025-07-30", "zaaknummer": "41938", "onderwerp": "Geen aparte tariefgroep voor neven en nichten; geen discriminatie", "samenvatting": "Een nicht (oomzegger) verkreeg in 2001 uit de nalatenschap van haar oom en werd onder de SW zoals die tot 2010 luidde belast naar tariefgroep III van art. 24 SW 1956, de groep van willekeurige derden, met een toptarief van 68 percent. De Hoge Raad stelt voorop dat de wetgever bij het indelen van belastingplichtigen in tariefgroepen en bij het bepalen van de tarieven een ruime beoordelingsvrijheid toekomt, die moet worden geëerbiedigd tenzij zij van redelijke grond is ontbloot. Het per 1 januari 1981 laten vervallen van de aparte tariefgroep voor kinderen van broers en zusters berustte op het buitenkanskarakter van de heffing en op de opvatting dat het zeer verfijnde verwantschapsonderscheid niet langer voldoende aansprak; die redengeving is niet onredelijk. Uit de enkele hoogte van het tarief volgt evenmin een excessieve last, ook niet omdat het vermogen deels zelf door vererving was verkregen, zodat art. 26 IVBPR, art. 14 EVRM en art. 1 Eerste Protocol niet zijn geschonden en het beroep ongegrond is.", "rechtsregel": "Bij de indeling van verkrijgers in tariefgroepen en bij het bepalen van de hoogte van de tarieven komt de wetgever een ruime beoordelingsvrijheid toe; zijn keuze om kinderen van broers en zusters voor de tariefstelling met willekeurige derden gelijk te stellen is niet van redelijke grond ontbloot en levert geen strijd op met het discriminatieverbod of het eigendomsrecht.", "wetsartikelen": ["art. 24 SW 1956", "art. 26 IVBPR", "art. 14 EVRM", "art. 1 Eerste Protocol EVRM"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2007:AZ1715"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2007:AZ1715"}, {"ecli": "ECLI:NL:PHR:2007:AZ1715", "instantie": "Parket bij de Hoge Raad", "datum": "2007-10-19", "gepubliceerd": "2025-07-30", "zaaknummer": "41938", "onderwerp": "Tariefgroep III voor neven en nichten; discriminatieverbod en eigendomsrecht", "samenvatting": "Belanghebbende verkreeg in 2001 uit de nalatenschap van haar oom; de aanslag is berekend naar tariefgroep III van art. 24 SW 1956 (zoals die tot 2010 luidde), met een effectieve druk van 67,3%. Zij betoogt dat de gelijkstelling van broers- en zusterskinderen met willekeurige derden in strijd is met art. 26 IVBPR en art. 14 EVRM in verbinding met art. 1 Eerste Protocol EVRM, en dat het tarief neerkomt op confiscatie. In een gezamenlijke bijlage bij de zaken 41938, 41943 en 41944 concludeert de A-G dat de wetgever - ondanks de overwegend budgettaire motivering van de samenvoeging van tariefgroepen in 1981 en de afwijzing van het voorstel-Moltmaker in 2001 - binnen zijn ruime beoordelingsmarge is gebleven: het buitenkansbeginsel rechtvaardigt progressie naar verwantschap, het onderscheid is niet overduidelijk onevenredig en van een individual and excessive burden is geen sprake.", "rechtsregel": "De wetgever mag bij de tariefstelling van de successiebelasting differentieren naar verwantschapsgraad en beschikt daarbij over een ruime beoordelingsmarge, zodat het onderbrengen van broers- en zusterskinderen in de hoogste tariefgroep geen verboden discriminatie of ontoelaatbare aantasting van het eigendomsrecht oplevert; de concrete tariefindeling is achterhaald door de tariefherziening van 2010.", "wetsartikelen": ["art. 24 SW 1956", "art. 26 IVBPR", "art. 14 EVRM", "art. 1 Eerste Protocol EVRM"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Per 1 januari 2010 is art. 24 SW 1956 vervangen door een stelsel met twee tariefgroepen en aanzienlijk lagere tarieven (maximaal 40%), zodat de bestreden tariefgroep III met tarieven tot 68% niet meer bestaat.", "gerelateerd": ["ECLI:NL:HR:2007:AZ1715"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2007:AZ1715"}, {"ecli": "ECLI:NL:PHR:2007:AZ1776", "instantie": "Parket bij de Hoge Raad", "datum": "2007-10-19", "gepubliceerd": "2025-07-30", "zaaknummer": "41943", "onderwerp": "Tariefgroep III bij verkrijging door nicht van oom; toetsing aan EVRM en IVBPR", "samenvatting": "Aan belanghebbende is ter zake van haar verkrijging in 2001 uit de nalatenschap van haar oom een aanslag successierecht opgelegd naar tariefgroep III van art. 24 SW 1956 (regime van voor 2010), met een effectieve belastingdruk van 67,3%. Zij stelt dat de gelijkstelling van broers- en zusterskinderen met niet-verwanten in strijd is met art. 26 IVBPR en art. 14 EVRM juncto art. 1 Eerste Protocol EVRM, en dat het tarief het eigendomsrecht schendt. De A-G concludeert - onder verwijzing naar de gezamenlijke bijlage bij de zaken 41938, 41943 en 41944 en mede op basis van rechtsvergelijking met omringende landen - tot ongegrondverklaring, omdat de wetgever de positie van broers- en zusterskinderen ongelijk mocht achten aan die van naaste verwanten en het tarief binnen zijn ruime beoordelingsmarge mocht vaststellen.", "rechtsregel": "Het rechtens beschermde onderscheid naar verwantschapsgraad in het successietarief hoeft niet verder te worden verfijnd dan de wetgever heeft gedaan, en de in een concreet geval bestaande verwachting van een verkrijging (het buitenkanskarakter) is voor de tariefgroepindeling rechtens niet relevant; de betrokken tariefindeling is inmiddels achterhaald.", "wetsartikelen": ["art. 24 SW 1956", "art. 26 IVBPR", "art. 14 EVRM", "art. 1 Eerste Protocol EVRM"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "De in 1981 ingevoerde indeling in drie tariefgroepen met een toptarief van 68% is per 1 januari 2010 vervangen door twee tariefgroepen met een toptarief van 40%.", "parallelzaken": ["ECLI:NL:PHR:2007:AZ1778"], "gerelateerd": ["ECLI:NL:HR:2007:AZ1776"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2007:AZ1776"}, {"ecli": "ECLI:NL:HR:2007:BA4803", "instantie": "Hoge Raad", "datum": "2007-05-11", "gepubliceerd": "2025-07-30", "zaaknummer": "42268", "onderwerp": "Bedrijfsopvolging: geen kwijtschelding bij latere kwijtschelding koopsom", "samenvatting": "Vader verkocht in augustus 1997 bij notariële akte zijn aandeel in een tussen hem en zijn zoon bestaande vennootschap aan de zoon, die ƒ 134.500 schuldig bleef in de vorm van een bij schuldvernieuwing ontstane geldlening; op 6 januari 1998 schold vader die lening kwijt, waarover recht van schenking werd geheven onder de SW zoals die tot 2010 luidde. De zoon verzocht om kwijtschelding van schenkingsrecht op grond van art. 26, lid 3, Invorderingswet 1990 (tekst 1999). De Hoge Raad oordeelt dat het begrip verkrijging in die bepaling aansluit bij art. 1 SW 1956, zodat de faciliteit alleen geldt indien ondernemingsvermogen zelf object van de schenking is; de toerekeningspassage behelst slechts een kwantitatieve beperking en geen versoepeling van dat uitgangspunt. Het beroep is ongegrond: de wet geeft geen aanspraak, en ook het besluit van 27 april 2004 dwingt daar niet toe omdat dat een onverbrekelijke, zeer nauwe relatie tussen overdracht en kwijtschelding eist, die bij kwijtschelding na verloop van tijd ontbreekt.", "rechtsregel": "De bedrijfsopvolgingsfaciliteit is alleen van toepassing indien het ondernemingsvermogen zelf voorwerp van de schenking is; de latere kwijtschelding van een uit de overdracht van een onderneming ontstane koopsomschuld is een schenking van een geldvordering en geeft daarom krachtens de wet geen aanspraak op de faciliteit.", "wetsartikelen": ["art. 26 lid 3 Invorderingswet 1990", "art. 1 SW 1956", "art. 81 Wet RO"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "De kwijtscheldingsfaciliteit van art. 26 lid 3 Invorderingswet 1990 is opgegaan in de bedrijfsopvolgingsregeling van art. 35b e.v. SW 1956, zodat de uitgelegde bepaling zelf niet meer geldt; de eis dat ondernemingsvermogen object van de verkrijging is, werkt daarin wel door.", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2007:BA4803"}, {"ecli": "ECLI:NL:HR:2007:AX0771", "instantie": "Hoge Raad", "datum": "2007-04-06", "gepubliceerd": "2025-07-30", "zaaknummer": "41720", "onderwerp": "Waardering bewoonde eigen woning: waarde in vrij opleverbare staat", "samenvatting": "Erflater overleed in 2002 en had bij testamentaire ouderlijke boedelverdeling alle goederen toebedeeld aan zijn 72-jarige echtgenote, die in de echtelijke woning bleef wonen; de kinderen kregen een vordering in contanten. In geschil was of de woning voor het recht van successie — onder de SW zoals die tot 2010 luidde — op de waarde in vrij opleverbare staat (€ 575.000) of op een door de bewoning gedrukte lagere waarde moest worden gesteld. De Hoge Raad oordeelt dat de SW destijds geen specifiek waarderingsvoorschrift voor de eigen woning kende, zodat art. 21, lid 1, SW geldt, en dat onder aanbieding op de meest geschikte wijze aanbieding tot oplevering in ontruimde staat moet worden verstaan zolang geen tegen marktgegadigden werkend gebruiksrecht (vruchtgebruik, gebruik en bewoning, huur) bestaat. Het beroep op het besluit van 19 augustus 2002 faalt omdat dat alleen ziet op een 'moreel woonrecht' jegens de kinderen, terwijl de echtgenote hier zelf de volle eigendom had verworven; de Hoge Raad doet de zaak zelf af en herstelt de aanslag.", "rechtsregel": "De waarde in het economische verkeer van een woning is de prijs die bij aanbieding ten verkoop op de meest geschikte wijze door de meestbiedende gegadigde zou zijn besteed; ontbreekt een tegen marktgegadigden werkend gebruiksrecht, dan is dat de waarde in ontruimde staat, ook als de langstlevende de woning feitelijk blijft bewonen.", "wetsartikelen": ["art. 21 lid 1 SW 1956"], "belang": "middel", "oordeel": "cassatie", "achterhaald": true, "achterhaald_reden": "Voor woningen geldt sinds 1 januari 2010 de verplichte WOZ-waardering van art. 21 lid 5 SW 1956, zodat deze WEV-benadering van een bewoonde woning voor de erfbelasting haar zelfstandige betekenis heeft verloren; de algemene maatstaf van art. 21 lid 1 SW blijft voor andere vermogensbestanddelen gelden.", "gerelateerd": ["ECLI:NL:PHR:2007:AX0771", "ECLI:NL:GHSHE:2004:AR4542"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2007:AX0771"}, {"ecli": "ECLI:NL:PHR:2007:AX0771", "instantie": "Parket bij de Hoge Raad", "datum": "2007-04-06", "gepubliceerd": "2025-07-30", "zaaknummer": "41720", "onderwerp": "Waardering eigen woning voor successierecht na vervallen 60%-forfait", "samenvatting": "Erflater overleed op 5 september 2002; de tot de huwelijksgemeenschap behorende woning werd in de aangifte op 75% van de leegwaarde (EUR 431.250) gesteld, terwijl de inspecteur uitging van EUR 575.000. In geschil is of binnen het begrip 'waarde in het economische verkeer' van art. 21, lid 1, SW 1956 - onder de SW zoals die tot 2010 luidde - nog ruimte bestaat om rekening te houden met het waardedrukkende effect van bewoning, nu het 60%-forfait van art. 21, lid 4, SW 1956 per 1 januari 2002 is afgeschaft. De A-G concludeert in een gezamenlijke bijlage bij vier zaken (41400, 41720, 42451 en 42630) dat uit de parlementaire behandeling voldoende blijkt dat de wetgever met de afschaffing bewust heeft beoogd voortaan van de waarde in vrij opleverbare staat uit te gaan, zodat het middel van de staatssecretaris slaagt; is dat maatschappelijk bezwaarlijk, dan is het aan de wetgever een voorziening te treffen.", "rechtsregel": "Na het vervallen per 1 januari 2002 van het 60%-forfait van art. 21, lid 4, SW 1956 moet een door de verkrijger of erflater bewoonde woning voor de waarde in het economische verkeer van art. 21, lid 1, SW 1956 worden gewaardeerd op de waarde in vrij opleverbare staat; deze regel is achterhaald doordat de wetgever eerst art. 21, lid 11 (2006) en nadien de WOZ-waardering (per 2010) heeft ingevoerd.", "wetsartikelen": ["art. 21 SW 1956", "art. 9 Wet op de vermogensbelasting 1964", "art. 3.58 Wet IB 2001", "art. 9 WBR", "art. 52 WBR", "art. 17 Wet WOZ"], "belang": "middel", "oordeel": "gegrond", "achterhaald": true, "achterhaald_reden": "De waardering van woningen voor de erf- en schenkbelasting is sinds 1 januari 2006 (art. 21, lid 11, SW 1956) en sinds 1 januari 2010 door de verplichte WOZ-waardering wettelijk geregeld, zodat de hier bepleite invulling van de waarde in het economische verkeer haar zelfstandige betekenis heeft verloren.", "gerelateerd": ["ECLI:NL:GHSHE:2004:AR4542", "ECLI:NL:HR:2007:AX0771"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2007:AX0771"}, {"ecli": "ECLI:NL:PHR:2007:AX0774", "instantie": "Parket bij de Hoge Raad", "datum": "2007-04-06", "gepubliceerd": "2025-07-30", "zaaknummer": "42451", "onderwerp": "Waardebepaling nagelaten woning; leegwaarde, WOZ-waarde en verkoopprijs", "samenvatting": "Erflater overleed op 3 september 2002 met een ouderlijke boedelverdeling; de tot de nalatenschap behorende woning was in de aangifte op EUR 111.629 gewaardeerd en door de inspecteur op EUR 200.000. Onder de SW zoals die tot 2010 luidde klaagden de erven dat het Hof ten onrechte aanknoopte bij de in juli 2004 gerealiseerde verkoopprijs van EUR 190.000, de WOZ-waarde negeerde en uitging van de waarde in vrij opleverbare staat. De A-G acht de op de verkooptransactie gebaseerde schatting een feitelijk en niet onbegrijpelijk oordeel, oordeelt dat de WOZ-waarde als zodanig geen maatstaf is voor art. 21, lid 1, SW 1956, en verwerpt de klacht over de leegwaarde op de gronden van de gezamenlijke bijlage bij de zaken 41400, 41720, 42451 en 42630.", "rechtsregel": "De waarde in het economische verkeer van een nagelaten woning mag worden geschat aan de hand van een kort na het overlijden gerealiseerde verkoopprijs - ook indien die door een bijzonder geinteresseerde buurman is betaald - terwijl de WOZ-waarde als zodanig geen maatstaf vormt voor art. 21, lid 1, SW 1956; deze laatste regel is achterhaald door de invoering van de WOZ-waardering per 2010.", "wetsartikelen": ["art. 21 SW 1956", "art. 17 Wet WOZ"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Sinds 1 januari 2010 worden woningen voor de erf- en schenkbelasting dwingend naar de WOZ-waarde gewaardeerd, zodat de hier beslechte discussie over leegwaarde versus WOZ-waarde onder art. 21, lid 1, SW 1956 haar belang heeft verloren.", "parallelzaken": ["ECLI:NL:PHR:2007:AX0777", "ECLI:NL:PHR:2007:AX0731"], "gerelateerd": ["ECLI:NL:HR:2007:AX0774"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2007:AX0774"}, {"ecli": "ECLI:NL:HR:2006:AQ7098", "instantie": "Hoge Raad", "datum": "2006-12-22", "gepubliceerd": "2025-07-30", "zaaknummer": "39261", "onderwerp": "Woonplaatsfictie art. 3 lid 1 SW niet in strijd met EG-recht", "samenvatting": "Erflater bezat de Nederlandse nationaliteit, woonde vanaf 1993 in België en overleed in 1997 met een geheel in België belegd vermogen; zijn in Nederland wonende kinderen werden op grond van de tienjarige woonplaatsfictie van art. 3, lid 1, SW 1956 in het recht van successie betrokken, met volledige verrekening van het Belgische successierecht. Het Hof had die fictie aangemerkt als een verkapte beperking van het vrije kapitaalverkeer. Onder verwijzing naar het arrest Van Hilten-van der Heijden (HvJ EG 23 februari 2006, C-513/03) oordeelt de Hoge Raad dat art. 3, lid 1, SW geen beperking van het kapitaalverkeer vormt en dat het geen verschil maakt dat hier twee lidstaten zijn betrokken; ook het burgerschap van de Unie en het algemene discriminatieverbod dwingen niet tot een ander oordeel, mede omdat de kinderen door de verrekening niet zwaarder worden belast dan wanneer erflater in Nederland was blijven wonen. Het principale beroep slaagt en de zaak wordt verwezen voor het onbehandeld gebleven tweede geschilpunt; de woonplaatsfictie geldt onder het huidige recht ongewijzigd.", "rechtsregel": "De tienjarige woonplaatsfictie voor Nederlanders van art. 3, lid 1, SW 1956 vormt geen beperking van het vrije kapitaalverkeer en levert evenmin een verboden discriminatie op wegens het EU-burgerschap of het algemene discriminatieverbod, omdat met de verdeling van heffingsbevoegdheid samenhangende differentiaties bij gebreke van harmonisatie tot de bevoegdheid van de lidstaten behoren.", "wetsartikelen": ["art. 3 lid 1 SW 1956", "art. 56 EG (voorheen art. 73B EG-Verdrag)", "art. 12 EG (voorheen art. 6 EG-Verdrag)", "art. 18 EG (voorheen art. 8A EG-Verdrag)"], "belang": "hoog", "oordeel": "verwijzing", "gerelateerd": ["ECLI:NL:PHR:2006:AQ7098", "ECLI:NL:GHSHE:2002:AF2787"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2006:AQ7098"}, {"ecli": "ECLI:NL:PHR:2006:AQ7098", "instantie": "Parket bij de Hoge Raad", "datum": "2006-12-22", "gepubliceerd": "2025-03-22", "zaaknummer": "39261", "onderwerp": "Woonplaatsfictie art. 3(1) SW; nationaliteitsaanknoping en vrij kapitaalverkeer", "samenvatting": "De erflater, in december 1993 om persoonlijke redenen naar Belgie verhuisd, overleed op 9 december 1997; zijn vier in Nederland wonende kinderen werden op grond van de tienjaarsfictie van art. 3, lid 1, SW 1956 in de Nederlandse heffing van recht van successie betrokken, waarbij na verrekening van het Belgische successierecht per kind f 29.633 resteerde en de fictie per saldo f 112.863 extra heffing meebracht (regime van de SW zoals die tot 2010 luidde). Het Hof Den Bosch achtte de fictie in strijd met het vrije kapitaalverkeer. A-G Wattel onderschrijft dat: de fictie discrimineert in werkelijkheid naar nationaliteit, omdat alleen vertrekkende Nederlanders worden getroffen, en de aangevoerde rechtvaardigingen (misbruikbestrijding, bijzondere band, compenserende voordelen, het OESO-commentaar) houden geen stand. De conclusie strekt primair tot ongegrondverklaring van zowel het principale beroep van de Staatssecretaris als het incidentele beroep, subsidiair tot het stellen van prejudiciele vragen, en tot afwijzing van het verzoek om integrale proceskostenvergoeding.", "rechtsregel": "De tienjarige woonplaatsfictie van art. 3, lid 1, SW 1956 knoopt in werkelijkheid aan bij nationaliteit en is daarom onverenigbaar met het vrije kapitaalverkeer, het verblijfsrecht en het discriminatieverbod van het EG-Verdrag, terwijl de forfaitaire proceskostenregeling van art. 8:75 Awb ook bij schending van EG-recht in beginsel toelaatbaar is.", "wetsartikelen": ["art. 3 lid 1 SW 1956", "art. 47 SW 1956", "art. 13 lid 2 Bvdb 1997", "art. 56 EG-Verdrag", "art. 18 EG-Verdrag", "art. 12 EG-Verdrag", "art. 26 IVBPR", "art. 14 EVRM", "art. 8:73 Awb", "art. 8:75 Awb"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHSHE:2002:AF2787", "ECLI:NL:HR:2006:AQ7098"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2006:AQ7098"}, {"ecli": "ECLI:NL:HR:2006:AY6001", "instantie": "Hoge Raad", "datum": "2006-08-11", "gepubliceerd": "2025-07-30", "zaaknummer": "39260", "onderwerp": "Reikwijdte navordering art. 52 SW; trust als verkrijger van de schenking", "samenvatting": "Een Nederlander die sinds 1988 in Frankrijk woonde, schonk in december 1988 ƒ 5.000.000 aan een door hem opgerichte irrevocable Cayman trust. Nadat de Hoge Raad in 1998 had beslist dat niet de beneficiaries maar de trust als verkrijger moest worden aangemerkt en de aan de echtgenote en kinderen opgelegde aanslagen waren vernietigd, legde de inspecteur in 2000 alsnog een navorderingsaanslag in het recht van schenking op aan de trust. De Hoge Raad oordeelt dat art. 52, lid 1, SW 1956 (tekst tot en met 1997, onder de SW zoals die tot 2010 luidde) weliswaar ook navordering toestaat wanneer een aanslag ten onrechte geheel achterwege is gebleven, maar dat voor navordering zonder nieuw feit bovendien vereist is dat er een relatie — in de wettekst uitgedrukt met het woord 'doordat' — bestaat tussen de omvang van de verminderde verkrijging van de ene en die van de andere verkrijger. Die relatie ontbreekt hier, en omdat de driejaarstermijn van art. 11, lid 3, AWR ruimschoots was verstreken kan de aanslag ook niet als primitieve aanslag in stand blijven; het beroep van de Staatssecretaris is ongegrond.", "rechtsregel": "Art. 52 SW 1956 biedt naast art. 16 AWR alleen een extra navorderingsmogelijkheid zonder nieuw feit indien een inhoudelijke samenhang bestaat tussen de vermindering van de verkrijging van de ene verkrijger en de omvang van de verkrijging van de ander; enkel het feit dat een aan een andere verkrijger opgelegde aanslag is verminderd, is onvoldoende.", "wetsartikelen": ["art. 52 lid 1 SW 1956", "art. 66 lid 1 SW 1956", "art. 11 lid 3 AWR", "art. 16 AWR"], "belang": "hoog", "oordeel": "ongegrond", "parallelzaken": ["ECLI:NL:HR:2006:AY5999"], "gerelateerd": ["ECLI:NL:GHSHE:2002:AF5375"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2006:AY6001"}, {"ecli": "ECLI:NL:HR:2006:AV1261", "instantie": "Hoge Raad", "datum": "2006-06-02", "gepubliceerd": "2025-07-30", "zaaknummer": "41394", "onderwerp": "Onjuist schenkingsjaar op aanslagbiljet leidt niet tot nietigheid", "samenvatting": "Aan belanghebbende was onder de SW zoals die tot 2010 luidde een aanslag in het recht van schenking opgelegd naar een verkrijging van € 28.987.529. Op het aanslagbiljet stond als jaar van schenking 2002 vermeld, terwijl niet in geschil was dat de schenking in 1998 had plaatsgevonden. De Hoge Raad oordeelt dat het Hof aan deze kennelijke vergissing terecht geen gevolg heeft verbonden, nu de vermelding geen onzekerheid heeft doen ontstaan over de vraag op welke verkrijging de aanslag zag. De overige middelen worden met toepassing van art. 81 Wet RO afgedaan; het beroep is ongegrond.", "rechtsregel": "Een kennelijke vergissing in de op het aanslagbiljet vermelde jaar van de schenking tast de aanslag niet aan, zolang daardoor geen onzekerheid ontstaat over de verkrijging waarop de aanslag betrekking heeft.", "wetsartikelen": ["art. 4 AWR", "art. 15 BRK", "art. 27 BRK", "art. 29 BRK", "art. 34 BRK", "art. 81 Wet RO"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2006:AV1261", "ECLI:NL:GHSGR:2004:AR7403"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2006:AV1261"}, {"ecli": "ECLI:NL:PHR:2006:AV1261", "instantie": "Parket bij de Hoge Raad", "datum": "2006-06-02", "gepubliceerd": "2025-07-30", "zaaknummer": "41394", "onderwerp": "Recht van schenking; woonplaats schenker en jaar op aanslagbiljet", "samenvatting": "De vader van belanghebbende verbleef van 24 december 1996 tot 1 april 1998 met een Curacaose ruling op Curacao en schonk op 24 maart 1998 vorderingen aan zijn kinderen; aan belanghebbende werd in 2002 een aanslag in het recht van schenking opgelegd naar een verkrijging van EUR 28.987.529 (regime van de SW zoals die tot 2010 luidde). Het Hof achtte de vader op grond van art. 4 AWR en art. 34, lid 1, BRK inwoner van Nederland, mede omdat de woning te Z hem permanent ter beschikking bleef staan, zodat het heffingsrecht ingevolge art. 27, lid 3, BRK aan Nederland toekwam. A-G Niessen verwerpt het middel over de op het aanslagbiljet vermelde jaartal 2002, omdat belanghebbende gezien de uitspraak op bezwaar en het processuele debat behoorde te weten dat sprake was van een kennelijke vergissing en de aanslag door toepassing van het tarief 2002 bovendien te laag is vastgesteld. Ook de middelen over het gepasseerde bewijsaanbod en het duurzaam tehuis falen; de conclusie strekt tot ongegrondverklaring.", "rechtsregel": "Het op een aanslagbiljet vermelde tijdvak van heffing is een essentieel onderdeel van de aanslag, maar een onjuiste jaarvermelding leidt niet tot nietigheid indien de belastingplichtige behoorde te weten dat sprake is van een kennelijke vergissing van de inspecteur, terwijl een in Nederland permanent beschikbaar gehouden woning een duurzaam tehuis blijft in de zin van art. 34, lid 1, BRK.", "wetsartikelen": ["art. 4 AWR", "art. 5 AWR", "art. 11 AWR", "art. 2 lid 3 onder e AWR", "art. 24 SW 1956", "art. 37 SW 1956", "art. 27 lid 3 BRK", "art. 34 lid 1 BRK", "art. 8:77 lid 1 Awb"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHSGR:2004:AR7403", "ECLI:NL:HR:2006:AV1261"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2006:AV1261"}, {"ecli": "ECLI:NL:HR:2006:AT8202", "instantie": "Hoge Raad", "datum": "2006-05-12", "gepubliceerd": "2025-07-30", "zaaknummer": "40684", "onderwerp": "Betaaldvoetbalclub is geen ANBI; eis van rechtstreeks algemeen nut", "samenvatting": "Een betaaldvoetbalclub verkreeg in 2001 uit een nalatenschap en claimde het verlaagde tarief voor het algemeen nut beogende instellingen van art. 24, lid 4, SW 1956, onder de SW zoals die tot 2010 luidde (recht van successie). De Hoge Raad stelt eerst vast dat de maatstaf dat door de werkzaamheden het algemeen belang minstens in gelijke mate als een particulier belang wordt gediend voor alle soorten instellingen geldt en niet alleen voor de in de wet met name genoemde kerkelijke, levensbeschouwelijke, charitatieve, culturele of wetenschappelijke instellingen. Daarnaast is vereist dat de werkzaamheden rechtstreeks erop gericht zijn enig algemeen belang te dienen; het Hof had zich ten onrechte gebaseerd op het indirecte effect dat een groot deel van de bevolking plezier beleeft aan betaald voetbal. Omdat de activiteiten van een profclub primair strekken tot het eigen sportieve en commerciële belang, is zij geen ANBI; de Hoge Raad doet de zaak zelf af en verklaart het beroep bij het Hof ongegrond. De 'minstens in gelijke mate'-toets is inmiddels vervangen door de eis dat een instelling nagenoeg uitsluitend het algemeen belang dient, maar de eis van rechtstreekse gerichtheid geldt onverkort en werkt door naar de ANBI-vrijstellingen van art. 32 en 33 SW 1956.", "rechtsregel": "Een instelling beoogt slechts het algemeen nut indien haar werkzaamheden rechtstreeks erop gericht zijn enig algemeen belang te dienen; een gunstig maatschappelijk effect van op een particulier belang gerichte activiteiten is onvoldoende, en die maatstaf geldt voor alle instellingen, ook buiten de in de wet met name genoemde categorieën.", "wetsartikelen": ["art. 24 lid 4 SW 1956"], "belang": "hoog", "oordeel": "cassatie", "gerelateerd": ["ECLI:NL:PHR:2006:AT8202", "ECLI:NL:GHSHE:2003:AO2335"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2006:AT8202"}, {"ecli": "ECLI:NL:PHR:2006:AT8202", "instantie": "Parket bij de Hoge Raad", "datum": "2006-05-12", "gepubliceerd": "2025-07-30", "zaaknummer": "40684", "onderwerp": "Recht van successie; betaaldvoetbalorganisatie geen ANBI (art. 24(4) SW)", "samenvatting": "De op 24 oktober 2001 overleden erflater benoemde een voetbalvereniging tot enig erfgenaam; ter zake van een verkrijging van f 1.062.109 werd f 611.873 aan recht van successie geheven. De vereniging houdt middellijk de betaaldvoetbal-bv en verricht zelf vooral de jeugdopleiding; zij beriep zich op het verlaagde tarief van art. 24, lid 4, SW 1956 zoals dat tot 2010 gold voor het algemeen nut beogende instellingen. Het Hof achtte haar een ANBI omdat het betaald voetbal ontspanning verschaft aan een groot deel van de bevolking. A-G Niessen concludeert tot gegrondverklaring: sponsoren, spelers en het tegen commerciele prijzen betalende publiek streven alle particuliere belangen na, zodat wat het Hof als algemeen belang aanmerkt geheel opgaat in particuliere belangen, en de faciliteit niet is bedoeld voor een instelling die een product met voldoende marktpotentie aanbiedt.", "rechtsregel": "Een instelling wier feitelijke werkzaamheden bestaan in het tegen min of meer commerciele prijzen aanbieden van prestaties die door sponsoren, spelers en publiek als particulier belang worden geconsumeerd, beoogt niet rechtstreeks het algemeen nut in de zin van art. 24, lid 4, SW 1956.", "wetsartikelen": ["art. 24 lid 4 SW 1956", "art. 47 Wet IB 1964", "art. 8:77 Awb"], "belang": "middel", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:GHSHE:2003:AO2335", "ECLI:NL:HR:2006:AT8202"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2006:AT8202"}, {"ecli": "ECLI:NL:HR:2006:AT4931", "instantie": "Hoge Raad", "datum": "2006-02-17", "gepubliceerd": "2025-07-30", "zaaknummer": "40994", "onderwerp": "STRIPS vallen niet onder vrijstelling nog niet vorderbare rentetermijnen", "samenvatting": "Erflater liet bij zijn overlijden in 1996 zogenoemde STRIPS na: van obligaties afgesplitste, zelfstandig verhandelbare rentecoupons. In geschil was of de vrijstelling voor nog niet vorderbare termijnen van renten van art. 32, lid 1, onder 10°, SW 1956 — onder de SW zoals die tot 2010 luidde — daarop van toepassing is. De Hoge Raad beantwoordt die vraag ontkennend: de vrijstelling ziet blijkens de wetsgeschiedenis slechts op renten die afkomen van door de erflater nagelaten vermogensbestanddelen en die termijnsgewijs, dat wil zeggen over terugkerende perioden, worden genoten, terwijl STRIPS door de afsplitsing in het vermogen van de erflater het karakter hebben van een renteloze vordering en niet van periodiek genoten inkomsten. Het beroep op de Mededeling van de Staatssecretaris van 12 juli 1993 faalt omdat die alleen op de inkomstenbelasting ziet; de Hoge Raad doet de zaak zelf af en stelt de verkrijgingen vast op telkens ƒ 181.147.", "rechtsregel": "De vrijstelling voor nog niet vorderbare termijnen van renten geldt uitsluitend voor renten die afkomen van eveneens tot de nalatenschap behorende vermogensbestanddelen en die termijnsgewijs — over terugkerende perioden — worden genoten; afgesplitste, zelfstandig verhandelbare rentecoupons (STRIPS) zijn renteloze vorderingen en delen niet in de vrijstelling.", "wetsartikelen": ["art. 32 lid 1 onder 10° SW 1956"], "belang": "hoog", "oordeel": "cassatie", "gerelateerd": ["ECLI:NL:PHR:2006:AT4931", "ECLI:NL:GHSHE:2004:AP0971"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2006:AT4931"}, {"ecli": "ECLI:NL:PHR:2006:AT4931", "instantie": "Parket bij de Hoge Raad", "datum": "2006-02-17", "gepubliceerd": "2025-03-22", "zaaknummer": "40994", "onderwerp": "Recht van successie; vallen STRIPS onder de vrijstelling van art. 32(1)10 SW?", "samenvatting": "Tot de nalatenschap van de op 22 juni 1996 overleden erflater behoorden 522.200 STRIPS, losse op 15 januari 1997 vervallende rentecoupons van een staatsobligatie, zonder mantels, door de Inspecteur gewaardeerd op f 511.756. De zaak speelt onder de SW zoals die tot 2010 luidde (recht van successie) en onder de Wet IB 1964. Het Hof achtte de vrijstelling van art. 32, lid 1, onder 10, SW 1956 voor nog niet vorderbare termijnen van renten van toepassing; A-G Niessen meent van niet, omdat de vrijstelling blijkens wetsgeschiedenis en rechtspraak alleen ziet op rentebedragen die over terugkerende perioden worden genoten, terwijl van de mantel afgesplitste coupons met een eenmalige uitbetaling vergelijkbaar zijn met een rentespaarbrief. Ook het beroep op de Mededeling van 12 juli 1993 faalt, omdat die uitsluitend over de inkomstenbelasting gaat; vermindering van de samenloop moet in de inkomstenbelasting worden gezocht.", "rechtsregel": "De vrijstelling voor nog niet vorderbare termijnen van renten geldt alleen voor rentebedragen die termijnsgewijze, dat wil zeggen over terugkerende perioden, worden genoten, zodat van de hoofdsom afgesplitste losse rentecoupons (STRIPS) daar niet onder vallen.", "wetsartikelen": ["art. 32 lid 1 onder 10 SW 1956", "art. 21 lid 3 SW 1956", "art. 33 lid 1 onder 9 SW 1956", "art. 27 lid 1 Wet IB 1964", "art. 31 lid 1 Wet IB 1964", "art. 36 lid 9 Wet IB 1964", "art. 38 lid 3 Wet IB 1964", "art. 79 Wet RO"], "belang": "middel", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:GHSHE:2004:AP0971", "ECLI:NL:HR:2006:AT4931"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2006:AT4931"}, {"ecli": "ECLI:NL:HR:2005:AU7356", "instantie": "Hoge Raad", "datum": "2005-12-02", "gepubliceerd": "2025-07-30", "zaaknummer": "40087", "onderwerp": "Waardering ondernemingsvermogen: badwill blijft buiten beschouwing", "samenvatting": "Onder de SW zoals die tot 2010 luidde (recht van successie) ging het om de waardering van een melkquotum in een landbouwbedrijf dat na het overlijden van erflater in 1999 door zijn echtgenote in maatschapsverband met de broer van erflater werd voortgezet; de erven bepleitten voor een verkrijging van tezamen ƒ 1.249.462 een lagere waarde dan de waarde in het economische verkeer wegens de lage rentabiliteit (badwill) van het bedrijf. De Hoge Raad verwerpt dat standpunt: uit de totstandkomingsgeschiedenis van art. 21 SW 1956 blijkt dat de wetgever goodwill bewust buiten de heffing wilde houden en dat goodwill daarbij — mede uit vrees voor schattingsproblemen — als saldobegrip is gehanteerd, zodat onder de tot 1 januari 2002 geldende tekst ook badwill of onderrentabiliteit bij de waardering buiten beschouwing moet blijven. Het beroep is ongegrond. Het arrest wijst er zelf op dat per 1 januari 2002 is bepaald dat voor overdracht vatbare goodwill wél in aanmerking wordt genomen, zodat de regel alleen voor oudere verkrijgingen betekenis heeft.", "rechtsregel": "Onder art. 21 SW 1956 zoals dat tot 1 januari 2002 luidde blijft niet alleen goodwill maar ook badwill (onderrentabiliteit) bij de waardering van ondernemingsvermogen buiten beschouwing, omdat goodwill in de wetsgeschiedenis als saldobegrip is gehanteerd — een regel die door de wetswijziging per 1 januari 2002 is achterhaald.", "wetsartikelen": ["art. 21 lid 5 SW 1956", "art. 21 lid 1 SW 1956", "art. 1167 BW (oud)", "art. 81 Wet RO"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Sinds 1 januari 2002 wordt voor overdracht vatbare goodwill uitdrukkelijk in de waardering betrokken, zodat het spiegelbeeld — het buiten beschouwing laten van badwill — voor latere verkrijgingen niet meer geldt.", "gerelateerd": ["ECLI:NL:GHARN:2003:AI0326"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2005:AU7356"}, {"ecli": "ECLI:NL:HR:2005:AU3934", "instantie": "Hoge Raad", "datum": "2005-10-07", "gepubliceerd": "2025-07-30", "zaaknummer": "39120", "onderwerp": "Art. 6:11 Awb: wetenschap executeur niet toerekenbaar aan de erfgenaam", "samenvatting": "De aangifte voor het recht van successie was gedaan door de executeur-testamentair, die op de voet van art. 43 lid 1 SW 1956 woonplaats te zijnen huize koos; het aanslagbiljet werd op 28 juli 1999 naar dat adres gezonden en de executeur maakte geen bezwaar. De erfgename - een stichting waarvan hij ten tijde van het overlijden nog bestuursvoorzitter was maar per 1 juli 1999 niet meer - stelde pas in november 2000 van de aanslag te hebben vernomen en werd in haar bezwaar niet-ontvankelijk verklaard. De Hoge Raad oordeelt dat het Hof zijn verwerping van het beroep op art. 6:11 Awb onvoldoende heeft gemotiveerd en dat, voor zover in die redengeving besloten ligt dat de wetenschap van de executeur dat de aanslag was opgelegd of diens keuze om geen bezwaar te maken aan belanghebbende wordt toegerekend, het van een onjuiste rechtsopvatting is uitgegaan: de executeur-testamentair is geen door de erfgenaam aangestelde vertegenwoordiger, en de erfgenaam is zelfstandig bevoegd bezwaar te maken. Vernietiging en verwijzing naar het Gerechtshof 's-Gravenhage. Het arrest ziet op de SW zoals die tot 2010 luidde, maar de aangifte- en woonplaatskeuzebepalingen voor de executeur zijn inhoudelijk gehandhaafd.", "rechtsregel": "Bij de beoordeling of een termijnoverschrijding verschoonbaar is in de zin van art. 6:11 Awb mogen de wetenschap van de executeur-testamentair dat de aanslag is opgelegd en diens keuze om daartegen geen bezwaar te maken niet aan de erfgenaam worden toegerekend, omdat de executeur geen door de erfgenaam aangestelde vertegenwoordiger is en de erfgenaam zelfstandig bezwaar kan maken.", "wetsartikelen": ["art. 6:11 Awb", "art. 24 lid 1 SW 1956", "art. 43 lid 1 SW 1956", "art. 72 lid 1 SW 1956"], "belang": "middel", "oordeel": "verwijzing", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2005:AU3934"}, {"ecli": "ECLI:NL:HR:2005:AT7215", "instantie": "Hoge Raad", "datum": "2005-06-10", "gepubliceerd": "2025-07-30", "zaaknummer": "40277", "onderwerp": "Onbegrijpelijk hofoordeel; ontvankelijkheid van de schenker in zijn beroep", "samenvatting": "Het Hof had het beroep van X tegen een of meer aanslagen in het recht van schenking ongegrond verklaard, maar sprak in zijn uitspraak nu eens van een en dan weer van drie aanslagen en oordeelde ten slotte dat 'de aanslag' eerder te laag dan te hoog was. De Hoge Raad acht zonder nadere motivering onbegrijpelijk op welke grond het Hof ervan is uitgegaan dat een aanslag in geding is, en waarom de deels van de vastgestelde feiten afwijkende en onderling niet overeenstemmende verklaringen van partijen ter zitting, over de juistheid waarvan het Hof zich niet uitlaat, tot dat oordeel zouden leiden. De uitspraak wordt vernietigd en het geding verwezen naar het Gerechtshof Arnhem, met de opmerking dat het verwijzingshof eerst moet beoordelen of X - de schenker en niet een begiftigde - ontvankelijk is in zijn beroep, waarvoor van belang is jegens wie de inspecteur uitspraak op bezwaar heeft gedaan en of X namens de begiftigde(n) heeft gehandeld, en vervolgens of er een of meer aanslagen zijn opgelegd en aan wie. Het arrest is louter formeel-processueel en gewezen onder de SW zoals die tot 2010 luidde.", "rechtsregel": "Voordat over een aanslag in het schenkingsrecht inhoudelijk kan worden geoordeeld, moet worden vastgesteld jegens wie de inspecteur uitspraak op bezwaar heeft gedaan en hoeveel aanslagen aan wie zijn opgelegd; van de schenker, die zelf niet de aangeslagen begiftigde is, moet afzonderlijk worden onderzocht of hij in zijn rechtsmiddel ontvankelijk is.", "belang": "laag", "oordeel": "verwijzing", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2005:AT7215"}, {"ecli": "ECLI:NL:HR:2005:AT7209", "instantie": "Hoge Raad", "datum": "2005-06-10", "gepubliceerd": "2025-07-30", "zaaknummer": "38600", "onderwerp": "Gelijkheidsbeginsel bij schenkingsrecht; vergelijking met cultuurfonds faalt", "samenvatting": "Aan een stichting met als doel de bevordering van kunst en wetenschap was ter zake van een schenking van f 10.000 een aanslag in het recht van schenking opgelegd; zij beriep zich op het gelijkheidsbeginsel omdat het Prins Bernhard Cultuur Fonds van ontvangen schenkingen geen aangifte hoeft te doen. Het Hof oordeelde dat die begunstigende behandeling berust op het vertrouwen van de Staatssecretaris dat het fonds overeenkomstig zijn doelstelling werkzaam is en zal blijven, hetgeen kennelijk is gebaseerd op de wijze waarop het fonds zijn middelen aanwendt, en dat dit een rechtens relevant verschil oplevert met belanghebbende, die nog geen feitelijke werkzaamheden ter bevordering van kunst en wetenschap had verricht. De Hoge Raad laat die oordelen in stand: het eerste is van feitelijke aard en niet onbegrijpelijk, het tweede geeft geen blijk van een onjuiste rechtsopvatting en is verweven met waarderingen van feitelijke aard; de overweging over de bij voorbaat aan het fonds verleende kwijtschelding op de voet van art. 67 lid 1 ten derde SW 1956 is niet dragend. Beroep ongegrond, onder de SW zoals die tot 2010 luidde; de vraag naar de feitelijke werkzaamheid van een instelling keert onder het huidige recht terug in de ANBI-toets.", "rechtsregel": "Een instelling die haar algemeen nuttige doelstelling nog niet feitelijk uitvoert, verkeert voor de toepassing van het gelijkheidsbeginsel niet in een gelijk geval met een instelling waarvan op grond van haar feitelijke werkzaamheid is aanvaard dat zij van ontvangen schenkingen geen aangifte behoeft te doen.", "wetsartikelen": ["art. 67 lid 1 SW 1956"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHAMS:2002:AF1331"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2005:AT7209"}, {"ecli": "ECLI:NL:HR:2004:AP1888", "instantie": "Hoge Raad", "datum": "2004-06-18", "gepubliceerd": "2025-03-22", "zaaknummer": "38937", "onderwerp": "Nalatenschapsschuld; regeling ex art. 3:172 BW blijkt ook uit gedragingen", "samenvatting": "In geschil was de omvang van de belaste verkrijging uit de nalatenschap van de in 1998 overleden erflater, en meer in het bijzonder of een gestelde schuld van erflaters zijde aan belanghebbende in aanmerking kwam; het Hof leidde uit de gedragingen van partijen af dat tussen de deelgenoten een regeling in de zin van art. 3:172 BW tot stand was gekomen en verminderde de aanslag tot een verkrijging van f 726.166. De Hoge Raad verwerpt de klacht dat de term regeling een actieve rol van partijen veronderstelt: een regeling in de zin van art. 3:172 BW is het geheel van wat deelgenoten bij overeenkomst regelen (art. 3:168 lid 1 BW), en de wilsverklaringen die zo'n overeenkomst tot stand brengen kunnen op grond van art. 3:37 lid 1 BW in gedragingen besloten liggen, nu de art. 3:168 en 3:172 BW geen andersluidend vormvoorschrift kennen. Het oordeel dat hier zo'n regeling is getroffen is feitelijk en niet onbegrijpelijk; belanghebbende kan zich tegenover de inspecteur bovendien niet beroepen op verklaringen en gedragingen die zij na het overlijden van haar moeder met zichzelf in haar hoedanigheid van enig rechtsopvolgster onder algemene titel heeft uitgewisseld. Beroep ongegrond, onder de SW zoals die tot 2010 luidde (recht van successie).", "rechtsregel": "Een regeling als bedoeld in art. 3:172 BW komt vormvrij tot stand en kan besloten liggen in gedragingen van de deelgenoten; een erfgenaam kan zich tegenover de inspecteur niet beroepen op verklaringen of gedragingen die zij na het overlijden van de wederpartij met zichzelf als enig rechtsopvolgster onder algemene titel heeft uitgewisseld.", "wetsartikelen": ["art. 3:37 lid 1 BW", "art. 3:168 lid 1 BW", "art. 3:172 BW"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHARN:2002:AE8379"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2004:AP1888"}, {"ecli": "ECLI:NL:HR:1998:BI5819", "instantie": "Hoge Raad", "datum": "1998-11-18", "gepubliceerd": "2025-03-22", "zaaknummer": "31.756", "onderwerp": "Trust als doelvermogen; doelvermogen kan verkrijger zijn voor schenkingsrecht", "samenvatting": "Een in Nederland wonende settlor stelde in 1992 naar het recht van Jersey twee irrevocable discretionary trusts in en bracht daarin onder meer f 1.500.000 en aandelen ter waarde van f 38.414.000; de inspecteur legde aan de aangewezen beneficiaries - een stichting en enkele familieleden - aanslagen in het recht van schenking op naar een verkrijging van telkens f 39.926.832. De Hoge Raad oordeelt dat art. 19 van het Haagse Trustverdrag meebrengt dat eerst naar het op de trust toepasselijke buitenlandse recht wordt bepaald welke rechtsgevolgen aan de trust zijn verbonden en daarna hoe het Nederlandse belastingrecht daarop moet worden toegepast, zonder dat een beroep op art. 13 van het verdrag nodig is. Omdat de settlor onherroepelijk afstand had gedaan en noch de beneficiaries, noch de trustees, noch de protector enig recht met vermogenswaarde hadden verkregen, ontbrak bij hen een verkrijging; de trusts zijn doelvermogens, en nu het stelsel van de Successiewet niet toelaat dat een binnenlands wonende zich uit vrijgevigheid van zijn goederen ontdoet zonder heffing, kan ook een doelvermogen als verkrijger worden aangemerkt. Het schenkingsrecht is daarom naar het niet-v
