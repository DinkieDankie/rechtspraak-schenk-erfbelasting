SW 1956", "art. 10 Uitvoeringsregeling schenk- en erfbelasting", "art. 3.2 Wet IB 2001", "art. 4.17c Wet IB 2001", "art. 3:4 Awb", "art. 8:73 Awb", "art. 120 Grondwet", "art. 1 EP EVRM"], "belang": "hoog", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHDHA:2025:737", "parallelzaken": ["ECLI:NL:GHDHA:2025:738"]}, {"ecli": "ECLI:NL:GHSHE:2025:540", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2025-02-26", "gepubliceerd": "2025-06-18", "zaaknummer": "23/58", "onderwerp": "Erfbelasting: onjuiste aanduiding 'legaat' in plaats van 'legitieme portie' op het aanslagbiljet", "samenvatting": "Belanghebbende, woonachtig in Frankrijk, verkreeg door het inroepen van haar legitieme portie uit de nalatenschap van haar vader. Op het aanslagbiljet erfbelasting was de verkrijging aangeduid als 'legaat'. Zij bestreed de hoogte van de aanslag niet, maar vroeg vernietiging omdat de onjuiste aanduiding tot een ongunstige beoordeling door de Franse fiscus zou kunnen leiden. Het hof acht het hoger beroep ontvankelijk (er is belang wegens de gestelde Franse gevolgen en schade), maar verwerpt het inhoudelijk: op grond van art. 1 lid 1 onder 1° SW 1956 wordt geheven over al wat krachtens erfrecht wordt verkregen en een vordering uit legitieme portie is zo'n verkrijging; art. 36 SW 1956 regelt slechts wie belastingplichtig is en eist niet dat per soort verkrijging (erfdeel, legaat, legitieme) een afzonderlijke aanslag wordt opgelegd. Het aanslagbiljet voldoet aan de minimumeisen uit HR 11 november 2022 (belastingschuldige, bedrag, betaalwijze en betalingstermijn), zodat de materiële belastingschuld rechtsgeldig is geformaliseerd. Wel schond de inspecteur art. 8:42 Awb door delen van de aangifte weg te lakken en stukken niet over te leggen; het hof verbindt daaraan met art. 8:31 Awb enkel vergoeding van het griffierecht. Voor twee maanden overschrijding van de redelijke termijn in hoger beroep krijgt belanghebbende € 500 immateriële schadevergoeding van de minister.", "rechtsregel": "Een onjuiste aanduiding van de aard van de verkrijging (legaat in plaats van legitieme portie) in de specificatie van het aanslagbiljet erfbelasting tast de geldigheid van de aanslag niet aan: art. 1 lid 1 onder 1° SW 1956 belast alles wat krachtens erfrecht wordt verkregen, ongeacht de hoedanigheid waarin, en art. 36 SW 1956 verplicht niet tot een aanslag per soort verkrijging, mits het biljet voldoet aan de eisen van HR 11 november 2022 (naam belastingschuldige, hoogte schuld, betaalwijze, betalingstermijn).", "wetsartikelen": ["art. 1 lid 1 onder 1° SW 1956", "art. 5 SW 1956", "art. 36 SW 1956", "art. 37 SW 1956", "art. 5 lid 1 AWR", "art. 8:42 Awb", "art. 8:31 Awb"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2025:540"}, {"ecli": "ECLI:NL:RBGEL:2025:1367", "instantie": "Rechtbank Gelderland", "datum": "2025-02-20", "gepubliceerd": "2025-05-27", "zaaknummer": "AWB - 23_4226", "onderwerp": "Intrekking anbi-beschikking met terugwerkende kracht; steunstichting?", "samenvatting": "De inspecteur heeft de anbi-beschikking van een fondsenwervende stichting op het terrein van het zelfgekozen levenseinde met terugwerkende kracht tot 25 juni 2019 ingetrokken, omdat de stichting feitelijk zou functioneren als steunstichting van een niet-anbi cooperatie. In geschil is uitsluitend of uit de feitelijke werkzaamheden blijkt dat de instelling (nagenoeg) uitsluitend het algemeen belang dient. De rechtbank toetst de vijftien gefinancierde projecten afzonderlijk en oordeelt dat slechts vier projecten (sociale media campagne en drie boekprojecten) een particulier belang dienen; die blijven onder de 10%-grens van het uitgavencriterium, zodat aan het 90%-criterium is voldaan. Dat negen van de vijftien projecten door de samenwerkingspartner zijn aangevraagd maakt de stichting nog geen steunstichting; het beroep is gegrond en de intrekkingsbeschikking wordt vernietigd.", "rechtsregel": "Of een instelling (nagenoeg) uitsluitend het algemeen nut beoogt, wordt beoordeeld aan de hand van de statutaire doelstelling en de feitelijke werkzaamheden, waarbij het 90%-criterium een uitgavencriterium is dat per project wordt getoetst; financiering van projecten van een niet-anbi met dezelfde doelstelling maakt de instelling niet zonder meer een steunstichting.", "wetsartikelen": ["art. 5b AWR", "art. 1a Uitvoeringsregeling AWR 1994", "art. 1b Uitvoeringsregeling AWR 1994"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2025:1367"}, {"ecli": "ECLI:NL:GHAMS:2025:1048", "instantie": "Gerechtshof Amsterdam", "datum": "2025-02-19", "gepubliceerd": "2025-06-17", "zaaknummer": "24/307", "onderwerp": "ANBI-status: activiteiten dienen niet rechtstreeks het algemeen belang", "samenvatting": "Een stichting die zich richt op bewustwording rond 'tijd en tijdsbeleid' (workshops voor scholieren, trainingen voor werknemers, een jaarlijkse actie voor nachtwerkers, boek en documentaire) verzocht op 8 september 2020 om te worden aangemerkt als ANBI; de inspecteur wees dat af, de rechtbank kende de status alsnog toe. Het Hof toetst de statutaire doelstelling in samenhang met de (voorgenomen) feitelijke werkzaamheden op het moment van het verzoek en oordeelt dat de stichting zich primair en rechtstreeks (nagenoeg) uitsluitend richt op particuliere belangen van specifieke doelgroepen (scholieren van 14-17 jaar, nachtwerkers, ploegendienstmedewerkers, jonge werkende gezinnen), wier persoonlijke ontwikkeling bij de activiteiten is gebaat. Dat daarvan een gunstig maatschappelijk neveneffect uitgaat, maakt de activiteiten niet rechtstreeks algemeen nuttig; aan de kwantitatieve 90%-toets komt het Hof niet toe. Het hoger beroep van de inspecteur is gegrond, de uitspraak van de rechtbank wordt vernietigd en het beroep van de stichting alsnog ongegrond verklaard.", "rechtsregel": "Voor de ANBI-status moet de statutaire doelstelling in samenhang met de (voorgenomen) feitelijke werkzaamheden rechtstreeks op enig algemeen belang zijn gericht; werkzaamheden die in de kern voorzien in de persoonlijke ontwikkeling of behoeften van deelnemers dienen een particulier belang, tenzij de instelling zich (nagenoeg) uitsluitend op kwetsbare groepen richt, en een gunstig maatschappelijk neveneffect is onvoldoende.", "wetsartikelen": ["art. 5b AWR", "art. 1a, lid 1, onderdeel b, Uitvoeringsregeling AWR 1994", "art. 8:75 Awb", "art. 8:108 Awb"], "belang": "middel", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:RBNHO:2023:13881"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHAMS:2025:1048"}, {"ecli": "ECLI:NL:RBZWB:2025:849", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2025-02-17", "gepubliceerd": "2025-02-24", "onderwerp": "SPF Curaçao; schenkingen aan zoon; formeelrechtelijke aspecten navordering", "samenvatting": "Belanghebbende bracht zijn vermogen onder in een SPF op Curaçao en emigreerde naar Bonaire; vanuit de SPF zijn schenkingen aan zijn zoon verricht. Na FIOD-onderzoek zijn navorderingsaanslagen IB/PVV opgelegd. De rechtbank oordeelt dat art. 8:42 Awb niet is geschonden (strafdossier bij contactambtenaar behoort niet tot de op de zaak betrekking hebbende stukken), dat de verlengde navorderingstermijn (art. 16 lid 4 AWR) terecht is toegepast, dat een nieuw feit aanwezig is en dat de bewijslast wordt omgekeerd en verzwaard omdat de trustvraag in de aangiften niet is aangekruist. Belanghebbende kon over het SPF-vermogen beschikken als ware het zijn eigen vermogen (transparantie).", "rechtsregel": "Het niet aankruisen van de trustvraag in de aangifte leidt tot omkering en verzwaring van de bewijslast; een transparante SPF verhindert toepassing van de verlengde navorderingstermijn niet.", "wetsartikelen": ["art. 8:42 Awb", "art. 16 lid 4 AWR", "art. 27e AWR"], "belang": "laag", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2025:849"}, {"ecli": "ECLI:NL:HR:2025:241", "instantie": "Hoge Raad", "datum": "2025-02-14", "gepubliceerd": "2026-07-11", "zaaknummer": "23/00153", "onderwerp": "Transparantierechtspraak naast APV-regime; art. 8:42 Awb-stukken", "samenvatting": "Belanghebbende 2 schonk in 2000 de aandelen in een Antilliaanse NV aan een stichting particulier fonds (SPF) waarover hij een onbeperkte volmacht op de bankrekening had; de inspecteur rekende het SPF-vermogen voor 2011 en 2012 aan belanghebbenden toe. In cassatie betoogden zij dat de transparantierechtspraak (HR 30 oktober 1985, ECLI:NL:HR:1985:AC9086) is achterhaald door invoering per 2010 van artikel 2.14a Wet IB 2001. De Hoge Raad verwerpt dat: artikel 2.14a ziet enkel op gevallen waarin vaststaat dat vermogen is afgezonderd, en de daaraan voorafgaande vraag of van afzondering sprake is wordt beantwoord met de transparantierechtspraak. De uitspraak wordt niettemin vernietigd omdat het Hof het verzoek om overlegging van stukken ten onrechte tardief verklaarde; nieuwe respectievelijk met een beroep op artikel 8:29 Awb geheimgehouden stukken behoren tot de stukken die de inspecteur op grond van artikel 8:42 Awb alsnog onverwijld moet inbrengen.", "rechtsregel": "Indien de belastingplichtige over bij een derde ondergebracht vermogen kan beschikken als ware het zijn eigen vermogen, is dat vermogen niet afgezonderd en komt men aan artikel 2.14a Wet IB 2001 niet toe; de transparantierechtspraak is door invoering van het APV-regime niet achterhaald.", "wetsartikelen": ["art. 2.14a Wet IB 2001", "art. 8:29 Awb", "art. 8:42 Awb"], "belang": "hoog", "oordeel": "verwijzing", "gerelateerd": ["ECLI:NL:GHSHE:2022:4440"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2025:241"}, {"ecli": "ECLI:NL:RBNNE:2025:242", "instantie": "Rechtbank Noord-Nederland", "datum": "2025-01-28", "gepubliceerd": "2025-05-21", "zaaknummer": "24-1800", "onderwerp": "ANBI; categorie welzijn vereist geen afgebakende kwetsbare doelgroep", "samenvatting": "Een stichting die eenzaamheid bestrijdt door buurtgenoten met dezelfde interesses te koppelen en burenhulp te organiseren, kreeg de ANBI-status geweigerd omdat volgens de inspecteur een afgebakende, kwetsbare doelgroep ontbrak en de stichting slechts een platform zou zijn. De rechtbank verwerpt beide eisen: zij vindt daarvoor geen steun in de wet, de wetsgeschiedenis of de rechtspraak van de Hoge Raad, oordeelt dat de categorie welzijn ruim en met inachtneming van maatschappelijke ontwikkelingen moet worden uitgelegd en dat het tegengaan van eenzaamheid daaronder valt. Omdat de werkzaamheden een onmisbare schakel in die eenzaamheidsbestrijding zijn en de kwantitatieve toets niet in geschil was, wordt de stichting per 17 juli 2023 als ANBI aangemerkt.", "rechtsregel": "De categorie welzijn van art. 5b, derde lid, AWR moet ruim worden uitgelegd; noch een afgebakende kwetsbare doelgroep, noch het zelf organiseren van de activiteiten is vereist, mits de werkzaamheden rechtstreeks - als onmisbare schakel - op het algemeen nut zijn gericht.", "wetsartikelen": ["art. 5b AWR", "art. 1a Uitvoeringsregeling Algemene wet inzake rijksbelastingen 1994", "art. 1b Uitvoeringsregeling Algemene wet inzake rijksbelastingen 1994"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNNE:2025:242"}, {"ecli": "ECLI:NL:GHDHA:2025:956", "instantie": "Gerechtshof Den Haag", "datum": "2025-01-21", "gepubliceerd": "2026-04-17", "zaaknummer": "BK-23/728", "onderwerp": "Erfbelasting: legitieme onder oud recht; geen partnervrijstelling voor kind", "samenvatting": "De vader van belanghebbende overleed in 1995 onder oud erfrecht met een ouderlijke boedelverdeling; belanghebbende en zijn broer riepen hun legitieme portie in en de nalatenschap werd nooit verdeeld. Na het overlijden van de moeder in 2019 stelde belanghebbende dat hij een (te laag gewaardeerde) overbedelingsvordering met rente had en dat hij recht had op de partnervrijstelling. Het Hof oordeelt dat inroeping van de legitieme naar oud recht een goederenrechtelijke aanspraak opleverde en geen vorderingsrecht, zodat noch herwaardering noch rentebijtelling aan de orde is en die aanspraak ten tijde van het overlijden in 2019 was uitgewerkt (artikel 128 Overgangswet nieuw BW); de aanslag naar een belaste verkrijging van € 92.583 is eerder te laag dan te hoog. De partnervrijstelling is terecht geweigerd omdat belanghebbende bloedverwant in de rechte lijn is (artikel 1a, lid 1, onderdeel d, SW 1956) en de mantelzorguitzondering van artikel 1a, lid 4, SW sinds het vervallen van het mantelzorgcompliment per 2015 geen werking meer heeft; dit levert geen schending op van artikel 1 EP EVRM of artikel 14 EVRM, mede omdat ook een geadopteerd kind bloedverwant in de rechte lijn is.", "rechtsregel": "Een bloedverwant in de rechte lijn kan sinds het vervallen van het mantelzorgcompliment per 1 januari 2015 niet als partner in de zin van artikel 1a SW 1956 worden aangemerkt, en een onder oud erfrecht ingeroepen legitieme portie geeft slechts een goederenrechtelijke aanspraak die niet als rentedragende vordering op de nalatenschap in aftrek komt.", "wetsartikelen": ["art. 1a, lid 1, onderdeel d, SW 1956", "art. 1a, lid 4, SW 1956", "art. 32, lid 1, SW 1956", "art. 4:960 BW (oud)", "art. 4:1167 BW (oud)", "art. 4:63 BW", "art. 128 Overgangswet nieuw BW", "art. 1:229 BW", "art. 63 AWR", "art. 11 Wet algemene bepalingen", "art. 1 EP EVRM", "art. 14 EVRM"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHDHA:2025:956"}, {"ecli": "ECLI:NL:GHAMS:2024:3381", "instantie": "Gerechtshof Amsterdam", "datum": "2024-12-10", "gepubliceerd": "2026-08-13", "zaaknummer": "21/1665", "onderwerp": "Bedrijfsopvolging — geen bevoordelingsbedoeling bij aandelenoverdracht", "samenvatting": "Navorderingsaanslag IB/PVV op grond van art. 4.22 Wet IB 2001 bij een aandelenoverdracht in het kader van bedrijfsopvolging, met discussie over de waardering van onroerende zaken. Het hof vernietigt de navorderingsaanslag: de inspecteur heeft niet aannemelijk gemaakt dat de verkoopprijs is bedongen bij een niet onder normale omstandigheden gesloten overeenkomst, noch dat sprake was van een bevoordelingsbedoeling. Raakvlak met de schenkbelasting via het vereiste van bevoordelingsbedoeling bij bedrijfsopvolging binnen de familie.", "rechtsregel": "Het enkele feit dat een aandelenoverdracht in familieverband en in het kader van bedrijfsopvolging plaatsvindt, brengt niet mee dat de prijs onzakelijk is; de inspecteur draagt de bewijslast van de bevoordelingsbedoeling.", "wetsartikelen": ["art. 4.22 Wet IB 2001", "art. 1 SW 1956 (raakvlak)"], "belang": "laag", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHAMS:2024:3381"}, {"ecli": "ECLI:NL:RBZWB:2024:8408", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2024-12-09", "gepubliceerd": "2025-01-13", "zaaknummer": "BRE 23/10547", "onderwerp": "Aanslagtermijn erfbelasting; verzending uitstelbrief niet aannemelijk gemaakt", "samenvatting": "De moeder van belanghebbende overleed in 2019; het overlijden werd op 16 december 2019 ingeschreven, zodat de driejaarstermijn voor het opleggen van de aanslag erfbelasting op 17 december 2019 aanving. De executeur verzocht in juli 2020 om uitstel voor het doen van aangifte; de inspecteur stelt dat op 30 juli 2020 uitstel is verleend, maar belanghebbende betwist de ontvangst van die brief. De rechtbank oordeelt dat de inspecteur met een schermprint uit een intern systeem en een algemeen assurancerapport over de verzending van alle brieven in 2020 de verzending niet aannemelijk maakt, zodat geen kenbaar uitstel is verleend, de aanslagtermijn niet is verlengd en de op 20 maart 2023 gedagtekende aanslag erfbelasting van € 146.780 wordt vernietigd.", "rechtsregel": "Betwist de belastingplichtige de ontvangst van de brief waarin uitstel voor het doen van aangifte erfbelasting is verleend, dan moet de inspecteur de verzending aannemelijk maken; een interne systeemaantekening en een algemeen assurancerapport volstaan daarvoor niet, zodat de aanslagtermijn niet wordt verlengd.", "belang": "middel", "oordeel": "gegrond", "parallelzaken": ["ECLI:NL:RBZWB:2024:8405", "ECLI:NL:RBZWB:2024:8409"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2024:8408"}, {"ecli": "ECLI:NL:RBZWB:2024:8401", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2024-12-09", "gepubliceerd": "2025-03-22", "zaaknummer": "BRE-23/12476", "onderwerp": "Belastingrente bij aanslag erfbelasting; aangifte enkele dagen te laat", "samenvatting": "De moeder van belanghebbende overleed in 2022; de door de notaris verzorgde aangifte erfbelasting werd op 12 juli 2023 ontvangen, dus niet vóór de eerste dag van de negende maand na het overlijden (9 juli 2023), waarna bij de aanslag van € 84.863 € 1.089 belastingrente in rekening is gebracht. De rechtbank oordeelt dat de uitzondering van artikel 30g, vierde lid, AWR niet van toepassing is en dat de figuur van de verschoonbare termijnoverschrijding niet geldt voor het doen van aangifte, zodat de door belanghebbende aangevoerde bijzondere omstandigheden (drie sterfgevallen in twee maanden, een vergissing van de notaris) niet baten. Ook de duur van het rentetijdvak tot zes weken na dagtekening van de aanslag is juist, nu de wetgever uitdrukkelijk heeft willen aansluiten bij het invorderbaar worden van de aanslag.", "rechtsregel": "De uitzondering op het in rekening brengen van belastingrente bij erfbelasting geldt alleen als de aangifte binnen acht maanden na het overlijden is ontvangen; een verschoonbare termijnoverschrijding bestaat voor het doen van aangifte niet, ook niet bij bijzondere persoonlijke omstandigheden.", "wetsartikelen": ["art. 30g AWR"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2024:8401"}, {"ecli": "ECLI:NL:RBZWB:2024:8411", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2024-12-09", "gepubliceerd": "2025-03-22", "zaaknummer": "BRE 23/11559", "onderwerp": "Kwijtschelding overbedelingsvordering bij echtscheiding is belaste schenking", "samenvatting": "Bij het opstellen van huwelijkse voorwaarden in 2011 erkende belanghebbende € 956.236,50 wegens overbedeling schuldig aan zijn echtgenote; in het echtscheidingsconvenant van 2018 deed zij afstand van die vordering (met rente € 1.081.072) om de vennootschappen van belanghebbende van elk financieel risico te vrijwaren. In geschil was of sprake was van vrijgevigheid. De rechtbank oordeelt dat de inspecteur bewustheid en wil tot bevoordeling aannemelijk heeft gemaakt – een kwijtschelding van ruim € 1 miljoen zou de ex-echtgenote niet aan een willekeurige derde met een onderneming doen – en dat belanghebbende niet aannemelijk heeft gemaakt dat werd voldaan aan een natuurlijke verbintenis, nu de noodzaak van de kwijtschelding en het ontbreken van minder vergaande alternatieven niet zijn onderbouwd.", "rechtsregel": "Het kwijtschelden van een overbedelingsvordering in het kader van een echtscheiding is een belaste schenking indien de schuldeiser zich van de bevoordeling bewust was en deze heeft gewild; de enkele wens de continuïteit van de onderneming van de ex-partner te waarborgen neemt de vrijgevigheid niet weg en levert zonder nadere onderbouwing geen natuurlijke verbintenis op.", "wetsartikelen": ["art. 7:186 BW", "art. 6:3 BW"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2024:8411"}, {"ecli": "ECLI:NL:RBDHA:2024:20487", "instantie": "Rechtbank Den Haag", "datum": "2024-12-05", "gepubliceerd": "2024-12-11", "onderwerp": "BOR schenkbelasting; bezitsvereiste art. 35d na juridische splitsing", "samenvatting": "Moeder schonk op 7 september 2020 - dezelfde dag als een juridische splitsing - alle aandelen in de afgesplitste vennootschap aan haar dochter, met een beroep op de bedrijfsopvolgingsregeling (BOR). De inspecteur beperkte de BOR tot 49%, omdat moeder 51% van de aandelen (afkomstig van de in 2017 overleden vader) binnen vijf jaar voor de schenking had verkregen en daardoor voor dat deel niet aan het bezitsvereiste van art. 35d, lid 1, onderdeel c SW voldeed. De rechtbank verklaart het beroep ongegrond. In hoger beroep bevestigd (ECLI:NL:GHDHA:2026:114).", "rechtsregel": "Voor de BOR moet per aandelenpakket aan het bezitsvereiste van art. 35d SW zijn voldaan; aandelen die de schenker binnen de bezitstermijn heeft verkregen (hier via toedeling na overlijden van de mede-aandeelhouder) delen niet in de voorwaardelijke vrijstelling, ook niet na een daaropvolgende juridische splitsing.", "wetsartikelen": ["art. 35b SW 1956", "art. 35d SW 1956"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2024:20487"}, {"ecli": "ECLI:NL:GHARL:2024:7093", "instantie": "Gerechtshof Arnhem-Leeuwarden", "datum": "2024-11-19", "gepubliceerd": "2025-02-13", "zaaknummer": "23/1175", "onderwerp": "Erfbelasting: omvang nalatenschap na onherroepelijke vereffeningsbeschikking", "samenvatting": "Erflater overleed in 2017 zonder testament en liet negen erfgenamen na, ieder voor 1/9 deel; aan belanghebbende werd ambtshalve een aanslag erfbelasting opgelegd, bij uitspraak op bezwaar verminderd tot een belaste verkrijging van € 13.933 op basis van de door de vereffenaars opgestelde rekening en verantwoording en uitdelingslijst. Belanghebbende stelde dat de nalatenschap moest worden verminderd met een uit de nalatenschap van zijn moeder afkomstige overbedelingsschuld aan hem en zijn broer. Het Hof oordeelt dat met het onherroepelijk worden van de beschikking van de rechtbank Limburg van 4 augustus 2022, waarbij het verzet tegen de uitdelingslijst ongegrond is verklaard, de omvang van de nalatenschap voor de toepassing van de Successiewet 1956 in beginsel vaststaat, en dat belanghebbende met blote stellingen en onnavolgbare, niet met stukken onderbouwde berekeningen onvoldoende heeft aangevoerd om daarvan af te wijken. Een na sluiting van het onderzoek ingediend nader stuk geeft geen aanleiding tot heropening.", "rechtsregel": "Is in de civiele vereffening de rekening en verantwoording met uitdelingslijst onherroepelijk komen vast te staan doordat het verzet daartegen ongegrond is verklaard, dan staat de omvang van de nalatenschap voor de toepassing van de Successiewet 1956 in beginsel vast; wie een lagere omvang bepleit, moet dat met concrete, onderbouwde gegevens aannemelijk maken.", "wetsartikelen": ["Successiewet 1956", "art. 8:68 Awb"], "belang": "middel", "oordeel": "ongegrond", "parallelzaken": ["ECLI:NL:GHARL:2024:7094", "ECLI:NL:GHARL:2024:7095"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHARL:2024:7093"}, {"ecli": "ECLI:NL:RBZWB:2024:7323", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2024-10-30", "gepubliceerd": "2026-05-13", "zaaknummer": "BRE 20/8064 en BRE 20/8066 tot en met BRE 20/8072", "onderwerp": "Toerekening trustvermogen aan erfgename; tegenbewijs art. 2.14a lid 6; boeten", "samenvatting": "Vader stelde in 1999 een irrevocable discretionary trust in; na zijn overlijden in 2008 wordt het trustvermogen voor een vierde deel aan belanghebbende, een van de vier dochters en erfgenamen, toegerekend (IB/PVV 2010 tot en met 2017). De 'Deed of exclusion' van 24 december 2009 baat haar niet: doordat de door de trust gehouden vennootschap haar een renteloze, aflossingsvrije lening van EUR 184.018 liet voortduren, genoot zij indirect een voordeel en is zij in feite indirect begunstigde, zodat het verzwaarde tegenbewijs van artikel 2.14a, lid 6, Wet IB 2001 niet is geleverd. Navordering is mogelijk wegens aan haar toe te rekenen kwade trouw van de adviseur die de trustvraag in de aangiften niet aankruiste; de verlengde navorderingstermijn geldt onbeperkt wegens de standstillbepaling van artikel 64 VWEU. De vergrijpboeten worden vernietigd omdat niet is aangetoond dat belanghebbende zelf, die op een deskundige adviseur vertrouwde, opzet of grove schuld kan worden verweten.", "rechtsregel": "Een erfgenaam die door het renteloos laten voortbestaan van een lening van een tot het APV behorende vennootschap een voordeel geniet, is in feite indirect begunstigde, zodat de tegenbewijsregeling van artikel 2.14a, lid 6, Wet IB 2001 faalt, ook als hij formeel als begunstigde is uitgesloten.", "wetsartikelen": ["art. 2.14a Wet IB 2001", "art. 16 AWR", "art. 67d AWR", "art. 67e AWR", "art. 63 VWEU", "art. 64 VWEU"], "belang": "middel", "oordeel": "gegrond", "parallelzaken": ["ECLI:NL:RBZWB:2024:7324", "ECLI:NL:RBZWB:2024:7325"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2024:7323"}, {"ecli": "ECLI:NL:RBZWB:2024:7326", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2024-10-30", "gepubliceerd": "2026-05-13", "zaaknummer": "BRE 20/7701 tot en met BRE 20/7708", "onderwerp": "Toerekening trustvermogen aan inmiddels overleden erfgename; art. 2.14a lid 6", "samenvatting": "In deze zaak van de erven van een in 2021 overleden dochter gaat het om dezelfde in 1999 door vader ingestelde discretionaire trust; een vierde van het trustvermogen is op grond van artikel 2.14a Wet IB 2001 aan erflaatster toegerekend voor de jaren 2010 tot en met 2017. De rechtbank oordeelt dat erflaatster door een renteloze, aflossingsvrije lening van de door de trust gehouden vennootschap in feite indirect begunstigde was, zodat de 'Deed of exclusion' van 2009 niet aan toerekening in de weg staat en het tegenbewijs van artikel 2.14a, lid 6, Wet IB 2001 niet is geleverd. De belastbare inkomens uit sparen en beleggen 2010 tot en met 2016 worden verminderd omdat alsnog rekening moet worden gehouden met de schulden aan die vennootschap en aan de trust; het beroep voor 2017 is ongegrond. De boeten waren na het overlijden al tot nihil verminderd.", "rechtsregel": "Formele uitsluiting als begunstigde ('excluded') verhindert toerekening van APV-vermogen aan een erfgenaam niet indien deze feitelijk indirect een voordeel uit het afgezonderde vermogen geniet.", "wetsartikelen": ["art. 2.14a Wet IB 2001", "art. 16 AWR", "art. 63 VWEU", "art. 64 VWEU"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2024:7326"}, {"ecli": "ECLI:NL:PHR:2024:1114", "instantie": "Parket bij de Hoge Raad", "datum": "2024-10-25", "gepubliceerd": "2026-01-30", "zaaknummer": "24/01608", "onderwerp": "BOR na ruziesplitsing; uitleg verwijzingsarrest en reikwijdte art. 9(2) URSE", "samenvatting": "Tweede cassatieronde in de zaak over de schenking in 2013 van aandelen na de ruziesplitsing van 2011 (vervolg op HR BNB 2023/97, ECLI:NL:HR:2023:647); het verwijzingshof oordeelde dat 'horen' en 'zien' meer dan een objectieve onderneming vormden en dat de BOR daarom slechts voor 49% geldt. In geschil zijn de uitleg van het verwijzingsarrest, de vraag of art. 9, lid 2, URSE ook de indirecte bezitseis verzacht, de bewijslastverdeling en de goede procesorde. A-G Wattel acht de uitleg van het hof juist, meent dat art. 9, lid 2, URSE blijkens zijn tekst uitsluitend op aandelen en dus op de directe bezitseis ziet, en acht het aan belanghebbende om aannemelijk te maken dat sprake was van een objectieve onderneming omdat hij zich op een vrijstelling beroept. De conclusie strekt tot ongegrondverklaring van het cassatieberoep van belanghebbende.", "rechtsregel": "Art. 9, lid 2, Uitvoeringsregeling schenk- en erfbelasting verzacht bij een juridische splitsing uitsluitend de directe bezitseis ten aanzien van de aandelen en niet de indirecte bezitseis dat het lichaam de onderneming vijf jaren heeft gedreven; wie zich op de bedrijfsopvolgingsvrijstelling beroept draagt de bewijslast dat aan de voorwaarden is voldaan.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 35d SW 1956", "art. 9 Uitvoeringsregeling schenk- en erfbelasting", "art. 3.2 Wet IB 2001", "art. 2:334cc BW"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2024:1114"}, {"ecli": "ECLI:NL:RBGEL:2024:6970", "instantie": "Rechtbank Gelderland", "datum": "2024-10-14", "gepubliceerd": "2026-06-24", "onderwerp": "Leegwaarderatio woning bij quasi-wettelijke verdeling (erfbelasting)", "samenvatting": "Erflater benoemde zijn echtgenote voor 1% en zijn drie kinderen ieder voor 33% tot erfgenaam en stelde de wettelijke verdeling buiten toepassing, met een keuze voor een quasi-wettelijke verdeling. Belanghebbende is huurder van de geërfde woning; de inspecteur paste daarom bij haar (anders dan bij de twee andere kinderen) de leegwaarderatio van art. 21, achtste lid, SW niet toe omdat zij als mede-eigenaar/huurder zou verkrijgen. De rechtbank oordeelt dat de uiterste wilsbeschikking inhoudelijk overeenkomt met de wettelijke verdeling, zodat op grond van art. 1, vijfde lid, SW belanghebbende een geldvordering verkrijgt en niet een aandeel in de woning. Het beroep is gegrond; de belaste verkrijging wordt verminderd tot €38.358.", "rechtsregel": "Een quasi-wettelijke verdeling die inhoudelijk overeenkomt met de wettelijke verdeling wordt via art. 1, vijfde lid, SW gelijkgesteld; de niet-langstlevende erfgenaam verkrijgt een geldvordering, zodat de uitsluiting van de leegwaarderatio (art. 21, achtste lid, SW) voor de huurder/verkrijger niet aan de orde is.", "wetsartikelen": ["art. 1 SW 1956", "art. 21 SW 1956"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2024:6970"}, {"ecli": "ECLI:NL:PHR:2024:1055", "instantie": "Parket bij de Hoge Raad", "datum": "2024-10-11", "gepubliceerd": "2025-10-06", "zaaknummer": "24/01828", "onderwerp": "Kruislings schenken; dubbele eigenwoningvrijstelling; fraus legis", "samenvatting": "Belanghebbende en haar broer ontvingen op 12 juli 2017 elk EUR 100.000 van hun moeder en een dag later elk EUR 100.000 van mevrouw Z, terwijl de moeder omstreeks dezelfde tijd in totaal EUR 200.000 aan de kinderen van Z schonk; op beide schenkingen is een beroep gedaan op de verruimde eigenwoningvrijstelling van art. 33, onder 5o en 7o, SW 1956, waarna de Inspecteur de kruislingse schenking als schenking van de moeder aanmerkte en EUR 9.468 schenkbelasting hief. A-G Koopman meent dat de door het Hof vastgestelde nauwe samenhang op zichzelf onvoldoende is voor een zelfstandige fiscaalrechtelijke kwalificatie, maar dat fraus legis wel toepassing kan vinden nu uit de wetsgeschiedenis blijkt dat de wetgever het kruislings schenken niet heeft aanvaard en het ontbreken van specifieke antimisbruikwetgeving geen impliciete aanvaarding meebrengt. Omdat in de hofuitspraak besloten ligt dat het verijdelen van schenkbelasting de overwegende beweegreden was, faalt de klacht; de A-G geeft de Hoge Raad in overweging aan te geven hoe nauw de samenhang moet zijn, bij voorkeur langs civielrechtelijke weg (do ut des versus do et das).", "rechtsregel": "Kruislingse schenkingen kunnen niet reeds op grond van een vastgestelde nauwe samenhang zelfstandig fiscaalrechtelijk worden geherkwalificeerd tot een schenking van de eigen ouder, maar leveren wel fraus legis op indien het samenstel van rechtshandelingen overwegend is ingegeven door het verijdelen van schenkbelasting; uit het uitblijven van specifieke antimisbruikwetgeving mag geen impliciete aanvaarding door de wetgever worden afgeleid.", "wetsartikelen": ["art. 1 SW 1956", "art. 33 SW 1956", "art. 31 AWR", "art. 7:175 BW", "art. 7:186 BW"], "belang": "hoog", "oordeel": "ongegrond", "parallelzaken": ["ECLI:NL:PHR:2024:1056"], "gerelateerd": ["ECLI:NL:RBDHA:2023:10331", "ECLI:NL:GHDHA:2024:646", "ECLI:NL:HR:2025:1327"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2024:1055"}, {"ecli": "ECLI:NL:RBNNE:2024:4367", "instantie": "Rechtbank Noord-Nederland", "datum": "2024-10-09", "gepubliceerd": "2025-05-27", "zaaknummer": "LEE 24/1489", "onderwerp": "Erfbelasting; geen hogere vrijstelling voor inwonend kind", "samenvatting": "Belanghebbende woonde sinds zijn geboorte bij zijn in 2020 overleden moeder en verkreeg EUR 60.945; de inspecteur paste de kindvrijstelling van EUR 20.946 toe, zodat EUR 39.999 belast was. Belanghebbende bepleitte toepassing van de partnervrijstelling onder de voorwaarden van de per 1 januari 2010 afgeschafte samenwoonvrijstelling voor oudere thuiswonende kinderen of de met terugwerkende kracht per 1 januari 2015 afgeschafte mantelzorgvrijstelling, omdat door het ontbreken van een vervangende regeling of overgangsrecht een leemte in de wet zou zijn ontstaan. De rechtbank wijst dat af: de rechter moet rechtspreken volgens de wet en mag vervallen wetgeving niet toepassen.", "rechtsregel": "De rechter mag vervallen vrijstellingen in de Successiewet 1956 niet alsnog toepassen; de wetgever mag vrijstellingen afschaffen zonder overgangsrecht en de belastingplichtige kan er niet op vertrouwen dat wetgeving ongewijzigd blijft.", "wetsartikelen": ["art. 32 SW 1956", "art. 24 SW 1956 (oud)", "art. 1a SW 1956 (oud)"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNNE:2024:4367"}, {"ecli": "ECLI:NL:RBZWB:2024:6438", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2024-09-18", "gepubliceerd": "2025-03-21", "zaaknummer": "BRE 23/11403", "onderwerp": "BOR: medegerechtigdheid geschonken aan wie geen beherend vennoot is", "samenvatting": "Belanghebbende verkreeg in 2020 van haar ouders een medegerechtigdheid in een CV met een waarde van € 430.000 en deed een beroep op de bedrijfsopvolgingsregeling; de inspecteur paste alleen de reguliere vrijstelling van € 5.515 toe en stelde de schenkbelasting op € 72.224 vast. In geschil was of belanghebbende ten tijde van de schenking beherend vennoot was als bedoeld in artikel 35c, tweede lid, SW 1956; op 30 juni 2020 was zij dat niet (haar echtgenoot en broer waren de beherend vennoten) en op 1 juli 2020 was de CV al ontbonden en waren de ouders geen vennoot van de opvolgende vof. De rechtbank verwerpt ook het beroep op het huwelijksgoederenregime – een gemeenschap van goederen leidt niet tot vereenzelviging of toerekening van de kwaliteit van beherend vennoot – en op artikel 26 SW 1956, dat blijkens de wetsgeschiedenis alleen ziet op de mate van verwantschap voor tarief en vrijstellingen en niet op de ondernemerskwaliteit. Toetsing van artikel 35c SW 1956 aan het evenredigheidsbeginsel stuit af op het toetsingsverbod van artikel 120 Grondwet en artikel 11 Wet AB.", "rechtsregel": "De kwaliteit van beherend vennoot die artikel 35c, tweede lid, SW 1956 voor de BOR bij verkrijging van een medegerechtigdheid eist, kan niet via het huwelijksgoederenregime of via de partnerfictie van artikel 26 SW 1956 aan de andere partner worden toegerekend.", "wetsartikelen": ["art. 26 SW 1956", "art. 35b SW 1956", "art. 35c SW 1956", "art. 3.2 Wet IB 2001", "art. 3.3 Wet IB 2001", "art. 120 Grondwet", "art. 11 Wet AB"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2024:6438"}, {"ecli": "ECLI:NL:HR:2024:1130", "instantie": "Hoge Raad", "datum": "2024-09-06", "gepubliceerd": "2025-03-22", "zaaknummer": "22/02354", "onderwerp": "Kindbegrip SW; niet-erkend biologisch kind met family life; art. 14 EVRM", "samenvatting": "Belanghebbende, in 1996 geboren en niet erkend door zijn in 2017 overleden biologische vader, was bij testament tot erfgenaam benoemd; tussen hem en de erflater bestond family life in de zin van art. 8 EVRM, maar geen familierechtelijke betrekking. In geschil waren de tariefgroep van art. 24, lid 1, SW en de kindvrijstelling van art. 32, lid 1, onder 4, letter c, SW. De Hoge Raad oordeelt dat voor het begrip kind in art. 2, lid 3, letter i, AWR en voor het begrip afstammeling in art. 24, lid 1, SW moet worden aangesloten bij het civiele recht, zodat een familierechtelijke betrekking is vereist. Het daaruit voortvloeiende onderscheid tussen huwelijkse en buitenhuwelijkse kinderen met family life is echter in strijd met art. 14 in samenhang met art. 8 EVRM; rechtsherstel gaat de rechtsvormende taak van de rechter te buiten, zodat de aanslag in stand blijft, met EUR 500 immateriele schadevergoeding wegens overschrijding van de redelijke termijn.", "rechtsregel": "Voor de begrippen kind (art. 2, lid 3, letter i, AWR) en afstammeling (art. 24, lid 1, SW 1956) is een familierechtelijke betrekking vereist; het daaruit voortvloeiende ongunstiger tarief en vrijstelling voor een niet-erkend buitenhuwelijks kind dat family life met de erflater had, is in strijd met art. 14 EVRM in samenhang met art. 8 EVRM, maar het rechtstekort dient door de wetgever te worden opgeheven.", "wetsartikelen": ["art. 24 lid 1 SW 1956", "art. 32 lid 1 onder 4 letter c SW 1956", "art. 32 lid 1 onder 4 letter f SW 1956", "art. 19 SW 1956", "art. 2 lid 3 letter i AWR", "art. 1:197 BW", "art. 1:199 BW", "art. 1:3 lid 1 BW", "art. 8 EVRM", "art. 14 EVRM"], "belang": "hoog", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:GHARL:2022:4050", "ECLI:NL:PHR:2023:1201"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2024:1130"}, {"ecli": "ECLI:NL:RBZWB:2024:6084", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2024-08-30", "gepubliceerd": "2025-03-22", "zaaknummer": "BRE 23/3608", "onderwerp": "Belastingrente bij voorlopige aanslag erfbelasting; termijn art. 30g AWR", "samenvatting": "De enige erfgenaam verzocht pas bij brief van 28 oktober 2022, ontvangen op 2 november 2022, om een voorlopige aanslag erfbelasting, waarna EUR 7.406 belastingrente in rekening werd gebracht. De rechtbank oordeelt dat de termijn van art. 30g, vierde lid, AWR - de eerste dag van de negende maand na het overlijden, aansluitend bij de aangiftetermijn van art. 45, eerste lid, SW 1956 - op 3 oktober 2022 eindigde, zodat terecht rente is berekend. Wel merkt de rechtbank het verzoek om geen rente in rekening te brengen aan als verzoekschrift in de zin van art. 60 AWR, waarop art. 6:11 Awb van overeenkomstige toepassing is; van een verschoonbare termijnoverschrijding is hier echter geen sprake omdat belanghebbende van een onjuiste einddatum uitging.", "rechtsregel": "Een verzoek om een voorlopige aanslag erfbelasting zonder belastingrente moet zijn ontvangen binnen acht maanden na het overlijden; een te laat verzoek is een verzoekschrift in de zin van art. 60 AWR waarop art. 6:11 Awb van overeenkomstige toepassing is.", "wetsartikelen": ["art. 30g AWR", "art. 60 AWR", "art. 6:11 Awb", "art. 45 SW 1956"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2024:6084"}, {"ecli": "ECLI:NL:GHDHA:2024:1256", "instantie": "Gerechtshof Den Haag", "datum": "2024-07-24", "gepubliceerd": "2025-03-21", "zaaknummer": "BK-23/892", "onderwerp": "ANBI-status ten onrechte met terugwerkende kracht ingetrokken; risicoselectie en art. 52 AWR", "samenvatting": "De Inspecteur had de ANBI-beschikking van een stichting met terugwerkende kracht tot 1 januari 2008 ingetrokken nadat een derdenonderzoek bij een gever die giftenaftrek claimde had geleid tot een ANBI-onderzoek bij de stichting. Het Hof verwerpt het beroep op art. 8:42 Awb en oordeelt dat geen sprake is geweest van onrechtmatige risicoselectie op grond van de islamitische achtergrond van de stichting, zodat het rapport van het ANBI-onderzoek niet buiten beschouwing blijft. Inhoudelijk stelt het Hof vast dat de administratie over 2010 tot en met 2014 gebreken vertoont (onvolledig ingevulde kwitanties zonder uniek nummeringssysteem, ontbrekende leningsdocumentatie, kasverschillen), maar dat die gebreken — mede gelet op de verbetering door de jaren heen, het ontbreken van onderbouwing door de Inspecteur en het werken met vrijwilligers — niet meebrengen dat niet is voldaan aan de administratieplicht van art. 52, lid 1, AWR. Omdat de geconstateerde verschillen minder dan 10% van de uitgaven belopen, is evenmin aannemelijk dat niet aan het kwantitatieve (90%-)criterium is voldaan; de liquidatiebepaling in de statuten voldoet aan art. 1b UR AWR. De ANBI-status is dus ten onrechte ingetrokken en de uitspraak van de Rechtbank wordt bevestigd.", "rechtsregel": "Gebreken in de administratie van een instelling leiden niet zonder meer tot schending van de administratieplicht van art. 52 AWR en tot verlies van de ANBI-status: beslissend is of de administratie, mede gelet op de aard en omvang van de gebreken en op achteraf verstrekte verklarende gegevens, voldoende inzicht geeft in herkomst en besteding van de middelen en of aannemelijk is dat meer dan 10% van de uitgaven niet in overeenstemming met de doelstelling is gedaan.", "wetsartikelen": ["art. 5b AWR", "art. 52 AWR", "art. 1a Uitvoeringsregeling AWR 1994", "art. 1b Uitvoeringsregeling AWR 1994", "art. 6.33 lid 1 letter b Wet IB 2001", "art. 41a Uitvoeringsregeling IB 2001", "art. 8:42 Awb"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBDHA:2023:11856"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHDHA:2024:1256"}, {"ecli": "ECLI:NL:RBZWB:2024:4980", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2024-07-18", "gepubliceerd": "2025-03-22", "zaaknummer": "BRE 23/2843", "onderwerp": "Art. 82a SW; overgangsrecht blokkeert eigenwoningvrijstelling 2019", "samenvatting": "Belanghebbende deed in 2011 een beroep op de toen geldende eenmalig verhoogde vrijstelling voor een schuldigerkenning van EUR 24.144 en claimde voor een schenking van EUR 44.156 in 2019 de eenmalig verhoogde eigenwoningvrijstelling van EUR 102.010. De rechtbank oordeelt dat art. 82a SW 1956 toepassing van die vrijstelling blokkeert omdat in de jaren 2010 tot en met 2016 al een verhoogde vrijstelling is toegepast, ongeacht het toen geschonken bedrag, en dat de wetgever dit gevolg blijkens de parlementaire behandeling uitdrukkelijk heeft aanvaard vanwege de uitvoeringslasten. Het beroep op het discriminatieverbod van art. 26 IVBPR en art. 14 EVRM faalt, omdat de wetgever binnen zijn ruime beoordelingsmarge is gebleven, en de inspecteur had geen beleidsvrijheid.", "rechtsregel": "Art. 82a SW 1956 sluit toepassing van de verhoogde eigenwoningvrijstelling uit zodra in enig jaar 2010 tot en met 2016 een verhoogde vrijstelling is benut, ongeacht de omvang daarvan, en een inhaalschenking is niet mogelijk.", "wetsartikelen": ["art. 82a SW 1956", "art. 33 SW 1956", "art. 33a SW 1956", "art. 26 IVBPR", "art. 14 EVRM", "art. 1 Eerste Protocol EVRM"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "De verhoogde eigenwoningvrijstelling waarop het overgangsrecht van art. 82a SW 1956 ziet, is per 1 januari 2024 vervallen, zodat de regel alleen nog voor oude jaren betekenis heeft.", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2024:4980"}, {"ecli": "ECLI:NL:RBZWB:2024:4731", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2024-07-16", "gepubliceerd": "2025-03-22", "zaaknummer": "23/3117", "onderwerp": "Recht van schenking 2009; transparante Curacaose stichting", "samenvatting": "Ouders brachten in 2001 ruim EUR 2.000.000 in een naar het recht van Curacao opgerichte stichting en lieten die op 31 december 2009 - vlak voor de inwerkingtreding van de APV-wetgeving - aan elk van hun drie kinderen EUR 300.000 uitkeren; de aanslag betreft het recht van schenking onder de Successiewet zoals die tot 2010 luidde. De rechtbank oordeelt dat de inspecteur aannemelijk heeft gemaakt dat de ouders eind 2009 over het stichtingsvermogen konden beschikken als ware het hun eigen vermogen - er lag geen zelfstandig bestuursbesluit, de schenkingen kwamen voort uit afspraken tussen ouders en kinderen en de stichting betaalde privelasten van de ouders - zodat het vermogen aan de ouders wordt toegerekend en sprake is van een belaste schenking. Het beroep op het voortvarendheidsvereiste faalt omdat geen navorderingsaanslag maar een aanslag binnen de driejaarstermijn is opgelegd.", "rechtsregel": "Kan de inbrenger over het vermogen van een afgezonderd doelvermogen beschikken als ware het zijn eigen vermogen, dan wordt dat vermogen fiscaal aan hem toegerekend en geldt een uitkering daaruit aan zijn kind als een schenking van hem; het voortvarendheidsvereiste geldt alleen bij gebruik van de verlengde navorderingstermijn.", "wetsartikelen": ["art. 16 AWR"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "De hier toegepaste transparantiebenadering ziet op schenkingen van voor 1 januari 2010; sindsdien beheerst de APV-wetgeving de toerekening van vermogen van afgezonderde particuliere vermogens.", "parallelzaken": ["ECLI:NL:RBZWB:2024:4732"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2024:4731"}, {"ecli": "ECLI:NL:RBZWB:2024:4860", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2024-07-15", "gepubliceerd": "2025-03-22", "zaaknummer": "BRE 23/2837", "onderwerp": "Erfbelasting; geen renteschuld op overbedelingsvorderingen aftrekbaar", "samenvatting": "Vader overleed in 2000 met een ouderlijke boedelverdeling waarbij de dochters overbedelingsvorderingen van 337.921 gulden kregen; het testament kende rente van 5 tot 8 procent toe, maar alleen indien de kinderen daartoe de wens te kennen zouden geven. Na het overlijden van moeder in 2021 voerden de dochters een renteschuld van in totaal EUR 391.022 (6 procent enkelvoudig) op als schuld van de nalatenschap. De rechtbank oordeelt dat de bewijslast op belanghebbende rust en dat zij niet aannemelijk maakt dat die wens ooit kenbaar is gemaakt - de aangifte na het overlijden van vader vermeldde juist 'geen rentevergoeding over schuldig gebleven erfdelen' - zodat de inspecteur de renteschuld terecht heeft gecorrigeerd; van schending van het zorgvuldigheidsbeginsel is geen sprake.", "rechtsregel": "Wie zich beroept op een renteschuld op overbedelingsvorderingen als schuld van de nalatenschap draagt de bewijslast dat de in het testament aan een wilsuiting gekoppelde rente daadwerkelijk is gaan lopen.", "wetsartikelen": ["art. 1167 BW (oud)"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2024:4860"}, {"ecli": "ECLI:NL:GHSHE:2024:2117", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2024-06-28", "gepubliceerd": "2025-03-22", "zaaknummer": "22/2273", "onderwerp": "Navordering erfbelasting: woonplaatsfictie art. 3 SW, nieuw feit en de plicht tot een redelijke schatting binnen de aanslagtermijn", "samenvatting": "Erflater, Nederlander, stond wisselend in het buitenland ingeschreven en overleed in 2015 in Nederland; zijn zoon en enig erfgenaam stelde dat geen aangifteplicht bestond. Na een strafrechtelijk witwasonderzoek legde de inspecteur in 2020 een navorderingsaanslag erfbelasting op naar een belaste verkrijging van € 10.566.351 met een vergrijpboete van 50% (€ 1.050.570). Het hof oordeelt: (a) de inspecteur heeft zijn beroep op kwade trouw ter zitting van de rechtbank uitdrukkelijk en ondubbelzinnig ingetrokken en kan daarop niet terugkomen; (b) de inspecteur was vóór het verstrijken van de aanslagtermijn (14 mei 2018) bekend met het lopende woonplaatsonderzoek en had de aanslag toen ter behoud van rechten moeten opleggen op basis van een redelijke schatting van € 7.547.050, zodat hij slechts partieel — voor het meerdere — over een nieuw feit beschikt; (c) op grond van onder meer brp-inschrijving in 2006, Nederlands kenteken, VGZ-verzekering, ontbrekende fiscale binding met het buitenland en het frequent bezochte familiegraf is aannemelijk dat erflater binnen tien jaar vóór zijn overlijden in Nederland woonde, zodat art. 3 lid 1 SW 1956 toepassing vindt; (d) omkering van de bewijslast faalt omdat de inspecteur de verzending van de aanmaning niet aannemelijk maakt; (e) de verkrijging wordt verminderd tot € 2.945.819 en (f) de vergrijpboete wordt vernietigd omdat de inspecteur niet heeft doen blijken dat belanghebbende opzettelijk of grofschuldig onjuist aangifte deed.", "rechtsregel": "Voor de erfbelasting kan de inspecteur in beginsel volstaan met raadpleging van het eigen erfbelastingdossier, maar beschikt hij vóór het einde van de aanslagtermijn over aanwijzingen dat de woonplaatsfictie van art. 3 lid 1 SW 1956 van toepassing kan zijn, dan moet hij bij de inspecteur inkomstenbelasting informeren en de aanslag ter behoud van rechten opleggen naar een redelijke schatting; alleen voor zover naderhand blijkt dat de verkrijging hoger is dan dat redelijk geschatte bedrag is sprake van een nieuw feit dat navordering rechtvaardigt. Een ter zitting uitdrukkelijk ingetrokken beroep op kwade trouw is prijsgegeven. Voor een vergrijpboete moet de inspecteur doen blijken (overtuigend aantonen) dat de onjuiste woonplaatsvermelding in de aangifte aan opzet of grove schuld is te wijten.", "wetsartikelen": ["art. 3 lid 1 SW 1956", "art. 21 lid 5 SW 1956", "art. 16 lid 1 AWR", "art. 27e AWR", "art. 67e AWR", "art. 6 lid 2 EVRM"], "belang": "hoog", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2024:2117"}, {"ecli": "ECLI:NL:RBNHO:2024:6582", "instantie": "Rechtbank Noord-Holland", "datum": "2024-06-12", "gepubliceerd": "2025-03-22", "zaaknummer": "AWB - 23 _ 399", "onderwerp": "ANBI-status geweigerd; voordelen voor gelieerde BV en aandeelhouders", "samenvatting": "Een stichting die kookdagen en huisbezoeken voor (eenzame) ouderen organiseert vroeg de ANBI-status aan; die werd geweigerd. De rechtbank oordeelt dat de feitelijke werkzaamheden rechtstreeks zijn gericht op het welzijn van kwetsbare ouderen en niet primair op vermaak of ontspanning, maar dat de gelieerde BV - eigenaar van het merkenrecht en verplicht ten minste 50% van haar jaarwinst te doneren - aanzienlijke marketingvoordelen en een waardestijging van het merkenrecht geniet. Omdat de stichting geen berekening van die voordelen tegenover de donaties (EUR 42.464 in 2020, EUR 76.857 in 2021, circa EUR 250.000 in 2022) heeft gesteld, kan niet worden vastgesteld dat de BV per saldo geen voordeel heeft, zodat particuliere belangen aan de ANBI-status in de weg staan.", "rechtsregel": "Een instelling dient niet uitsluitend of nagenoeg uitsluitend het algemeen belang indien een gelieerde vennootschap door haar algemeen nuttige activiteiten marketingvoordelen en waardestijging van haar merkenrecht geniet en de instelling niet aannemelijk maakt dat daar voldoende tegenprestaties tegenover staan.", "wetsartikelen": ["art. 5b AWR", "art. 1a Uitvoeringsregeling Algemene wet inzake rijksbelastingen 1994"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNHO:2024:6582"}, {"ecli": "ECLI:NL:RBNHO:2024:6586", "instantie": "Rechtbank Noord-Holland", "datum": "2024-06-12", "gepubliceerd": "2025-03-21", "zaaknummer": "23-3989", "onderwerp": "ANBI-status geweigerd; activiteiten dienen particulier belang deelnemers", "samenvatting": "Een in 2021 opgerichte stichting die (jong)volwassenen ondersteunt bij zelfheling en zelfrealisatie vroeg tevergeefs de ANBI-status aan. De rechtbank oordeelt eerst dat het beroep tijdig is, omdat 19 mei 2023 met een algemeen erkende feestdag is gelijkgesteld, en vervolgens dat de statutaire doelstelling niet zonder meer op algemeen nut wijst en de feitelijke werkzaamheden - yoga, kooklessen, designlessen, coaching door zelfstandige coaches - voor een groot deel generieke ontspanning en vermaak zijn waarvoor iedere jongere zich kan aanmelden. Zonder duidelijke toelatingscriteria en zonder methode om het effect op kwetsbaarheden vast te stellen is niet aannemelijk dat de stichting primair en rechtstreeks, en voor 90% of meer, het algemeen nut dient; ook het beroep op jeugdzorg en op de meerderheidsregel faalt.", "rechtsregel": "Voor de categorieen welzijn en jeugd- en ouderenzorg van art. 5b, derde lid, AWR moet de instelling zich statutair en feitelijk richten op een hulpbehoevende doelgroep; ontbreken toelatingscriteria en effectmeting, dan dienen de activiteiten primair het particuliere belang van de deelnemers.", "wetsartikelen": ["art. 5b AWR", "art. 1a Uitvoeringsregeling Algemene wet inzake rijksbelastingen 1994", "art. 3 Algemene termijnenwet"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNHO:2024:6586"}, {"ecli": "ECLI:NL:GHAMS:2024:1494", "instantie": "Gerechtshof Amsterdam", "datum": "2024-05-28", "gepubliceerd": "2026-05-13", "zaaknummer": "23/294 en 23/295", "onderwerp": "APV-toerekening familiestichting 1907 strijdig met art. 1 EP jo. art. 14 EVRM", "samenvatting": "Een in 1907 opgerichte familiestichting met een vermogen van ruim € 8 miljoen, die de stichter tot enig erfgenaam had benoemd, keert uitsluitend aan familieleden tussen 18 en 40 jaar circa € 2.000 per jaar uit; aan belanghebbende, weduwe van een achterkleinzoon van een broer van de oprichter, is voor 2018 en 2019 pro rata 1,926% van het stichtingsvermogen in box 3 toegerekend. Het Hof bevestigt dat de stichting geen SBBI is maar een APV, dat 'onterfd' in art. 2.14a, lid 4, Wet IB 2001 ruim moet worden opgevat en ook impliciete onterving door benoeming van een ander tot enig erfgenaam omvat, en dat belanghebbende rechtens begunstigde is zodat de tegenbewijsregeling van het zesde lid niet slaagt. Toepassing van de APV-regeling levert in dit geval echter strijd op met art. 1 EP jo. art. 14 EVRM: bij een zuiver binnenlandse, in een ver verleden zonder fiscaal motief ingestelde APV waarbij het zicht op de feiten niet is ontnomen, ontbreekt de fair balance tussen het bestrijden van een heffingsvacuüm en de ongelijkheid tussen begunstigden zonder en met uitkering. Het Hof biedt rechtsherstel door de heffing te beperken tot het daadwerkelijk genoten voordeel, dat het op nihil stelt.", "rechtsregel": "De toerekeningsregeling voor afgezonderd particulier vermogen schendt art. 1 EP jo. art. 14 EVRM voor zover zij in een zuiver binnenlandse situatie, waarin het vermogen in een ver verleden zonder fiscaal motief en zonder verhulling van de feiten is afgezonderd, belasting heft bij een begunstigde die geen uitkering ontvangt of kan afdwingen; het rechtsherstel bestaat uit beperking van de heffing tot het daadwerkelijk genoten voordeel.", "wetsartikelen": ["art. 2.14a Wet IB 2001", "art. 5b AWR", "art. 5c AWR", "art. 64 AWR", "art. 2:285 BW", "art. 1 EP EVRM", "art. 14 EVRM"], "belang": "hoog", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHAMS:2024:1494"}, {"ecli": "ECLI:NL:RBGEL:2024:3255", "instantie": "Rechtbank Gelderland", "datum": "2024-05-28", "gepubliceerd": "2025-03-22", "zaaknummer": "AWB - 23 _ 4107", "onderwerp": "Verrekenbeding huwelijkse voorwaarden; geen fictieve verkrijging art. 11 SW", "samenvatting": "Erflater was buiten gemeenschap van goederen gehuwd met belanghebbende, met een beding dat na het eindigen van het huwelijk ieder van de echtgenoten deling van beider vermogensvermeerdering kan vorderen; hij onterfde zijn echtgenote en legateerde haar EUR 450.000. In de aangifte was EUR 1.781.413 als fictieve erfrechtelijke verkrijging in de zin van art. 11 SW 1956 verantwoord, waarna een aanslag erfbelasting naar een belaste verkrijging van EUR 1.778.403 volgde. De rechtbank oordeelt onder verwijzing naar HR 16 maart 1994 dat op het verrekenbeding ook anders dan door overlijden - namelijk bij scheiding - een beroep kon worden gedaan, zodat het bedrag krachtens huwelijksvermogensrecht en niet krachtens erfrecht is verkregen; het beroep is gegrond en de aanslag wordt verminderd tot nihil omdat het legaat binnen de partnervrijstelling blijft.", "rechtsregel": "Hetgeen een echtgenoot toevalt op grond van een verrekenbeding waarop ook tijdens het huwelijk of bij beeindiging anders dan door overlijden een beroep kon worden gedaan, wordt verkregen krachtens huwelijksvermogensrecht en niet krachtens (fictief) erfrecht in de zin van art. 11 SW 1956.", "wetsartikelen": ["art. 11 SW 1956"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2024:3255"}, {"ecli": "ECLI:NL:PHR:2024:486", "instantie": "Parket bij de Hoge Raad", "datum": "2024-05-03", "gepubliceerd": "2026-02-27", "zaaknummer": "23/02449", "onderwerp": "Reikwijdte doorkijkbenadering bij waardering certificaten van vastgoed-bv", "samenvatting": "Belanghebbende kreeg in december 2015 van haar vader certificaten van aandelen geschonken in een vennootschap met een portefeuille van 66 objecten, waaronder 57 woningen; in geschil zijn de omvang van de BOR en de waardering van de certificaten. Het hof paste bij de waardering de forfaitaire waarderingsregels voor verhuurde woningen (WOZ-waarde en leegwaarderatio) toe; de staatssecretaris bestrijdt dat in het principale beroep. A-G Koopman meent dat de door de Hoge Raad ontwikkelde doorkijkbenadering niet dwingend kan worden voorgeschreven bij de waardering van (certificaten van) aandelen in vastgoedlichamen, omdat de waarde daarvan niet rechtstreeks en niet geheel van de onderliggende woningen afhangt en ficties en forfaits niet extensief behoren te worden uitgelegd; het principale middel slaagt in zoverre. Het incidentele beroep over de BOR faalt omdat het in wezen de feitelijke oordelen over de arbeid-plus- en rendement-plus-toets bestrijdt.", "rechtsregel": "De forfaitaire waarderingsvoorschriften voor (verhuurde) woningen in art. 21 SW 1956 gelden niet dwingend bij de waardering van (certificaten van) aandelen in een vastgoedlichaam; de doorkijkbenadering strekt zich niet uit tot een verkrijging waarvan de waarde niet rechtstreeks van de waarde van de onroerende zaken afhangt.", "wetsartikelen": ["art. 21 SW 1956", "art. 35b SW 1956", "art. 35c SW 1956", "art. 81 Wet RO"], "belang": "hoog", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2024:486"}, {"ecli": "ECLI:NL:RBZWB:2024:2145", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2024-04-03", "gepubliceerd": "2025-03-22", "zaaknummer": "BRE 21/2567 en BRE 21/2568", "onderwerp": "Art. 53 SW; geen vermindering schenkbelasting, dwaling voorgewend", "samenvatting": "Ouders schonken hun drie kinderen in 2014 certificaten van aandelen (totale waarde EUR 1.500.000) met toepassing van de BOR; na het faillissement van de vennootschap in juni 2017 werden de certificaten op 31 mei 2017 wegens gestelde wederzijdse dwaling teruggeleverd en werd om vermindering op grond van art. 53 SW 1956 verzocht. De rechtbank oordeelt dat belanghebbende onvoldoende aanknopingspunten voor dwaling heeft verschaft: uit de getuigenverklaring van de adviseur, de dwalingsovereenkomst zelf en een interne memo blijkt dat partijen ten tijde van de schenking geen rekening hielden met een faillissement binnen vijf jaar, zodat het beroep op vernietiging als voorgewend moet worden aangemerkt. Wel wordt EUR 500 immateriele schadevergoeding toegekend wegens overschrijding van de redelijke termijn.", "rechtsregel": "Vernietiging van een schenkingsovereenkomst wegens wederzijdse dwaling leidt alleen tot vermindering op grond van art. 53, eerste lid, SW 1956 als de belanghebbende voldoende aanknopingspunten voor de dwaling verschaft; enkel later verkregen wetenschap over het vervallen van de BOR bij faillissement volstaat daarvoor niet.", "wetsartikelen": ["art. 53 SW 1956", "art. 35b SW 1956", "art. 35e SW 1956", "art. 6:228 BW"], "belang": "middel", "oordeel": "ongegrond", "parallelzaken": ["ECLI:NL:RBZWB:2024:2144"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2024:2145"}, {"ecli": "ECLI:NL:GHDHA:2024:647", "instantie": "Gerechtshof Den Haag", "datum": "2024-03-27", "gepubliceerd": "2025-10-06", "zaaknummer": "BK-23/727", "onderwerp": "Kruislings schenken; eigenwoningvrijstelling art. 33 SW; herkwalificatie en fraus legis", "samenvatting": "Belanghebbende en zijn zus ontvingen op 12 juli 2017 elk € 100.000 van hun moeder en op 13 juli 2017 elk € 100.000 van mevrouw [C]; moeder schonk in 2017 aan elk van de vier kinderen van mevrouw [C] € 50.000, in totaal eveneens € 200.000. Voor alle schenkingen werd een beroep gedaan op de eenmalig verhoogde eigenwoningvrijstelling van art. 33, aanhef en sub 5, letter c, respectievelijk sub 7, SW 1956 (tekst 2017), terwijl de kinderen van mevrouw [C] die vrijstelling ten opzichte van hun eigen moeder al hadden benut. Het Hof oordeelt dat de Inspecteur op grond van fiscaalrechtelijke (her)kwalificatie de tweede schenking terecht heeft aangemerkt als een schenking van de eigen moeder, omdat tegenover de vermogensverschuivingen over en weer even grote bedragen staan, de schenkingen kort na elkaar en met het oog op de eigenwoningvrijstelling zijn gedaan en niet aannemelijk is dat zij los van elkaar zouden zijn gedaan. Subsidiair is ook aan het norm- en motiefvereiste van fraus legis voldaan; dat de wetgever het kruislings schenken heeft onderkend zonder de wettekst aan te passen, staat aan bestrijding niet in de weg. Het hoger beroep faalt en de uitspraak van de Rechtbank wordt op andere gronden bevestigd. Identieke parallelzaak: ECLI:NL:GHDHA:2024:646. Het cassatieberoep is verworpen bij HR 3 oktober 2025, ECLI:NL:HR:2025:1328.", "rechtsregel": "Kruislingse schenkingen die naar bedrag en tijdstip op elkaar zijn afgestemd en uitsluitend zijn gedaan om de eenmalig verhoogde eigenwoningvrijstelling meer dan eenmaal te benutten, kunnen door fiscaalrechtelijke (her)kwalificatie — en subsidiair via fraus legis — worden aangemerkt als schenkingen van de eigen ouder, zodat de vrijstelling van art. 33, aanhef en sub 5, letter c, SW 1956 slechts eenmaal toepassing vindt.", "wetsartikelen": ["art. 33 aanhef en sub 5 letter c SW 1956", "art. 33 aanhef en sub 7 SW 1956", "art. 33a lid 2 SW 1956", "art. 1 lid 7 SW 1956", "art. 7:186 lid 2 BW"], "belang": "middel", "oordeel": "ongegrond", "parallelzaken": ["ECLI:NL:GHDHA:2024:646"], "gerelateerd": ["ECLI:NL:RBDHA:2023:10328", "ECLI:NL:HR:2025:1328"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHDHA:2024:647"}, {"ecli": "ECLI:NL:RBZWB:2024:1717", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2024-03-14", "gepubliceerd": "2025-03-21", "zaaknummer": "BRE 23/24", "onderwerp": "Belastingrente bij aanslag erfbelasting; uitstel en vroege betaling", "samenvatting": "Na het overlijden van zijn broer in 2021 werd aan belanghebbende een aanslag erfbelasting opgelegd met EUR 104 belastingrente, berekend vanaf acht maanden na het overlijden tot 3 mei 2022 (19 weken na ontvangst van de op 21 december 2021 ingediende aangifte). De rechtbank oordeelt dat de rente conform art. 30g AWR is berekend: dat de aanslag al op 6 april 2022 was betaald doet niet af aan renteberekening over de volledige betaaltermijn, het woord 'uiterlijk' in art. 30g, derde lid, AWR biedt de inspecteur geen keuzevrijheid, en gesteld telefonisch uitstel voor de aangifte wekt geen vertrouwen dat geen rente wordt berekend. Ook het verzoek om immateriele schadevergoeding wordt afgewezen omdat de redelijke termijn van twee jaar niet is overschreden.", "rechtsregel": "Verleend uitstel voor het doen van aangifte erfbelasting verschuift het aanvangsmoment van de renteperiode van art. 30g, tweede lid, onderdeel a, AWR niet, en belastingrente mag worden berekend over de volledige betaaltermijn ook als de aanslag daarvoor al is betaald.", "wetsartikelen": ["art. 30g AWR", "art. 9 Invorderingswet 1990"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2024:1717"}, {"ecli": "ECLI:NL:GHARL:2024:1864", "instantie": "Gerechtshof Arnhem-Leeuwarden", "datum": "2024-03-12", "gepubliceerd": "2026-02-27", "zaaknummer": "23/1408", "onderwerp": "BOR schenkbelasting: indirecte bezitseis na ruziesplitsing", "samenvatting": "Na een ruziesplitsing in 2011 en een afsplitsing in 2012 schonk moeder in 2013 alle aandelen [naam5] B.V. aan belanghebbende; de inspecteur verleende de BOR slechts over 49% van de waarde en stelde de belaste verkrijging op € 1.048.082. In deze procedure na verwijzing (HR 21 april 2023, ECLI:NL:HR:2023:647) moest het Hof beoordelen of de aan de tussenhoudster toegerekende activiteiten van haar dochtermaatschappijen vóór de splitsing één of meer objectieve ondernemingen vormden. Het Hof oordeelt dat belanghebbende, tegenover de gemotiveerde betwisting door de inspecteur, niet aannemelijk heeft gemaakt dat de 'horen'- en 'zien'-activiteiten in drie afzonderlijke dochtervennootschappen (met eigen administratie, klantenkring, personeel en afzetgebied) één objectieve onderneming vormden; de gestelde centrale leiding, doorbelasting van managementfees en synergie zijn niet onderbouwd. Belanghebbende heeft via de uitruil zijn subjectieve gerechtigdheid tot de onderneming 'horen' uitgebreid van 49% naar 100%, zodat de BOR terecht tot 49% is beperkt en het hoger beroep ongegrond is.", "rechtsregel": "De indirecte bezitseis van artikel 35d, lid 1, onderdeel c, SW 1956 moet per objectieve onderneming worden beoordeeld, waarbij toerekening op grond van artikel 35c, lid 5, SW plaatsvindt met inachtneming van de omvang van het belang, zodat voor een tijdens de bezitsperiode verkregen uitbreiding van de subjectieve gerechtigdheid tot een objectieve onderneming een nieuwe bezitstermijn aanvangt.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 35d SW 1956", "art. 3.2 Wet IB 2001", "art. 9, lid 2, Uitvoeringsregeling schenk- en erfbelasting", "art. 14a Wet Vpb 1969", "art. 2:334cc BW"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHARL:2024:1864"}, {"ecli": "ECLI:NL:GHSHE:2024:668", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2024-02-27", "gepubliceerd": "2025-03-21", "zaaknummer": "20-002685-21", "onderwerp": "Strafzaak: verduistering door een executeur van een nalatenschap en onjuiste aangifte inkomstenbelasting", "samenvatting": "Een advocaat/fiscalist maakte in 2014, eerst als gevolmachtigde en na het overlijden als executeur-testamentair, in totaal € 50.213 over van de rekeningen van een kinderloze, hoogbejaarde en cognitief kwetsbare vrouw naar zichzelf, en deed daarnaast over 2015 en 2016 opzettelijk onjuiste aangiften inkomstenbelasting (€ 73.223 nadeel). Zijn verweer dat het slachtoffer toestemming had gegeven strandt: er is geen schriftelijke vastlegging, het slachtoffer is overleden en zijn eigen verklaringen wisselden. Fiscaal is de achtergrond relevant: de verdachte wilde volgens zijn eigen verklaring bewust géén erfgenaam worden 'omdat dat fiscaal niet interessant zou zijn' (derdentarief) en het spaargeld nog vóór het overlijden naar zijn eigen rekening laten overmaken zodat hij er geen belasting over hoefde te betalen; de Successiewet 1956 is echter in de strafzaak niet toegepast. Het hof veroordeelt tot 8 maanden gevangenisstraf, waarvan 4 voorwaardelijk (mede wegens overschrijding van de redelijke termijn met ruim drie maanden in hoger beroep).", "rechtsregel": "Verduistering gepleegd door een executeur van een nalatenschap (art. 321 jo. 323 Sr) wordt zwaar aangerekend wanneer de dader beroepsmatig het vertrouwen van een kwetsbare erflater genoot; een gestelde maar niet schriftelijk vastgelegde toestemming van de inmiddels overleden rechthebbende maakt de toe-eigening niet rechtmatig. Geen materiële toepassing van de Successiewet 1956.", "wetsartikelen": ["art. 69 AWR", "art. 321 Sr", "art. 323 Sr", "art. 6 lid 1 EVRM"], "belang": "laag", "oordeel": "n.v.t.", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2024:668"}, {"ecli": "ECLI:NL:RBGEL:2024:912", "instantie": "Rechtbank Gelderland", "datum": "2024-02-21", "gepubliceerd": "2025-03-21", "zaaknummer": "AWB - 23_2522", "onderwerp": "Invorderingsrente bij aanslag schenkbelasting; gelijkheidsbeginsel", "samenvatting": "Belanghebbende betaalde de haar in 2015 opgelegde aanslag schenkbelasting van EUR 473.130 pas na afloop van de cassatieprocedure in 2021 en 2022, waarna de ontvanger in totaal EUR 78.356 aan invorderingsrente in rekening bracht. Zij beriep zich op het gelijkheidsbeginsel omdat de invorderingsrente bij haar zus was gehalveerd op grond van een onjuiste toezegging die de ontvanger nog voor de uitspraak op bezwaar had willen intrekken, maar wegens het vertrouwensbeginsel gestand deed. De rechtbank oordeelt dat van begunstigend beleid, van een oogmerk van begunstiging of van de meerderheidsregel geen sprake is: bij een als zodanig onderkende fout ontbreekt het oogmerk van begunstiging en de ontvanger hoeft die fout niet voort te zetten; ook het beroep op het zorgvuldigheidsbeginsel en op het ontbreken van rente-voor- of nadeel faalt.", "rechtsregel": "Een ten onrechte gedane toezegging die uitsluitend wegens het vertrouwensbeginsel gestand wordt gedaan, vormt een fout en geen oogmerk van begunstiging, zodat een andere belastingplichtige daaraan via het gelijkheidsbeginsel geen aanspraak op dezelfde behandeling kan ontlenen; het al dan niet bestaan van rentevoordeel of rentenadeel is voor de berekening van invorderingsrente niet van belang.", "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2024:912"}, {"ecli": "ECLI:NL:HR:2024:239", "instantie": "Hoge Raad", "datum": "2024-02-16", "gepubliceerd": "2025-03-21", "zaaknummer": "22/00619", "onderwerp": "Huwelijkse voorwaarden 90-10; schenking, art. 11 SW en fraus legis", "samenvatting": "Echtgenoten die in 2015 in wettelijke gemeenschap van goederen waren gehuwd, kwamen op 19 oktober 2017 huwelijkse voorwaarden overeen waarbij de erflater voor 10 procent en belanghebbende voor 90 procent tot de gemeenschap gerechtigd werd; de erflater overleed later in 2017. De Inspecteur ging uit van een 50-50-verdeling en belastte een verkrijging van EUR 1.206.459. De Hoge Raad oordeelt dat het aangaan van zulke huwelijkse voorwaarden geen schenking is, dat art. 11, lid 2 en lid 4, SW niet van toepassing is en dat fraus legis slechts aan de orde is indien het ontgaan van erfbelasting het doorslaggevende motief was en bij het aangaan zo goed als zeker was dat de voor het kleinste deel gerechtigde echtgenoot eerder zou overlijden. Het Hof hanteerde ten onrechte het criterium van enigszins gelijke levens- en sterftekansen; de Hoge Raad doet de zaak af en bevestigt de vernietiging van de aanslag door de Rechtbank.", "rechtsregel": "Het aangaan van huwelijkse voorwaarden waarbij de echtgenoten voor ongelijke delen tot de huwelijksgemeenschap gerechtigd worden is geen schenking en valt slechts onder fraus legis indien het ontgaan van erfbelasting het doorslaggevende motief was en op dat moment zo goed als zeker was dat de voor het kleinste deel gerechtigde echtgenoot als eerste zou overlijden, terwijl art. 11, lid 4, SW 1956 slechts belast wat een echtgenoot meer verkrijgt dan overeenkomt met zijn eigen aandeel in de gemeenschap.", "wetsartikelen": ["art. 1 lid 1 SW 1956", "art. 1 lid 7 SW 1956", "art. 11 lid 2 SW 1956", "art. 11 lid 4 SW 1956", "art. 12 lid 1 SW 1956", "art. 1:121 BW"], "belang": "hoog", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:GHAMS:2022:96", "ECLI:NL:PHR:2023:188"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2024:239"}, {"ecli": "ECLI:NL:GHARL:2024:1093", "instantie": "Gerechtshof Arnhem-Leeuwarden", "datum": "2024-02-13", "gepubliceerd": "2025-03-21", "zaaknummer": "22/1716", "onderwerp": "Erfbelasting: waardering recht van erfpacht; canonpercentage (art. 21 SW)", "samenvatting": "Tot de nalatenschap behoorde een in 1989 voor vijftig jaar verkregen recht van erfpacht op een onder de Natuurschoonwet 1928 gerangschikt landgoed van 83.865 m² met een jaarlijkse canon van € 9.602. In geschil was uitsluitend het bij de waardering te hanteren canonpercentage: 1,692 of 2,08 (belanghebbende) tegenover een samengesteld percentage van 2,74 (de inspecteur), uitgaande van een grondwaarde van € 625.000. Het Hof oordeelt dat de bewijslast dat het samengestelde percentage niet te hoog is op de inspecteur rust en dat hij daarin is geslaagd: de waardering van een erfpachtrecht is geen exacte wetenschap, referentiegegevens zijn schaars en de inspecteur heeft zijn waarden per m² met meerdere referentietransacties onderbouwd en terecht onderscheid gemaakt tussen grond bij de woning en overige grond. Het aanbod om de beide taxateurs als getuige te horen wordt afgewezen, nu hun schriftelijke verklaringen al tot de gedingstukken behoren en belanghebbende hen niet zelf heeft meegebracht of opgeroepen.", "rechtsregel": "Bij de waardering van een recht van erfpacht naar de waarde in het economische verkeer van art. 21, lid 1, SW 1956 mag een samengesteld canonpercentage worden gehanteerd waarbij per grondsoort en bestemming wordt gedifferentieerd, mits het met referentietransacties is onderbouwd; op de inspecteur rust de bewijslast dat het door hem verdedigde percentage niet te hoog is.", "wetsartikelen": ["art. 21, lid 1, SW 1956"], "belang": "laag", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHARL:2024:1093"}, {"ecli": "ECLI:NL:GHARL:2024:888", "instantie": "Gerechtshof Arnhem-Leeuwarden", "datum": "2024-02-06", "gepubliceerd": "2025-03-22", "zaaknummer": "22/488", "onderwerp": "BOF erfbelasting: bezitstermijn art. 35d SW bij toetreding tot maatschap", "samenvatting": "Erflater trad blijkens een op 26 april 2016 ondertekende maatschapsovereenkomst toe tot de maatschap van belanghebbende en diens echtgenote, waarbij de overeenkomst vermeldde vast te leggen 'hetgeen van kracht is met ingang van 1 januari 2016'; erflater overleed op 1 januari 2017. Op de verkrijging werd de bedrijfsopvolgingsfaciliteit toegepast voor € 532.576, waarna de inspecteur navorderde tot een belaste verkrijging van € 793.331. Het Hof oordeelt dat sprake is van een nieuw feit, omdat uit de aangifte erfbelasting de datum van ondertekening niet bleek en de inspecteur mocht afgaan op de aangifte, en dat belanghebbende niet aannemelijk heeft gemaakt dat de maatschap al op 1 januari 2016 was overeengekomen. Terugwerkende kracht - contractueel of op grond van het besluit van 6 februari 2010, nr. DGB 2010/671M - is voor de bezitstermijn niet van belang: die eis moet materieel worden ingevuld en ging pas lopen op 26 april 2016, zodat niet aan de eenjaarstermijn is voldaan en de BOF vervalt.", "rechtsregel": "De bezitstermijn van één jaar van art. 35d SW 1956 moet materieel worden beoordeeld en vangt aan op het moment waarop de erflater feitelijk ondernemer is geworden; aan een civielrechtelijk of beleidsmatig aan een maatschapsovereenkomst verleende terugwerkende kracht komt voor die termijn geen betekenis toe.", "wetsartikelen": ["art. 35d, lid 1, SW 1956", "art. 35c, lid 1, onderdeel a, SW 1956", "art. 16, lid 1, AWR", "art. 3.4 Wet IB 2001", "art. 3.5 Wet IB 2001", "art. 3.62 Wet IB 2001"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBGEL:2022:266"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHARL:2024:888"}, {"ecli": "ECLI:NL:RBZWB:2024:342", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2024-01-24", "gepubliceerd": "2026-05-28", "onderwerp": "Schenkbelasting: leegwaarderatio, verrekening erfdeel, menselijke maat", "samenvatting": "Moeder schonk haar appartement aan haar zoon. De inspecteur legde een aanslag schenkbelasting op zonder toepassing van de leegwaarderatio. Belanghebbende betoogde dat de leegwaarderatio van toepassing was, dat het vaderlijk erfdeel verrekend moest worden, en deed een beroep op de 'menselijke maat'. De rechtbank verwierp alle gronden: de leegwaarderatio geldt niet bij schenkingen van woningen, verrekening van een civielrechtelijk erfdeel is geen fiscale aftrekpost, en de menselijke maat biedt geen zelfstandige grond voor vermindering. Dit vonnis is in hoger beroep bekrachtigd door ECLI:NL:GHSHE:2026:1241.", "rechtsregel": "De leegwaarderatio (art. 17a Uitv.reg. IB) is niet van toepassing bij de waardebepaling van een schenking van een woning; verrekening van een vaderlijk erfdeel met de verschuldigde schenkbelasting is fiscaal niet mogelijk.", "wetsartikelen": ["art. 21 SW 1956", "art. 12 SW 1956"], "belang": "laag", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2024:342"}, {"ecli": "ECLI:NL:RBZWB:2024:341", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2024-01-24", "gepubliceerd": "2026-04-30", "zaaknummer": "BRE 22/4371", "onderwerp": "Schenkbelasting; herroeping schenking en restant eenmalig verhoogde vrijstelling", "samenvatting": "Belanghebbende ontving in 2009 een herroepelijke schenking van EUR 22.760 waarop de eenmalig verhoogde vrijstelling is toegepast; in 2017 werd die schenking herroepen en omgezet in een lening die vervolgens werd kwijtgescholden, naast een schenking van EUR 80.000, waarop een beroep op de eigenwoningvrijstelling werd gedaan. De rechtbank oordeelt dat de herroeping geen terugwerkende kracht heeft: het belastbare feit uit 2009 blijft bestaan en de destijds toegepaste vrijstelling blijft in stand, zodat artikel 82a SW 1956 de eigenwoningvrijstelling in 2017 verlaagt tot een restant van EUR 27.650. Het goedkeurende beleid van de staatssecretaris baat belanghebbende niet omdat de inspecteur onweersproken heeft aangevoerd dat aan de herroeping fiscale motieven ten grondslag lagen. Het beroep is ongegrond.", "rechtsregel": "De herroeping van een herroepelijke schenking doet het belastbare feit en de daarop toegepaste eenmalig verhoogde vrijstelling niet met terugwerkende kracht teniet, zodat het restant van de verhoogde vrijstelling op grond van artikel 82a SW 1956 beperkt blijft.", "wetsartikelen": ["art. 82a SW 1956"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2024:341"}, {"ecli": "ECLI:NL:RBNHO:2024:1875", "instantie": "Rechtbank Noord-Holland", "datum": "2024-01-09", "gepubliceerd": "2025-11-18", "zaaknummer": "AWB - 21 _ 6130", "onderwerp": "Art. 66 SW: aanvang aanslagtermijn schenkbelasting na overlijden schenker", "samenvatting": "Eiseres ontving in 2006 van haar echtgenoot een schenking van EUR 4.000.000 (destijds nog recht van schenking onder de SW zoals die tot 2010 luidde); de schenker overleed in 2007 en pas na een inkeermelding legde de inspecteur op 2 februari 2021 ambtshalve een aanslag schenkbelasting op van EUR 1.019.463. In geschil is of de bevoegdheid tot het opleggen van de aanslag was vervallen. De rechtbank oordeelt eerst dat met het oningevuld en niet ondertekend retourneren van het aangifteformulier geen aangifte is gedaan, en vervolgens dat het woord 'of' in art. 66, eerste lid, onder 2, SW 1956 niet meebrengt dat de inspecteur uitsluitend kan aansluiten bij het eerste overlijden van schenker of begiftigde; nu eiseres nog leeft, is de driejaarstermijn van art. 11, derde lid, AWR nog niet aangevangen en is de aanslag tijdig opgelegd. Het beroep is ongegrond; wel wordt EUR 1.000 immateriele schadevergoeding toegekend.", "rechtsregel": "Is van een schenking geen aangifte gedaan, dan dwingt art. 66, eerste lid, onder 2, SW 1956 niet tot aansluiting bij het eerste overlijden van schenker of begiftigde: blijkt de schenking pas later, dan kan de driejaarstermijn ook aanvangen met het overlijden van de ander, zodat de aanslagbevoegdheid niet vervalt door het enkele verstrijken van drie jaren na het eerste overlijden.", "wetsartikelen": ["art. 66 SW 1956", "art. 11 AWR"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNHO:2024:1875"}, {"ecli": "ECLI:NL:PHR:2023:1201", "instantie": "Parket bij de Hoge Raad", "datum": "2023-12-22", "gepubliceerd": "2025-03-21", "zaaknummer": "22/02354", "onderwerp": "Kindbegrip SW; biologische vader met family life; art. 24 e
