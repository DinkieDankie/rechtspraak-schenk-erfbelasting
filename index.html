<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202b;--muted:#5d6b7a;--line:#e2e6ea;--accent:#1f4e79;--hoog:#b3261e;--middel:#8a6100;--laag:#41606f;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.banner{background:var(--accent);color:#fff;border-radius:10px;padding:16px 18px;margin-bottom:18px}
.banner h2{margin:0 0 10px;font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.9}
.stats{display:flex;flex-wrap:wrap;gap:26px}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;opacity:.85}
.note{margin-top:12px;font-size:12.5px;line-height:1.5;opacity:.92;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
select,input[type=search]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=search]{flex:1;min-width:200px}
.count{color:var(--muted);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 16px;margin-bottom:11px}
.card h3{margin:0 0 6px;font-size:16px}
.meta{color:var(--muted);font-size:12.5px;margin-bottom:9px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.b-hoog{color:var(--hoog)}.b-middel{color:var(--middel)}.b-laag{color:var(--laag)}
.b-sig{background:var(--hoog);color:#fff;border-color:var(--hoog)}
.sum{font-size:14px;margin:0 0 10px}
.arts{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button.toggle{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:#fbfcfd;border-radius:7px;cursor:pointer;color:var(--accent)}
button.toggle:hover{background:#eef3f8}
a.ext{font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:7px;text-decoration:none;color:var(--accent);background:#fbfcfd}
a.ext:hover{background:#eef3f8}
.rr{display:none;margin-top:11px;padding:11px 13px;background:#f2f6fa;border-left:3px solid var(--accent);border-radius:0 7px 7px 0;font-size:13.5px}
.rr.open{display:block}
.rr b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin-bottom:4px}
.empty{padding:36px;text-align:center;color:var(--muted)}
</style>

<body>
<div class="wrap">
<h1>Uitspraken schenk- en erfbelasting</h1>
<div class="sub">Automatische dagelijkse scan van rechtspraak.nl (Open Data API, rechtsgebied belastingrecht) &mdash; gefilterd op schenk- en erfbelasting.</div>

<div class="banner">

    <div class="stat"><b id="s-datum">&ndash;</b><span>scandatum</span></div>

  <select id="f-inst"><option value="">Alle instanties</option></select>

  <select id="f-oordeel"><option value="">Alle oordelen</option></select>

</div>
<div class="count" id="count"></div>
<div id="list"></div>
</div>

<script>
const UITSPRAKEN_DATA = {"laatste_update": "2026-10-09T17:11:32Z", "uitspraken": [{"ecli": "ECLI:NL:GHARN:2006:AV6380", "instantie": "Gerechtshof Arnhem", "datum": "2006-03-01", "gepubliceerd": "2006-03-22", "zaaknummer": "03-01949", "onderwerp": "Gemeenschappelijke huishouding eindigt bij opname in verzorgingstehuis (tariefgroep I)", "samenvatting": "Belanghebbende voerde sinds 1963 met erflaatster en haar echtgenoot, later met erflaatster en zijn eigen echtgenote, een gemeenschappelijke huishouding. Na opname van de door multiple sclerose hulpbehoevende erflaatster in een verzorgingstehuis (1993), verkoop van de woning en verhuizing van belanghebbende kan volgens het Hof niet worden volgehouden dat de huishouding tot haar overlijden in 2001 heeft voortgeduurd. Tariefgroep I (art. 24 lid 2 onder b SW) is niet van toepassing; beroep ongegrond. Het beroep op gewekt vertrouwen faalt op grond van HR BNB 2000/231. Cassatie: ECLI:NL:HR:2008:AZ6924.", "rechtsregel": "Een gemeenschappelijke huishouding duurt na opname van de erflater in een verzorgingstehuis niet voort tot het overlijden wanneer de omstandigheden (aard en verloop van de ziekte, verkoop woning, verhuizing) daar redelijkerwijs niet op wijzen.", "wetsartikelen": ["art. 24 lid 2 SW 1956"], "belang": "laag", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Het begrip gemeenschappelijke huishouding van art. 24, lid 2, SW 1956 is per 1 januari 2010 vervallen en vervangen door het partnerbegrip van art. 1a SW 1956.", "gerelateerd": ["ECLI:NL:HR:2008:AZ6924", "ECLI:NL:PHR:2008:AZ6924"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHARN:2006:AV6380"}, {"ecli": "ECLI:NL:GHAMS:2004:AP0576", "instantie": "Gerechtshof Amsterdam", "datum": "2004-05-27", "gepubliceerd": "2004-06-09", "zaaknummer": "02/03833", "onderwerp": "Woonplaats erflater in Nederland; geen gemeenschappelijke huishouding (tariefgroep I)", "samenvatting": "Erflater overleed in Spanje, waar hij ca. acht maanden per jaar verbleef met M, maar had in Nederland een volledig ingerichte woning en duurzame persoonlijke en zakelijke banden. Het Hof oordeelt dat hij ten tijde van overlijden in Nederland woonde, zodat de nalatenschap op grond van art. 1 SW in Nederland is belast. Omdat erflater en M gedurende ca. vier maanden per jaar geen gemeenschappelijk hoofdverblijf hadden en objectief noopte omstandigheden niet blijken (HR BNB 1993/181), wordt M niet belast in tariefgroep I (art. 24 lid 2 onder a SW) maar in tariefgroep III zonder vrijstelling. Beroep ongegrond.", "rechtsregel": "Woonplaats van de erflater (art. 1 SW) wordt bepaald naar de duurzame band van persoonlijke aard met Nederland; zonder gemeenschappelijk hoofdverblijf is slechts bij objectief noopte omstandigheden een gemeenschappelijke huishouding aan te nemen.", "wetsartikelen": ["art. 1 SW 1956", "art. 24 lid 2 SW 1956"], "belang": "laag", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Het begrip gemeenschappelijke huishouding van art. 24, lid 2, SW 1956 is per 1 januari 2010 vervallen en vervangen door het partnerbegrip van art. 1a SW 1956.", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHAMS:2004:AP0576"}, {"ecli": "ECLI:NL:GHSGR:2003:AN9842", "instantie": "Gerechtshof 's-Gravenhage", "datum": "2003-10-30", "gepubliceerd": "2003-12-10", "zaaknummer": "BK-02/03758", "onderwerp": "Gemeenschappelijke huishouding 5 jaar ontbreekt bij gescheiden huishoudens (tariefgroep I)", "samenvatting": "Belanghebbende en erflater hadden decennialang een affectieve relatie, maar woonden afzonderlijk (op een minuut afstand), hadden gescheiden huishoudelijke uitgaven en geen gemeenschappelijk hoofdverblijf. Belanghebbende, op wie de bewijslast rust, slaagt niet in het bewijs van een gemeenschappelijke huishouding gedurende ten minste vijf jaren voorafgaand aan het overlijden (art. 24 lid 2 onder a SW). Noch het milieu van herkomst, noch de bedrijfsvoering maakte het ontbreken van een gemeenschappelijk hoofdverblijf objectief noodzakelijk. Tariefgroep III, geen vrijstelling art. 32 lid 1 onder e (oud); beroep ongegrond.", "rechtsregel": "Zonder gemeenschappelijk hoofdverblijf is een gemeenschappelijke huishouding slechts aan te nemen bij een financieel/economisch gezamenlijke huishouding en objectief noopte omstandigheden; de bewijslast rust op de verkrijger.", "wetsartikelen": ["art. 24 lid 2 SW 1956", "art. 32 SW 1956"], "belang": "laag", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Het begrip gemeenschappelijke huishouding van art. 24, lid 2, SW 1956 is per 1 januari 2010 vervallen en vervangen door het partnerbegrip van art. 1a SW 1956.", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSGR:2003:AN9842"}, {"ecli": "ECLI:NL:GHAMS:2026:2574", "instantie": "Gerechtshof Amsterdam", "datum": "2026-07-21", "gepubliceerd": "2026-09-09", "zaaknummer": "25/726", "onderwerp": "Navordering erfbelasting buitenlands vermogen; voortvarendheidseis en één bestuursorgaan", "samenvatting": "Erflater overleed op 1 april 2010; belanghebbende (dochter) erfde vermogen op Belgische rekeningen dat niet in de aangifte erfbelasting was vermeld. Voor de navordering gold op grond van art. 66 lid 4 SW 1956 geen termijnbeperking. In geschil is of de inspecteur voldoende voortvarend heeft gehandeld. Het Hof oordeelt dat de inspecteur inkomstenbelasting en de inspecteur erfbelasting voor de voortvarendheidstoets als één bestuursorgaan moeten worden aangemerkt, zodat de relevante periode niet pas aanvangt op het moment waarop de 'inspecteur erfbelasting' door de 'inspecteur inkomstenbelasting' werd geïnformeerd (1 april 2021), maar al bij ontvangst door de Belastingdienst van de 'Verklaring vermogen in het buitenland' op 14 september 2020. Omdat tussen die ontvangst en 1 april 2021 geen op de erfbelastingjaren gerichte activiteiten zijn verricht, is sprake van een onverklaarbare vertraging van meer dan zes maanden. De navorderingsaanslag en de vergrijpboete worden daarom vernietigd; het hoger beroep is gegrond. Dit is de hogerberoepsuitspraak in dezelfde procedure als ECLI:NL:RBNHO:2024:13856, waarin de rechtbank de aanvangsdatum van de voortvarendheidstoets nog op 1 april 2021 had gesteld.", "rechtsregel": "Voor de voortvarendheidstoets bij navordering van erfbelasting over verzwegen buitenlands vermogen (art. 66 lid 4 SW 1956) worden de inspecteur inkomstenbelasting en de inspecteur erfbelasting als één bestuursorgaan aangemerkt, zodat de beoordelingsperiode al aanvangt bij ontvangst door de Belastingdienst van gegevens over het buitenlandse vermogen, ook als die gegevens aanvankelijk alleen bij de inspecteur inkomstenbelasting bekend zijn.", "wetsartikelen": ["art. 66 lid 4 SW 1956", "art. 16 AWR", "art. 67e AWR"], "belang": "hoog", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:RBNHO:2024:13856"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHAMS:2026:2574"}, {"ecli": "ECLI:NL:RBNHO:2024:13856", "instantie": "Rechtbank Noord-Holland", "datum": "2024-12-27", "gepubliceerd": "2025-03-03", "zaaknummer": "HAA 23/2544", "onderwerp": "Navordering erfbelasting buitenlands vermogen; voortvarendheid en vergrijpboete", "samenvatting": "Erflater (overleden 1 april 2010) en zijn echtgenote waren gehuwd onder uitsluiting van gemeenschap, maar kwamen in 2005 aanvullende huwelijkse voorwaarden overeen met een finaal verrekenbeding alsof zij in algehele gemeenschap waren gehuwd. In de aangifte erfbelasting waren op naam van de echtgenote staande KBC-tegoeden in Belgie niet vermeld. De rechtbank oordeelt dat de inspecteur beschikte over een nieuw feit (art. 16 lid 1 AWR): ten tijde van de primitieve aanslag (18 december 2012) was hij niet met de Belgische tegoeden bekend. De onbeperkte navorderingstermijn van art. 66 lid 4 SW is van toepassing omdat de bevoegdheid tot navordering op 1 januari 2012 nog niet was vervallen (HR 3 maart 2017, ECLI:NL:HR:2017:356). Het voortvarendheidsvereiste uit HR 26 februari 2010 (ECLI:NL:HR:2010:BJ9092/BJ9120) geldt overeenkomstig voor art. 66 lid 4 SW; de termijn ving pas aan op 1 april 2021, toen de inspecteur voor het eerst aanwijzingen kreeg dat de tegoeden een erfrechtelijke verkrijging vormden, en niet reeds bij ontvangst van de 'Verklaring vermogen in het buitenland' (r.o. 23). De beroepen op het vertrouwens-, gelijkheids-, motiverings- en zorgvuldigheidsbeginsel falen; het gelijkheidsbeginsel ziet niet op de behandeling van een en dezelfde belastingplichtige bij twee vergelijkbare gelegenheden (r.o. 26). De vergrijpboete wegens grove schuld blijft in stand (r.o. 31), maar wordt wegens overschrijding van de redelijke termijn met 10% verminderd tot EUR 4.500.", "rechtsregel": "Het voortvarendheidsvereiste geldt overeenkomstig bij de onbeperkte navorderingstermijn van art. 66 lid 4 SW 1956, en de daarbij te toetsen termijn vangt pas aan zodra de inspecteur aanwijzingen heeft dat het buitenlandse vermogen een verkrijging krachtens erfrecht betreft; enkel bekendheid met buitenlandse tegoeden op naam van de langstlevende is daarvoor onvoldoende.", "wetsartikelen": ["art. 66 lid 4 SW 1956", "art. 16 AWR", "art. 67e AWR", "art. 3:2 Awb"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNHO:2024:13856", "gerelateerd": ["ECLI:NL:GHAMS:2026:2574"]}, {"ecli": "ECLI:NL:GHARL:2026:5189", "instantie": "Gerechtshof Arnhem-Leeuwarden", "datum": "2026-08-04", "gepubliceerd": "2026-08-31", "zaaknummer": "25/828", "onderwerp": "Art. 10 SW: rentebetaling bij meerdere schuldigerkenningen; toerekening", "samenvatting": "Erflater schonk in 2019 en 2020 telkens € 100.000 onder schuldigerkenning tegen 6% rente. Niet alle rente was tijdig betaald en de betalingen waren niet gespecificeerd. Het Hof oordeelt dat de toets van art. 10 SW per vermogensbestanddeel (per schuldigerkenning) moet plaatsvinden, maar dat ongespecificeerde rentebetalingen met (overeenkomstige) toepassing van art. 6:43 lid 2 BW eerst aan de oudste verbintenis worden toegerekend. Voor de schuldigerkenning 2019 was daardoor voldoende en tijdig rente betaald (art. 10 SW niet van toepassing); voor de schuldigerkenning 2020 niet, omdat de rente over 2020 pas in 2023 werd aangevuld en dus buiten de eenjaarstermijn van het Besluit van 18 oktober 2016, BLKB2016/130M, viel. Het Hof verwerpt de eis van de Inspecteur dat het betalingskenmerk de rentebetaling exact specificeert. Zowel het principale hoger beroep van de Inspecteur als het incidentele hoger beroep van belanghebbende is ongegrond; uitspraak Rechtbank bevestigd. Identieke parallelzaken: ECLI:NL:GHARL:2026:5190 en ECLI:NL:GHARL:2026:5191.", "rechtsregel": "De 6%-rentetoets van art. 10 lid 3 SW wordt per schuldigerkenning beoordeeld; zijn er meerdere schuldigerkenningen en zijn de rentebetalingen niet gespecificeerd, dan worden zij op de voet van art. 6:43 lid 2 BW eerst toegerekend aan de oudste verbintenis, en mag de inspecteur niet eisen dat het betalingskenmerk de betaling specificeert.", "wetsartikelen": ["art. 10 SW 1956", "art. 21 lid 14 SW 1956", "art. 10 Uitvoeringsbesluit SW 1956", "art. 6:43 lid 2 BW", "art. 8:42 Awb"], "belang": "hoog", "oordeel": "ongegrond", "parallelzaken": ["ECLI:NL:GHARL:2026:5190", "ECLI:NL:GHARL:2026:5191"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHARL:2026:5189"}, {"ecli": "ECLI:NL:GHARL:2026:5188", "instantie": "Gerechtshof Arnhem-Leeuwarden", "datum": "2026-08-04", "gepubliceerd": "2026-09-02", "zaaknummer": "25/618 t/m 25/621", "onderwerp": "APV: beschikkingsmacht over SPF-vermogen; uitspraak na verwijzing", "samenvatting": "Uitspraak na verwijzing (HR 14 februari 2025, ECLI:NL:HR:2025:241) over een Antilliaanse SPF. Het Hof beoordeelt het geschilpunt integraal en acht aannemelijk dat de inbrenger ook in 2011 en 2012 over het SPF-vermogen kon beschikken als ware het zijn eigen vermogen: de oprichtingsbevoegdheid was aan hem overgedragen zodat hij het bestuur te allen tijde kon vervangen, alle substantiële besluiten (dividenduitlening, liquidatie, herstructurering met verwatering van 49% naar 24%) werden op zijn initiatief genomen en het formele bestuur handelde niet onafhankelijk. De formele bevoegdheid van het trustkantoor krijgt daarom slechts geringe bewijskracht. Betreft IB/PVV (art. 2.14a Wet IB 2001), maar het beschikkingsmachtcriterium is rechtstreeks van belang voor de APV-toerekening in de SW. Extra vergoeding immateriële schade van € 500 wegens overschrijding redelijke termijn na verwijzing.", "rechtsregel": "Voor de vraag of een inbrenger over APV-vermogen kan beschikken als ware het zijn eigen vermogen is niet de formele bestuursbevoegdheid van het trustkantoor beslissend, maar of de inbrenger feitelijk het beleid bepaalt — wat wordt aangenomen als hij het bestuur zonder opgaaf van redenen kan vervangen en alle substantiële beslissingen op zijn initiatief zijn genomen.", "wetsartikelen": ["art. 2.14a Wet IB 2001", "art. 4.16 Wet IB 2001", "art. 17 SW 1956", "art. 8:29 Awb", "art. 8:42 Awb"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHARL:2026:5188"}, {"ecli": "ECLI:NL:RBZWB:2026:7173", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2026-08-03", "gepubliceerd": "2026-08-13", "zaaknummer": "BRE 24/5750", "onderwerp": "Waardering schenking met onzekere waarde (4 parallelzaken) — waarde achteraf beslissend", "samenvatting": "Vader schonk in 2020 bij notariële akte aan vier begiftigden (elk 1/4) zijn vordering op een beleggingsclub en de economische eigendom van zijn vordering op de Staat wegens de in 2013 onteigende SNS-obligaties. Aangifte werd gedaan naar een waarde van nihil, omdat de schadeloosstelling toen nog volstrekt onzeker was. Pas in 2023 werd de schadeloosstelling definitief (Ondernemingskamer 11-2-2021, bekrachtigd HR 21-4-2023) en ontving elke begiftigde € 76.912. De rechtbank oordeelt dat de schenking in 2020 is voltooid (geen opschortende voorwaarde; alleen de wáárde was onzeker) en dat voor de waardering moet worden aangesloten bij de achteraf definitief vastgestelde waarde, inclusief de tot de schenkingsdatum aangegroeide rente. Het beroep is gegrond: de aanslag wordt verminderd tot € 20.358 over een schenking van € 70.069. Identieke parallelzaken (zelfde schenking, per begiftigde één zaak): ECLI:NL:RBZWB:2026:7175, 7176 en 7177.", "rechtsregel": "Is bij een voltooide schenking alleen de waarde van het geschonkene onzeker, dan wordt die waarde niet schattenderwijs naar de omstandigheden op het schenkingsmoment bepaald, maar naar de achteraf definitief vastgestelde waarde; de erfbelastingjurisprudentie van de Hoge Raad geldt hier onverkort omdat schenkbelasting evenzeer een tijdstipbelasting is.", "wetsartikelen": ["art. 1 SW 1956", "art. 21 SW 1956", "art. 1 lid 9 SW 1956", "art. 2 lid 3 Besluit proceskosten bestuursrecht"], "belang": "hoog", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:7173", "parallelzaken": ["ECLI:NL:RBZWB:2026:7175", "ECLI:NL:RBZWB:2026:7176", "ECLI:NL:RBZWB:2026:7177"]}, {"ecli": "ECLI:NL:RBGEL:2026:6244", "instantie": "Rechtbank Gelderland", "datum": "2026-07-29", "gepubliceerd": "2026-08-07", "onderwerp": "Partnervrijstelling geweigerd aan inwonend kind - geen discriminatie", "samenvatting": "Belanghebbende, bloedverwant in de rechte lijn (kind), claimt de partnervrijstelling van art. 32 SW 1956. De rechtbank oordeelt dat het uitsluiten van bloedverwanten in de rechte lijn van de partnervrijstelling geen schending oplevert van het discriminatieverbod, het recht op eerbiediging van 'family life' of het evenredigheidsbeginsel. Beroep ongegrond.", "rechtsregel": "Het onthouden van de partnervrijstelling (art. 32 SW) aan een bloedverwant in de rechte lijn is niet in strijd met het discriminatieverbod, art. 8 EVRM of het evenredigheidsbeginsel.", "wetsartikelen": ["art. 32 SW 1956", "art. 1a SW 1956", "art. 8 EVRM", "art. 14 EVRM"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2026:6244"}, {"ecli": "ECLI:NL:RBZWB:2026:6742", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2026-07-20", "gepubliceerd": "2026-07-29", "onderwerp": "Waardering overbedelingsschuld langstlevende naar civielrechtelijke waarde", "samenvatting": "Aanslag erfbelasting ter zake van verkrijging uit nalatenschap moeder (2018). In geschil is de hoogte van de overbedelingsschuld aan de erfgenamen uit de nalatenschap van de eerder overleden vader (2013). De rechtbank oordeelt dat de nalatenschap in aanmerking wordt genomen naar de waarde in het economisch verkeer op het tijdstip van de verkrijging en dat de overbedelingsvorderingen worden gewaardeerd naar de werkelijke (civielrechtelijke) waarde; het ambtshalve geschatte bedrag uit de aanslagen bij het eerste overlijden is niet bepalend. Beroep gegrond; aanslag verminderd tot een belaste verkrijging van EUR 27.739.", "rechtsregel": "De overbedelingsschuld/onderbedelingsvordering in de bij het tweede overlijden openvallende nalatenschap wordt gewaardeerd naar de werkelijke (civielrechtelijke) waarde, niet naar de bij het eerste overlijden ambtshalve geschatte bedragen.", "wetsartikelen": ["art. 1 SW 1956", "art. 21 SW 1956"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:6742"}, {"ecli": "ECLI:NL:RBNNE:2026:2796", "instantie": "Rechtbank Noord-Nederland", "datum": "2026-07-14", "gepubliceerd": "2026-08-03", "zaaknummer": "LEE 25/4359", "onderwerp": "Belastingrente erfbelasting bij tijdige maar onjuiste aangifte", "samenvatting": "Na het overlijden van erflaatster op 15 mei 2022 deed de weduwnaar op 9 december 2022 tijdig aangifte erfbelasting; de inspecteur stelde het zuiver saldo circa € 673.000 hoger vast en legde een aanslag van € 40.648 met € 5.449 belastingrente op. De rechtbank oordeelt dat de uitzonderingen van art. 30g, derde en vierde lid, AWR alleen gelden als de aanslag overeenkomstig de aangifte wordt vastgesteld, wat hier niet het geval is, zodat terecht rente is berekend; dat niet binnen drie maanden een aanslag volgde doet daar niet aan af nu de wettelijke aanslagtermijn drie jaar bedraagt. Op grond van het nadere standpunt van de inspecteur (aangiftebelasting € 9.043 in plaats van € 4.835) wordt de rente verminderd tot € 4.805; de klachten over rendement, box 3, traagheid en vroegtijdige betaling falen.", "rechtsregel": "Belastingrente over de erfbelasting blijft alleen achterwege indien de aanslag overeenkomstig een tijdig ingediende aangifte wordt vastgesteld; wijkt de aanslag inhoudelijk van de aangifte af, dan is ondanks tijdige aangifte belastingrente verschuldigd.", "wetsartikelen": ["art. 30g AWR", "art. 45 SW 1956", "art. 9 Invorderingswet 1990"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNNE:2026:2796"}, {"ecli": "ECLI:NL:RBDHA:2026:19799", "instantie": "Rechtbank Den Haag", "datum": "2026-07-09", "gepubliceerd": "2026-07-23", "onderwerp": "Verschoonbare termijnoverschrijding bezwaar aanslag erfbelasting", "samenvatting": "De aanslag erfbelasting (legaat, overlijden 2020) is aan de notaris/executeur als contactpersoon gestuurd; de notaris stuurde deze niet door aan de legataris. De legataris raakte pas via de aanmaning op de hoogte en maakte vrijwel direct bezwaar. De rechtbank oordeelt dat de termijnoverschrijding verschoonbaar is (art. 6:11 Awb): omdat de verkrijger de notaris niet zelf heeft aangesteld, kan het niet-doorsturen haar niet worden toegerekend. Uitspraak op bezwaar vernietigd; inspecteur moet opnieuw op het bezwaar beslissen.", "rechtsregel": "Wanneer de aanslag erfbelasting aan de door de erflater aangewezen notaris/executeur is gezonden en deze de aanslag niet aan de verkrijger doorstuurt, is de daaropvolgende termijnoverschrijding van de verkrijger verschoonbaar (art. 6:11 Awb), nu het handelen van de niet door haar aangestelde notaris niet aan haar kan worden toegerekend.", "wetsartikelen": ["art. 6:11 Awb", "SW 1956 (aanslag erfbelasting)"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2026:19799"}, {"ecli": "ECLI:NL:RBZWB:2026:5958", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2026-07-03", "gepubliceerd": "2026-07-17", "onderwerp": "BOR geweigerd: vastgoedexploitatie geen materiële onderneming", "samenvatting": "Vader schonk in 2020 alle aandelen in zijn BV (portefeuille van enkele historische kamerverhuurpanden, in 2000 geruisloos ingebracht) aan zijn zoon; belaste verkrijging € 2.011.499. De rechtbank oordeelt dat niet aannemelijk is gemaakt dat de BV ten tijde van de schenking een onderneming dreef in de zin van art. 3.2 Wet IB 2001: het rendement-plus-criterium is niet vervuld, zodat arbeid-plus geen behandeling meer behoeft. Het subsidiaire beroep op onderdeel 5 van de interne Praktijkhandreiking bedrijfsopvolging vastgoedexploitanten (1 juni 2016) faalt: die handreiking is weliswaar bindend beleid dat niet door latere wetgeving of jurisprudentie opzij wordt gezet, maar eist dat de activiteiten sinds de geruisloze inbreng ongewijzigd zijn — en dat heeft belanghebbende tegenover de gemotiveerde betwisting niet onderbouwd.", "rechtsregel": "Vastgoedexploitatie kwalificeert voor de BOR alleen als onderneming bij cumulatieve arbeid-plus én rendement-plus op het schenkingsmoment; een beroep op de Praktijkhandreiking vastgoedexploitanten slaagt alleen als bewezen wordt dat de activiteiten sinds de eerdere geruisloze inbreng ongewijzigd zijn.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c lid 1 onder c SW 1956", "art. 3.2 Wet IB 2001", "art. 4.17c Wet IB 2001"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:5958"}, {"ecli": "ECLI:NL:GHDHA:2026:2038", "instantie": "Gerechtshof Den Haag", "datum": "2026-06-23", "gepubliceerd": "2026-07-13", "onderwerp": "APV-toerekening familiestichting na verwijzing HR; box 3", "samenvatting": "Verwijzingszaak na HR 26 september 2025, ECLI:NL:HR:2025:1389. Vermogen van een familiestichting wordt als afgezonderd particulier vermogen (art. 2.14a Wet IB 2001) aan erflaatster toegerekend. Na verwijzing kan de vraag of sprake is van een individuele en buitensporige last niet meer worden getoetst. Het hof verwerpt het beroep op redelijke wetsuitleg, het verbod op willekeur, détournement de pouvoir, het rechtszekerheids- en het evenredigheidsbeginsel. Box 3-heffing wordt berekend conform de ambtshalve verminderingen naar aanleiding van het Kerstarrest.", "rechtsregel": "Toerekening van vermogen van een familiestichting als APV aan de inbrenger/erfgenamen houdt na cassatie stand; algemene rechtsbeginselen doorbreken de wettelijke APV-toerekening van art. 2.14a Wet IB 2001 niet.", "wetsartikelen": ["art. 2.14a Wet IB 2001"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHDHA:2026:2038"}, {"ecli": "ECLI:NL:RBNHO:2026:7687", "instantie": "Rechtbank Noord-Holland", "datum": "2026-06-18", "gepubliceerd": "2026-08-19", "onderwerp": "Erfbelasting; waardering gelegateerd recht van gebruik en bewoning (1 jaar)", "samenvatting": "Erflater legateerde aan zijn zoon het recht om diens woning en erf gedurende één jaar na overlijden om niet te blijven gebruiken, onder de last alle eigenaarslasten te dragen. In geschil is de waardering van dit genotsrecht. Belanghebbende betoogde dat art. 6 UBSW alleen ziet op levenslange of onbepaalde rechten, zodat de leeftijdsafhankelijke factor 0,75 wettelijke basis mist. De rechtbank verwerpt dit: het zinsdeel 'van het leven van een persoon afhankelijk' betekent niet 'levenslang', maar dat het recht eindigt bij eerder overlijden van de gerechtigde. Waardering: WOZ-waarde × 6% (art. 10 UBSW) × factor 0,75 (art. 6 UBSW), verminderd met € 2.310 eigenaarslasten (nader standpunt inspecteur). Beroep gegrond wegens die vermindering.", "rechtsregel": "Een tijdelijk genotsrecht dat eindigt bij eerder overlijden van de gerechtigde is 'van het leven van een persoon afhankelijk' in de zin van art. 6 UBSW; de leeftijdsafhankelijke kapitalisatiefactor is dan ook op een eenjarig gebruiksrecht van toepassing.", "wetsartikelen": ["art. 21 lid 5 SW 1956", "art. 21 lid 14 SW 1956", "art. 5 UBSW", "art. 6 UBSW", "art. 10 UBSW"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNHO:2026:7687"}, {"ecli": "ECLI:NL:RBZWB:2026:5367", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2026-06-18", "gepubliceerd": "2026-06-26", "onderwerp": "Schenk- en erfbelasting; gewetensbezwaren tegen belastingbetaling", "samenvatting": "Belanghebbende (woonachtig in Frankrijk) had gewetensbezwaren tegen de aanwending van Nederlandse belastinggelden voor militaire doeleinden en wenste daarom de aanslagen schenkbelasting (schenking 2021 van €128.750) en erfbelasting (verkrijging 2021 van €206.009) niet te voldoen. Niet in geschil was dat de aanslagen in overeenstemming met de Successiewet 1956 waren vastgesteld. De rechtbank oordeelt dat de aanwending van belastingopbrengsten een politieke en geen rechterlijke kwestie is en dat gewetensbezwaren niet tot vermindering van de aanslagen kunnen leiden. Ook het verzoek om een dwangsom faalt omdat de inspecteur binnen twee weken na ingebrekestelling besliste. Beroepen ongegrond.", "rechtsregel": "Gewetensbezwaren tegen de aanwending van belastinggelden vormen geen grond voor vermindering van een conform de Successiewet 1956 vastgestelde aanslag schenk- of erfbelasting; de besteding van belastingopbrengsten is een politieke, niet een rechterlijke aangelegenheid.", "wetsartikelen": ["Successiewet 1956 (algemeen)", "art. 4:17 Awb (dwangsom)"], "belang": "laag", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:5367"}, {"ecli": "ECLI:NL:RBZWB:2026:5371", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2026-06-18", "gepubliceerd": "2026-06-25", "onderwerp": "Fictieve verkrijging art. 13a SW; waardestijging aandelen door overlijden", "samenvatting": "Belanghebbende houdt alle aandelen in een BV die (via certificering en een tussenhoudster) een vennootschap bezit waarop een lijfrenteverplichting jegens een derde rustte. Door het overlijden van de lijfrentegerechtigde verviel de verplichting, waardoor de aandelen in waarde stegen. De inspecteur nam op grond van art. 13a SW een fictieve verkrijging in aanmerking. De rechtbank oordeelt dat de omstandigheden binnen het door de wetgever voorziene toepassingsbereik van art. 13a SW vallen; de bepaling kan als wet in formele zin niet aan het evenredigheidsbeginsel worden getoetst en het beroep op art. 1 EP en art. 14 EVRM faalt (de beperking tot de familiekring is niet van redelijke grond ontbloot). Beroep ongegrond.", "rechtsregel": "Een waardestijging van aandelen die het gevolg is van het vervallen van een op de vennootschap rustende lijfrenteverplichting door overlijden valt binnen het toepassingsbereik van de fictieve verkrijging van art. 13a SW; de bepaling kan als formele wet niet aan het evenredigheidsbeginsel worden getoetst en is niet in strijd met art. 1 EP / art. 14 EVRM.", "wetsartikelen": ["art. 13a SW 1956", "art. 1 EP EVRM", "art. 14 EVRM"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:5371"}, {"ecli": "ECLI:NL:RBZWB:2026:5372", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2026-06-18", "gepubliceerd": "2026-06-25", "onderwerp": "Fictieve verkrijging art. 13a SW (parallelzaak zus)", "samenvatting": "Parallelzaak van ECLI:NL:RBZWB:2026:5371 betreffende de zus van belanghebbende, met dezelfde aandelenstructuur en lijfrenteverplichting. De rechtbank komt tot hetzelfde oordeel: de inspecteur heeft terecht een fictieve verkrijging op grond van art. 13a SW in aanmerking genomen wegens de waardestijging van de aandelen door het vervallen van de lijfrenteverplichting bij overlijden. Beroep ongegrond.", "rechtsregel": "Identiek aan ECLI:NL:RBZWB:2026:5371: waardestijging van aandelen door het vervallen van een lijfrenteverplichting bij overlijden valt onder de fictieve verkrijging van art. 13a SW.", "wetsartikelen": ["art. 13a SW 1956", "art. 1 EP EVRM", "art. 14 EVRM"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:5372"}, {"ecli": "ECLI:NL:RBZWB:2026:5370", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2026-06-18", "gepubliceerd": "2026-06-25", "onderwerp": "Erfbelasting; WOZ-waarde woning staat in rechte vast (art. 18a AWR)", "samenvatting": "Tot de in 2012 verkregen nalatenschap behoorde een woning waarvan de WOZ-waarde op €534.000 was vastgesteld. In latere jaren erkende de BsGW een te hoge waardering, maar de WOZ-beschikking voor het peiljaar 2012 bleef onherroepelijk. De inspecteur verminderde de (eveneens onherroepelijke) aanslag erfbelasting ambtshalve op grond van art. 18a, lid 1, onderdeel b, AWR uitgaande van €350.000. Belanghebbende wenste een verdere verlaging. De rechtbank oordeelt dat voor de erfbelasting wordt aangesloten bij de in rechte vaststaande WOZ-waarde en dat de aanslag alleen verder kan worden verminderd indien de WOZ-beschikking zelf wordt herzien; dat is hier niet gebeurd. Beroep ongegrond.", "rechtsregel": "Voor de waardering van een woning in de erfbelasting wordt aangesloten bij de in rechte vaststaande WOZ-waarde van het verkrijgingsjaar; een onherroepelijke aanslag kan op de voet van art. 18a AWR uitsluitend verder worden verminderd indien de onderliggende WOZ-beschikking wordt herzien.", "wetsartikelen": ["art. 21, lid 5 SW 1956", "art. 18a AWR"], "belang": "laag", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:5370"}, {"ecli": "ECLI:NL:GHDHA:2026:2349", "instantie": "Gerechtshof Den Haag", "datum": "2026-06-18", "gepubliceerd": "2026-08-10", "zaaknummer": "BK-25/795", "onderwerp": "Giftenaftrek geweigerd na intrekking ANBI-status; kwade trouw", "samenvatting": "Aanslag IB/PVV 2021. Het hof oordeelt dat de hoorplicht en het inzagerecht niet zijn geschonden en dat de uitspraak op bezwaar niet prematuur was. Giftenaftrek wordt geweigerd omdat de ANBI-status van de instelling is ingetrokken en belanghebbende te kwader trouw was. Relevant voor de schenkbelasting via de ANBI-status (art. 5b AWR), die ook bepalend is voor de vrijstellingen van art. 32 en 33 SW 1956.", "rechtsregel": "Intrekking van de ANBI-status ontneemt de aftrek van giften aan die instelling; op opgewekt vertrouwen kan geen beroep worden gedaan door een gever die te kwader trouw is.", "wetsartikelen": ["art. 6.32-6.38 Wet IB 2001", "art. 5b AWR", "art. 32/33 SW 1956 (raakvlak)"], "belang": "laag", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHDHA:2026:2349"}, {"ecli": "ECLI:NL:RBZWB:2026:5369", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2026-06-18", "gepubliceerd": "2026-07-06", "zaaknummer": "BRE 25/1623", "onderwerp": "Schenkbelasting; eigenwoningvrijstelling geweigerd na eerder benutte verhoogde vrijstelling", "samenvatting": "Belanghebbende deed voor een schenking van zijn vader van EUR 25.731 in 2018 een geslaagd beroep op de eenmalig verhoogde vrijstelling en verzocht in 2021 voor een schenking van EUR 75.000 om de eigenwoningvrijstelling van artikel 33, aanhef en onderdeel 5, onder c, SW 1956. De rechtbank oordeelt dat de schenkingsovereenkomst uit 2018 geen herroepingsclausule bevat en dat de gestelde afwijkende partijbedoeling geen steun vindt in verklaringen, gedragingen of de tekst; bovendien zou de schenking pas in 2023 zijn teruggedraaid, ruim na het belastbare feit in 2021, zodat ook het goedkeurende beleid voor herroepen schenkingen niet van toepassing is. Het beroep op het vertrouwensbeginsel wegens de ongelukkig geformuleerde vermelding van EUR 111.906 aan vrijstelling op het aanslagbiljet faalt, omdat belanghebbende gelet op de toelichting en het verschuldigde bedrag niet redelijkerwijs kon menen dat de vrijstelling was verleend. Het beroep is ongegrond.", "rechtsregel": "Een eerder benutte eenmalig verhoogde vrijstelling staat toepassing van de eigenwoningvrijstelling in een later jaar in de weg zolang niet aannemelijk is dat de eerdere schenking herroepelijk was en voor het latere belastbare feit rechtsgeldig is herroepen.", "wetsartikelen": ["art. 33 SW 1956"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:5369"}, {"ecli": "ECLI:NL:GHARL:2026:4066", "instantie": "Gerechtshof Arnhem-Leeuwarden", "datum": "2026-06-16", "gepubliceerd": "2026-06-26", "onderwerp": "Quasi-wettelijke verdeling; leegwaarderatio bij verhuurde woning", "samenvatting": "Erflater sloot in zijn testament de wettelijke verdeling uit en legde een quasi-wettelijke verdeling op; alle goederen (waaronder een verhuurde woning) gingen naar de langstlevende echtgenote, de kinderen verkregen een onderbedelingsvordering. Belanghebbende was ten tijde van het overlijden huurder van de woning. De inspecteur paste bij haar de leegwaarderatio niet toe (art. 21, lid 8, laatste volzin SW: verkrijging door huurder), waardoor haar verkrijging hoger uitviel dan die van haar broer en zus. Het Hof oordeelt dat belanghebbende krachtens erfrecht een geldvordering heeft verkregen (art. 1, lid 3, jo. art. 10, lid 5 SW), en niet de woning zelf, zodat de uitzondering voor de verkrijgende huurder niet geldt. De leegwaarderatio (62%) moet ook bij haar worden toegepast; de aanslag wordt verminderd tot een belaste verkrijging van €38.358. Hoger beroep inspecteur ongegrond, bevestiging rechtbank.", "rechtsregel": "Bij een quasi-wettelijke verdeling verkrijgt het kind krachtens erfrecht een onderbedelingsvordering (art. 1, lid 3, jo. art. 10, lid 5 SW) en niet de tot de nalatenschap behorende woning zelf; de uitzondering van art. 21, lid 8, laatste volzin SW (geen leegwaarderatio bij verkrijging door de huurder) is daarom niet van toepassing, ook als het kind feitelijk huurder van de woning was.", "wetsartikelen": ["art. 1, lid 3 SW 1956", "art. 10, lid 5 SW 1956", "art. 21, lid 5 SW 1956", "art. 21, lid 8 SW 1956"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHARL:2026:4066"}, {"ecli": "ECLI:NL:RBDHA:2026:15427", "instantie": "Rechtbank Den Haag", "datum": "2026-05-29", "gepubliceerd": "2026-06-30", "zaaknummer": "25/7796", "onderwerp": "Afwijzing ANBI-verzoek jeugdvereniging; categorie 'welzijn' art. 5b AWR", "samenvatting": "Een uit 1886 stammende vereniging voor lokaal jeugd- en welzijnswerk verzocht in december 2024 om de ANBI-status; de inspecteur wees dat af omdat de activiteiten (clubs, dans, kampen, evenementen) ontspanning en persoonlijke ontwikkeling betreffen en slechts zijdelings het algemeen belang dienen. In geschil is of de vereniging valt onder de categorie 'welzijn' van art. 5b, lid 3, onderdeel a, AWR. De rechtbank verwerpt het standpunt van de inspecteur dat 'welzijn' een afgebakende kwetsbare doelgroep vereist en interpreteert de categorieën ruim, maar oordeelt dat de vereniging de kwalitatieve toets niet haalt: onvoldoende inzichtelijk is hoe de activiteiten het algemeen belang rechtstreeks en (nagenoeg) uitsluitend dienen, mede omdat niet is onderbouwd in hoeverre zij zich richt op een publiek buiten de eigen ledenkring. Het beroep op het gelijkheidsbeginsel faalt omdat stichtingen zonder leden rechtens niet vergelijkbaar zijn met een vereniging en de feitelijke vergelijkbaarheid slechts summier is onderbouwd.", "rechtsregel": "De categorie 'welzijn' van art. 5b, lid 3, onderdeel a, AWR vereist geen afgebakende kwetsbare doelgroep, maar een vereniging dient te bewijzen dat haar feitelijke werkzaamheden rechtstreeks en (nagenoeg) uitsluitend het algemeen belang dienen en zich niet beperken tot het particuliere belang van de eigen ledenkring.", "wetsartikelen": ["art. 5b AWR", "art. 1a Uitvoeringsregeling AWR 1994"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2026:15427"}, {"ecli": "ECLI:NL:GHARL:2026:3419", "instantie": "Gerechtshof Arnhem-Leeuwarden", "datum": "2026-05-27", "gepubliceerd": "2026-08-26", "onderwerp": "BOR: vastgoed-BV geen materiële onderneming; arbeid+/rendement+-toets", "samenvatting": "Tot de nalatenschap behoren alle aandelen in een vastgoed-BV (verhuur bedrijfspanden, drie werknemers onder wie erflater). Het Hof bevestigt dat de BV geen materiële onderneming drijft: de verhuur-, beheer- en onderhoudswerkzaamheden horen bij normaal vermogensbeheer en hebben niet onmiskenbaar ten doel een hoger rendement te behalen dan bij normaal vermogensbeheer. Incidentele huurdersinvesteringen zijn niet aan de BV toe te rekenen; een rendementsvergelijking met de IPD Vastgoedindex baat belanghebbende niet omdat al aan de arbeidstoets niet is voldaan. BOR (art. 35b/35c SW) niet van toepassing; hoger beroep ongegrond.", "rechtsregel": "Vastgoedexploitatie is pas een materiële onderneming voor de BOR als de arbeid naar aard en omvang normaal vermogensbeheer te boven gaat én onmiskenbaar gericht is op een bovengemiddeld rendement; de bewijslast rust op de verkrijger die zich op de BOR beroept.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 3.2 Wet IB 2001"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHARL:2026:3419"}, {"ecli": "ECLI:NL:GHSHE:2026:1357", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2026-05-27", "gepubliceerd": "2026-06-24", "onderwerp": "Integrale proceskostenvergoeding na gegrond bezwaar aanslag erfbelasting", "samenvatting": "De inspecteur had een aanslag erfbelasting opgelegd naar een geschatte verkrijging van €1.000.000 en het bezwaar daartegen later gegrond verklaard. In geschil is of belanghebbende recht heeft op een integrale (in plaats van forfaitaire) proceskostenvergoeding wegens onzorgvuldig handelen van de inspecteur en wegens een door de rechtbank vastgestelde schending van art. 8:42 Awb. Het hof oordeelt dat geen sprake is van bijzondere omstandigheden in de zin van art. 2, lid 3, Besluit proceskosten bestuursrecht en bevestigt de uitspraak van de rechtbank; het hoger beroep is ongegrond.", "rechtsregel": "Het schatten van een verkrijging en een schending van art. 8:42 Awb leveren op zichzelf geen bijzondere omstandigheid op die een integrale proceskostenvergoeding (art. 2, lid 3, Bpb) rechtvaardigt; daarvoor is verdergaande onzorgvuldigheid (tegen beter weten in handelen) vereist.", "wetsartikelen": ["art. 8:42 Awb", "art. 2 Besluit proceskosten bestuursrecht"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2026:1357"}, {"ecli": "ECLI:NL:GHARL:2026:3418", "instantie": "Gerechtshof Arnhem-Leeuwarden", "datum": "2026-05-27", "gepubliceerd": "2026-06-22", "zaaknummer": "23/2564", "onderwerp": "BOR erfbelasting: vastgoedexploitatie geen materiële onderneming", "samenvatting": "Erflater overleed in 2016 en liet alle aandelen na in een vennootschap met acht onroerende zaken, waarvan een deel werd verhuurd; de aanslag erfbelasting werd na bezwaar en beroep vastgesteld naar een belaste verkrijging van € 1.245.731 zonder toepassing van de BOR. Het Hof beoordeelt per activiteit (aan- en verkoop, bouw en verbouw, verhuur) of sprake is van arbeid die naar aard en omvang meer omvat dan bij normaal vermogensbeheer gebruikelijk is en onmiskenbaar is gericht op een hoger rendement, en beantwoordt die vraag ontkennend: aan- en verkoop ontbrak in 2012-2016, de verbouwingsinvesteringen zijn door huurders gedaan en niet geactiveerd, en verhuur, beheer, toezicht, klein onderhoud en opruiming na een faillissement van een huurder horen bij normaal beheer. Ook de rendementsberekening ten opzichte van de IPD-vastgoedindex baat belanghebbende niet, de getaxeerde waarde van het verhuurde vastgoed van € 1.227.500 blijft in stand en er is geen grond de belastingrente te matigen.", "rechtsregel": "Exploitatie van onroerende zaken vormt slechts een materiële onderneming in de zin van artikel 3.2 Wet IB 2001 - en geeft dus alleen dan recht op de BOR - indien de arbeid naar aard en omvang meer omvat dan bij normaal vermogensbeheer gebruikelijk is én onmiskenbaar ten doel heeft een hoger dan normaal rendement te behalen, waarbij de bewijslast rust op degene die zich op de BOR beroept.", "wetsartikelen": ["art. 1 SW 1956", "art. 35b SW 1956", "art. 35c SW 1956", "art. 3.2 Wet IB 2001"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHARL:2026:3418"}, {"ecli": "ECLI:NL:RBGEL:2026:4062", "instantie": "Rechtbank Gelderland", "datum": "2026-05-22", "gepubliceerd": "2026-06-05", "onderwerp": "Erfbelasting: beroep buiten termijn, niet-ontvankelijk", "samenvatting": "In Spanje wonende erfgenaam stelde beroep in tegen een aanslag erfbelasting. Het beroepschrift is na afloop van de zeswekentermijn ter post bezorgd en ontvangen. De rechtbank verklaart het beroep niet-ontvankelijk; aan een inhoudelijke beoordeling van de aanslag komt zij niet toe.", "rechtsregel": "Een buiten de termijn van art. 6:7 Awb ingediend beroepschrift is zonder verschoonbaarheid niet-ontvankelijk, ook bij een in het buitenland wonende belanghebbende.", "wetsartikelen": ["art. 6:7 Awb", "art. 6:9 Awb", "art. 6:11 Awb"], "belang": "laag", "oordeel": "n.v.t.", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2026:4062"}, {"ecli": "ECLI:NL:RBZWB:2026:4355", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2026-05-19", "gepubliceerd": "2026-05-28", "onderwerp": "Erfbelasting: verhoogde kindvrijstelling — 50%-eis levensonderhoud niet aangetoond", "samenvatting": "Belanghebbende (erfgenaam van een in Frankrijk wonende moeder) claimde de verhoogde kindvrijstelling voor erfbelasting. De verhoogde vrijstelling vereist dat de erflater meer dan 50% heeft bijgedragen aan het levensonderhoud van de verkrijger. De rechtbank oordeelde dat belanghebbende dit niet aannemelijk had gemaakt, gelet op de vermogenspositie van de moeder (saldi vanaf €23k t/m €112k) en de ontvangen schenkingen. Het beroep is ongegrond.", "rechtsregel": "De verhoogde kindvrijstelling (art. 32 lid 1 sub 4 onder b SW) geldt alleen als de erflater meer dan 50% heeft bijgedragen aan het levensonderhoud van het kind; de bewijslast rust op de verkrijger.", "wetsartikelen": ["art. 32 lid 1 sub 4 SW 1956"], "belang": "laag", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:4355"}, {"ecli": "ECLI:NL:RBZWB:2026:4356", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2026-05-19", "gepubliceerd": "2026-05-28", "onderwerp": "Erfbelasting: buitensporige last, beneficiaire aanvaarding en art. 1 EP EVRM", "samenvatting": "Belanghebbende (dochter) ontving bloot eigendom na overlijden moeder (vader heeft vruchtgebruik via oud testament). Zij aanvaardde beneficiair maar stelde dat de erfbelasting een buitensporige last vormde ex art. 1 EP EVRM, nu zij geen middelen had en de vader de erfbelasting weigerde te betalen. De rechtbank oordeelt dat beneficiaire aanvaarding niet afdoet aan de verschuldigdheid van erfbelasting over de bloot eigendomsverkrijging; de situatie met de vader (vruchtgebruiker die zijn deel niet betaalt) is een civielrechtelijke kwestie. Het beroep is slechts gegrond voor de proceskosten in de bezwaarfase.", "rechtsregel": "Beneficiaire aanvaarding van een nalatenschap ontslaat de erfgenaam niet van de verplichting erfbelasting te betalen over zijn verkrijging; het feit dat de vruchtgebruiker zijn aandeel in de erfbelasting niet voldoet, is een civielrechtelijke kwestie die de fiscale verschuldigdheid onverlet laat.", "wetsartikelen": ["art. 1 EP EVRM", "art. 5 SW 1956", "art. 20 SW 1956"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:4356"}, {"ecli": "ECLI:NL:RBDHA:2026:19642", "instantie": "Rechtbank Den Haag", "datum": "2026-05-19", "gepubliceerd": "2026-07-30", "onderwerp": "Waardering overbedelingsschuld bij tweede overlijden (langstlevende)", "samenvatting": "Bij het tweede overlijden (erflaatster, 2023) moet de overbedelingsschuld/onderbedelingsvordering die is ontstaan door de ouderlijke boedelverdeling na het eerste overlijden (vader, 1999) worden gewaardeerd naar de werkelijke waarde van de woning ten tijde van het eerste overlijden, niet naar de destijds voor de aangifte gehanteerde (lagere WOZ-)waarde. De rechtbank volgt HR 25 september 2009 (ECLI:NL:HR:2009:BI1127). Beroep gegrond; verweerder moet uitgaan van de werkelijke waarde van EUR 269.999 (NLG 595.000), vermeerderd met testamentaire rente.", "rechtsregel": "Bij het overlijden van de langstlevende wordt de overbedelingsschuld/onderbedelingsvordering uit de ouderlijke boedelverdeling gewaardeerd naar de werkelijke waarde van het onderliggende goed ten tijde van het eerste overlijden, ook als bij het eerste overlijden een lagere waarde is aangegeven en aanvaard.", "wetsartikelen": ["art. 1 SW 1956", "art. 21 SW 1956"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2026:19642"}, {"ecli": "ECLI:NL:RBDHA:2026:12696", "instantie": "Rechtbank Den Haag", "datum": "2026-05-13", "gepubliceerd": "2026-06-03", "onderwerp": "Verhoogde EW-vrijstelling: kwijtschelding niet-kwalificerende lening", "samenvatting": "Ouders schonken hun dochter de kwijtschelding van een lening die was verstrekt voor de aanschaf van een eigen woning. De rechtbank oordeelt dat de eenmalig verhoogde vrijstelling eigen woning (art. 33, onder 5, sub c, SW) niet geldt, omdat de lening niet kwalificeert als eigenwoningschuld in de zin van art. 3.119a Wet IB 2001. Het beroep op het vertrouwensbeginsel faalt. Formeel opvallend: het te late beroep is toch ontvankelijk omdat een latere verminderingsbeslissing met rechtsmiddelverwijzing een nieuwe beroepstermijn vermeldde.", "rechtsregel": "Kwijtschelding van een lening die niet kwalificeert als eigenwoningschuld (art. 3.119a Wet IB 2001) valt niet onder de eenmalig verhoogde schenkingsvrijstelling eigen woning van art. 33, onder 5, sub c, SW 1956.", "wetsartikelen": ["art. 33 onder 5 sub c SW 1956", "art. 3.119a Wet IB 2001"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2026:12696"}, {"ecli": "ECLI:NL:GHSHE:2026:1241", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2026-05-13", "gepubliceerd": "2026-05-28", "onderwerp": "Schenkbelasting: heffingsbevoegdheid na onjuiste tenaamstelling, beroep op dwaling", "samenvatting": "Na drie aanslagen schenkbelasting met onjuiste tenaamstelling legde de inspecteur — na herhaalde pogingen — een correcte aanslag op. Het hof oordeelt dat de heffingsbevoegdheid nog niet was uitgeput: de eerdere aanslagen met onjuiste tenaamstelling waren ongeldig en doorbrekten de verjaringstermijn niet voor de correcte aanslag. Een beroep op dwaling bij de aan de schenking ten grondslag liggende akte van rectificatie — opgemaakt na overlijden van beide partijen — werd verworpen. Het hoger beroep (bekrachtiging van ECLI:NL:RBZWB:2024:342) is ongegrond.", "rechtsregel": "Herhaalde onjuiste tenaamstelling door een systeemfout doorbreekt de heffingsbevoegdheid niet; de inspecteur die consequent corrigeert en uiteindelijk een penaanslag op naam stelt, handelt niet ernstig onzorgvuldig en de heffingsbevoegdheid is niet uitgeput.", "wetsartikelen": ["art. 66 SW 1956", "art. 66a SW 1956"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2026:1241"}, {"ecli": "ECLI:NL:GHSHE:2026:1128", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2026-04-29", "gepubliceerd": "2026-05-12", "onderwerp": "Schenkbelasting: vrijstelling art. 33/12° SW – schenking door zoons aan vriendin erflater", "samenvatting": "Twee zoons schonken na het overlijden van hun vader elk € 250.000 aan de LAT-relatie van de vader (anderhalf jaar samen, niet samenwonend, niet opgenomen in testament). In een vaststellingsovereenkomst erkenden zoons een 'dringende morele verplichting'. Zij claimden de vrijstelling ex art. 33 aanhef en onder 12° SW (voldoening aan een natuurlijke verbintenis ex art. 6:3 BW). Hof bevestigt oordeel rechtbank: niet aannemelijk dat erflater nakoming door zoons verlangde; de zoons ervoeren zelf ook geen dringende morele verplichting naar objectieve maatstaven. Vaststellingsovereenkomst en subjectieve kwalificatie als 'morele verplichting' zijn onvoldoende om vrijstelling te claimen.", "rechtsregel": "De vrijstelling ex art. 33 aanhef en onder 12° SW vereist dat de zoons zelf naar objectieve maatstaven een dringende morele verplichting (art. 6:3 BW) jegens de begiftigde ervaren; een natuurlijke verbintenis van de erflater vererft niet automatisch, en een vaststellingsovereenkomst met subjectieve kwalificatie volstaat niet.", "wetsartikelen": ["art. 1 lid 7 SW 1956", "art. 33 aanhef en onder 12° SW 1956", "art. 6:3 BW"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2026:1128", "vindplaatsen": ["V-N Vandaag 2026/986", "Viditax (FutD) 2026051302"]}, {"ecli": "ECLI:NL:RBDHA:2026:15688", "instantie": "Rechtbank Den Haag", "datum": "2026-04-22", "gepubliceerd": "2026-06-18", "onderwerp": "Belastingrente erfbelasting; buitenlandse erfgenaam zonder BSN", "samenvatting": "Aan een in Nieuw-Zeeland wonende erfgename (belaste verkrijging €602.821) zonder BSN is belastingrente (art. 30g AWR) opgelegd omdat de aangifte erfbelasting na de achtmaandstermijn werd ingediend. De vertraging kwam voort uit de tijd die nodig was om via een woonplaatsverklaring een BSN te verkrijgen; de Belastingdienst had op haar website de indruk gewekt dat aangifte pas met BSN mogelijk was. De rechtbank oordeelt dat het in rekening brengen van belastingrente in strijd is met het zorgvuldigheidsbeginsel en vernietigt de rentebeschikking. Beroep gegrond.", "rechtsregel": "Onder bijzondere omstandigheden brengen de abbb (zorgvuldigheidsbeginsel) mee dat geen belastingrente ex art. 30g AWR mag worden geheven wanneer de aangiftevertraging het gevolg is van de door de Belastingdienst gewenste BSN-procedure voor een buitenlandse erfgenaam.", "wetsartikelen": ["art. 30g AWR", "art. 9 Invorderingswet 1990"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2026:15688"}, {"ecli": "ECLI:NL:GHSHE:2026:1079", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2026-04-22", "gepubliceerd": "2026-06-09", "onderwerp": "Herroeping schenking; eenmalig verhoogde eigenwoningvrijstelling herleeft niet", "samenvatting": "Een in 2009 benutte eenmalig verhoogde vrijstelling herleeft niet door herroeping van die schenking in 2017. De herroeping is vervulling van een ontbindende voorwaarde zonder terugwerkende kracht (art. 3:38 lid 2 BW); via art. 82a SW resteert slechts het niet-benutte deel van de eigenwoningvrijstelling. Het goedkeurend beleid mist toepassing omdat de herroeping overwegend fiscaal is gemotiveerd. Bij een schenking vrij van belasting blijft de verkrijger belastingplichtig (art. 36 SW).", "rechtsregel": "Herroeping van een herroepelijke schenking heeft geen terugwerkende kracht; de eerder benutte eenmalig verhoogde vrijstelling herleeft niet en wordt via art. 82a SW op een latere eigenwoningvrijstelling in mindering gebracht.", "wetsartikelen": ["art. 33 SW 1956", "art. 82a SW 1956", "art. 36 SW 1956", "art. 3:38 lid 2 BW"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2026:1079"}, {"ecli": "ECLI:NL:RBNHO:2026:5134", "instantie": "Rechtbank Noord-Holland", "datum": "2026-04-21", "gepubliceerd": "2026-07-07", "onderwerp": "Aanslagtermijn erfbelasting; integrale proceskostenvergoeding", "samenvatting": "Erflaatster overleed op 22 juli 2020; kort daarvoor (30 juni 2020) was het finaal wederkerig verrekenbeding ingetrokken. In geschil is of de aanslag erfbelasting (uiteindelijk verminderd tot een verkrijging van EUR 126.984) binnen de wettelijke aanslagtermijn is opgelegd, mede gelet op verleend uitstel. Tevens verzoekt belanghebbende om integrale vergoeding van de bezwaarkosten. De rechtbank oordeelt dat de aanslag tijdig is opgelegd en dat geen recht bestaat op een integrale kostenvergoeding.", "rechtsregel": "De aanslagtermijn voor de erfbelasting wordt verlengd met de duur van het verleende uitstel voor het doen van aangifte; er bestaat geen recht op integrale proceskostenvergoeding zonder dat sprake is van tegen beter weten in handelen of ernstige onzorgvuldigheid van de inspecteur.", "wetsartikelen": ["art. 66 SW 1956", "art. 45 SW 1956"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNHO:2026:5134"}, {"ecli": "ECLI:NL:RBDHA:2026:9541", "instantie": "Rechtbank Den Haag", "datum": "2026-04-20", "gepubliceerd": "2026-04-21", "onderwerp": "IB/PVV 2017 erflater: rekening-courant deels oninbaar, WEV onroerende zaken", "samenvatting": "Erfgenamen procederen over IB/PVV-aanslag 2017 van erflater. Rente op rekening-courantvordering deels oninbaar: rechtbank vermindert aanslag. Vervreemdingsverlies aandelen aan stichting niet aannemelijk; WEV onroerende zaken niet lager dan WOZ-waarde aangetoond. Beroep gedeeltelijk gegrond.", "rechtsregel": "Erfgenamen die procederen over IB-aanslag erflater dragen bewijslast voor oninbaarheid rente en lagere WEV; niet volstaan met blote stelling.", "wetsartikelen": ["art. 3.8 Wet IB 2001", "art. 3.94 Wet IB 2001"], "belang": "laag", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2026:9541"}, {"ecli": "ECLI:NL:RBDHA:2026:9542", "instantie": "Rechtbank Den Haag", "datum": "2026-04-20", "gepubliceerd": "2026-04-21", "onderwerp": "IB/PVV 2018 erflater: rekening-courant oninbaar, sfeerovergang onroerende zaak", "samenvatting": "Erfgenamen procederen over IB/PVV 2018 van erflater. Rente op rekening-courant deels oninbaar en vervreemdingsverliezen bij sfeerovergang onroerende zaak aannemelijk gemaakt: aanslag verminderd. Beroep gedeeltelijk gegrond.", "rechtsregel": "Sfeerovergang van onroerende zaak van box 1 naar box 3 kan een vervreemdingsverlies opleveren als de WEV lager is dan de boekwaarde; oninbaarheid rente rekening-courant verlaagt belastbaar inkomen.", "wetsartikelen": ["art. 3.8 Wet IB 2001"], "belang": "laag", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2026:9542"}, {"ecli": "ECLI:NL:HR:2026:669", "instantie": "Hoge Raad", "datum": "2026-04-17", "wetsartikelen": ["art. 1a lid 4 SW 1956 (oud)", "art. 32 lid 1 onderdeel 4° SW 1956", "art. 128 Overgangswet NBW"], "oordeel": "ongegrond", "onderwerp": "Kind dat mantelzorg verleent heeft geen recht op de partnervrijstelling erfbelas", "samenvatting": "Kind dat mantelzorg verleent heeft geen recht op de partnervrijstelling erfbelasting. Goederenrechtelijke aanspraak van legitimarissen is geen aftrekbare schuld van de nalatenschap. Beroep in cassatie ongegrond. Definitieve uitspraak Hoge Raad over reikwijdte partnervrijstelling voor mantelzorger. Bevestigt dat enkel juridisch gelijkgestelden aanspraak kunnen maken op partnervrijstelling; mantelzorg alleen is onvoldoende. Goederenrechtelijke legitimarisaanspraak kwalificeert niet als schuld van de nalatenschap.", "rechtsregel": "Definitieve uitspraak Hoge Raad over reikwijdte partnervrijstelling voor mantelzorger. Bevestigt dat enkel juridisch gelijkgestelden aanspraak kunnen maken op partnervrijstelling; mantelzorg alleen is onvoldoende. Goederenrechtelijke legitimarisaanspraak kwalificeert niet als schuld van de nalatenschap.", "belang": "hoog", "gepubliceerd": "2026-04-17", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2026:669", "tags": ["Vrijstellingen", "Nalatenschap"]}, {"ecli": "ECLI:NL:RBNNE:2026:1208", "instantie": "Rechtbank Noord-Nederland", "datum": "2026-04-16", "wetsartikelen": ["art. 35c lid 1 sub c SW 1956", "art. 35d lid 1 sub c SW 1956"], "oordeel": "gegrond", "onderwerp": "BOR directe bezitseis bij aandeleninkoop door BV: moeder hield dezelfde 600 cert", "samenvatting": "BOR directe bezitseis bij aandeleninkoop door BV: moeder hield dezelfde 600 certificaten al langer dan 5 jaar; de procentuele stijging (van 6% naar 7,55%) door inkoop eigen aandelen door de BV zelf doet geen nieuwe bezitstermijn ingaan. BOR van toepassing op de volle schenking. Tegenstrijdig met ECLI:NL:RBDHA:2026:8337: Rechtbank Noord-Nederland oordeelt dat inkoop eigen aandelen door de BV geen nieuwe bezitstermijn doet ingaan voor de reeds >5 jaar gehouden certificaten, omdat de schenker geen nieuwe aandelen heeft verkregen. Beide uitspraken betreffen dezelfde rechtsvraag met tegengestelde uitkomst.", "rechtsregel": "Tegenstrijdig met ECLI:NL:RBDHA:2026:8337: Rechtbank Noord-Nederland oordeelt dat inkoop eigen aandelen door de BV geen nieuwe bezitstermijn doet ingaan voor de reeds >5 jaar gehouden certificaten, omdat de schenker geen nieuwe aandelen heeft verkregen. Beide uitspraken betreffen dezelfde rechtsvraag met tegengestelde uitkomst.", "belang": "hoog", "gepubliceerd": "2026-04-16", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNNE:2026:1208", "tags": ["BOR", "Schenkbelasting", "Bedrijfsopvolging"]}, {"ecli": "ECLI:NL:RBDHA:2026:8337", "instantie": "Rechtbank Den Haag", "datum": "2026-04-07", "wetsartikelen": ["art. 35c lid 1 sub c SW 1956", "art. 35d lid 1 sub c SW 1956"], "oordeel": "ongegrond", "onderwerp": "BOR indirecte bezitseis bij aandeleninkoop door werkvennootschap: holding had in", "samenvatting": "BOR indirecte bezitseis bij aandeleninkoop door werkvennootschap: holding had indirect 80% in de onderneming; na inkoop eigen aandelen door werkvennootschap steeg dit procentueel naar 100%. Voor de extra 20% begon een nieuwe indirecte bezitstermijn. BOR slechts van toepassing voor 80%. Tegenstrijdig met ECLI:NL:RBNNE:2026:1208 over directe bezitseis: Rechtbank Den Haag oordeelt dat een aandeleninkoop door de werkvennootschap een nieuwe indirecte bezitstermijn doet ingaan voor het procentueel uitgebreide belang. Conflict vraagt om verduidelijking door hogere rechter.", "rechtsregel": "Tegenstrijdig met ECLI:NL:RBNNE:2026:1208 over directe bezitseis: Rechtbank Den Haag oordeelt dat een aandeleninkoop door de werkvennootschap een nieuwe indirecte bezitstermijn doet ingaan voor het procentueel uitgebreide belang. Conflict vraagt om verduidelijking door hogere rechter.", "belang": "hoog", "gepubliceerd": "2026-04-07", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2026:8337", "tags": ["BOR", "Schenkbelasting", "Bedrijfsopvolging"]}, {"ecli": "ECLI:NL:RBDHA:2026:8355", "instantie": "Rechtbank Den Haag", "datum": "2026-04-07", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956"], "oordeel": "ongegrond", "onderwerp": "Verhuur van voormalig modemagazijn te Amsterdam door BV kwalificeert als normaal", "samenvatting": "Verhuur van voormalig modemagazijn te Amsterdam door BV kwalificeert als normaal vermogensbeheer en niet als een onderneming. BOR niet van toepassing op het geërfde minderheidsbelang (31%). Aandelenwaarde vastgesteld met 10% incourantheidsafslag wegens minderheidsbelang. Bevestigt vaste lijn dat verhuur van vastgoed als normaal vermogensbeheer kwalificeert en daarmee buiten de BOR valt. Opvallend is de toegepaste incourantheidsafslag van 10% op de aandelenwaarde wegens het minderheidsbelang.", "rechtsregel": "Bevestigt vaste lijn dat verhuur van vastgoed als normaal vermogensbeheer kwalificeert en daarmee buiten de BOR valt. Opvallend is de toegepaste incourantheidsafslag van 10% op de aandelenwaarde wegens het minderheidsbelang.", "belang": "middel", "gepubliceerd": "2026-04-07", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2026:8355", "tags": ["BOR", "Erfbelasting"]}, {"ecli": "ECLI:NL:RBDHA:2026:8356", "instantie": "Rechtbank Den Haag", "datum": "2026-04-07", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956"], "oordeel": "ongegrond", "onderwerp": "Companion-zaak bij ECLI:NL:RBDHA:2026:8355 (zaaknr", "samenvatting": "Companion-zaak bij ECLI:NL:RBDHA:2026:8355 (zaaknr. SGR 25/3031): zelfde feitencomplex, andere erfgenaam. Verhuur modemagazijn Amsterdam is geen onderneming; BOR niet van toepassing. Companion-zaak bij ECLI:NL:RBDHA:2026:8355; geen zelfstandige rechtsontwikkeling. Zie hoofdzaak voor de inhoudelijke analyse.", "rechtsregel": "Companion-zaak bij ECLI:NL:RBDHA:2026:8355; geen zelfstandige rechtsontwikkeling. Zie hoofdzaak voor de inhoudelijke analyse.", "belang": "laag", "gepubliceerd": "2026-04-07", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2026:8356", "tags": ["BOR", "Erfbelasting"]}, {"ecli": "ECLI:NL:RBDHA:2026:8341", "instantie": "Rechtbank Den Haag", "datum": "2026-04-07", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956"], "oordeel": "ongegrond", "onderwerp": "Companion-zaak bij ECLI:NL:RBDHA:2026:8355 (zaaknr", "samenvatting": "Companion-zaak bij ECLI:NL:RBDHA:2026:8355 (zaaknr. SGR 25/4506): zelfde feitencomplex, andere erfgenaam. Verhuur modemagazijn Amsterdam is geen onderneming; BOR niet van toepassing. Companion-zaak bij ECLI:NL:RBDHA:2026:8355; geen zelfstandige rechtsontwikkeling. Zie hoofdzaak voor de inhoudelijke analyse.", "rechtsregel": "Companion-zaak bij ECLI:NL:RBDHA:2026:8355; geen zelfstandige rechtsontwikkeling. Zie hoofdzaak voor de inhoudelijke analyse.", "belang": "laag", "gepubliceerd": "2026-04-07", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2026:8341", "tags": ["BOR", "Erfbelasting"]}, {"ecli": "ECLI:NL:RBNNE:2026:1253", "instantie": "Rechtbank Noord-Nederland", "datum": "2026-03-24", "gepubliceerd": "2026-04-16", "onderwerp": "Erfbelasting: mantelzorger-kind; geen partnervrijstelling", "samenvatting": "Kind dat samenleefde met en mantelzorg verleende aan moeder, claimt partnervrijstelling (art. 25 SW). Rechtbank: de wetgever heeft bewust kinderen die ouders verzorgen niet gelijkgesteld aan partners. Die keuze kan aan eiser worden tegengeworpen, ongeacht feitelijke samenwoning. Vordering op moeder niet aannemelijk gemaakt. Beroep ongegrond.", "rechtsregel": "Een kind dat samenleeft met en mantelzorg verleent aan een ouder heeft geen recht op de partnervrijstelling; de wettelijke keuze om kinderen-mantelzorgers niet gelijk te stellen aan partners is rechtsgeldig.", "wetsartikelen": ["art. 25 SW 1956"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNNE:2026:1253"}, {"ecli": "ECLI:NL:RBNNE:2026:1254", "instantie": "Rechtbank Noord-Nederland", "datum": "2026-03-24", "gepubliceerd": "2026-06-02", "zaaknummer": "LEE 25/3614 en 26/1020", "onderwerp": "Betalingen tussen broer en zus: schenking of natuurlijke verbintenis", "samenvatting": "De broer van eiseres maakte haar in 2022 en 2023 respectievelijk € 13.873 en € 18.000 over, waarover de inspecteur schenkbelasting naar het derdentarief van 30% heffde. Eiseres stelde dat het ging om compensatie voor jarenlange onbetaalde arbeid en een gebroken belofte over inwoning, zodat sprake was van een rechtens afdwingbare dan wel natuurlijke verbintenis. De rechtbank oordeelt dat geen contractuele verhouding of schadeplichtigheid is ontstaan en dat eiseres, op wie de bewijslast rust, niet aannemelijk heeft gemaakt dat naar maatschappelijke opvattingen een zo dringende morele verplichting bestond dat van een natuurlijke verbintenis kan worden gesproken; beroepen ongegrond.", "rechtsregel": "Betalingen binnen familieverband zijn belaste schenkingen tenzij de verkrijger aannemelijk maakt dat naar maatschappelijke opvattingen een zo dringende morele verplichting van de betaler bestond dat de betaling voldoening van een natuurlijke verbintenis vormt.", "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNNE:2026:1254"}, {"ecli": "ECLI:NL:RBNHO:2026:2919", "instantie": "Rechtbank Noord-Holland", "datum": "2026-03-19", "gepubliceerd": "2026-05-28", "onderwerp": "APV: kwalificatie Stiftung als afgezonderd particulier vermogen, omkering bewijslast", "samenvatting": "In geschil is of een buitenlandse Stiftung (fonds) kwalificeert als Afgezonderd Particulier Vermogen (APV) in de zin van art. 2.14a Wet IB 2001. De inspecteur stelde dat het vermogen aan de erflater moest worden toegerekend en legde IB/PVV-aanslagen op. De rechtbank (meervoudige kamer) oordeelt dat sprake is van een APV en past partiële omkering en verzwaring van de bewijslast toe wegens gebrekkige informatieverstrekking. De beroepen zijn gegrond, maar op basis van de omgekeerde bewijslast. Dit arrest is relevant voor de SW omdat APV-kwalificatie ook doorwerkt in de erfbelastingsfeer (art. 16 SW).", "rechtsregel": "Een buitenlandse Stiftung zonder aandelen en met afgezonderd vermogen kwalificeert als APV ex art. 2.14a Wet IB 2001; partiële omkering van de bewijslast is mogelijk als de belastingplichtige niet voldoet aan zijn informatieverplichtingen.", "wetsartikelen": ["art. 2.14a Wet IB 2001", "art. 47 AWR", "art. 27e AWR", "art. 16 SW 1956"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNHO:2026:2919"}, {"ecli": "ECLI:NL:RBZWB:2026:1738", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2026-03-13", "gepubliceerd": "2026-03-19", "onderwerp": "BOR: gelegateerde cultuurgrond geen ondernemingsvermogen; btw in WEV", "samenvatting": "Belanghebbende verkreeg bij legaat een onverdeeld aandeel in cultuurgrond (gebruik en genot ingebracht in de melkveehouderij-VOF van erflater) en in spaartegoeden/beleggingen. De rechtbank oordeelt dat deze vermogensbestanddelen op het moment van verkrijging geen (gedeelte van een) onderneming vormen in de zin van art. 35c lid 1 onder a SW; latere inbreng in de VOF waartoe belanghebbende toetrad maakt dat niet anders. Art. 3.62 Wet IB 2001 werkt niet door naar de BOR. Bij waardering van de grond (art. 21 lid 1 SW) maakt omzetbelasting deel uit van de waarde in het economische verkeer; aftrekbaarheid bij de koper is een persoonlijke omstandigheid.", "rechtsregel": "Voor de BOR is beslissend of het verkregene op het moment van verkrijging kwalificeert als (gedeelte van een) onderneming; doorschuifbepalingen uit de Wet IB 2001 (art. 3.62) werken niet door naar art. 35b/35c SW en omzetbelasting behoort tot de WEV van art. 21 SW.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 21 SW 1956", "art. 3.62 Wet IB 2001", "art. 8:42 Awb"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:1738"}, {"ecli": "ECLI:NL:RBZWB:2026:1740", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2026-03-13", "gepubliceerd": "2026-05-04", "zaaknummer": "25/224", "onderwerp": "Erfbelasting; BOR bij legaat cultuurgrond en waardering in het economische verkeer", "samenvatting": "Belanghebbende verkreeg uit de nalatenschap van haar in 2020 overleden broer bij legaat een onverdeeld aandeel in cultuurgrond en in spaartegoeden/beleggingen (totaal aangegeven EUR 369.778) en trad daarna toe tot de melkveehouderij-VOF waarin erflater vennoot was; de aanslag erfbelasting bedroeg EUR 134.354. De rechtbank oordeelt dat op het moment van de verkrijging geen sprake was van (een gedeelte van) een onderneming als bedoeld in artikel 35c, eerste lid, onderdeel a, SW 1956, zodat de BOR niet van toepassing is; latere inbreng van gebruik en genot in de VOF en creditering in het vennootschapsvermogen doen daar niet aan af, en de doorschuifregeling van artikel 3.62 Wet IB 2001 werkt niet door naar de BOR. Ook het subsidiaire waarderingsstandpunt faalt, omdat bij de waarde in het economische verkeer van artikel 21, eerste lid, SW 1956 de aan de koper in rekening gebrachte omzetbelasting tot de prijs behoort. Het beroep op artikel 8:42 Awb slaagt evenmin; het beroep is ongegrond.", "rechtsregel": "Voor de bedrijfsopvolgingsregeling is beslissend of het verkregene op het tijdstip van de verkrijging (een gedeelte van) een objectieve onderneming vormt, en de doorschuifregeling van artikel 3.62 Wet IB 2001 werkt niet door naar de BOR.", "wetsartikelen": ["art. 21 SW 1956", "art. 35b SW 1956", "art. 35c SW 1956", "art. 35e SW 1956", "art. 3.2 Wet IB 2001", "art. 3.62 Wet IB 2001", "art. 3.63 Wet IB 2001", "art. 8:29 Awb", "art. 8:42 Awb"], "belang": "middel", "oordeel": "ongegrond", "parallelzaken": ["ECLI:NL:RBZWB:2026:1739"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:1740"}, {"ecli": "ECLI:NL:HR:2026:137", "instantie": "Hoge Raad", "datum": "2026-01-30", "gepubliceerd": "2026-01-30", "onderwerp": "BOR bezitseis bij ruziesplitsing: nieuwe indirecte bezitstermijn voor uitgebreid belang", "samenvatting": "Moeder hield via [E] Beheer indirect 49% in [D] BV, die twee ondernemingen dreef ('horen' en 'zien'). Na een ruziesplitsing (2011) verkreeg moeder 100% in 'horen'. In 2013 schonk zij de aandelen aan haar kind en claimde BOR voor de volledige waarde. De Inspecteur paste BOR slechts toe voor 49%. Gerechtshof Arnhem-Leeuwarden (verwijzingshof) oordeelde dat 'horen' en 'zien' twee afzonderlijke objectieve ondernemingen vormden; HR laat dit feitelijke oordeel in stand. De indirecte bezitstermijn van art. 35d lid 1 letter c SW vangt opnieuw aan voor het bij de splitsing uitgebreide procentuele belang. Art. 9 lid 2 URSE biedt alleen verzachting van de directe bezitseis en is niet van toepassing op de indirecte bezitseis.", "rechtsregel": "Bij uitbreiding van de procentuele gerechtigdheid in een objectieve onderneming (ook door juridische splitsing) begint voor het uitgebreide deel een nieuwe indirecte bezitstermijn te lopen ex art. 35d lid 1 letter c SW; art. 9 lid 2 URSE geldt uitsluitend voor de directe bezitseis.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c lid 1 letter a SW 1956", "art. 35d lid 1 letter c SW 1956", "art. 9 lid 2 URSE"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2026:137", "vindplaatsen": ["BNB 2026/49 m.nt. I.J.F.A. van Vijfeijken", "V-N 2026/7.13", "NTFR 2026/234 m.nt. Y. Saïdi", "NJB 2026/366"]}, {"ecli": "ECLI:NL:GHDHA:2026:114", "instantie": "Gerechtshof Den Haag", "datum": "2026-01-29", "wetsartikelen": ["art. 35c lid 1 sub c SW 1956", "art. 35d lid 1 sub c SW 1956"], "oordeel": "ongegrond", "onderwerp": "BOR-bezitsvereiste bij erfrechtelijke verkrijging aandelenbelang: moeder hield 4", "samenvatting": "BOR-bezitsvereiste bij erfrechtelijke verkrijging aandelenbelang: moeder hield 49% langer dan 5 jaar en verkreeg 51% via erfrecht in 2016; schenking in 2020 valt voor het erfrechtelijk verkregen deel buiten de 5-jaarstermijn. BOR beperkt tot het oorspronkelijk gehouden 49%-belang. Bevestigt restrictieve uitleg van de dubbele bezitseis: voor elk afzonderlijk verkregen onderdeel van het aandelenbelang loopt een eigen bezitstermijn. Essentieel voor estate planning bij overlijden van een medeaandeelhouder gevolgd door een schenking binnen 5 jaar.", "rechtsregel": "Bevestigt restrictieve uitleg van de dubbele bezitseis: voor elk afzonderlijk verkregen onderdeel van het aandelenbelang loopt een eigen bezitstermijn. Essentieel voor estate planning bij overlijden van een medeaandeelhouder gevolgd door een schenking binnen 5 jaar.", "belang": "hoog", "gepubliceerd": "2026-01-29", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHDHA:2026:114", "tags": ["BOR", "Schenkbelasting", "Bedrijfsopvolging"]}, {"ecli": "ECLI:NL:RBNNE:2026:213", "instantie": "Rechtbank Noord-Nederland", "datum": "2026-01-29", "gepubliceerd": "2026-04-09", "zaaknummer": "LEE 25/412", "onderwerp": "Schenking aandelen aan bedrijfsopvolger: loon uit dienstbetrekking?", "samenvatting": "De enig aandeelhouder van een familieconcern leverde op 17 juni 2022 al zijn aandelen (waarde EUR 7.800.000) ten titel van schenking aan eiser, sinds 2007 werkzaam bij het concern en laatstelijk directeur, onder een herroepingsvoorwaarde die aanknoopt bij de bedrijfsopvolgingsregeling van art. 35b en 35e SW 1956 en onder een doorgeefverplichting. De inspecteur merkte de waarde aan als loon uit dienstbetrekking en corrigeerde het box 1-inkomen tot EUR 8.033.836. De rechtbank oordeelt dat de inspecteur de bewijslast niet heeft voldaan: de aandelen behoorden tot het privevermogen van de schenker, de werkgever is niet gecompenseerd, en een enkel causaal verband met de dienstbetrekking maakt het voordeel nog geen loon. De concernregel voor loon van derden wordt niet uitgebreid tot de aandeelhouder-natuurlijk persoon, en van fooien of dergelijke prestaties van derden is evenmin sprake; het beroep is gegrond.", "rechtsregel": "Een schenking van aandelen door een aandeelhouder-natuurlijk persoon aan een werknemer-bedrijfsopvolger vormt geen loon uit dienstbetrekking indien de werkgever het voordeel niet heeft verstrekt en dit niet in opdracht en voor rekening van de werkgever is gekomen; een conditio sine qua non-verband met de dienstbetrekking is daartoe onvoldoende, en de concernregel voor loon van derden strekt zich niet uit tot een natuurlijk persoon-aandeelhouder.", "wetsartikelen": ["art. 10 lid 1 Wet LB 1964", "art. 3.81 Wet IB 2001", "art. 35b SW 1956", "art. 35e SW 1956", "art. 8:29 Awb", "art. 8:42 Awb"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNNE:2026:213"}, {"ecli": "ECLI:NL:RBNHO:2026:2226", "instantie": "Rechtbank Noord-Holland", "datum": "2026-01-28", "gepubliceerd": "2026-03-04", "onderwerp": "Erfbelasting NSW-landgoed: invordering na verkoop/onttrekking percelen", "samenvatting": "Eiser erfde in 2001 aandeel in twee NSW-landgoederen; successierecht grotendeels buiten invordering gesteld. In 2019 werden percelen van een landgoed verkocht c.q. onttrokken aan NSW. In 2022 werd aanslag ter invordering erfbelasting opgelegd. Eiser betwist de grondslag; rechtbank oordeelt dat de aanslag terecht is opgelegd: de verminderingsbeschikking van 2009 had alleen betrekking op het terstond invorderbare deel, niet op de totale aanslaggrondslag.", "rechtsregel": "Een verminderingsbeschikking in de zin van de NSW heeft alleen betrekking op het terstond invorderbare deel van de aanslag; de buiten invordering gestelde erfbelasting blijft als aanslaggrondslag in stand en kan alsnog worden ingevorderd bij schending van de NSW-voorwaarden (art. 8/8a NSW).", "wetsartikelen": ["art. 7 NSW", "art. 8 NSW", "art. 8a NSW", "art. 11 AWR"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNHO:2026:2226"}, {"ecli": "ECLI:NL:RBZWB:2026:313", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2026-01-23", "gepubliceerd": "2026-02-16", "zaaknummer": "BRE 25/702 en 25/703", "onderwerp": "Rechtsmiddelen tegen aanslagen van een overledene; schuldeiser nalatenschap", "samenvatting": "Eiseres kwam op tegen de aan een overledene opgelegde aanslagen IB/PVV en Zvw 2021; de inspecteur verklaarde haar bezwaren niet-ontvankelijk omdat zij geen belanghebbende is. De rechtbank oordeelt dat bij een overledene alleen een erfgenaam of executeur kan worden aangemerkt als degene van wie inkomens- of vermogensbestanddelen in het voorwerp van de belasting zijn begrepen (art. 26a AWR); eiseres is blijkens het testament geen erfgenaam maar heeft slechts een vordering op de nalatenschap. De bezwaren zijn daarom terecht niet-ontvankelijk ver
