      "samenvatting": "Tot de in 2012 verkregen nalatenschap behoorde een woning waarvan de WOZ-waarde op €534.000 was vastgesteld. In latere jaren erkende de BsGW een te hoge waardering, maar de WOZ-beschikking voor het peiljaar 2012 bleef onherroepelijk. De inspecteur verminderde de (eveneens onherroepelijke) aanslag erfbelasting ambtshalve op grond van art. 18a, lid 1, onderdeel b, AWR uitgaande van €350.000. Belanghebbende wenste een verdere verlaging. De rechtbank oordeelt dat voor de erfbelasting wordt aangesloten bij de in rechte vaststaande WOZ-waarde en dat de aanslag alleen verder kan worden verminderd indien de WOZ-beschikking zelf wordt herzien; dat is hier niet gebeurd. Beroep ongegrond.",
      "rechtsregel": "Voor de waardering van een woning in de erfbelasting wordt aangesloten bij de in rechte vaststaande WOZ-waarde van het verkrijgingsjaar; een onherroepelijke aanslag kan op de voet van art. 18a AWR uitsluitend verder worden verminderd indien de onderliggende WOZ-beschikking wordt herzien.",
      "wetsartikelen": [
        "art. 21, lid 5 SW 1956",
        "art. 18a AWR"
      ],
      "belang": "laag",
      "oordeel": "ongegrond",
      "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:5370"
    },
    {

      "gepubliceerd": "2026-06-24",
      "onderwerp": "Integrale proceskostenvergoeding na gegrond bezwaar aanslag erfbelasting",
      "samenvatting": "De inspecteur had een aanslag erfbelasting opgelegd naar een geschatte verkrijging van €1.000.000 en het bezwaar daartegen later gegrond verklaard. In geschil is of belanghebbende recht heeft op een integrale (in plaats van forfaitaire) proceskostenvergoeding wegens onzorgvuldig handelen van de inspecteur en wegens een door de rechtbank vastgestelde schending van art. 8:42 Awb. Het hof oordeelt dat geen sprake is van bijzondere omstandigheden in de zin van art. 2, lid 3, Besluit proceskosten bestuursrecht en bevestigt de uitspraak van de rechtbank; het hoger beroep is ongegrond.",
      "rechtsregel": "Het schatten van een verkrijging en een schending van art. 8:42 Awb leveren op zichzelf geen bijzondere omstandigheid op die een integrale proceskostenvergoeding (art. 2, lid 3, Bpb) rechtvaardigt; daarvoor is verdergaande onzorgvuldigheid (tegen beter weten in handelen) vereist.",

      "belang": "middel",
      "oordeel": "ongegrond",

    },
    {
      "ecli": "ECLI:NL:RBGEL:2024:6970",
      "instantie": "Rechtbank Gelderland",
      "datum": "2024-10-14",
      "gepubliceerd": "2026-06-24",
      "onderwerp": "Leegwaarderatio woning bij quasi-wettelijke verdeling (erfbelasting)",
      "samenvatting": "Erflater benoemde zijn echtgenote voor 1% en zijn drie kinderen ieder voor 33% tot erfgenaam en stelde de wettelijke verdeling buiten toepassing, met een keuze voor een quasi-wettelijke verdeling. Belanghebbende is huurder van de geërfde woning; de inspecteur paste daarom bij haar (anders dan bij de twee andere kinderen) de leegwaarderatio van art. 21, achtste lid, SW niet toe omdat zij als mede-eigenaar/huurder zou verkrijgen. De rechtbank oordeelt dat de uiterste wilsbeschikking inhoudelijk overeenkomt met de wettelijke verdeling, zodat op grond van art. 1, vijfde lid, SW belanghebbende een geldvordering verkrijgt en niet een aandeel in de woning. Het beroep is gegrond; de belaste verkrijging wordt verminderd tot €38.358.",
      "rechtsregel": "Een quasi-wettelijke verdeling die inhoudelijk overeenkomt met de wettelijke verdeling wordt via art. 1, vijfde lid, SW gelijkgesteld; de niet-langstlevende erfgenaam verkrijgt een geldvordering, zodat de uitsluiting van de leegwaarderatio (art. 21, achtste lid, SW) voor de huurder/verkrijger niet aan de orde is.",
      "wetsartikelen": [
        "art. 1 SW 1956",
        "art. 21 SW 1956"
      ],
      "belang": "middel",
      "oordeel": "gegrond",
      "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2024:6970"

    {

      "datum": "2026-04-22",
      "gepubliceerd": "2026-06-18",
      "onderwerp": "Belastingrente erfbelasting; buitenlandse erfgenaam zonder BSN",
      "samenvatting": "Aan een in Nieuw-Zeeland wonende erfgename (belaste verkrijging €602.821) zonder BSN is belastingrente (art. 30g AWR) opgelegd omdat de aangifte erfbelasting na de achtmaandstermijn werd ingediend. De vertraging kwam voort uit de tijd die nodig was om via een woonplaatsverklaring een BSN te verkrijgen; de Belastingdienst had op haar website de indruk gewekt dat aangifte pas met BSN mogelijk was. De rechtbank oordeelt dat het in rekening brengen van belastingrente in strijd is met het zorgvuldigheidsbeginsel en vernietigt de rentebeschikking. Beroep gegrond.",
      "rechtsregel": "Onder bijzondere omstandigheden brengen de abbb (zorgvuldigheidsbeginsel) mee dat geen belastingrente ex art. 30g AWR mag worden geheven wanneer de aangiftevertraging het gevolg is van de door de Belastingdienst gewenste BSN-procedure voor een buitenlandse erfgenaam.",

      "gepubliceerd": "2026-06-09",
      "onderwerp": "Herroeping schenking; eenmalig verhoogde eigenwoningvrijstelling herleeft niet",
      "samenvatting": "Een in 2009 benutte eenmalig verhoogde vrijstelling herleeft niet door herroeping van die schenking in 2017. De herroeping is vervulling van een ontbindende voorwaarde zonder terugwerkende kracht (art. 3:38 lid 2 BW); via art. 82a SW resteert slechts het niet-benutte deel van de eigenwoningvrijstelling. Het goedkeurend beleid mist toepassing omdat de herroeping overwegend fiscaal is gemotiveerd. Bij een schenking vrij van belasting blijft de verkrijger belastingplichtig (art. 36 SW).",

      "samenvatting": "Conclusie A-G in de APV-zaak die leidt tot HR 1 december 2023 (ECLI:NL:HR:2023:1664). Behandelt of de (niet uitgevoerde) statutaire doelstelling en het uitkeringsverbod ex art. 2:285 lid 3 BW aan toepassing van het APV-regime in de weg staan, wie het vermogen heeft ingebracht, en de verhouding tussen het APV-regime en de fiscale-transparantierechtspraak.",

      "samenvatting": "Hoger beroep in de APV-zaak (art. 16 SW / art. 2.14a Wet IB 2001) die uitmondt in HR 1 december 2023 (ECLI:NL:HR:2023:1664). Het vermogen van een stichting met vier verhuurde panden wordt als afgezonderd particulier vermogen aan de erflaatster toegerekend; de stichting is geen SBBI en erflaatster beoogde meer dan bijkomstig een particulier belang. Het afzonderingsbegrip ziet ook op het door de stichting zelf aangekochte pand.",

      "rechtsregel": "Bij een familiestichting zonder reële doelstellingsactiviteiten, met afzondering van vermogen en behoud van zeggenschap en bevoordeling binnen de familiekring, is sprake van afgezonderd particulier vermogen dat aan de erflater wordt toegerekend.",

      "onderwerp": "Erfbelasting: beroep buiten termijn, niet-ontvankelijk",
      "samenvatting": "In Spanje wonende erfgenaam stelde beroep in tegen een aanslag erfbelasting. Het beroepschrift is na afloop van de zeswekentermijn ter post bezorgd en ontvangen. De rechtbank verklaart het beroep niet-ontvankelijk; aan een inhoudelijke beoordeling van de aanslag komt zij niet toe.",

    {

      "samenvatting": "Ouders schonken hun dochter de kwijtschelding van een lening die was verstrekt voor de aanschaf van een eigen woning. De rechtbank oordeelt dat de eenmalig verhoogde vrijstelling eigen woning (art. 33, onder 5, sub c, SW) niet geldt, omdat de lening niet kwalificeert als eigenwoningschuld in de zin van art. 3.119a Wet IB 2001. Het beroep op het vertrouwensbeginsel faalt. Formeel opvallend: het te late beroep is toch ontvankelijk omdat een latere verminderingsbeslissing met rechtsmiddelverwijzing een nieuwe beroepstermijn vermeldde.",
      "rechtsregel": "Kwijtschelding van een lening die niet kwalificeert als eigenwoningschuld (art. 3.119a Wet IB 2001) valt niet onder de eenmalig verhoogde schenkingsvrijstelling eigen woning van art. 33, onder 5, sub c, SW 1956.",

    {
      "ecli": "ECLI:NL:RBZWB:2026:4355",
      "instantie": "Rechtbank Zeeland-West-Brabant",

      "gepubliceerd": "2026-05-28",
      "onderwerp": "Erfbelasting: verhoogde kindvrijstelling — 50%-eis levensonderhoud niet aangetoond",
      "samenvatting": "Belanghebbende (erfgenaam van een in Frankrijk wonende moeder) claimde de verhoogde kindvrijstelling voor erfbelasting. De verhoogde vrijstelling vereist dat de erflater meer dan 50% heeft bijgedragen aan het levensonderhoud van de verkrijger. De rechtbank oordeelde dat belanghebbende dit niet aannemelijk had gemaakt, gelet op de vermogenspositie van de moeder (saldi vanaf €23k t/m €112k) en de ontvangen schenkingen. Het beroep is ongegrond.",
      "rechtsregel": "De verhoogde kindvrijstelling (art. 32 lid 1 sub 4 onder b SW) geldt alleen als de erflater meer dan 50% heeft bijgedragen aan het levensonderhoud van het kind; de bewijslast rust op de verkrijger.",

    {
      "ecli": "ECLI:NL:RBZWB:2026:4356",
      "instantie": "Rechtbank Zeeland-West-Brabant",
      "datum": "2026-05-19",
      "gepubliceerd": "2026-05-28",
      "onderwerp": "Erfbelasting: buitensporige last, beneficiaire aanvaarding en art. 1 EP EVRM",
      "samenvatting": "Belanghebbende (dochter) ontving bloot eigendom na overlijden moeder (vader heeft vruchtgebruik via oud testament). Zij aanvaardde beneficiair maar stelde dat de erfbelasting een buitensporige last vormde ex art. 1 EP EVRM, nu zij geen middelen had en de vader de erfbelasting weigerde te betalen. De rechtbank oordeelt dat beneficiaire aanvaarding niet afdoet aan de verschuldigdheid van erfbelasting over de bloot eigendomsverkrijging; de situatie met de vader (vruchtgebruiker die zijn deel niet betaalt) is een civielrechtelijke kwestie. Het beroep is slechts gegrond voor de proceskosten in de bezwaarfase.",
      "rechtsregel": "Beneficiaire aanvaarding van een nalatenschap ontslaat de erfgenaam niet van de verplichting erfbelasting te betalen over zijn verkrijging; het feit dat de vruchtgebruiker zijn aandeel in de erfbelasting niet voldoet, is een civielrechtelijke kwestie die de fiscale verschuldigdheid onverlet laat.",

    {

      "gepubliceerd": "2026-05-28",
      "onderwerp": "Schenkbelasting: heffingsbevoegdheid na onjuiste tenaamstelling, beroep op dwaling",
      "samenvatting": "Na drie aanslagen schenkbelasting met onjuiste tenaamstelling legde de inspecteur — na herhaalde pogingen — een correcte aanslag op. Het hof oordeelt dat de heffingsbevoegdheid nog niet was uitgeput: de eerdere aanslagen met onjuiste tenaamstelling waren ongeldig en doorbrekten de verjaringstermijn niet voor de correcte aanslag. Een beroep op dwaling bij de aan de schenking ten grondslag liggende akte van rectificatie — opgemaakt na overlijden van beide partijen — werd verworpen. Het hoger beroep (bekrachtiging van ECLI:NL:RBZWB:2024:342) is ongegrond.",
      "rechtsregel": "Herhaalde onjuiste tenaamstelling door een systeemfout doorbreekt de heffingsbevoegdheid niet; de inspecteur die consequent corrigeert en uiteindelijk een penaanslag op naam stelt, handelt niet ernstig onzorgvuldig en de heffingsbevoegdheid is niet uitgeput.",

        "art. 66a SW 1956"
      ],

      "oordeel": "ongegrond",
      "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2026:1241"
    },
    {

      "instantie": "Rechtbank Noord-Holland",
      "datum": "2026-03-19",
      "gepubliceerd": "2026-05-28",
      "onderwerp": "APV: kwalificatie Stiftung als afgezonderd particulier vermogen, omkering bewijslast",
      "samenvatting": "In geschil is of een buitenlandse Stiftung (fonds) kwalificeert als Afgezonderd Particulier Vermogen (APV) in de zin van art. 2.14a Wet IB 2001. De inspecteur stelde dat het vermogen aan de erflater moest worden toegerekend en legde IB/PVV-aanslagen op. De rechtbank (meervoudige kamer) oordeelt dat sprake is van een APV en past partiële omkering en verzwaring van de bewijslast toe wegens gebrekkige informatieverstrekking. De beroepen zijn gegrond, maar op basis van de omgekeerde bewijslast. Dit arrest is relevant voor de SW omdat APV-kwalificatie ook doorwerkt in de erfbelastingsfeer (art. 16 SW).",
      "rechtsregel": "Een buitenlandse Stiftung zonder aandelen en met afgezonderd vermogen kwalificeert als APV ex art. 2.14a Wet IB 2001; partiële omkering van de bewijslast is mogelijk als de belastingplichtige niet voldoet aan zijn informatieverplichtingen.",

    {
      "ecli": "ECLI:NL:RBZWB:2024:342",
      "instantie": "Rechtbank Zeeland-West-Brabant",
      "datum": "2024-01-24",
      "gepubliceerd": "2026-05-28",
      "onderwerp": "Schenkbelasting: leegwaarderatio, verrekening erfdeel, menselijke maat",
      "samenvatting": "Moeder schonk haar appartement aan haar zoon. De inspecteur legde een aanslag schenkbelasting op zonder toepassing van de leegwaarderatio. Belanghebbende betoogde dat de leegwaarderatio van toepassing was, dat het vaderlijk erfdeel verrekend moest worden, en deed een beroep op de 'menselijke maat'. De rechtbank verwierp alle gronden: de leegwaarderatio geldt niet bij schenkingen van woningen, verrekening van een civielrechtelijk erfdeel is geen fiscale aftrekpost, en de menselijke maat biedt geen zelfstandige grond voor vermindering. Dit vonnis is in hoger beroep bekrachtigd door ECLI:NL:GHSHE:2026:1241.",
      "rechtsregel": "De leegwaarderatio (art. 17a Uitv.reg. IB) is niet van toepassing bij de waardebepaling van een schenking van een woning; verrekening van een vaderlijk erfdeel met de verschuldigde schenkbelasting is fiscaal niet mogelijk.",

    {

      "instantie": "Rechtbank Noord-Holland",

      "gepubliceerd": "2026-05-20",
      "onderwerp": "APV/trust VS: BvdB-voorkoming ondanks belastingverdrag",
      "samenvatting": "Mevrouw X is gerechtigd tot een discretionaire trust (opgericht bij testament) die in de VS niet-fiscaal-transparant is en in Nederland als afgezonderd particulier vermogen (APV) ex art. 2.14a Wet IB 2001 wordt toegerekend. Het belastingverdrag VS-NL biedt geen bescherming tegen de economisch dubbele heffing. De Rechtbank oordeelt dat art. 25b BvdB (voorkoming dubbele belasting) wél van toepassing is, ook al bestaat er een belastingverdrag, omdat dit verdrag geen effectieve voorkoming biedt voor de APV-heffing.",

      "onderwerp": "Schenkbelasting: vrijstelling art. 33/12° SW – schenking door zoons aan vriendin erflater",
      "samenvatting": "Twee zoons schonken na het overlijden van hun vader elk € 250.000 aan de LAT-relatie van de vader (anderhalf jaar samen, niet samenwonend, niet opgenomen in testament). In een vaststellingsovereenkomst erkenden zoons een 'dringende morele verplichting'. Zij claimden de vrijstelling ex art. 33 aanhef en onder 12° SW (voldoening aan een natuurlijke verbintenis ex art. 6:3 BW). Hof bevestigt oordeel rechtbank: niet aannemelijk dat erflater nakoming door zoons verlangde; de zoons ervoeren zelf ook geen dringende morele verplichting naar objectieve maatstaven. Vaststellingsovereenkomst en subjectieve kwalificatie als 'morele verplichting' zijn onvoldoende om vrijstelling te claimen.",
      "rechtsregel": "De vrijstelling ex art. 33 aanhef en onder 12° SW vereist dat de zoons zelf naar objectieve maatstaven een dringende morele verplichting (art. 6:3 BW) jegens de begiftigde ervaren; een natuurlijke verbintenis van de erflater vererft niet automatisch, en een vaststellingsovereenkomst met subjectieve kwalificatie volstaat niet.",

      "samenvatting": "Belanghebbende verkreeg bij legaat een onverdeeld aandeel in cultuurgrond (gebruik en genot ingebracht in de melkveehouderij-VOF van erflater) en in spaartegoeden/beleggingen. De rechtbank oordeelt dat deze vermogensbestanddelen op het moment van verkrijging geen (gedeelte van een) onderneming vormen in de zin van art. 35c lid 1 onder a SW; latere inbreng in de VOF waartoe belanghebbende toetrad maakt dat niet anders. Art. 3.62 Wet IB 2001 werkt niet door naar de BOR. Bij waardering van de grond (art. 21 lid 1 SW) maakt omzetbelasting deel uit van de waarde in het economische verkeer; aftrekbaarheid bij de koper is een persoonlijke omstandigheid.",

      "samenvatting": "Vader schonk in 2020 alle aandelen in zijn BV (portefeuille van enkele historische kamerverhuurpanden, in 2000 geruisloos ingebracht) aan zijn zoon; belaste verkrijging € 2.011.499. De rechtbank oordeelt dat niet aannemelijk is gemaakt dat de BV ten tijde van de schenking een onderneming dreef in de zin van art. 3.2 Wet IB 2001: het rendement-plus-criterium is niet vervuld, zodat arbeid-plus geen behandeling meer behoeft. Het subsidiaire beroep op onderdeel 5 van de interne Praktijkhandreiking bedrijfsopvolging vastgoedexploitanten (1 juni 2016) faalt: die handreiking is weliswaar bindend beleid dat niet door latere wetgeving of jurisprudentie opzij wordt gezet, maar eist dat de activiteiten sinds de geruisloze inbreng ongewijzigd zijn — en dat heeft belanghebbende tegenover de gemotiveerde betwisting niet onderbouwd.",

      "zaaknummer": "BRE 24/5750",
      "onderwerp": "Waardering schenking met onzekere waarde (4 parallelzaken) — waarde achteraf beslissend",
      "samenvatting": "Vader schonk in 2020 bij notariële akte aan vier begiftigden (elk 1/4) zijn vordering op een beleggingsclub en de economische eigendom van zijn vordering op de Staat wegens de in 2013 onteigende SNS-obligaties. Aangifte werd gedaan naar een waarde van nihil, omdat de schadeloosstelling toen nog volstrekt onzeker was. Pas in 2023 werd de schadeloosstelling definitief (Ondernemingskamer 11-2-2021, bekrachtigd HR 21-4-2023) en ontving elke begiftigde € 76.912. De rechtbank oordeelt dat de schenking in 2020 is voltooid (geen opschortende voorwaarde; alleen de wáárde was onzeker) en dat voor de waardering moet worden aangesloten bij de achteraf definitief vastgestelde waarde, inclusief de tot de schenkingsdatum aangegroeide rente. Het beroep is gegrond: de aanslag wordt verminderd tot € 20.358 over een schenking van € 70.069. Identieke parallelzaken (zelfde schenking, per begiftigde één zaak): ECLI:NL:RBZWB:2026:7175, 7176 en 7177.",

  },
  "samengevoegde_eclis": {
    "ECLI:NL:RBZWB:2026:7175": "ECLI:NL:RBZWB:2026:7173",
    "ECLI:NL:RBZWB:2026:7176": "ECLI:NL:RBZWB:2026:7173",
    "ECLI:NL:RBZWB:2026:7177": "ECLI:NL:RBZWB:2026:7173",
    "ECLI:NL:GHARL:2026:5190": "ECLI:NL:GHARL:2026:5189",
    "ECLI:NL:GHARL:2026:5191": "ECLI:NL:GHARL:2026:5189"
  }
};

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const scan = UITSPRAKEN_DATA.dagelijkse_scan || {};
document.getElementById('s-datum').textContent = scan.datum || '-';
document.getElementById('s-gev').textContent = scan.gevonden ?? 0;
document.getElementById('s-rel').textContent = scan.relevant ?? 0;
document.getElementById('s-sig').textContent = scan.significant ?? 0;
document.getElementById('s-tot').textContent = (UITSPRAKEN_DATA.uitspraken||[]).length;
document.getElementById('s-note').textContent = scan.toelichting || '';

const rows = (UITSPRAKEN_DATA.uitspraken||[]).slice().sort((a,b)=>String(b.datum).localeCompare(String(a.datum)));

function fill(id, vals){
  const sel = document.getElementById(id);
  [...new Set(vals.filter(Boolean))].sort().forEach(v=>{
    const o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o);
  });
}
fill('f-inst', rows.map(r=>r.instantie));
fill('f-oordeel', rows.map(r=>r.oordeel));

function card(u){
  const bcls = u.belang==='hoog'?'b-hoog':u.belang==='middel'?'b-middel':'b-laag';
  const sig = u.belang==='hoog' ? '<span class="badge b-sig">Significant</span>' : '';
  const arts = (u.wetsartikelen||[]).map(esc).join(' &middot; ');
  return `<div class="card">
    <h3>${esc(u.onderwerp)}</h3>
    <div class="meta">
      <span>${esc(u.instantie)}</span><span>&bull;</span>
      <span>${esc(u.datum)}</span><span>&bull;</span>
      <span>${esc(u.ecli)}</span>
      ${u.zaaknummer?'<span>&bull;</span><span>'+esc(u.zaaknummer)+'</span>':''}
      <span class="badge ${bcls}">${esc(u.belang)}</span>
      <span class="badge ${bcls}">${esc(u.oordeel)}</span>
      ${sig}
    </div>
    <p class="sum">${esc(u.samenvatting)}</p>
    ${arts?`<div class="arts">${arts}</div>`:''}
    <div class="actions">
      <button class="toggle" type="button">Praktijkbelang &amp; rechtsregel</button>
      <a class="ext" href="${esc(u.url)}" target="_blank" rel="noopener">Open op rechtspraak.nl &rarr;</a>
    </div>
    <div class="rr"><b>Rechtsregel</b>${esc(u.rechtsregel)}</div>
  </div>`;
}

function render(){
  const fi=document.getElementById('f-inst').value,
        fb=document.getElementById('f-belang').value,
        fo=document.getElementById('f-oordeel').value,
        q=document.getElementById('f-q').value.toLowerCase().trim();
  const out = rows.filter(u=>{
    if(fi && u.instantie!==fi) return false;
    if(fb && u.belang!==fb) return false;
    if(fo && u.oordeel!==fo) return false;
    if(q){
      const hay=[u.ecli,u.onderwerp,u.samenvatting,u.rechtsregel,u.instantie,u.zaaknummer,(u.wetsartikelen||[]).join(' ')].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  document.getElementById('count').textContent = out.length+' van '+rows.length+' uitspraken';
  document.getElementById('list').innerHTML = out.length? out.map(card).join('') : '<div class="empty">Geen uitspraken gevonden met deze filters.</div>';
}

document.getElementById('list').addEventListener('click', e=>{
  if(e.target.classList.contains('toggle')){
    e.target.parentElement.parentElement.querySelector('.rr').classList.toggle('open');
  }
});
['f-inst','f-belang','f-oordeel','f-q'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
});
render();
</script>
</body>
</html>
