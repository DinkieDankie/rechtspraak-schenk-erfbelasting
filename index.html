      "zaaknummer": "BK-18/00925",
      "onderwerp": "Partner van kind van Stifter is geen erfgenaam en geen begunstigde van APV",
      "samenvatting": "Aan belanghebbende, fiscaal partner van een dochter van de Stifter van dezelfde Liechtensteinse Stiftung, is voor 2013 een belastbaar inkomen uit sparen en beleggen van € 60.000 toegerekend uit hoofde van het APV. Het Hof bevestigt dat de Stiftung een APV is, maar oordeelt dat belanghebbende geen erfgenaam van de Stifter is zodat art. 2.14a Wet IB 2001 bij hem reeds daarom geen vermogen doet opkomen; bovendien behoort hij blijkens de Beistatuten uitdrukkelijk niet tot het Begunstigtenkreis (de Ehegatten van de kinderen zijn uitgesloten), zodat hij geen begunstigde is en dat ook niet kan worden en het tegenbewijs van het zesde lid is geleverd. Nu de partners op grond van art. 2.17, lid 4, Wet IB 2001 hun onderlinge verhouding hebben gewijzigd en geen APV-vermogen aan belanghebbende hebben toegerekend, en de TBS-vordering geen tussen partners verdeelbaar inkomensbestanddeel is, wordt het belastbaar inkomen uit sparen en beleggen op nihil gesteld.",
      "rechtsregel": "Toerekening van APV-vermogen op grond van art. 2.14a Wet IB 2001 vindt niet plaats bij iemand die geen erfgenaam is van degene die het vermogen heeft afgezonderd en die blijkens de statutaire begunstigdenkring geen begunstigde is en dat ook niet kan worden; een uit het APV voortvloeiende TBS-vordering behoort niet tot de tussen fiscale partners verdeelbare inkomensbestanddelen.",

    {

      "zaaknummer": "BK-18/00920 tm BK-18/00924",
      "onderwerp": "Liechtensteinse Stiftung als APV; begunstigde; geen strijd met art. 1 EP EVRM",
      "samenvatting": "De in 2007 naar Liechtensteins recht opgerichte Stiftung waarin de in 1996 naar Zwitserland geëmigreerde vader zijn aandelen, een effectenportefeuille en een bankrekening afzonderde, is een APV: het vermogen dient met de verzorging van echtgenote, kinderen en kleinkinderen een meer dan bijkomstig particulier belang en het bestuur beslist discretionair over uitkeringen. Belanghebbende, zoon van de Stifter en behorend tot het Begunstigtenkreis, is uitsluitend begunstigde zonder juridisch afdwingbaar recht, zodat de tegenbewijsregeling van art. 2.14a, lid 6, Wet IB 2001 niet slaagt en hem als erfgenaam een vierde van het stichtingsvermogen wordt toegerekend. Het Hof verwerpt de klachten dat de APV-regeling in strijd is met de vrijheid van vestiging en van kapitaalverkeer en met art. 1 EP EVRM op regel- en individueel niveau; van een individuele en buitensporige last is geen sprake. Voor 2013 is de vereiste aangifte niet gedaan omdat het toegerekende vermogen niet is aangegeven; het vermogen wordt redelijkerwijs op € 7.291.019 geschat en het beroep op interne compensatie (TBS-vordering tegen 6% rente) slaagt.",
      "rechtsregel": "Een discretionaire buitenlandse Stiftung waarin met een meer dan bijkomstig particulier belang vermogen is afgezonderd is een APV, en een tot de begunstigdenkring behorende erfgenaam zonder juridisch afdwingbaar recht op uitkeringen kan zich niet op de tegenbewijsregeling van art. 2.14a, lid 6, Wet IB 2001 beroepen.",

    {

      "instantie": "Rechtbank Noord-Nederland",

      "gepubliceerd": "2026-05-13",
      "zaaknummer": "AWB - 17 _ 4232",
      "onderwerp": "Box 3: toegeëigend nalatenschapssaldo en corresponderende schuld aan erfgenamen",
      "samenvatting": "Eiser heeft zich na het overlijden van zijn oom in 2008 het saldo van diens Zwitserse bankrekening toegeëigend door dat op een eigen UBS-rekening te plaatsen; in 2014 bleek uit het testament dat niet hij maar drie ANBI's enig erfgenaam waren. In geschil is of het saldo van € 549.734 per 1 januari 2015 tot zijn box 3-bezittingen behoort. De rechtbank oordeelt dat eiser gelet op de tenaamstelling als rechthebbende en bezitter geldt, zodat het saldo terecht op grond van art. 5.3, lid 2, onderdeel e, Wet IB 2001 tot zijn bezittingen is gerekend, maar dat daartegenover een in rechte opeisbare schuld aan de erfgenamen staat: op grond van art. 4:182 BW volgden de erfgenamen de erflater van rechtswege op, en de toeëigening levert een vordering op (art. 4:483 BW dan wel art. 6:162 BW), waaraan onbekendheid van de erfgenamen met de rekening niet afdoet. De schuld wordt op nominale waarde gewaardeerd nu eiser niet insolvabel was, zodat per saldo geen belastbaar voordeel uit sparen en beleggen resteert.",

      "instantie": "Gerechtshof 's-Hertogenbosch",
      "datum": "2017-02-10",
      "gepubliceerd": "2026-02-24",
      "zaaknummer": "16/00245",
      "onderwerp": "Inzageverzoek erfbelastingdossier: geen voor bezwaar vatbare beschikking",
      "samenvatting": "Belanghebbende is bij testament als legataris aangewezen en heeft ter zake van het overlijden in 2010 een aanslag erfbelasting van EUR 3.304 (belaste verkrijging EUR 33.046) voldaan zonder daartegen bezwaar te maken. Zij verzocht de inspecteur in 2014 om inzage in de dossiers inzake de aangiften erfbelasting; de inspecteur wees dat af en merkte de afwijzing aan als niet voor bezwaar vatbaar. Het hof oordeelt dat de afwijzing van het inzageverzoek geen belastingaanslag en geen voor bezwaar vatbare beschikking is als bedoeld in artikel 26, lid 1, AWR, zodat de rechtbank terecht heeft geoordeeld dat de inspecteur het bezwaar niet-ontvankelijk had moeten verklaren. Aan de vraag of het inzageverzoek terecht is afgewezen komt het hof daarom niet toe.",
      "rechtsregel": "De beslissing van de inspecteur op een verzoek om inzage in de voor de belastingheffing van belang zijnde stukken is geen belastingaanslag en geen voor bezwaar vatbare beschikking in de zin van artikel 26, lid 1, AWR, zodat daartegen geen bezwaar en beroep openstaat.",

        "art. 7:1 Awb",

      ],

    {
      "ecli": "ECLI:NL:HR:2016:354",

      "zaaknummer": "14/05821",
      "onderwerp": "Intrekking ANBI-status met terugwerkende kracht; vertrouwensbeginsel",
      "samenvatting": "Een in 2005 opgerichte oldtimermuseumstichting was bij brief van 9 februari 2006 en bij beschikking van 7 december 2007 als ANBI aangemerkt; na een boekenonderzoek trok de Inspecteur die status bij beschikking van 21 november 2011 in met terugwerkende kracht tot 1 januari 2008, met als gevolg een aanslag recht van successie over een verkrijging van € 2.381.671 (bedrag ontleend aan de conclusie ECLI:NL:PHR:2015:2204 en aan ECLI:NL:RBDHA:2013:7035). In geschil was of het vertrouwensbeginsel aan die terugwerkende kracht in de weg stond. De Hoge Raad oordeelt dat art. 6.33, lid 3, Wet IB 2001 (oud) de inspecteur uitdrukkelijk toestaat een instelling niet meer als ANBI aan te merken vanaf een tijdstip vóór de intrekkingsbeschikking, tenzij algemene beginselen van behoorlijk bestuur zich daartegen verzetten, dat aan een op een ingevuld standaardaanvraagformulier gebaseerde ANBI-beschikking geen gerechtvaardigd vertrouwen van een weloverwogen standpuntbepaling kan worden ontleend, en dat noch de wettekst noch de wetsgeschiedenis de eis stelt dat de instelling kwade trouw kan worden verweten. Het oordeel dat de feitelijke werkzaamheden niet voor ten minste 50 percent het algemeen belang dienden blijft in stand; de zaak wordt verwezen naar Hof Amsterdam voor het beroep op het gelijkheidsbeginsel.",
      "rechtsregel": "Een ANBI-beschikking kan met terugwerkende kracht worden ingetrokken zonder dat kwade trouw van de instelling is vereist, en aan een beschikking die uitsluitend berust op een ingevuld standaardaanvraagformulier kan de instelling geen in rechte te beschermen vertrouwen op een weloverwogen standpuntbepaling ontlenen.",
      "wetsartikelen": [

    {

      "instantie": "Parket bij de Hoge Raad",

      "gepubliceerd": "2026-07-24",
      "zaaknummer": "14/05821",
      "onderwerp": "Conclusie A-G: terugwerkende intrekking ANBI-status en vertrouwensbeginsel",
      "samenvatting": "A-G Niessen concludeert in de zaak van de oldtimermuseumstichting waarvan de ANBI-status per 1 januari 2008 met terugwerkende kracht is ingetrokken, met als gevolg een aanslag recht van successie over de in 2008 verkregen nalatenschap van € 2.381.671. Nu vaststaat dat niet aan de materiële ANBI-vereisten is voldaan, heeft de instelling nooit recht gehad op de status en kon de beschikking in beginsel met terugwerkende kracht worden ingetrokken; omdat de beschikking berustte op door belanghebbende zelf onjuist verstrekte informatie (alle vragen op het aanvraagformulier waren bevestigend beantwoord) faalt het beroep op het vertrouwensbeginsel, ongeacht of die onjuiste informatie met opzet is verstrekt. De A-G acht de eis van kwade trouw die het Hof stelde onjuist en merkt op dat kwade trouw wel van belang is voor de schenker die giftenaftrek claimt. Zowel het principale als het incidentele beroep zijn volgens de A-G gegrond; verwijzing is nodig voor de beoordeling van het gelijkheidsbeginsel.",
      "rechtsregel": "Berust een ANBI-beschikking op door de instelling zelf verstrekte onjuiste gegevens, dan kan zij daaraan geen gerechtvaardigd vertrouwen ontlenen en staat het vertrouwensbeginsel niet in de weg aan intrekking met terugwerkende kracht, ook zonder kwade trouw.",

      "zaaknummer": "AWB - 14 _ 8132",
      "onderwerp": "Partnerbegrip art. 1a SW: notarieel samenlevingscontract en zesmaandstermijn",
      "samenvatting": "Eiser is enig erfgenaam van zijn in 2013 overleden tweelingbroer met wie hij sinds 19 augustus 2010 op hetzelfde adres stond ingeschreven; hij is aangeslagen naar het tarief van 30% over een belaste verkrijging van EUR 75.260. In geschil is of hij partner is in de zin van art. 1a SW 1956, nu een notarieel samenlevingscontract ontbreekt en de vijfjaarstermijn van het derde lid niet is gehaald. De rechtbank oordeelt dat het Handvest van de grondrechten van de EU niet van toepassing is omdat bij de aanslag erfbelasting geen Unierecht ten uitvoer wordt gebracht, en dat de wetgever binnen zijn ruime beoordelingsmarge is gebleven door het notarieel samenlevingscontract en de zesmaandstermijn te eisen ter voorkoming van misbruik. Dat erflaters korte overlevingstijd na de diagnose het sluiten van een contract onmogelijk maakte, is vanuit de doelstelling van art. 1a SW niet relevant; het beroep is ongegrond.",
      "rechtsregel": "De eisen van art. 1a SW 1956 van een notarieel samenlevingscontract met wederzijdse zorgverplichting en een voorafgaande periode van zes maanden zijn objectieve, ter voorkoming van misbruik gestelde voorwaarden die binnen de ruime beoordelingsvrijheid van de wetgever vallen en niet in strijd zijn met art. 14 EVRM en art. 26 IVBPR.",

      "onderwerp": "Nieuwe aanslag schenkingsrecht na vernietiging wegens gebrekkige tenaamstelling",
      "samenvatting": "In een gebruiksovereenkomst van 5 oktober 1999 over een woonhuis lag een schenking van belanghebbende en zijn echtgenote aan hun zoon besloten; ter zake daarvan was op 5 november 2004 een gezamenlijke aanslag ten name van '[X] en echtgenote' opgelegd, die bij HR 19 februari 2010, ECLI:NL:HR:2010:BL4316, was vernietigd omdat verkrijgingen van meerdere verkrijgers niet in een gezamenlijke aanslag mogen worden betrokken. In geschil was of de Inspecteur in 2011 alsnog afzonderlijke aanslagen mocht opleggen en of de aanvang van de aanslagtermijn van art. 66 SW 1956 (inschrijving van de akte van overlijden) verenigbaar is met art. 26 IVBPR en art. 14 EVRM. De Hoge Raad oordeelt dat met de vernietigde gezamenlijke aanslag nog geen aanslag ter zake van de eigen verkrijging van belanghebbende was opgelegd, zodat van een tweede aanslag over dezelfde verkrijging geen sprake is, en dat art. 66 SW 1956 geen aanknopingspunt biedt voor een aanvang van de termijn op het moment waarop de inspecteur met de schenking bekend wordt; de wetgever is binnen zijn ruime beoordelingsmarge gebleven.",
      "rechtsregel": "Een vernietigde, aan meerdere verkrijgers gezamenlijk opgelegde aanslag schenkingsrecht is geen aanslag ter zake van de individuele verkrijging, zodat de inspecteur daarna binnen de termijn van art. 66 SW 1956 alsnog per verkrijger een aanslag mag opleggen.",

      "onderwerp": "Recht van overgang; partnervrijstelling en vrij verkeer van kapitaal",
      "samenvatting": "Erflater had de Nederlandse nationaliteit maar woonde bij zijn overlijden in 2008 al langer dan tien jaar in Duitsland; zijn echtgenote verkreeg in Nederland gelegen onroerende zaken met een waarde van EUR 648.000 (verkrijging na hypotheekschulden EUR 270.799), waarover EUR 39.144 recht van overgang werd geheven. In geschil was of het onthouden van de partnervrijstelling van artikel 32, eerste lid, ten vierde, onderdeel a, SW 1956 bij het recht van overgang verenigbaar is met het Unierecht. De rechtbank oordeelt onder verwijzing naar HvJ EU 17 oktober 2013, C-181/12 (Welte) dat er geen objectief verschil bestaat dat de zwaardere belasting van de niet-inwonersituatie rechtvaardigt, en dat het door de inspecteur benadrukte verschil tussen het Nederlandse en het Duitse stelsel (koppeling tussen omvang heffingsobject en vrijstelling) niet tot een ander oordeel leidt. Het beroep is gegrond en de aanslag wordt vernietigd omdat de vrijstelling de verkrijging overtreft.",

    {

      "onderwerp": "Erfbelasting; waardering leegstaande woning naar WOZ-waarde art. 21 lid 5 SW",
      "samenvatting": "Erflaatster overleed op 1 november 2010; haar woning had voor 2010 een WOZ-waarde van EUR 395.000 (peildatum 1 januari 2009) maar werd op 17 februari 2011 verkocht voor EUR 348.000, waarna de Inspecteur de aangifte corrigeerde naar de WOZ-waarde. A-G IJzerman concludeert dat art. 21, lid 5, SW 1956 (tekst 2010-2012) ook geldt voor een na het overlijden leegstaande, te koop staande woning, omdat maatgevend is hoe de onroerende zaak tot het overlijden werd gebruikt, en dat deze bijzondere waarderingsregel als lex specialis voorgaat op de hoofdregel van art. 21, lid 1, SW 1956. Het ontbreken van een tegenbewijsregeling levert geen schending op van art. 1 Eerste Protocol EVRM - het gaat om een materiele maatstafbepaling met voldoende processuele waarborgen en een effectief tarief van 9,38 procent vormt geen individuele en buitensporige last - en voor anticiperende toepassing van de latere tegenbewijsregeling bestaat geen grond. De conclusie strekt tot ongegrondverklaring.",
      "rechtsregel": "Voor de erfbelasting geldt het waarderingsvoorschrift van art. 21, lid 5, SW 1956 als lex specialis ook voor een door het overlijden leeggekomen woning, zonder dat een lagere latere verkoopprijs als tegenbewijs kan dienen.",

      "onderwerp": "Successierecht; ontbreken procesbelang na vermindering aanslag tot nihil",
      "samenvatting": "Aan belanghebbende was wegens een verkrijging in 2006 ambtshalve een aanslag successierecht van € 11.807 opgelegd, die de inspecteur bij uitspraak op bezwaar uit coulance tot nihil verminderde. In beroep betwistte belanghebbende de omvang en de verdeling van de nalatenschap. De rechtbank verklaart het beroep niet-ontvankelijk wegens ontbrekend procesbelang: nu de aanslag al nihil bedraagt kan de rechter belanghebbende niet in een gunstiger positie brengen en mag hij de aanslag niet verhogen; voor een reprimande aan de inspecteur ontbreekt een juridische grondslag.",

      "samenvatting": "Belanghebbende bewoonde in 2010 met zijn gezin om niet een woning van zijn ouders, die de volledige beschikkingsmacht behielden en het verblijf op elk moment konden beëindigen; de huurwaarde van € 49.428 was als schenking aangegeven. De rechtbank oordeelt dat weliswaar sprake is van verrijking van belanghebbende, maar niet van de voor een schenking vereiste verarming van de ouders: de waarde in het economische verkeer van de woning wijzigt niet door de gedoogsituatie en de gederfde huur heeft nooit tot hun vermogen behoord (vgl. HR 26 februari 1986, BNB 1986/163, en HR 8 juli 1996, BNB 1996/290). De aanslag wordt verminderd tot een schenking vrij van recht van € 9.802; beroep gegrond.",
      "rechtsregel": "Het van dag tot dag gedogen van bewoning om niet, waarbij de eigenaar de volledige beschikkingsmacht behoudt, leidt niet tot verarming van de eigenaar en vormt daarom geen belastbare schenking in de zin van de Successiewet 1956.",

    {
      "ecli": "ECLI:NL:GHAMS:2013:2717",
      "instantie": "Gerechtshof Amsterdam",
      "datum": "2013-08-29",

      "zaaknummer": "12-00472",
      "onderwerp": "Art. 7 SW: kwijtgescholden koopsom niet opgeofferd; art. 10 SW huurschuld",
      "samenvatting": "Erflaatster verkocht in 2002 haar woning aan haar zoon voor EUR 216.000, schold direct EUR 34.025 kwijt en schold de resterende schuld van EUR 181.975 in de jaren 2002 tot en met 2009 volledig kwijt, terwijl zij de woning terughuurde voor EUR 650 per maand en de huur (met rente EUR 71.400) nooit betaalde. In geschil is of het kwijtgescholden bedrag op grond van artikel 7 SW 1956 in mindering komt op de fictieve verkrijging van artikel 10 SW 1956 en of de onbetaalde huur onder artikel 10 SW 1956 valt. Het Hof oordeelt dat, gelet op het rechtstreekse verband tussen de bedongen koopsom en de van meet af aan voorgenomen en volledig uitgevoerde kwijtscheldingen, niets is opgeofferd, zodat aftrek is uitgesloten. De niet betaalde huur is een vruchtgebruik als bedoeld in artikel 10, lid 2, SW 1956; vrijgevigheid is daarvoor niet vereist.",
      "rechtsregel": "Artikel 7 SW 1956 laat geen aftrek toe voor zover de door de erflater bedongen tegenprestatie door hem is kwijtgescholden en dus niet werkelijk door de verkrijger is opgeofferd; het onbetaald laten van een reele huurschuld levert een genot van vruchtgebruik in de zin van artikel 10 SW 1956 op, ook zonder vrijgevigheid.",

    {
      "ecli": "ECLI:NL:RBDHA:2013:7035",
      "instantie": "Rechtbank Den Haag",
      "datum": "2013-05-21",
      "gepubliceerd": "2026-02-18",
      "zaaknummer": "AWB-12_5986",
      "onderwerp": "ANBI-status oldtimermuseum ingetrokken per 1 januari 2008",
      "samenvatting": "Een in 2005 opgerichte stichting die statutair de exploitatie van een oldtimermuseum beoogt, was per 1 januari 2008 als ANBI aangemerkt; na boekenonderzoek is die status bij beschikking van 21 november 2011 met ingang van 1 januari 2008 ingetrokken, waarna op 15 mei 2012 een aanslag recht van successie is opgelegd over de in 2008 verkregen nalatenschap van € 2.381.671. De rechtbank oordeelt dat bij de ANBI-toets niet alleen op de statutaire doelstelling maar ook op hetgeen de instelling in werkelijkheid nastreeft moet worden gelet, en dat de feitelijke werkzaamheden – een nauwelijks ontsloten collectie die enkele uren per week te bezichtigen was – niet voor ten minste 50 percent het algemeen belang dienen. Omdat de beoordeling van de daadwerkelijke handelwijze een toets achteraf impliceert, kan aan de afgifte van de ANBI-beschikking op zichzelf geen vertrouwen worden ontleend en stond het de inspecteur vrij de beschikking met terugwerkende kracht in te trekken; ook het beroep op uitlatingen van de staatssecretaris en op het gelijkheidsbeginsel (muziekverenigingen) faalt.",
      "rechtsregel": "Of een instelling een ANBI is, wordt beoordeeld aan de hand van zowel de statutaire doelstelling als de feitelijke werkzaamheden, welke toets naar zijn aard achteraf plaatsvindt, zodat aan de afgifte van de ANBI-beschikking op zichzelf geen in rechte te beschermen vertrouwen kan worden ontleend.",

    {
      "ecli": "ECLI:NL:HR:2013:BY8161",
      "instantie": "Hoge Raad",
      "datum": "2013-05-03",
      "gepubliceerd": "2026-02-18",
      "zaaknummer": "12/02197",
      "onderwerp": "Periodieke gift uitgevoerd door erfgenamen; schenkingsrecht als andere gift",
      "samenvatting": "Erflaatster schonk in 2001 bij notariele akte aan een ANBI een recht op periodieke uitkeringen van jaarlijks 16.000 certificaten 'vrij van recht'; na haar overlijden in 2002 voerden de erfgenamen de termijn 2002 pas in 2003 uit en werd in 2003 het schenkingsrecht van EUR 182.417 ten laste van de boedel betaald. De Hoge Raad oordeelt dat waardeverschuiving en vrijgevigheid moeten worden beoordeeld naar het moment waarop de schenkingsovereenkomst tot stand komt, dat de op de erfgenamen overgegane verplichting niet van aard verandert en op een notariele akte blijft berusten, en dat voor de eis van vaste en gelijkmatige uitkeringen bepalend zijn de verplichtingen uit de schenkingsovereenkomst en niet de feitelijk verrichte uitkeringen. De verplichting is in 2002 niet rentedragend geworden in de zin van artikel 6.40, letter d, Wet IB 2001, zodat beide termijnen in 2003 aftrekbaar zijn; het betaalde schenkingsrecht is een andere gift in de zin van artikel 6.35 Wet IB 2001, waardoor de persoonsgebonden aftrek op EUR 90.851 wordt gesteld.",
      "rechtsregel": "Of bij de uitvoering van een schenkingsovereenkomst sprake is van een waardeverschuiving en van vrijgevigheid, en of de uitkeringen vast en gelijkmatig zijn, moet worden beoordeeld naar het moment waarop die overeenkomst tot stand kwam en aan de hand van de daaruit voortvloeiende verplichtingen, ook indien die verplichtingen krachtens erfrecht op de erfgenamen zijn overgegaan.",

      "onderwerp": "Fideicommissaire nadere verkrijging vormt met eerdere verkrijging een geheel",
      "samenvatting": "Belanghebbenden verkregen in 1999 ieder EUR 143.393 uit de nalatenschap van hun vader en in 2007, bij het overlijden van de bezwaarde echtgenote, ieder EUR 123.472 uit hoofde van de fideicommissaire making; de inspecteur berekende het successierecht over de nadere verkrijging naar evenredigheid op EUR 17.848. De Hoge Raad oordeelt dat uit de samenhang van de artikelen 1, 5 en 24 SW 1956 volgt dat onder de belaste verkrijging moet worden verstaan al wat de belastingplichtige uit een nalatenschap verkrijgt verminderd met de toepasselijke vrijstellingen, zodat beide verkrijgingen tezamen het tarief bepalen en vrijstellingen niet nogmaals kunnen worden toegepast. Omdat de SW geen voorschrift bevat om dubbele heffing over het reeds eerder verkregene te vermijden, ligt het mede uit uitvoerbaarheidsoogpunt voor de hand de belasting over de nadere verkrijging evenredig te bepalen, uitgaande van de tarieven en vrijstellingen ten tijde van die nadere verkrijging.",
      "rechtsregel": "De oorspronkelijke verkrijging en de nadere verkrijging door het vrijvallen van fideicommissair vermogen vormen voor de heffing samen een belaste verkrijging uit een nalatenschap, waarbij de belasting over de nadere verkrijging wordt gesteld op het evenredige deel van de belasting die ten tijde van die nadere verkrijging over de totale verkrijging verschuldigd zou zijn.",

      "onderwerp": "Vrijstelling art. 33 lid 1 onder 8 SW bij onvermogen schulden te betalen",
      "samenvatting": "Vader cedeerde een vordering van EUR 50.075 op zijn zoon aan zijn dochter en schonk de zoon vervolgens datzelfde bedrag onder de voorwaarde de schuld aan de zus af te lossen; over 2009 is een aanslag schenkingsrecht van EUR 2.958 opgelegd. In geschil is of de vrijstelling van artikel 33, lid 1, onder 8, SW 1956 van toepassing is. Het Hof leidt uit de wetsgeschiedenis af dat de vrijstelling restrictief moet worden toegepast en slechts ziet op een benarde financiele positie waarin dringend hulp geboden is; dat de schuld opeisbaar was en werd opgeeist volstaat niet, nu niet aannemelijk is dat belanghebbende failliet dreigde te gaan of andere verstrekkende financiele problemen had. Het hoger beroep is ongegrond; het Hof bevestigt de rechtbank met verbetering van gronden, omdat de rechtbank ten onrechte betekenis toekende aan ingetrokken resoluties.",
      "rechtsregel": "De vrijstelling van artikel 33, lid 1, onder 8, SW 1956 vereist dat de begiftigde ten tijde van de schenking in een benarde financiele positie verkeert en dringend behoefte heeft aan middelen om schuldeisers te voldoen; enkel een opeisbare en opgeeiste schuld die hij niet kan betalen is onvoldoende.",

      "samenvatting": "Bij het overlijden van erflater in 1999 verkregen de vijf kinderen ieder rechtstreeks een achtste (EUR 143.393 per kind, belast met f 37.905), terwijl de tweede echtgenote drie achtsten verkreeg onder fideicommis de residuo met de kinderen als verwachters; na haar overlijden in 2007 verkreeg ieder kind nog EUR 123.472 en berekende de Inspecteur de aanslag pro rata (123.472/266.864 x EUR 38.577 = EUR 17.848). A-G IJzerman meent dat sprake is van twee verkrijgingen, maar dat dit niet uitmaakt omdat het successierecht op grond van art. 1, lid 1, onder 1°, en art. 5 SW 1956 wordt geheven over al wat in totaal krachtens erfrecht van de erflater wordt verkregen, zodat de primaire en de nadere verkrijging voor de heffingsgrondslag worden samengevoegd en vrijstellingen en laagste tariefschijven slechts eenmaal kunnen worden benut. Van de denkbare methoden (verrekening, vrijstelling aan de voet, evenredige vrijstelling) acht hij de evenredigheidsmethode juist, mede omdat art. 45, lid 3, SW 1956 materieel bijheffing over de primaire verkrijging mogelijk maakt; de conclusie strekt tot ongegrondverklaring.",

      "samenvatting": "Erflaatster schonk in 2001 bij notariele akte 'vrij van recht' aan een ANBI een recht op periodieke uitkeringen van jaarlijks 16.000 certificaten van aandelen gedurende vijf jaren; na haar overlijden in 2002 voldeden de erfgenamen de termijnen over 2002 en 2003 pas in 2003 en droegen zij tevens het schenkingsrecht van EUR 182.417. In geschil is of belanghebbende naar rato van zijn erfdeel giftenaftrek toekomt en op welk moment en naar welke waarde. A-G Niessen concludeert dat art. 6.38 Wet IB 2001 geen eisen stelt aan de persoon die de uitkeringen doet, zodat de rechtsopvolger de aftrek kan toepassen en het uitblijven van betaling in een jaar het karakter van de periodieke gift niet aantast, dat de termijnen niet 'rentedragend' zijn geworden zodat aftrek in 2003 (terbeschikkingstelling) plaatsvindt naar de waarde op dat moment, maar dat de betaling van het schenkingsrecht als boedelschuld geen andere gift oplevert.",

      "onderwerp": "BOR successierecht; bungalowpark als onderneming; vertrouwensbeginsel",
      "samenvatting": "Tot de nalatenschap van de op 29 januari 2009 overleden erflater behoorden 9.000 certificaten (50%) in een BV die een bungalowpark exploiteert; in geschil zijn de waardering van de certificaten en de toepassing van de bedrijfsopvolgingsfaciliteiten van hoofdstuk IIIA SW 1956. De rechtbank honoreert het beroep op het vertrouwensbeginsel: aan de brief van de inspecteur van 1 april 2010, die uitdrukkelijk zag op de aangifte recht van successie en berustte op het overgelegde taxatierapport, mochten de erfgenamen het vertrouwen ontlenen dat een aankooprisico van 30% in aftrek kwam, ook al miskende die brief mogelijk de liquidatiewaarderegel van art. 21 lid 4 SW 1956. Omdat de BV met eigen personeel alle beheer-, verhuur-, renovatie- en onderhoudswerkzaamheden verricht en de bezettingsgraad hoog is, gaan de werkzaamheden normaal vermogensbeheer te boven en drijft de BV een materiele onderneming, zodat de beroepen gegrond zijn en de belaste verkrijging per erfgenaam op EUR 71.907 wordt gesteld.",
      "rechtsregel": "Van een materiele onderneming in de zin van de bedrijfsopvolgingsfaciliteiten van de Successiewet 1956 is bij verhuur van onroerende zaken sprake indien de daadwerkelijk verrichte arbeid naar aard en omvang normaal vermogensbeheer te boven gaat; aan een concrete, op de aangifte voor het recht van successie betrekking hebbende standpuntbepaling van de bevoegde inspecteur mag de verkrijger vertrouwen ontlenen tenzij de onjuistheid daarvan voor hem kenbaar was.",

      "gepubliceerd": "2026-02-18",

      "onderwerp": "Successierecht: art. 10 SW bij schuldigerkenning; nietige schenkingen",
      "samenvatting": "Erflaatster erkende tussen 1994 en 2001 in totaal f 534.070 (€ 242.350) schuldig aan haar dochter, eenmaal bij notariële akte (1994) en verder bij onderhandse akten, telkens tegen een bij leven niet-opeisbare rente. Het Hof oordeelt dat de bij onderhandse akte gedane schenkingen niet bij leven zijn uitgevoerd en daarom op grond van artikel 7:177 BW zijn vervallen, zodat die bedragen niet als schuld op de verkrijging in mindering komen; het eerder geheven schenkingsrecht is niettemin terecht geheven omdat artikel 1, lid 2, SW 1956 (oude tekst) ook bij uitvoering van een nietige schenking heffing voorschreef, en registratie en heffing wekken geen in rechte te beschermen vertrouwen. Voor de notariële schenking uit 1994 acht het Hof, gelet op de geloofwaardige verklaring ter zitting en de overgelegde bankafschriften, aannemelijk dat erflaatster tot 2005 daadwerkelijk rente heeft betaald, zodat artikel 10 SW 1956 toepassing mist. De aanslag wordt verminderd tot € 11.716 na verrekening van het over de onderhandse schenkingen geheven schenkingsrecht van € 11.545.",
      "rechtsregel": "Een schuldig erkend en geschonken bedrag valt buiten het bereik van artikel 10 SW 1956 indien de erflater over dat bedrag daadwerkelijk jaarlijks rente aan de schuldeiser heeft betaald, ook als het feitelijk vergoede percentage lager is dan het overeengekomen percentage.",

      "onderwerp": "Art. 24 lid 3 SW naast conserverende aanslag BOR; geschonken bedrijfswoning",
      "samenvatting": "Ouders schonken bij akte van 26 september 2007 de bedrijfswoning aan hun zoon bij de bedrijfsoverdracht; op de verkrijging is de vrijstelling van art. 15, eerste lid, letter d, WBR toegepast. De inspecteur stelde de belastbare verkrijging vast op € 927.014 en legde naast een conserverende aanslag (te conserveren waarde € 931.426, belasting € 188.788) een gewone aanslag recht van schenking op van € 10.800, zijnde 6% van de waarde van de bedrijfswoning van € 180.000, met een beroep op art. 24, derde lid, SW als zelfstandige heffingsbepaling. De rechtbank oordeelt dat art. 31a SW meebrengt dat de verschuldigde belasting geheel aan de te conserveren waarde wordt toegerekend, zodat bij gewone aanslag over een grondslag van nihil wordt geheven; art. 24, derde lid, SW bewerkstelligt slechts een minimumbedrag aan belasting en levert geen zelfstandig heffingsrecht op, mede omdat het standpunt van de inspecteur bij herziening op de voet van art. 53b SW tot dubbele heffing zou kunnen leiden zonder wettelijke verminderingsregeling. Beroep gegrond; de gewone aanslag wordt verminderd tot nihil.",

      "zaaknummer": "43393",
      "onderwerp": "Geen schenking bij overname maatschapsaandeel tegen voortzettingswaarde",
      "samenvatting": "Belanghebbende zette het veehouderijbedrijf van de per 31 december 1999 ontbonden maatschap met zijn vader voort met gebruikmaking van een voortzettingsbeding, waarbij is uitgegaan van boekwaarde respectievelijk de waarde in verpachte staat en een melkquotum op nihil, tegen een overnamesom van f 96.602; de inspecteur stelde de schenking vast op f 250.919. De Hoge Raad oordeelt dat het hof ten onrechte aan de hand van het waarderingsvoorschrift van artikel 21 SW 1956 heeft beoordeeld of sprake is van een schenking, nu artikel 1, lid 2, SW destijds voor het schenkingsbegrip naar het Burgerlijk Wetboek verwees. Uit HR 13 februari 2004, NJ 2004/653 volgt dat voor zover waardering op een lagere dan de economische waarde noodzakelijk is om voortgezette bedrijfsuitoefening te verzekeren, in het algemeen sprake is van nakoming van een verplichting en niet van de vereiste bevoordelingsbedoeling; nu de inspecteur die noodzaak niet had weersproken, vernietigt de Hoge Raad de aanslag.",
      "rechtsregel": "Voor zover waardering van een over te nemen ondernemingsvermogen op een lagere dan de economische waarde noodzakelijk is om voortgezette bedrijfsuitoefening te verzekeren, is in het algemeen sprake van nakoming van een uit redelijkheid en billijkheid voortvloeiende verplichting en ontbreekt de voor een schenking vereiste bevoordelingsbedoeling.",

      "onderwerp": "Overname boerenbedrijf tegen agrarische waarde; schenking art. 1 lid 2 SW",
      "samenvatting": "Belanghebbende zette per 31 december 1999 de veehouderijmaatschap met zijn vader voort en nam op grond van het voortzettings- en overnemingsbeding de activa over tegen boekwaarde respectievelijk waarde in verpachte staat (melkquotum op nihil), tegen een overnamesom van f 96.602, onder een meerwaardeclausule van tien jaar; de Inspecteur stelde de schenking vast op f 250.919. A-G Van Ballegooijen betoogt dat art. 21 SW 1956 pas aan de orde komt nadat een schenking in de zin van art. 1, lid 2, SW 1956 is vastgesteld, maar dat het Hof terecht uit het aanmerkelijke verschil tussen overnamesom en waarde in het economische verkeer een materiële bevoordeling heeft afgeleid. Uit HR 13 februari 2004, NJ 2004/653 volgt niet dat een overdracht tegen agrarische waarde die voortvloeit uit redelijkheid en billijkheid tussen deelgenoten een schenking uitsluit; blijkens HR 4 maart 2005, NJ 2005/162 moet het geheel van de maatschapsverhouding worden meegewogen, en de voorwaardelijke meerwaardeclausule heeft geen waardedrukkend effect. De conclusie strekt tot ongegrondverklaring van het eerste middel.",

    {

      "zaaknummer": "07/8586, 07/8588 en 07/8590",
      "onderwerp": "Bedrijfsopvolgingsfaciliteit; financieringsvennootschap als beleggingslichaam",
      "samenvatting": "Tot de nalatenschap van de in 2005 overleden erflater behoorden (certificaten van) aandelen in een BV die haar vastgoedonderneming in de jaren tachtig had overgedragen aan drie vennootschappen van de kinderen en zich sindsdien uitsluitend bezighield met hypothecair gedekte financiering van die vennootschappen (vorderingen € 28.398.995, daarnaast effecten en liquiditeiten). In geschil was of de bedrijfsopvolgingsfaciliteit van art. 35b, tweede lid, onderdeel b, SW 1956 van toepassing was op de verkrijging van € 8.939.158 per erfgenaam. De rechtbank oordeelt dat de feitelijke werkzaamheid bestaat in het beleggen van vermogen of een daarmee overeenkomende werkzaamheid: door de hypothecaire zekerheid en een rendement van circa 4% zijn geen risico's aanvaard die een normale vermogensbeheerder niet zou aanvaarden, en er is geen actieve betrokkenheid bij de gelieerde ondernemingen. Beroepen ongegrond.",

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const scan = UITSPRAKEN_DATA.dagelijkse_scan || {};
document.getElementById('s-datum').textContent = scan.datum || '-';
document.getElementById('s-gev').textContent = scan.gevonden ?? 0;
document.getElementById('s-rel').textContent = scan.relevant ?? 0;
document.getElementById('s-sig').textContent = scan.significant ?? 0;
document.getElementById('s-tot').textContent = (UITSPRAKEN_DATA.uitspraken||[]).length;
document.getElementById('s-note').textContent = scan.toelichting || '';

const rows = (UITSPRAKEN_DATA.uitspraken||[]).slice().sort((a,b)=>String(b.datum).localeCompare(String(a.datum)));

function fill(id, vals){
  const sel = document.getElementById(id);
  [...new Set(vals.filter(Boolean))].sort().forEach(v=>{
    const o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o);
  });
}
fill('f-inst', rows.map(r=>r.instantie));
fill('f-oordeel', rows.map(r=>r.oordeel));

function card(u){
  const bcls = u.belang==='hoog'?'b-hoog':u.belang==='middel'?'b-middel':'b-laag';
  const sig = u.belang==='hoog' ? '<span class="badge b-sig">Significant</span>' : '';
  const arts = (u.wetsartikelen||[]).map(esc).join(' &middot; ');
  return `<div class="card">
    <h3>${esc(u.onderwerp)}</h3>
    <div class="meta">
      <span>${esc(u.instantie)}</span><span>&bull;</span>
      <span>${esc(u.datum)}</span><span>&bull;</span>
      <span>${esc(u.ecli)}</span>
      ${u.zaaknummer?'<span>&bull;</span><span>'+esc(u.zaaknummer)+'</span>':''}
      <span class="badge ${bcls}">${esc(u.belang)}</span>
      <span class="badge ${bcls}">${esc(u.oordeel)}</span>
      ${sig}
    </div>
    <p class="sum">${esc(u.samenvatting)}</p>
    ${arts?`<div class="arts">${arts}</div>`:''}
    <div class="actions">
      <button class="toggle" type="button">Praktijkbelang &amp; rechtsregel</button>
      <a class="ext" href="${esc(u.url)}" target="_blank" rel="noopener">Open op rechtspraak.nl &rarr;</a>
    </div>
    <div class="rr"><b>Rechtsregel</b>${esc(u.rechtsregel)}</div>
  </div>`;
}

function render(){
  const fi=document.getElementById('f-inst').value,
        fb=document.getElementById('f-belang').value,
        fo=document.getElementById('f-oordeel').value,
        q=document.getElementById('f-q').value.toLowerCase().trim();
  const out = rows.filter(u=>{
    if(fi && u.instantie!==fi) return false;
    if(fb && u.belang!==fb) return false;
    if(fo && u.oordeel!==fo) return false;
    if(q){
      const hay=[u.ecli,u.onderwerp,u.samenvatting,u.rechtsregel,u.instantie,u.zaaknummer,(u.wetsartikelen||[]).join(' ')].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  document.getElementById('count').textContent = out.length+' van '+rows.length+' uitspraken';
  document.getElementById('list').innerHTML = out.length? out.map(card).join('') : '<div class="empty">Geen uitspraken gevonden met deze filters.</div>';
}

document.getElementById('list').addEventListener('click', e=>{
  if(e.target.classList.contains('toggle')){
    e.target.parentElement.parentElement.querySelector('.rr').classList.toggle('open');
  }
});
['f-inst','f-belang','f-oordeel','f-q'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
});
render();
</script>
