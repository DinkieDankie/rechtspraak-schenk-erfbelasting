erwantentarief door de trusts verschuldigd en de aanslagen aan de beneficiaries zijn ten onrechte opgelegd; het cassatieberoep van de Staatssecretaris wordt verworpen. Het arrest is gewezen onder de SW zoals die tot 2010 luidde.", "rechtsregel": "Voor de fiscale behandeling van een naar buitenlands recht rechtsgeldig ingestelde trust wordt eerst naar dat recht bepaald welke rechtsgevolgen zij heeft en daarna het Nederlandse belastingrecht daarop toegepast; een irrevocable discretionary trust waarbij niemand een recht met vermogenswaarde verkrijgt, is een doelvermogen dat zelf als verkrijger voor het schenkingsrecht kan gelden - een toerekening die inmiddels is achterhaald door de regeling voor afgezonderd particulier vermogen.", "wetsartikelen": ["art. 13 Haags Trustverdrag 1985", "art. 19 Haags Trustverdrag 1985", "Wet conflictenrecht trusts"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Sinds 1 januari 2010 wordt het in een trust afgezonderde vermogen op grond van de regeling voor afgezonderd particulier vermogen (art. 2.14a Wet IB 2001 en de art. 16 en 17 SW 1956) toegerekend aan de inbrenger en diens erfgenamen, zodat de trust niet langer als zelfstandig verkrijgend doelvermogen wordt belast.", "gerelateerd": ["ECLI:NL:PHR:1996:19", "ECLI:NL:PHR:1998:AA2564"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:1998:BI5819"}, {"ecli": "ECLI:NL:HR:1994:ZC5687", "instantie": "Hoge Raad", "datum": "1994-06-15", "gepubliceerd": "2025-03-22", "zaaknummer": "28840", "onderwerp": "Vrijgevigheid: voldoende dat de verarmde de verrijking heeft gewild", "samenvatting": "Belanghebbende was in 1969 in algehele gemeenschap van goederen gehuwd; bij de scheiding en deling na de echtscheiding in 1989 werd hij met f 20.178.540 overbedeeld, omdat zijn gewezen echtgenote zich van die overbedeling bewust was maar op morele gronden een groot deel van het haar toekomende vermogen niet toegescheiden wenste te krijgen. Het Hof stelde in cassatie onbestreden vast dat het ging om een bewuste bevoordeling, gedaan uit niet-zakelijke oogmerken en anders dan ter voldoening aan een natuurlijke verbintenis, en nam vrijgevigheid aan. De Hoge Raad verwerpt het beroep: niet vereist is dat afzonderlijk feitelijk wordt onderzocht of het bevoordelingsoogmerk het bij de vermogensverschuiving voorop staande motief was; voor het aannemen van vrijgevigheid is voldoende dat degene die verarmd is de verrijking van de andere partij heeft gewild, en het motief - hier een morele overweging - staat daaraan niet in de weg. Het arrest is gewezen onder de SW zoals die tot 2010 luidde (recht van schenking), maar de regel geldt onverkort onder het huidige schenkingsbegrip.", "rechtsregel": "Voor het aannemen van vrijgevigheid is voldoende dat degene die verarmd is de verrijking van de andere partij heeft gewild; een afzonderlijk onderzoek of het bevoordelingsoogmerk het voorop staande motief was, is niet nodig, en een louter moreel motief sluit vrijgevigheid niet uit.", "wetsartikelen": ["art. 1 lid 2 SW 1956"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:1994:51"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:1994:ZC5687"}, {"ecli": "ECLI:NL:HR:1989:ZC4185", "instantie": "Hoge Raad", "datum": "1989-12-20", "gepubliceerd": "2026-02-25", "zaaknummer": "26062", "onderwerp": "Omzetting morele verplichting in afdwingbare uitkering; art. 33 SW-vrijstelling", "samenvatting": "Belanghebbende zette na het overlijden van zijn ex-echtgenote in 1984 haar onderhoudsuitkeringen aan haar in Israel wonende moeder voort en legde die morele verplichting bij akte van 12 juli 1984 vast als een in rechte afdwingbare jaarlijkse toelage van Bfr. 600.000; hem werd ambtshalve een aanslag schenkingsrecht opgelegd naar een verkrijging van f 145.726 met verhoging. De Hoge Raad oordeelt dat het aangaan van een in rechte afdwingbare verplichting tot een periodieke uitkering ter voldoening aan een in rechte niet vorderbare verplichting een schenking is in de zin van artikel 1, lid 2, SW 1956. De vrijstelling van artikel 33, lid 1, onder 12, SW mist toepassing omdat er geen familierechtelijke betrekkingen meer bestonden met de voormalige schoonmoeder en belanghebbende uitsluitend op grond van de goede verstandhouding met zijn voormalige echtgenote aan haar verzoek voldeed, zodat de schoonmoeder de nakoming niet als een haar toekomende prestatie mocht beschouwen.", "rechtsregel": "Van een verplichting uit moraal of fatsoen in de zin van artikel 33, lid 1, onder 12, SW 1956 is slechts sprake indien de omstandigheden van het geval en de verhouding van de betrokken personen nakoming zo dringend maken dat degene jegens wie de verplichting bestaat die nakoming mag beschouwen als een hem toekomende prestatie; ook het omzetten van zo'n verplichting in een afdwingbare is een schenking in de zin van artikel 1, lid 2, SW 1956.", "wetsartikelen": ["art. 1 SW 1956", "art. 33 SW 1956", "art. 46 SW 1956", "art. 47 SW 1956", "art. 51 SW 1956", "art. 9 AWR", "art. 1:396 BW"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:1989:ZC4185"}, {"ecli": "ECLI:NL:PHR:1989:15", "instantie": "Parket bij de Hoge Raad", "datum": "1989-05-03", "gepubliceerd": "2026-01-09", "zaaknummer": "26.062", "onderwerp": "Natuurlijke verbintenis jegens gewezen schoonmoeder; vrijstelling art. 33 SW", "samenvatting": "Na het overlijden van zijn gewezen echtgenote in maart 1984 zette belanghebbende de door haar aan haar moeder betaalde onderhoudsuitkeringen voort en verplichtte hij zich bij akte van 12 juli 1984 tot een jaarlijkse toelage van Bfrs 600.000 aan zijn gewezen schoonmoeder; de inspecteur hief schenkingsrecht en weigerde de vrijstelling voor voldoening aan een verplichting die enkel op moraal of fatsoen berust. A-G Moltmaker zet uiteen dat de omzetting van een natuurlijke verbintenis in een afdwingbare verplichting op grond van art. 1, lid 2, SW 1956 in beginsel een schenking is, en dat het door de Hoge Raad gehanteerde aanspraakcriterium tautologisch is, zodat het uiteindelijk aankomt op waardering van de omstandigheden aan de hand van de maatschappelijke opvattingen. Hij acht - zij het niet zonder aarzeling - het oordeel van het hof dat naar maatschappelijke opvatting na echtscheiding geen natuurlijke verbintenis tot voortzetting van het onderhoud van de gewezen schoonouders bestaat, houdbaar, en concludeert tot verwerping.", "rechtsregel": "Of een morele verplichting zo dringend is dat zij een natuurlijke verbintenis oplevert in de zin van art. 33, lid 1, onder 12°, SW 1956, wordt niet beslist door het (tautologische) aanspraakcriterium maar door waardering van de omstandigheden en verhoudingen aan de hand van de maatschappelijke opvattingen.", "wetsartikelen": ["art. 1 lid 2 SW 1956", "art. 33 lid 1 onder 12° SW 1956", "art. 1400 BW (oud), natuurlijke verbintenis", "art. 1:392 BW", "art. 1:396 BW"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:1989:15"}, {"ecli": "ECLI:NL:HR:1985:AW8326", "instantie": "Hoge Raad", "datum": "1985-03-13", "gepubliceerd": "2025-03-22", "zaaknummer": "22 691", "onderwerp": "Geen schenking: gebruik en bewoning tegen prijsgeven van het huurrecht", "samenvatting": "Belanghebbende verleende haar 70-jarige moeder in 1981 bij notariele akte, uitdrukkelijk ten titel van schenking en om niet, het recht van gebruik en bewoning van het appartementsrecht dat de moeder tot dan toe van haar huurde; na aangifte legde de inspecteur uiteindelijk een navorderingsaanslag in het recht van schenking op naar een verkrijging van f 59.006, uitgaande van de waarde vrij op te leveren van f 110.000. Het Hof stelde vast dat belanghebbende door de transactie niet was verarmd - het appartementsrecht kwam immers vrij van huur - en vernietigde de aanslag. De Hoge Raad verwerpt het beroep van de Staatssecretaris: in de wijze waarop het Hof de waarde na de vestiging heeft berekend ligt besloten dat partijen bij die vestiging de tussen hen bestaande huurovereenkomst hebben beeindigd, zodat belanghebbende het zakelijk recht niet om niet heeft afgestaan en het middel, dat van een andere opvatting uitgaat, faalt. Het arrest is gewezen onder de SW zoals die tot 2010 luidde (recht van schenking).", "rechtsregel": "Wie een zakelijk recht van gebruik en bewoning vestigt terwijl tegelijkertijd het huurrecht van de gebruiker op dezelfde zaak wordt beeindigd, staat dat recht niet om niet af, zodat ondanks de in de akte gekozen titel van schenking geen schenking in de zin van de Successiewet aanwezig is.", "wetsartikelen": ["art. 1 SW 1956", "art. 18 SW 1956", "art. 21 SW 1956", "art. 5 Uitvoeringsbesluit SW 1956", "art. 10 Uitvoeringsbesluit SW 1956", "art. 1703 BW (oud)"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:1985:AW8326"}, {"ecli": "ECLI:NL:HR:1981:AW9635", "instantie": "Hoge Raad", "datum": "1981-05-20", "gepubliceerd": "2025-03-22", "zaaknummer": "20 335", "onderwerp": "Laagrentende lening is schenking van vruchtgebruik; forfaitaire waardering", "samenvatting": "Een vermogende, kinderloze oom leende belanghebbende in 1975 f 200.000 voor twintig jaar tegen 3% rente ter financiering van een woonhuis, terwijl de zakelijke hypotheekrente destijds ruim 9% bedroeg; de inspecteur belastte een bevoordeling van f 124.500 en het Hof waardeerde het voordeel op het gekapitaliseerde verschil tussen 9% en 3% op de voet van art. 21 onder I letter f SW 1956, omdat art. 18 lid 1 SW 1956 naar zijn oordeel alleen op renteloze leningen zag. De Hoge Raad casseert: ook een uit vrijgevigheid voor bepaalde tijd tegen een lagere dan zakelijk verantwoorde rente verstrekte lening is een schenking van een vruchtgebruik in de zin van art. 18 lid 1 SW 1956, zodat de waarde forfaitair moet worden bepaald op het in art. 10 Uitvoeringsbesluit SW 1956 genoemde rentepercentage verminderd met de bedongen rente, berekend over de hoofdsom en gekapitaliseerd volgens de tabel van art. 6 lid 1 van dat besluit. De Hoge Raad doet de zaak zelf af en stelt de bevoordeling op (5% -/- 3%) van f 200.000 over twintig jaar, ofwel f 49.800. Het arrest is gewezen onder de SW zoals die tot 2010 luidde; de waarderingssystematiek leeft voort in art. 21 lid 14 SW 1956 jo. art. 10 Uitvoeringsbesluit SW 1956, thans met een forfait van 6%.", "rechtsregel": "Het uit vrijgevigheid voor bepaalde tijd verstrekken van een renteloze of laagrentende lening is een schenking van een vruchtgebruik, waarvan de waarde forfaitair wordt bepaald op het in art. 10 Uitvoeringsbesluit SW 1956 genoemde rentepercentage verminderd met de bedongen rente, berekend over de hoofdsom en gekapitaliseerd volgens de tabel van dat besluit, en dus niet op het werkelijke verschil met de zakelijke rente.", "wetsartikelen": ["art. 18 lid 1 SW 1956", "art. 21 onder I SW 1956", "art. 21 onder II SW 1956", "art. 33 lid 1 onder 12 SW 1956", "art. 6 lid 1 Uitvoeringsbesluit SW 1956", "art. 10 Uitvoeringsbesluit SW 1956"], "belang": "hoog", "oordeel": "cassatie", "gerelateerd": ["ECLI:NL:PHR:1981:AW9635"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:1981:AW9635"}, {"ecli": "ECLI:NL:PHR:1981:AW9635", "instantie": "Parket bij de Hoge Raad", "datum": "1981-02-23", "gepubliceerd": "2025-03-21", "zaaknummer": "20 335", "onderwerp": "Recht van schenking; laagrentende lening, vruchtgebruik en splitsingsmethode", "samenvatting": "Belanghebbende leende in maart 1975 f 200.000 van een oom tegen 3 procent rente met een vaste looptijd tot 1995, terwijl de marktrente voor hypothecaire leningen 9 procent bedroeg; na het overlijden van de oom in 1976 werd de lening voor f 75.000 afgekocht. De zaak speelt onder de SW zoals die tot 2010 luidde (recht van schenking) en betreft de vraag of ook een laagrentende lening, en niet slechts een renteloze lening, als vruchtgebruik in de zin van art. 18, lid 1, SW 1956 moet worden aangemerkt en aldus op de voet van art. 21, onder II, SW en art. 10 Uitvoeringsbesluit SW moet worden gewaardeerd. A-G Mok verwerpt zowel de opvatting van het Hof (art. 18 niet van toepassing) als de aftrekmethode en bepleit splitsing van de lening in een deel tegen marktrente en een renteloos deel, hier een derde respectievelijk twee derde. De conclusie strekt tot vernietiging en vermindering van de aanslag tot een bevoordeling van f 83.000.", "rechtsregel": "Een lening tegen een lagere dan de marktrente moet voor het recht van schenking worden gesplitst in een gedeelte tegen marktrente en een renteloos gedeelte, waarbij alleen dat renteloze gedeelte als vruchtgebruik in de zin van art. 18, lid 1, SW 1956 (oud) wordt gewaardeerd; deze waarderingssystematiek is door de herziening van de Successiewet per 1 januari 2010 achterhaald.", "wetsartikelen": ["art. 18 lid 1 SW 1956", "art. 21 onder I SW 1956", "art. 21 onder II SW 1956", "art. 10 lid 2 SW 1956", "art. 6 Uitvoeringsbesluit SW 1956", "art. 10 Uitvoeringsbesluit SW 1956"], "belang": "middel", "oordeel": "gegrond", "achterhaald": true, "achterhaald_reden": "De waarderingssystematiek van art. 18 en art. 21, onder II, SW 1956 (oud) en art. 10 Uitvoeringsbesluit SW is bij de herziening van de Successiewet per 1 januari 2010 vervallen, zodat de bepleite splitsingsmethode onder het huidige recht geen toepassing meer vindt.", "gerelateerd": ["ECLI:NL:HR:1981:AW9635"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:1981:AW9635"}, {"ecli": "ECLI:NL:HR:1980:AB8781", "instantie": "Hoge Raad", "datum": "1980-06-04", "gepubliceerd": "2025-11-05", "zaaknummer": "19 058", "onderwerp": "Imputatie weduwepensioen; fictieve premieaftrek en uitleg van de Leidraad", "samenvatting": "Belanghebbende, in algehele gemeenschap van goederen gehuwd, verkreeg bij het overlijden van haar echtgenoot in 1975 een premievrij weduwepensioen met een waarde ten sterfdage van f 385.000; in geschil was welk bedrag daarvan op grond van art. 32 lid 2 SW 1956 in mindering kwam op de echtgenotenvrijstelling van f 250.000. De Hoge Raad oordeelt dat de vermindering van art. 23 onder 1 SW 1956 ook bij premievrij pensioen geldt en de geschatte, geacht door de gemeenschap opgeofferde premies omvat, maar dat de berekening niet mag worden ontleend aan de onder de Successiewet 1859 gevolgde administratieve praktijk: beslissend zijn tekst en strekking van art. 23, zodat de vermindering wordt gesteld op de helft van de geschatte premies die uitsluitend voor het weduwenpensioen verschuldigd zouden zijn geweest. Daarnaast formuleert de Hoge Raad dat algemene, ter kennis van het publiek gekomen uitlatingen van de administratie - hier de Leidraad Successiewet 1956 - moeten worden uitgelegd zoals belastingplichtigen ze naar objectieve beschouwing redelijkerwijs mochten opvatten, en dat bij redelijke twijfel de met de wet strokende uitleg de voorkeur verdient. Omdat het Hof aan die vertrouwensvraag niet is toegekomen, volgt vernietiging en verwijzing naar het Gerechtshof 's-Hertogenbosch. Het arrest ziet op de SW zoals die tot 2010 luidde; de vrijstellingsbedragen en de vormgeving van de pensioenimputatie zijn sindsdien gewijzigd.", "rechtsregel": "De op de verkrijging van een pensioenrecht toe te passen vermindering wegens werkelijk opgeofferde bedragen omvat bij premievrij pensioen de helft van de geschatte premies die uitsluitend voor het weduwenpensioen verschuldigd zouden zijn geweest; algemene gepubliceerde uitlatingen van de fiscus moeten worden uitgelegd zoals belastingplichtigen ze naar objectieve beschouwing redelijkerwijs mochten opvatten, waarbij bij redelijke twijfel de wetsconforme uitleg voorgaat.", "wetsartikelen": ["art. 23 SW 1956", "art. 32 lid 1 onder 4 SW 1956", "art. 32 lid 1 onder 5 SW 1956", "art. 32 lid 2 SW 1956"], "belang": "hoog", "oordeel": "verwijzing", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:1980:AB8781"}, {"ecli": "ECLI:NL:HR:1971:AX5018", "instantie": "Hoge Raad", "datum": "1971-03-17", "gepubliceerd": "2025-03-22", "zaaknummer": "16 473", "onderwerp": "Wijziging huwelijkse voorwaarden is geen schenking; art. 12 SW mist toepassing", "samenvatting": "Erflater en belanghebbende waren op huwelijkse voorwaarden met uitsluiting van iedere gemeenschap gehuwd; bij akte van 26 mei 1967 hieven zij die uitsluiting op, waardoor algehele gemeenschap van goederen ontstond, en erflater overleed op 25 augustus 1967, dus binnen 180 dagen. De inspecteur merkte de daaruit voortvloeiende bevoordeling van de vrijwel onvermogende echtgenote aan als een schenking en betrok haar via de fictie van art. 12 SW 1956 in het recht van successie. De Hoge Raad oordeelt dat art. 12 lid 1 SW 1956 aanknoopt bij het schenkingsbegrip van art. 1 lid 2 SW 1956 en dat een bevoordeling door boedelmenging als gevolg van een wijziging van de huwelijkse voorwaarden daaronder niet valt: door het enkele intreden van de algehele gemeenschap voltrekt zich niet de voor bevoordeling door schenking kenmerkende, op een bepaald ogenblik voltooide eenzijdige waardeverschuiving. Het cassatieberoep van de Staatssecretaris wordt verworpen; of de wijziging tegenover de kinderen een gift in de zin van art. 968 BW (oud) opleverde, kan daarmee in het midden blijven. Het arrest is gewezen onder de SW zoals die tot 2010 luidde, maar de regel is nog steeds het uitgangspunt voor de behandeling van huwelijksvermogensrechtelijke bevoordelingen.", "rechtsregel": "Een bevoordeling van de ene echtgenoot door de andere die het gevolg is van boedelmenging door wijziging van de huwelijkse voorwaarden, is geen schenking in de zin van de Successiewet, omdat zich daarbij geen op een bepaald ogenblik voltooide eenzijdige waardeverschuiving voordoet; de fictie van art. 12 SW 1956 kan daarop dus niet worden toegepast.", "wetsartikelen": ["art. 1 lid 2 SW 1956", "art. 12 SW 1956", "art. 33 lid 1 onder 12 SW 1956", "art. 968 BW (oud)"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:1971:AX5018"}, {"ecli": "ECLI:NL:HR:1968:AX5955", "instantie": "Hoge Raad", "datum": "1968-06-19", "gepubliceerd": "2026-01-09", "zaaknummer": "15 939", "onderwerp": "Fraus legis bij schenking van tijdelijk vruchtgebruik van aandelen", "samenvatting": "Belanghebbende schonk zijn twee kinderen bij notariele akte van 4 februari 1965 het vruchtgebruik over 1965 tot en met 1967 van 70 aandelen; de inspecteur rekende het dividend van f 7.350 op grond van art. 27 lid 2 Wet IB 1964 (schenking van dividendbewijzen) alsnog tot het inkomen van de schenker. De Hoge Raad bevestigt dat de schenking van een zakelijk recht van vruchtgebruik niet op een lijn kan worden gesteld met de schenking van dividendbewijzen, maar aanvaardt dat doel en strekking van art. 27 lid 2 zouden worden miskend indien het vruchtgebruik klaarblijkelijk niet om zijn reele praktische betekenis maar louter ter verijdeling van belastingheffing is geschonken, zoals bij vruchtgebruik tot wederopzegging of van zeer korte duur. Nu belanghebbende onweersproken had gesteld dat zijn inkomen vanaf 1968 door beeindiging van een functie sterk zou dalen, was de driejaarstermijn zakelijk verklaarbaar en faalt het middel; het enkele streven naar belastingbesparing doet daaraan niet af.", "rechtsregel": "De fictie van art. 27 lid 2 Wet IB 1964 kan met een beroep op doel en strekking van de wet worden toegepast op de schenking van een vruchtgebruik van aandelen, maar alleen indien dat vruchtgebruik klaarblijkelijk niet om de reele praktische betekenis van het zakelijke recht is geschonken doch met het oogmerk belastingheffing te verijdelen een vrijwel gelijke rechtstoestand te scheppen.", "wetsartikelen": ["art. 27 lid 1 Wet IB 1964", "art. 27 lid 2 Wet IB 1964"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:1968:AX5955"}, {"ecli": "ECLI:NL:HR:1962:AX7991", "instantie": "Hoge Raad", "datum": "1962-01-03", "gepubliceerd": "2025-03-21", "zaaknummer": "14 621", "onderwerp": "Art. 22 SW: waarderingsfaciliteit ondernemingsvermogen; weduwebeding", "samenvatting": "Erflater was firmant; de vennootschapsakte van 1952 bevatte een weduwebeding op grond waarvan zijn echtgenote na zijn overlijden als commanditair vennoot in de winst zou delen, en een overnemingsbeding op grond waarvan de erfgenamen recht kregen op erflaters kapitaaldeelneming plus zijn winstaandeel over het lopende boekjaar (f 159.507,92); de inspecteur belastte zowel het derdenbeding (f 1.200.000) als dat winstaandeel. Onder de SW zoals die tot 2010 luidde (recht van successie) oordeelt de Hoge Raad dat, nu erflater zonder het beding een aanmerkelijke tegenprestatie van zijn medevennoten voor zichzelf had kunnen bedingen, ten behoeve van de weduwe iets aan zijn vermogen is onttrokken, en dat het beroep op onbelastbaarheid van goodwill faalt: dat de waarde van een recht wordt bepaald door in de toekomst te verwachten (over)winst onttrekt het niet aan het successierecht. De faciliteit van art. 22 SW 1956, bedoeld om aangevers van bedrijfs- of beroepsvermogen tegemoet te komen in praktische waarderingsbezwaren, komt mede toe aan wie een vermogensbestanddeel moet aangeven dat geheel afhankelijk is van de waarde van dat ondernemingsvermogen op het overlijdenstijdstip, maar niet aan de verkrijger van een vordering ten belope van erflaters aandeel in de over het lopende boekjaar behaalde winst. Het beroep wordt verworpen.", "rechtsregel": "De waarderingsfaciliteit van art. 22 SW 1956 (oud) komt mede toe aan de aangever van een vermogensbestanddeel waarvan de waarde geheel afhankelijk is van de waarde van een bedrijfs- of beroepsvermogen op het tijdstip van overlijden, maar niet aan de verkrijger van een vordering ten belope van erflaters aandeel in de winst van het lopende boekjaar; deze faciliteit bestaat inmiddels niet meer.", "wetsartikelen": ["art. 13 SW 1956", "art. 21 SW 1956", "art. 22 SW 1956"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "De in art. 22 SW 1956 (oud) neergelegde waarderingsfaciliteit voor ondernemingsvermogen is vervallen en vervangen door de bedrijfsopvolgingsregeling van de art. 35b e.v. SW 1956.", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:1962:AX7991"}, {"ecli": "ECLI:NL:HR:1960:AY0559", "instantie": "Hoge Raad", "datum": "1960-01-06", "gepubliceerd": "2025-03-22", "zaaknummer": "14 161", "onderwerp": "Art. 22 SW 1956 (oud): balansdatumfaciliteit ook bij vordering op firmant-echtgenoot", "samenvatting": "Deze zaak speelt onder de SW zoals die tot 2010 luidde, toen nog werd geheven het recht van successie; het gaat om de inmiddels vervallen aangiftefaciliteit van art. 22 SW 1956 (oorspronkelijke tekst). De echtgenote van een in algehele gemeenschap van goederen gehuwde firmant overleed in 1957; haar erfgenamen gaven het aandeel in de beide firma's aan naar de balanstoestand per 31 december 1956, terwijl de Inspecteur de winst tot de sterfdag bijtelde omdat tot de nalatenschap juridisch slechts een vorderingsrecht op de echtgenoot behoorde. Het Hof volgde de Inspecteur, maar de Hoge Raad oordeelt dat noch de strekking noch de bewoordingen van art. 22 SW 1956 grond geven de faciliteit te beperken tot het geval waarin de bestanddelen van een bedrijfs- of beroepsvermogen zelf op de verkrijgers overgaan; de faciliteit is mede van toepassing wanneer de waarde van het verkregene geheel afhankelijk is van de waarde van die bestanddelen, zoals bij het overlijden van de echtgenote van een in algehele gemeenschap gehuwde vennoot. De Hoge Raad vernietigt en doet zelf af door de aanslagen te verminderen tot verkrijgingen van f 93.572 en f 31.190.", "rechtsregel": "De faciliteit van art. 22 SW 1956 (oude tekst) om bedrijfs- of beroepsvermogen naar de balansdatum aan te geven, geldt niet alleen wanneer de bestanddelen van dat vermogen zelf op de verkrijgers overgaan, maar ook wanneer de waarde van het verkregene geheel afhankelijk is van de waarde van die bestanddelen. Deze rechtsregel is achterhaald doordat de bepaling in de huidige Successiewet niet meer bestaat.", "wetsartikelen": ["art. 21 SW 1956", "art. 22 SW 1956", "art. 175 BW (oud)"], "belang": "middel", "oordeel": "cassatie", "achterhaald": true, "achterhaald_reden": "De in art. 22 SW 1956 (oorspronkelijke tekst) opgenomen faciliteit om ondernemingsvermogen naar de balansdatum aan te geven maakt geen deel meer uit van de huidige Successiewet; ondernemingsvermogen wordt nu gewaardeerd naar het tijdstip van de verkrijging (art. 21 SW 1956) en gefacilieerd via de bedrijfsopvolgingsregeling van art. 35b e.v. SW 1956.", "vindplaatsen": ["BNB 1960/52 met annotatie van Y.D.C. van Duyn"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:1960:AY0559"}, {"ecli": "ECLI:NL:HR:1953:210", "instantie": "Hoge Raad", "datum": "1953-12-30", "gepubliceerd": "2026-02-27", "zaaknummer": "11580", "onderwerp": "Vrijgevigheid; bloot morele verplichting sluit schenking niet uit", "samenvatting": "Een gezin dat van begin 1942 tot eind 1944 bij belanghebbende was ondergedoken en daarvoor f 240 per maand pensiongeld betaalde, stelde hem in 1945 onverplicht f 4.000 ter hand; de inspecteur rekende de daarvoor gekochte polissen tot het eindvermogen voor de vermogensaanwasbelasting. De Raad van Beroep achtte geen vrijgevigheid aanwezig omdat het bedrag een toeslag op de te lage pensionprijs zou zijn. De Hoge Raad oordeelt dat de Raad is uitgegaan van een verkeerde opvatting van het begrip vrijgevigheid van art. 16 lid 2 Wet VAB: aan dat vereiste is voldaan zodra iemand met de bedoeling een ander te bevoordelen buiten enige rechtsplicht of natuurlijke verbintenis om een voordeel om niet uit eigen vermogen doet overgaan. Het motief van voldoening aan een louter morele verplichting sluit vrijgevigheid en daarmee schenking niet uit; de Hoge Raad doet zelf af en vermindert de aanslag tot een belastbare som van f 401.", "rechtsregel": "Van vrijgevigheid is sprake wanneer iemand, met de bedoeling de ander te bevoordelen, buiten enig juridisch verband en zonder natuurlijke verbintenis een voordeel om niet uit het eigen vermogen in dat van een ander doet overgaan; het motief van voldoening aan een bloot morele verplichting sluit vrijgevigheid, en dus schenking, niet uit.", "wetsartikelen": ["art. 16 lid 2 Wet op de vermogensaanwasbelasting", "art. 17 lid 1 sub 2 Wet op de vermogensaanwasbelasting"], "belang": "hoog", "oordeel": "cassatie", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:1953:210"}, {"ecli": "ECLI:NL:HR:1926:78", "instantie": "Hoge Raad", "datum": "1926-05-26", "gepubliceerd": "2025-09-18", "zaaknummer": "112", "onderwerp": "Driedagenarrest: fraus legis bij periodieke uitkering die drie dagen vóór overlijden eindigt", "samenvatting": "Deze zaak speelt onder de Successiewet zoals die vóór de Successiewet 1956 luidde, toen nog werd geheven het recht van successie. De erflater had in 1906 en 1907 f 50.000 geschonken onder voorbehoud van een jaarlijkse uitkering die volgens het beding zou ophouden drie dagen vóór zijn overlijden, kennelijk om de fictiebepaling van art. 11 SW (oud) te ontgaan; de Ontvanger vorderde niettemin recht van successie. De Hoge Raad verwerpt de dragende grond van het Hof — dat de schenker tot zijn dood recht op de uitkering behield — omdat het ging om een verbintenis onder tijdsbepaling die op het moment van overlijden met terugwerkende kracht bleek te zijn geëindigd. Het cassatiemiddel leidt echter niet tot cassatie: nu met het beding geen ander belang en geen andere bedoeling voorzat dan het verijdelen van art. 11 SW en de geschapen rechtstoestand praktisch op één lijn is te stellen met de door de wet belaste toestand, zouden doel en strekking van de wet worden miskend als de in fraudem legis gepleegde handeling niet evenzeer werd getroffen. Dit is het eerste arrest waarin de Hoge Raad fraus legis in het belastingrecht toepaste; de doctrine geldt onverkort onder de huidige Successiewet, ook al is de fictiebepaling van art. 11 SW (oud) inmiddels vervangen door art. 10 SW 1956.", "rechtsregel": "Handelingen die uitsluitend zijn verricht om de werking van een belastingbepaling te verijdelen en die een rechtstoestand scheppen die de door de wet belaste toestand zozeer nabijkomt dat doel en strekking van de wet zouden worden miskend, worden op grond van fraus legis evenzeer door de belasting getroffen als de in de wet voorziene verrichting.", "wetsartikelen": ["art. 1 Successiewet (oud)", "art. 2 Successiewet (oud)", "art. 11 Successiewet (oud)"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:1926:1"], "vindplaatsen": ["NJ 1926, p. 723 met annotatie van P. Scholten"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:1926:78"}], "dagelijkse_scan": {"datum": "2026-10-08", "scanvenster": "2026-10-02 t/m 2026-10-08", "gevonden": 277, "relevant": 5, "significant": 0, "verwerkt_in_kennisbasis": [], "toelichting": "Weekscan 2026-10-09, venster 02-10 t/m 08-10 (277 unieke ECLI's belastingrecht, 2 pagina's). 5 trefwoordtreffers: 3 al bekend (GHAMS:2026:2574 opgenomen; RBZWB:2026:9141 en 9142 reeds uitgesloten, IB art. 4.17c), 2 nieuw uitgesloten na lezing: RBNHO:2026:9184 (overdrachtsbelasting art. 15 WBR, BOR-achtige vrijstelling maar geen SW; parallelzaken HAA 25/4448-4450 mogelijk later gepubliceerd) en RBGEL:2026:7140 (giftenaftrek IB, ANBI-status zelf niet in geschil, grensgeval). Geen nieuwe uitspraken, geen samenvoegingen, kennisbasis ongewijzigd."}, "samengevoegde_eclis": {"ECLI:NL:RBZWB:2026:7175": "ECLI:NL:RBZWB:2026:7173", "ECLI:NL:RBZWB:2026:7176": "ECLI:NL:RBZWB:2026:7173", "ECLI:NL:RBZWB:2026:7177": "ECLI:NL:RBZWB:2026:7173", "ECLI:NL:GHARL:2026:5190": "ECLI:NL:GHARL:2026:5189", "ECLI:NL:GHARL:2026:5191": "ECLI:NL:GHARL:2026:5189", "ECLI:NL:RBZWB:2024:7324": "ECLI:NL:RBZWB:2024:7323", "ECLI:NL:RBZWB:2024:7325": "ECLI:NL:RBZWB:2024:7323", "ECL ssiewet 1956 komt materieel niet aan de orde, de match berust op het woord 'erflater'.", "ECLI:NL:PHR:2014:2572": "Vals-positief: uitsluitend IB/PVV en vermogensbelasting (navordering, EU-kapitaalverkeer); de Successiewet 1956 komt in de tekst niet voor - de match berust op de woorden 'erflater' en 'erven'.", "ECLI:NL:PHR:2015:1477": "Vals-positief: formeel-procesrechtelijke zaak over IB/PVV en vermogensbelasting (verschoningsrecht, geheimhouding); de Successiewet 1956 komt in de tekst niet voor - de match berust op 'erflater' en 'erfgenamen'.", "ECLI:NL:PHR:2019:407": "Zuiver inkomstenbelastingzaak (box 3 en tbs-regeling) van de erven; de Successiewet 1956 komt in de conclusie in het geheel niet aan de orde. Match berust op de termen erflater/erven.", "ECLI:NL:RBDHA:2013:12127": "Formele Awr-zaak over een informatiebeschikking in de inkomstenbelasting; de Successiewet 1956 komt materieel niet aan de orde. Match berust op de termen erflater/erven.", "ECLI:NL:RBDHA:2016:238": "Zuiver IB/PVV-zaak over box 3-toerekening van trustvermogen; de Successiewet 1956 wordt in de uitspraak niet genoemd of toegepast. Match berust op de termen erflater/erven.", "ECLI:NL:RBGEL:2024:8158": "Zuivere IB/PVV-zaak over een verkapte winstuitdeling; de Successiewet 1956 komt materieel niet aan de orde (matcht slechts op 'erflater'/'erfgenamen').", "ECLI:NL:RBZWB:2013:7111": "Navordering vermogensbelasting en IB/PVV van een inmiddels overleden belastingplichtige; de Successiewet 1956 komt materieel niet aan de orde.", "ECLI:NL:RBZWB:2017:5809": "Zuiver IB-geschil (tbs/box 3) van de erven; geen materiele toepassing van de Successiewet 1956.", "ECLI:NL:GHLEE:2007:BA4244": "Gemeentelijke reinigingsrechten; geen schenk- of erfbelasting en geen nalatenschapsprocedure.", "ECLI:NL:RBDHA:2025:13122": "Zuivere overdrachtsbelastingzaak (onderwijsvrijstelling); match uitsluitend via de deelstring 'erfpacht'. De Successiewet 1956 komt er niet in voor.", "ECLI:NL:GHAMS:2026:1492": "Materieel een overdrachtsbelastingzaak (bedrijfsopvolgingsvrijstelling art. 15 lid 1 onderdeel b Wet BRV); art. 35e SW 1956 wordt slechts ter vergelijking genoemd, niet toegepast.", "ECLI:NL:GHDHA:2026:2024": "Zuivere omzetbelastingzaak over de medische vrijstelling; geen enkel raakvlak met de Successiewet 1956.", "ECLI:NL:HR:2008:BD3171": "Afvalstoffenbelasting; geen schenk- of erfbelasting en geen nalatenschap- of schenkingsprocedure.", "ECLI:NL:PHR:2025:904": "Conclusie in een zuivere overdrachtsbelastingzaak (art. 15 lid 1 onderdeel b Wet BRV); de Successiewet 1956 komt er materieel niet in voor.", "ECLI:NL:OGHACMB:2025:73": "Zuivere Sint Maartense inkomstenbelastingzaak (Landsverordening op de inkomstenbelasting) over huuropbrengsten uit een onverdeelde nalatenschap; de Successiewet 1956 komt in het geheel niet aan de orde en de erfgenaam is slechts partij in een andere belastingsoort (beslislijn 3).", "ECLI:NL:GHSHE:2024:824": "Zuivere overdrachtsbelastingzaak over de bedrijfsopvolgingsvrijstelling van art. 15 lid 1 letter b Wet BRV en de doorkijkarresten; de Successiewet 1956 en de BOR van art. 35b e.v. SW komen er materieel niet in voor (vergelijk de eerder uitgesloten ECLI:NL:GHAMS:2026:1492 en ECLI:NL:PHR:2025:904).", "ECLI:NL:GHSHE:2024:3757": "Zuivere Wet WOZ-/OZB-waarderingszaak (woning verkocht in verhuurde staat in een pakketverkoop); de Successiewet 1956 wordt in de uitspraak niet genoemd of toegepast en er is geen nalatenschaps- of schenkingscontext (vals-positief).", "ECLI:NL:GHSHE:2025:284": "Zuivere IB/PVV-zaak over aftrekbare kosten eigen woning bij aankoop van de blote eigendom van erfpachtgrond; de erven zetten de procedure na het overlijden slechts voort. De Successiewet 1956 komt materieel niet aan de orde; de match berust op 'erfpacht' en 'erve' (beslislijn 3 / deelstringmatch).", "ECLI:NL:GHARL:2024:785": "Materieel uitsluitend IB/PVV (navorderingsaanslag periodieke uitkeringen); de Successiewet wordt niet toegepast en er loopt geen schenkbelastingprocedure.", "ECLI:NL:GHARL:2024:2858": "Materieel een overdrachtsbelastingzaak (art. 15, lid 1, letter b, WBR); de toepassing van de BOR in de SW 1956 op dezelfde schenking was niet in geschil.", "ECLI:NL:GHARL:2025:1598": "Zuiver waarderingsgeschil over de giftenaftrek in de inkomstenbelasting; de ANBI- of SBBI-status van de begiftigde en de kwalificatie als periodieke gift waren niet in geschil.", "ECLI:NL:GHARL:2025:3432": "Vals-positief: zuivere IB/PVV-zaak over premieaftrek voor een arbeidsongeschiktheidsverzekering, zonder enige schenkings- of nalatenschapscomponent.", "ECLI:NL:GHDHA:2025:20": "Zuivere IB/PVV-zaak (navordering 2017 over inkomen uit aanmerkelijk belang bij inkoop en schenking van aandelen; nieuw feit, omvang vervreemdingsvoordeel art. 4.19 en 4.22 Wet IB 2001, bewijslast duurzaam overtollige liquide middelen bij de doorschuiffaciliteit van art. 4.17c Wet IB 2001, art. 7:10 lid 4 Awb en immateriele schadevergoeding). De Successiewet 1956 wordt niet toegepast; de BOR wordt alleen genoemd in een geciteerde notulentekst (beslislijn 3).", "ECLI:NL:GHDHA:2025:415": "Vals-positief: zuivere kansspelbelastingzaak (art. 1, 2 en 6 Wet KSB, illegaal aanbieden van weddenschappen op voetbalwedstrijden). De Successiewet 1956 komt in het geheel niet aan de orde; de match berust uitsluitend op de deelstring 'anbi' in het woord 'aanbieden'.", "ECLI:NL:GHDHA:2025:1233": "Giftenaftrek inkomstenbelasting (art. 6.32 e.v. Wet IB 2001) in een verzoek om ambtshalve vermindering: zuiver bewijsgeschil of belanghebbende contante giften van in totaal 6.000 euro aan een vereniging heeft gedaan en of sprake is van een periodieke gift, naast een hoorplichtklacht (art. 7:2 Awb). De ANBI- of SBBI-status is niet in geschil en de Successiewet 1956 wordt niet toegepast (beslislijn 1).", "ECLI:NL:HR:1959:AY0847": "Zuivere inkomstenbelastingzaak (art. 19 en 21 Besluit op de Inkomstenbelasting 1941): het betaalde successierecht behoort niet tot de kosten van verkrijging van krachtens erfrecht verkregen aanmerkelijkbelangaandelen, die worden gesteld op de waarde ten tijde van de verkrijging. De Successiewet wordt niet toegepast; het successierecht komt alleen als betaalde belasting aan de orde en de erfgenaam is slechts partij in een IB-geschil (beslislijn 3). GRENSGEVAL: de rechtsvraag raakt wel de fiscale behandeling van successierecht bij een erfrechtelijke verkrijging, dus desgewenst alsnog op te nemen met belang laag.", "ECLI:NL:HR:2008:BD1104": "Materieel een geschil over de rendementsgrondslag van box 3 (art. 5.3 Wet IB 2001); de Successiewet 1956 wordt niet toegepast, het successierecht komt alleen als feitelijke schuldpost voor.", "ECLI:NL:HR:2008:BD1101": "Materieel een geschil over de rendementsgrondslag van box 3 (art. 5.2 en 5.3 Wet IB 2001); de Successiewet 1956 wordt niet toegepast.", "ECLI:NL:HR:2012:BW9073": "Zuivere vennootschapsbelastingzaak over de Belastingregeling voor het Koninkrijk; de Successiewet 1956 komt materieel niet aan de orde. De match berust op het homonieme artikelnummer 35b (BRK in plaats van SW 1956).", "ECLI:NL:HR:2013:BY8147": "Materieel een geschil over de giftenaftrek in de inkomstenbelasting (art. 6.32 e.v. Wet IB 2001); de ANBI-status van de begiftigde instelling is niet in geschil, zodat de zaak volgens de beslislijn giftenaftrek buiten de database valt.", "ECLI:NL:HR:2018:2200": "Zaak betreft uitsluitend overdrachtsbelasting (art. 4 en 15 WBR); de Successiewet 1956 wordt in het arrest niet genoemd of toegepast en er is geen schenk- of erfbelastingprocedure aan de orde.", "ECLI:NL:PHR:2012:BW9073": "Zuivere vennootschapsbelastingzaak over de plaats van werkelijke leiding onder de BRK; de Successiewet 1956 komt er materieel niet in voor en de zaak matchte kennelijk alleen op het artikelnummer 35b.", "ECLI:NL:PHR:2012:BY8147": "Materieel een geschil over giftenaftrek in de inkomstenbelasting; de ANBI-status is niet in geschil, zodat de kwalificatievraag ontbreekt. Het recht van schenking komt slechts als betaald bedrag aan de orde.", "ECLI:NL:PHR:2024:828": "Zaak betreft uitsluitend vennootschapsbelasting en EU-recht (APV-regime, LGO); de Successiewet 1956 wordt alleen genoemd als titel van de wijzigingswet van 2009 en komt materieel niet aan de orde.", "ECLI:NL:RBGEL:2024:1786": "Zaak betreft materieel uitsluitend de loonbelasting (naheffingsaanslag loonheffingen); de Successiewet 1956 en de schenkbelasting worden niet toegepast of genoemd.", "ECLI:NL:RBGEL:2024:4520": "Materieel uitsluitend inkomstenbelasting (box 3) en woonplaats voor de AWR; de Successiewet 1956 wordt niet toegepast en er is geen schenk- of erfbelastingprocedure.", "ECLI:NL:RBGEL:2024:6858": "Zuivere omzetbelastingzaak over de kinderopvangvrijstelling; de Successiewet 1956 komt er materieel niet in voor (vals-positief).", "ECLI:NL:RBNHO:2025:7160": "Zuiver IB-geschil over giftenaftrek (vrijgevigheid); de ANBI-status van de begiftigde was niet in geschil, zodat er geen kwalificatievraag met doorwerking naar art. 32/33 SW 1956 speelt.", "ECLI:NL:RBZWB:2024:7327": "Materieel een IB/PVV- en boetezaak over toerekening van APV-vermogen (art. 2.14a Wet IB 2001); de Successiewet 1956 wordt niet toegepast en er is geen nalatenschap- of schenkingsprocedure aan de orde.", "ECLI:NL:RBZWB:2025:5522": "Materieel een vennootschapsbelastingzaak over aftrekbaarheid van advieskosten; de Successiewet 1956 wordt niet toegepast en er is geen aanslag schenk- of erfbelasting in geschil.", "ECLI:NL:RBZWB:2025:6448": "Zuiver giftenaftrekgeschil in de inkomstenbelasting over het vijfjaarsvereiste van art. 6.38 Wet IB 2001; de ANBI- of SBBI-status is niet in geschil en de Successiewet 1956 komt materieel niet aan de orde.", "ECLI:NL:HR:2018:2110": "Parallelzaak van ECLI:NL:HR:2018:2200; die hoofdzaak is zelf niet opgenomen (uitgesloten of buiten de selectie gebleven).", "ECLI:NL:HR:2013:BY8105": "Parallelzaak van ECLI:NL:HR:2013:BY8147; die hoofdzaak is zelf niet opgenomen (uitgesloten of buiten de selectie gebleven).", "ECLI:NL:PHR:2012:BY8105": "Parallelzaak van ECLI:NL:PHR:2012:BY8147; die hoofdzaak is zelf niet opgenomen (uitgesloten of buiten de selectie gebleven).", "ECLI:NL:GHARL:2024:2859": "Parallelzaak van ECLI:NL:GHARL:2024:2858; die hoofdzaak is zelf niet opgenomen (uitgesloten of buiten de selectie gebleven).", "ECLI:NL:RBZWB:2026:9141": "IB-zaak: doorschuifregeling art. 4.17c Wet IB 2001 bij schenking BV-aandelen; navorderingsaanslag IB/PVV, materieel geen SW-toepassing", "ECLI:NL:RBZWB:2026:9142": "IB-zaak: doorschuifregeling art. 4.17c Wet IB 2001 bij schenking BV-aandelen (parallel aan 9141); materieel geen SW-toepassing", "ECLI:NL:RBNHO:2026:9184": "Overdrachtsbelasting (art. 15 lid 1 onder b WBR, bedrijfsopvolgingsvrijstelling bij schenking van certificaten); geen SW-toepassing, materieel andere belasting.", "ECLI:NL:RBGEL:2026:7140": "Giftenaftrek IB 2020/2021 (art. 6.32 e.v. Wet IB 2001) voor niet in Nederland gevestigde instellingen: EU-rechtelijke toets op de ANBI-vereiste, ANBI-status van de begiftigden zelf niet in geschil, geen SW-toepassing (beslislijn 1; grensgeval, bevestigt HR 30 januari 2026 voor vrij verkeer van kapitaal)."}, "backfill": {"uitgevoerd": "2026-09-07", "bereik": "2026-01-01 t/m 2026-09-07 (publicatie-/wijzigingsdatum op rechtspraak.nl)", "opgehaald": 7971, "treffers": 168, "al_bekend": 61, "nieuw_hoofdzaken": 93, "opgenomen": 72, "uitgesloten": 21, "toelichting": "Terugwerkende scan over het hele jaar via het modified-bereik, per maand opgehaald met paginering. Van de 168 treffers waren er 61 al bekend; na samenvoegen van 14 parallelzaken bleven 93 nieuwe hoofdzaken over, die alle 93 volledig zijn gelezen en geanalyseerd. 21 zaken zijn na lezing van de volledige tekst uitgesloten (andere belastingsoort, homoniem- of deelstringmatch); die staan met reden in uitgesloten_eclis zodat latere scans ze niet opnieuw beoordelen. Beslislijn van de opdrachtgever: giftenaftrekzaken alleen bij een ANBI-/SBBI-kwalificatievraag; erfrechtelijke en formeelrechtelijke zaken rond een nalatenschap wel opnemen, met belang laag."}, "backfill_2025": {"uitgevoerd": "2026-09-09", "bereik": "2025-01-01 t/m 2025-12-31 (publicatie-/wijzigingsdatum op rechtspraak.nl)", "opgehaald": 58756, "treffers": 1357, "geselecteerd_hoofdzaken": 213, "opgenomen": 185, "uitgesloten": 27, "selectiecriterium": "uitspraakdatum 2024 of later, plus alle Hoge Raad- en Parket-zaken met een hard SW-trefwoord ongeacht jaar", "toelichting": "2025 kende drie bulkmaanden (maart, juli, augustus) met een archiefmigratie, waardoor het volume acht keer zo hoog lag als in 2026. Van de 1.357 treffers zijn er 261 geselecteerd; na samenvoegen van 48 parallelzaken bleven 213 hoofdzaken over, die alle volledig zijn gelezen. De resterende circa 1.100 treffers staan in inventarisatie_2025_rest.md en zijn niet uitgewerkt. Uitspraken waarvan de rechtsregel door de herziening van de Successiewet per 1-1-2010 of latere wetgeving is achterhaald, hebben het veld 'achterhaald' met reden en zijn afgetopt op belang=middel."}};

document.getElementById('s-note').textContent = scan.toelichting || '';

const rows = (UITSPRAKEN_DATA.uitspraken||[]).slice().sort((a,b)=>String(b.datum).localeCompare(String(a.datum)));

function fill(id, vals){
  const sel = document.getElementById(id);
  [...new Set(vals.filter(Boolean))].sort().forEach(v=>{
    const o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o);
  });
}
fill('f-inst', rows.map(r=>r.instantie));
fill('f-oordeel', rows.map(r=>r.oordeel));

function card(u){
  const bcls = u.belang==='hoog'?'b-hoog':u.belang==='middel'?'b-middel':'b-laag';
  const sig = u.belang==='hoog' ? '<span class="badge b-sig">Significant</span>' : '';
  const arts = (u.wetsartikelen||[]).map(esc).join(' &middot; ');
  return `<div class="card">
    <h3>${esc(u.onderwerp)}</h3>
    <div class="meta">
      <span>${esc(u.instantie)}</span><span>&bull;</span>
      <span>${esc(u.datum)}</span><span>&bull;</span>
      <span>${esc(u.ecli)}</span>
      ${u.zaaknummer?'<span>&bull;</span><span>'+esc(u.zaaknummer)+'</span>':''}
      <span class="badge ${bcls}">${esc(u.belang)}</span>
      <span class="badge ${bcls}">${esc(u.oordeel)}</span>
      ${sig}
    </div>
    <p class="sum">${esc(u.samenvatting)}</p>
    ${arts?`<div class="arts">${arts}</div>`:''}
    <div class="actions">
      <button class="toggle" type="button">Praktijkbelang &amp; rechtsregel</button>
      <a class="ext" href="${esc(u.url)}" target="_blank" rel="noopener">Open op rechtspraak.nl &rarr;</a>
    </div>
    <div class="rr"><b>Rechtsregel</b>${esc(u.rechtsregel)}</div>
  </div>`;
}

function render(){
  const fi=document.getElementById('f-inst').value,
        fb=document.getElementById('f-belang').value,
        fo=document.getElementById('f-oordeel').value,
        q=document.getElementById('f-q').value.toLowerCase().trim();
  const out = rows.filter(u=>{
    if(fi && u.instantie!==fi) return false;
    if(fb && u.belang!==fb) return false;
    if(fo && u.oordeel!==fo) return false;
    if(q){
      const hay=[u.ecli,u.onderwerp,u.samenvatting,u.rechtsregel,u.instantie,u.zaaknummer,(u.wetsartikelen||[]).join(' ')].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  document.getElementById('count').textContent = out.length+' van '+rows.length+' uitspraken';
  document.getElementById('list').innerHTML = out.length? out.map(card).join('') : '<div class="empty">Geen uitspraken gevonden met deze filters.</div>';
}

document.getElementById('list').addEventListener('click', e=>{
  if(e.target.classList.contains('toggle')){
    e.target.parentElement.parentElement.querySelector('.rr').classList.toggle('open');
  }
});
['f-inst','f-belang','f-oordeel','f-q'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
});
render();
</script>
</body>
</html>
