t IB 2001 juncto de artikelen 18 en 19 Uitvoeringsbesluit IB 2001 en niet naar de waarde in het economische verkeer van art. 5.19 Wet IB 2001.", "rechtsregel": "Een renteloze vordering brengt mee dat de schuldenaar een gerechtigdheid tot voordelen uit goederen en dus een genotsrecht in de zin van art. 5.22 lid 3 Wet IB 2001 heeft, zodat de vordering in box 3 forfaitair moet worden gewaardeerd volgens art. 5.22 Wet IB 2001 en niet naar de waarde in het economische verkeer.", "wetsartikelen": ["art. 5.19 lid 1 Wet IB 2001", "art. 5.22 Wet IB 2001", "art. 5.4 Wet IB 2001", "art. 16 AWR"], "belang": "laag", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2019:2909"}, {"ecli": "ECLI:NL:RBZWB:2019:3757", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2019-06-20", "gepubliceerd": "2026-02-03", "zaaknummer": "BRE - 17 _ 1709", "onderwerp": "BOR schenkbelasting; bezitseis art. 35d SW na juridische (ruzie)splitsing", "samenvatting": "De schenker hield voor de herstructurering middellijk 49% in een concern met twee activiteiten; door een ruziesplitsing (art. 2:334cc BW) in 2011 verkreeg zij middellijk 100% van de tak 'Horen', waarvan de aandelen in 2013 aan haar zoon werden geschonken met een beroep op de BOR. De rechtbank oordeelt dat de bezitseis van artikel 35d, eerste lid, onderdeel c, SW 1956 per objectieve onderneming of gedeelte daarvan afzonderlijk moet worden toegepast, zodat voor het door de splitsing verkregen 51%-gedeelte niet aan de vijfjaarstermijn is voldaan; artikel 9, tweede lid, Uitvoeringsregeling schenk- en erfbelasting voegt slechts bezitsperioden van aandelen samen en verruimt het begrip 'de daar bedoelde onderneming' niet. Ook het beroep op het gelijkheidsbeginsel faalt; het beroep is ongegrond, met EUR 1.000 immateriele schadevergoeding wegens overschrijding van de redelijke termijn.", "rechtsregel": "De bezitseis van artikel 35d, eerste lid, onderdeel c, SW 1956 moet voor elke objectieve onderneming of gedeelte daarvan afzonderlijk worden getoetst, ook wanneer de uitbreiding van het belang via een juridische splitsing is verkregen.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 35d SW 1956", "art. 35e SW 1956", "art. 37 SW 1956", "art. 11 AWR", "art. 9 Uitvoeringsregeling schenk- en erfbelasting", "art. 3.2 Wet IB 2001", "art. 3.55 Wet IB 2001", "art. 3.56 Wet IB 2001", "art. 3.57 Wet IB 2001", "art. 2:334cc BW"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHSHE:2021:2883", "ECLI:NL:RBZWB:2018:6631"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2019:3757"}, {"ecli": "ECLI:NL:GHDHA:2019:1744", "instantie": "Gerechtshof Den Haag", "datum": "2019-06-19", "gepubliceerd": "2026-05-13", "zaaknummer": "BK-18/00925", "onderwerp": "Partner van kind van Stifter is geen erfgenaam en geen begunstigde van APV", "samenvatting": "Aan belanghebbende, fiscaal partner van een dochter van de Stifter van dezelfde Liechtensteinse Stiftung, is voor 2013 een belastbaar inkomen uit sparen en beleggen van € 60.000 toegerekend uit hoofde van het APV. Het Hof bevestigt dat de Stiftung een APV is, maar oordeelt dat belanghebbende geen erfgenaam van de Stifter is zodat art. 2.14a Wet IB 2001 bij hem reeds daarom geen vermogen doet opkomen; bovendien behoort hij blijkens de Beistatuten uitdrukkelijk niet tot het Begunstigtenkreis (de Ehegatten van de kinderen zijn uitgesloten), zodat hij geen begunstigde is en dat ook niet kan worden en het tegenbewijs van het zesde lid is geleverd. Nu de partners op grond van art. 2.17, lid 4, Wet IB 2001 hun onderlinge verhouding hebben gewijzigd en geen APV-vermogen aan belanghebbende hebben toegerekend, en de TBS-vordering geen tussen partners verdeelbaar inkomensbestanddeel is, wordt het belastbaar inkomen uit sparen en beleggen op nihil gesteld.", "rechtsregel": "Toerekening van APV-vermogen op grond van art. 2.14a Wet IB 2001 vindt niet plaats bij iemand die geen erfgenaam is van degene die het vermogen heeft afgezonderd en die blijkens de statutaire begunstigdenkring geen begunstigde is en dat ook niet kan worden; een uit het APV voortvloeiende TBS-vordering behoort niet tot de tussen fiscale partners verdeelbare inkomensbestanddelen.", "wetsartikelen": ["art. 2.14a Wet IB 2001", "art. 2.17 Wet IB 2001", "art. 3.92 Wet IB 2001", "art. 25 AWR", "art. 1 EP EVRM"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHDHA:2019:1744"}, {"ecli": "ECLI:NL:GHDHA:2019:1743", "instantie": "Gerechtshof Den Haag", "datum": "2019-06-18", "gepubliceerd": "2026-05-13", "zaaknummer": "BK-18/00920 tm BK-18/00924", "onderwerp": "Liechtensteinse Stiftung als APV; begunstigde; geen strijd met art. 1 EP EVRM", "samenvatting": "De in 2007 naar Liechtensteins recht opgerichte Stiftung waarin de in 1996 naar Zwitserland geëmigreerde vader zijn aandelen, een effectenportefeuille en een bankrekening afzonderde, is een APV: het vermogen dient met de verzorging van echtgenote, kinderen en kleinkinderen een meer dan bijkomstig particulier belang en het bestuur beslist discretionair over uitkeringen. Belanghebbende, zoon van de Stifter en behorend tot het Begunstigtenkreis, is uitsluitend begunstigde zonder juridisch afdwingbaar recht, zodat de tegenbewijsregeling van art. 2.14a, lid 6, Wet IB 2001 niet slaagt en hem als erfgenaam een vierde van het stichtingsvermogen wordt toegerekend. Het Hof verwerpt de klachten dat de APV-regeling in strijd is met de vrijheid van vestiging en van kapitaalverkeer en met art. 1 EP EVRM op regel- en individueel niveau; van een individuele en buitensporige last is geen sprake. Voor 2013 is de vereiste aangifte niet gedaan omdat het toegerekende vermogen niet is aangegeven; het vermogen wordt redelijkerwijs op € 7.291.019 geschat en het beroep op interne compensatie (TBS-vordering tegen 6% rente) slaagt.", "rechtsregel": "Een discretionaire buitenlandse Stiftung waarin met een meer dan bijkomstig particulier belang vermogen is afgezonderd is een APV, en een tot de begunstigdenkring behorende erfgenaam zonder juridisch afdwingbaar recht op uitkeringen kan zich niet op de tegenbewijsregeling van art. 2.14a, lid 6, Wet IB 2001 beroepen.", "wetsartikelen": ["art. 2.14a Wet IB 2001", "art. 2.17 Wet IB 2001", "art. 3.92 Wet IB 2001", "art. 3.94 Wet IB 2001", "art. 3.95 Wet IB 2001", "art. 25 AWR", "art. 1 EP EVRM", "art. 49 VWEU", "art. 63 VWEU"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHDHA:2019:1743"}, {"ecli": "ECLI:NL:HR:2019:235", "instantie": "Hoge Raad", "datum": "2019-02-15", "gepubliceerd": "2025-08-04", "zaaknummer": "18/01139", "onderwerp": "Art. 13a SW: waardestijging aandelen door overlijden na ziekte", "samenvatting": "Belanghebbende hield alle aandelen in een BV met een lijfrenteverplichting jegens zijn moeder; nadat in mei 2015 was vastgesteld dat zij ongeneeslijk ziek was, overleed zij op 31 juli 2015 en viel de voorziening vrij, waardoor de aandelen in waarde stegen. In de aangifte erfbelasting was een fictieve verkrijging van EUR 218.228 op grond van art. 13a SW 1956 aangegeven; in geschil was of de waardestijging voor zover die al door de ziekte was ontstaan buiten de heffing moest blijven. De Hoge Raad verwerpt dat betoog: gelet op de strekking van art. 13a SW 1956 en de waarderingsregel van art. 21, lid 1, SW 1956 moet bij de door het overlijden veroorzaakte waardestijging mede rekening worden gehouden met een eerdere afwaardering van de lijfrentevoorziening wegens verminderd langlevenrisico, zodat de gehele waardestijging is belast.", "rechtsregel": "Bij de op grond van art. 13a SW 1956 te belasten waardestijging van aandelen door het overlijden van de erflater moet mede rekening worden gehouden met een eerdere afwaardering van de verplichting jegens de erflater in verband met een verminderd langlevenrisico.", "wetsartikelen": ["art. 13a SW 1956", "art. 21 SW 1956", "art. 81 Wet RO"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2018:1106", "ECLI:NL:GHDHA:2018:234"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2019:235"}, {"ecli": "ECLI:NL:PHR:2018:1106", "instantie": "Parket bij de Hoge Raad", "datum": "2018-10-04", "gepubliceerd": "2025-08-04", "zaaknummer": "18/01139", "onderwerp": "Art. 13a SW: waardestijging aandelen door overlijden bij vrijval lijfrente", "samenvatting": "Belanghebbende had de onderneming van zijn moeder (erflaatster) en haar echtgenoot in 2003 overgenomen tegen lijfrenten, die hij inbracht in zijn eigen B.V.; in mei 2015 werd bij erflaatster een ongeneeslijke ziekte met een prognose van enkele maanden vastgesteld en op 31 juli 2015 overleed zij, waarna een fictieve verkrijging ex art. 13a SW 1956 van € 218.228 in de aanslag erfbelasting 2015 werd begrepen. In geschil is of en tot welk bedrag sprake is van een waardestijging door het overlijden, nu belanghebbende stelt dat die waardestijging al bij de diagnose in de waarde was ingeprijsd en de fictieve verkrijging daarom primair nihil en subsidiair € 6.400 bedraagt. A-G IJzerman acht het door het Hof gehanteerde criterium van een concreet en voldoende sterk causaal verband een te ruime verruiming van de wettekst, maar meent dat de uitkomst juist is: blijkens de parlementaire geschiedenis wordt voor de waardestijging aangesloten bij de vrijval van de verplichting zoals per overlijdensdatum voor de vennootschapsbelasting berekend, en de wetgever kan niet hebben beoogd dat de fictie bij een voorzienbaar overlijden grotendeels zonder effect blijft. De conclusie strekt tot ongegrondverklaring van het cassatieberoep.", "rechtsregel": "De omvang van de fictieve verkrijging van art. 13a SW 1956 wordt bepaald door de waardestijging van de aandelen die per datum van overlijden voortvloeit uit de vrijval van de pensioen- of lijfrenteverplichting, zodat een reeds voor het overlijden in de waarde verdisconteerde stijging wegens een voorzienbaar overlijden de heffing niet vermindert.", "wetsartikelen": ["art. 1 SW 1956", "art. 13a SW 1956", "art. 21 SW 1956", "afdeling 4.3 Wet IB 2001"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBDHA:2017:11204", "ECLI:NL:GHDHA:2018:234", "ECLI:NL:HR:2019:235"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2018:1106"}, {"ecli": "ECLI:NL:RBNNE:2018:2067", "instantie": "Rechtbank Noord-Nederland", "datum": "2018-06-04", "gepubliceerd": "2026-05-13", "zaaknummer": "AWB - 17 _ 4232", "onderwerp": "Box 3: toegeëigend nalatenschapssaldo en corresponderende schuld aan erfgenamen", "samenvatting": "Eiser heeft zich na het overlijden van zijn oom in 2008 het saldo van diens Zwitserse bankrekening toegeëigend door dat op een eigen UBS-rekening te plaatsen; in 2014 bleek uit het testament dat niet hij maar drie ANBI's enig erfgenaam waren. In geschil is of het saldo van € 549.734 per 1 januari 2015 tot zijn box 3-bezittingen behoort. De rechtbank oordeelt dat eiser gelet op de tenaamstelling als rechthebbende en bezitter geldt, zodat het saldo terecht op grond van art. 5.3, lid 2, onderdeel e, Wet IB 2001 tot zijn bezittingen is gerekend, maar dat daartegenover een in rechte opeisbare schuld aan de erfgenamen staat: op grond van art. 4:182 BW volgden de erfgenamen de erflater van rechtswege op, en de toeëigening levert een vordering op (art. 4:483 BW dan wel art. 6:162 BW), waaraan onbekendheid van de erfgenamen met de rekening niet afdoet. De schuld wordt op nominale waarde gewaardeerd nu eiser niet insolvabel was, zodat per saldo geen belastbaar voordeel uit sparen en beleggen resteert.", "rechtsregel": "Wie zich zonder recht goederen van een nalatenschap toeëigent, heeft daartegenover een in rechte opeisbare schuld aan de erfgenamen die voor box 3 op de waarde in het economische verkeer, in beginsel de nominale waarde, wordt gewaardeerd, ongeacht of de erfgenamen op de peildatum met hun vordering bekend waren.", "wetsartikelen": ["art. 5.3 Wet IB 2001", "art. 5.19 Wet IB 2001", "art. 67n AWR", "art. 4:182 BW", "art. 4:483 BW", "art. 6:162 BW"], "belang": "laag", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNNE:2018:2067"}, {"ecli": "ECLI:NL:HR:2018:260", "instantie": "Hoge Raad", "datum": "2018-02-23", "gepubliceerd": "2025-08-04", "zaaknummer": "17/03144", "onderwerp": "Art. 66 SW: navordering successierecht bij overlijden van voor 1985", "samenvatting": "De erflater overleed in 1982; belanghebbende deed in 1983 aangifte voor het recht van successie zonder melding te maken van buitenlands vermogen (SW zoals die tot 2010 luidde) en meldde dat vermogen pas in februari 2012, waarna in april 2014 een navorderingsaanslag volgde. In geschil was of het tot 1 januari 1985 geldende art. 66 SW 1956, dat navordering toestond tot vijf jaar nadat de inspecteur met de onjuistheid bekend werd, na de wetswijziging van 8 juni 1991 zijn betekenis had behouden. De Hoge Raad oordeelt, in navolging van de A-G en onder verwijzing naar art. 5 Wet algemene bepalingen, dat aan de eerdere regeling geen betekenis meer toekomt, zodat navordering slechts binnen twaalf jaar na het overlijden mogelijk was en de bevoegdheid was vervallen.", "rechtsregel": "Het tot 1 januari 1985 geldende art. 66 SW 1956 heeft door de vervanging van dat artikel per 8 juni 1991 zijn betekenis verloren, ook voor nalatenschappen die voor 1985 zijn opengevallen, zodat navordering van successierecht in die gevallen slechts binnen twaalf jaar na het overlijden mogelijk was.", "wetsartikelen": ["art. 66 SW 1956", "art. 16 AWR", "art. 5 Wet algemene bepalingen"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "De regel ziet uitsluitend op het voor 8 juni 1991 geldende art. 66 SW 1956 en op nalatenschappen die voor 1985 zijn opengevallen, en heeft onder het huidige recht geen zelfstandige betekenis meer.", "parallelzaken": ["ECLI:NL:HR:2018:263", "ECLI:NL:HR:2018:262", "ECLI:NL:HR:2018:261", "ECLI:NL:HR:2018:256", "ECLI:NL:HR:2018:258", "ECLI:NL:HR:2018:257"], "gerelateerd": ["ECLI:NL:PHR:2017:1461"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2018:260"}, {"ecli": "ECLI:NL:HR:2017:3229", "instantie": "Hoge Raad", "datum": "2017-12-22", "gepubliceerd": "2025-08-04", "zaaknummer": "16/05639", "onderwerp": "Conserverende navorderingsaanslag na vaststellingsovereenkomst ter zitting", "samenvatting": "Belanghebbende verkreeg in 2002 uit de nalatenschap van een tante aanmerkelijkbelangaandelen en deed een beroep op de bedrijfsopvolgingsfaciliteit, waarna haar op grond van art. 37, leden 1 en 2, SW 1956 zoals dat tot 2010 luidde een aanslag en een conserverende aanslag in het recht van successie werden opgelegd. Ter zitting van de rechtbank in 2008, buiten de navorderingstermijn van art. 16, lid 3, AWR, spraken partijen af dat een passiefpost van EUR 2.920.755 samenhing met het beleggingsvermogen, waarna de gewone aanslag werd verlaagd en de inspecteur in 2011 alsnog een conserverende navorderingsaanslag oplegde. Het hof achtte die aanslag onrechtmatig, maar de Hoge Raad vernietigt en verwijst: het hof heeft de stelling dat de gemachtigde het onverbrekelijke verband tussen beide aanslagen moest begrijpen onbesproken gelaten, en zijn oordeel over de professionaliteit van partijen berust op een onjuiste rechtsopvatting dan wel is onbegrijpelijk gemotiveerd.", "rechtsregel": "Bij de uitleg van een ter zitting gesloten vaststellingsovereenkomst mogen aan de inspecteur qua professionaliteit geen hogere eisen worden gesteld dan aan de belastingadviseur die als gemachtigde optreedt, zodat de wetenschap van beide partijen over het verband tussen aanslag en conserverende aanslag in de uitleg moet worden betrokken.", "wetsartikelen": ["art. 37 SW 1956", "art. 52 SW 1956", "art. 66 SW 1956", "art. 16 AWR"], "belang": "middel", "oordeel": "verwijzing", "parallelzaken": ["ECLI:NL:HR:2017:3230"], "gerelateerd": ["ECLI:NL:PHR:2017:530", "ECLI:NL:GHSHE:2016:4602"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2017:3229"}, {"ecli": "ECLI:NL:HR:2017:3080", "instantie": "Hoge Raad", "datum": "2017-12-08", "gepubliceerd": "2025-08-04", "zaaknummer": "17/01194", "onderwerp": "Partnervrijstelling erfbelasting; mantelzorger heeft al een echtgenoot", "samenvatting": "Belanghebbende voerde sinds 1993 een gezamenlijke huishouding met haar echtgenoot, haar kinderen en haar ouders en verzorgde haar vader tot diens overlijden op 28 maart 2011; zij ontving het mantelzorgcompliment van art. 19a Wmo (oud). Zij claimde als enig erfgenaam de partnervrijstelling van art. 32, lid 1, onder 4 letter a, SW 1956 (destijds EUR 603.600), die haar werd geweigerd omdat zij op grond van art. 1a, lid 1, SW 1956 al haar echtgenoot als partner had. De Hoge Raad oordeelt dat het de wetgever vrijstond het stelsel in te richten op het uitgangspunt dat een persoon op enig moment slechts een partner kan hebben en dat uitgangspunt ook bij de mantelzorguitbreiding van art. 1a, lid 4, SW 1956 te handhaven; van strijd met art. 14 EVRM of art. 1 Twaalfde Protocol EVRM is geen sprake, mede omdat de gehuwde mantelzorger de partnervrijstelling behoudt voor de nalatenschap van de echtgenoot.", "rechtsregel": "Het uitgangspunt dat een persoon voor de Successiewet 1956 op enig moment slechts een partner kan hebben, mag ook worden gehandhaafd bij de uitbreiding van het partnerbegrip voor mantelzorgers en levert geen door art. 14 EVRM of het Twaalfde Protocol verboden discriminatie op.", "wetsartikelen": ["art. 1a SW 1956", "art. 32 SW 1956", "art. 14 EVRM", "art. 1 Eerste Protocol EVRM", "art. 1 Twaalfde Protocol EVRM", "art. 19a Wet maatschappelijke ondersteuning (oud)", "art. 81 Wet RO"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHSHE:2017:347"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2017:3080"}, {"ecli": "ECLI:NL:HR:2017:2840", "instantie": "Hoge Raad", "datum": "2017-11-10", "gepubliceerd": "2025-08-04", "zaaknummer": "17/01037", "onderwerp": "Verlengde navorderingstermijn schenkbelasting per schenkingshandeling", "samenvatting": "De moeder schonk haar dochters op 17 januari 1997 ieder f 465.200 vrij van recht, waarvan wel aangifte werd gedaan, en daarnaast f 925.000 afkomstig van een Zwitserse bankrekening, waarvan geen aangifte werd gedaan; dit betrof het recht van schenking onder de SW zoals die tot 2010 luidde. Nadat een zuster in 2014 inkeerde, legde de inspecteur in december 2015 een navorderingsaanslag op; in geschil was of de bijzondere navorderingsregeling van art. 66, lid 1, ten tweede, SW 1956 toepassing miste omdat van de andere schenking in hetzelfde jaar wel aangifte was gedaan. De Hoge Raad verwerpt dat betoog: gelet op de wetsgeschiedenis en op het karakter van tijdstipbelasting wordt per schenkingshandeling beoordeeld of (tijdig) aangifte is gedaan, zodat de termijn hier pas aanving na inschrijving van de akte van overlijden van de moeder (1 januari 2004). Art. 28 SW 1956 strekt er slechts toe splitsing van een schenking binnen een kalenderjaar tegen te gaan en heeft geen ruimer bereik.", "rechtsregel": "Voor de toepassing van de bijzondere navorderingsregeling van art. 66, lid 1, ten tweede, SW 1956 wordt per afzonderlijke schenkingshandeling beoordeeld of daarvan (tijdig) aangifte is gedaan; de samentelling van art. 28 SW 1956 doet daaraan niet af.", "wetsartikelen": ["art. 66 SW 1956", "art. 28 SW 1956", "art. 1 SW 1956", "art. 16 AWR", "art. 81 Wet RO"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBGEL:2017:269"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2017:2840"}, {"ecli": "ECLI:NL:HR:2017:356", "instantie": "Hoge Raad", "datum": "2017-03-03", "gepubliceerd": "2025-08-04", "zaaknummer": "16/03506", "onderwerp": "Art. 66 lid 3 SW: geen herleving van vervallen navorderingsbevoegdheid", "samenvatting": "Erflaatster overleed op 29 december 1998 met een verzwegen tegoed bij een Zwitserse bank; de enig erfgenaam deed in 1999 aangifte voor het recht van successie (SW zoals die tot 2010 luidde) zonder dat vermogen te vermelden en meldde het pas in 2014 via een vrijwillige verbetering. Op 1 januari 2012, toen art. 66, lid 3, SW 1956 zonder overgangsrecht in werking trad, was de twaalfjaarstermijn van art. 16, lid 4, AWR al verstreken; in geschil was of de op 9 september 2014 opgelegde navorderingsaanslag niettemin kon worden opgelegd. De Hoge Raad beantwoordt die vraag ontkennend: de bewoordingen 'vervalt (...) niet', de toelichting bij het amendement waaraan de bepaling is ontleend en de rechtszekerheid die de navorderingstermijnen dienen, verzetten zich ertegen dat een reeds vervallen navorderingsbevoegdheid herleeft zonder uitdrukkelijke bedoeling van de wetgever.", "rechtsregel": "De onbeperkte navorderingstermijn van art. 66, lid 3, SW 1956 doet een bevoegdheid tot navordering die op het tijdstip van inwerkingtreding (1 januari 2012) al op grond van art. 16, lid 4, AWR was vervallen, niet herleven.", "wetsartikelen": ["art. 66 SW 1956", "art. 16 AWR", "art. 81 Wet RO"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2016:1350", "ECLI:NL:GHARL:2016:4208"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2017:356"}, {"ecli": "ECLI:NL:GHSHE:2017:503", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2017-02-10", "gepubliceerd": "2026-02-24", "zaaknummer": "16/00245", "onderwerp": "Inzageverzoek erfbelastingdossier: geen voor bezwaar vatbare beschikking", "samenvatting": "Belanghebbende is bij testament als legataris aangewezen en heeft ter zake van het overlijden in 2010 een aanslag erfbelasting van EUR 3.304 (belaste verkrijging EUR 33.046) voldaan zonder daartegen bezwaar te maken. Zij verzocht de inspecteur in 2014 om inzage in de dossiers inzake de aangiften erfbelasting; de inspecteur wees dat af en merkte de afwijzing aan als niet voor bezwaar vatbaar. Het hof oordeelt dat de afwijzing van het inzageverzoek geen belastingaanslag en geen voor bezwaar vatbare beschikking is als bedoeld in artikel 26, lid 1, AWR, zodat de rechtbank terecht heeft geoordeeld dat de inspecteur het bezwaar niet-ontvankelijk had moeten verklaren. Aan de vraag of het inzageverzoek terecht is afgewezen komt het hof daarom niet toe.", "rechtsregel": "De beslissing van de inspecteur op een verzoek om inzage in de voor de belastingheffing van belang zijnde stukken is geen belastingaanslag en geen voor bezwaar vatbare beschikking in de zin van artikel 26, lid 1, AWR, zodat daartegen geen bezwaar en beroep openstaat.", "wetsartikelen": ["art. 72 SW 1956", "art. 26 AWR", "art. 67 AWR", "art. 7:1 Awb", "art. 8:1 Awb"], "belang": "laag", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2017:503"}, {"ecli": "ECLI:NL:PHR:2016:1350", "instantie": "Parket bij de Hoge Raad", "datum": "2016-12-15", "gepubliceerd": "2025-08-04", "zaaknummer": "16/03506", "onderwerp": "Onbeperkte navorderingstermijn art. 66 lid 3 SW; reeds verstreken termijn", "samenvatting": "Erflaatster overleed op 29 december 1998 en belanghebbende, enig erfgenaam, deed op 26 augustus 1999 aangifte voor het recht van successie, onder de SW zoals die tot 2010 luidde, zonder daarin het bij een Zwitserse bank aangehouden vermogen te vermelden; na een vrijwillige verbetering in 2014 legde de Inspecteur op 9 september 2014 een navorderingsaanslag van € 100.925 op. De twaalfjaarstermijn van art. 16, lid 4, AWR juncto art. 66, lid 1, SW 1956 was op 1 januari 2012, de datum van inwerkingtreding van het bij amendement ingevoerde art. 66, lid 3, SW 1956 tegen de Edelweissroute, reeds verstreken; in geschil is of die onbeperkte navorderingsbevoegdheid een reeds vervallen bevoegdheid doet herleven. A-G IJzerman meent van niet: de wettekst veronderstelt een op 1 januari 2012 nog bestaande bevoegdheid, een voltooide verjaring wordt geëerbiedigd en de amendementstoelichting spreekt slechts over de afgelopen twaalf jaar, zodat een zo ingrijpend gevolg door de wetgever uitdrukkelijk had moeten worden vastgelegd. De conclusie strekt tot ongegrondverklaring van het cassatieberoep van de Staatssecretaris.", "rechtsregel": "Art. 66, lid 3, SW 1956 heeft bij gebreke van overgangsrecht onmiddellijke werking, maar doet een op 1 januari 2012 reeds vervallen navorderingsbevoegdheid niet herleven, nu herleving van een voltooide verjaring door de wetgever uitdrukkelijk moet zijn vastgelegd.", "wetsartikelen": ["art. 66 SW 1956", "art. 72 SW 1956", "art. 16 AWR", "art. 10a AWR", "art. 25 AWR", "art. 27e AWR", "art. 52a AWR", "art. 47 IW 1990", "art. 10c Uitv.besl. SW 1956", "art. 1 Eerste Protocol EVRM", "art. 81 RO"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBGEL:2015:6628", "ECLI:NL:GHARL:2016:4208", "ECLI:NL:HR:2017:356"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2016:1350"}, {"ecli": "ECLI:NL:HR:2016:705", "instantie": "Hoge Raad", "datum": "2016-04-22", "gepubliceerd": "2025-08-04", "zaaknummer": "15/02845", "onderwerp": "BOR: vermogensetikettering van een aandelenbelang op houdsterniveau", "samenvatting": "Erflater overleed op 12 november 2010; tot de huwelijksgemeenschap behoorde een belang van 6,89 percent in een houdstervennootschap met een waarde van EUR 517.000.000, waarvan EUR 60.000.000 was toe te rekenen aan een belang van 70,6 percent in een buitenlandse werkmaatschappij. In geschil was of de bedrijfsopvolgingsregeling van hoofdstuk IIIA SW 1956 (tekst 2010) ook op dat belang van toepassing is, terwijl het voor erflater geen indirect aanmerkelijk belang vormde. De Hoge Raad oordeelt dat door de toerekening van de bezittingen en schulden van de overige deelnemingen op grond van art. 35c, lid 5, letter a, SW ervan moet worden uitgegaan dat de houdstervennootschap zelf een materiële onderneming drijft, en dat op grond van de vermogensetiketteringsregels ook vermogensbestanddelen van de houdster zelf, waaronder een aandelenbelang, tot dat ondernemingsvermogen kunnen behoren; er is geen aanleiding een aandelenbelang anders te behandelen dan andere vermogensbestanddelen. De Hoge Raad vernietigt de hofuitspraak, doet de zaak zelf af en bevestigt de uitspraak van de rechtbank.", "rechtsregel": "Nadat op grond van art. 35c, lid 5, letter a, SW 1956 de bezittingen en schulden van indirect gehouden aanmerkelijkbelangdeelnemingen aan de houdstervennootschap zijn toegerekend, kan een niet-toegerekend aandelenbelang van die houdster op grond van de vermogensetiketteringsregels tot haar ondernemingsvermogen in de zin van art. 35c, lid 1, letter c, SW behoren en daarmee onder de bedrijfsopvolgingsregeling vallen.", "wetsartikelen": ["art. 35c SW 1956 (tekst 2010)", "art. 3.2 Wet IB 2001"], "belang": "hoog", "oordeel": "cassatie", "gerelateerd": ["ECLI:NL:GHDHA:2015:1196"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2016:705"}, {"ecli": "ECLI:NL:HR:2016:583", "instantie": "Hoge Raad", "datum": "2016-04-08", "gepubliceerd": "2025-08-04", "zaaknummer": "15/00281", "onderwerp": "Art. 10 SW: verkoop woning aan kind met terughuur onder 6 percent WOZ", "samenvatting": "Erflaatster verkocht op 19 juli 2010 haar woning voor de getaxeerde verhuurde waarde van EUR 117.500 aan haar zoon en diens echtgenote en huurde de woning direct terug voor EUR 650 per maand; de WOZ-waarde bedroeg EUR 221.000 (2010) en EUR 216.000 (2011). Na haar overlijden op 21 januari 2011 werd bij belanghebbende een fictief legaat op de voet van art. 10 SW 1956 (tekst 2011) in aanmerking genomen, uiteindelijk resulterend in een aanslag van EUR 3463. De Hoge Raad oordeelt dat de erflaatster ingevolge art. 10, lid 3, SW in verbinding met art. 21, lid 13, SW en art. 10 Uitvoeringsbesluit SW 1956 wordt geacht een genot van vruchtgebruik te hebben gehad omdat de betaalde huur aanzienlijk minder bedraagt dan 6 percent van de WOZ-waarde in onbezwaarde staat, en dat het betoog dat partijen strikt zakelijk handelden afstuit op het bewust forfaitaire en scherp begrensde karakter van de regeling; ook het beroep op de besluiten van 6 januari 2011 en 4 april 2012 faalt, omdat die zien op huursituaties die op 1 januari 2010 al bestonden.", "rechtsregel": "Betaalt de erflater na overdracht van de woning aan het kind een huur van minder dan 6 percent van de WOZ-waarde in onbezwaarde staat, dan wordt hij op grond van art. 10, lid 3, SW 1956 geacht een genot van vruchtgebruik te hebben gehad en is art. 10 SW naar zijn bewoordingen van toepassing, zonder dat tegenbewijs van strikt zakelijk handelen daaraan kan afdoen.", "wetsartikelen": ["art. 7 SW 1956", "art. 10 SW 1956 (tekst 2011)", "art. 21 SW 1956 (tekst 2011)", "art. 10 Uitvoeringsbesluit Successiewet 1956", "Wet WOZ"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2015:2271", "ECLI:NL:GHDHA:2014:4101"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2016:583"}, {"ecli": "ECLI:NL:HR:2016:430", "instantie": "Hoge Raad", "datum": "2016-03-18", "gepubliceerd": "2025-08-04", "zaaknummer": "15/01984", "onderwerp": "Successierecht over kapitaalverzekering geen aftrekbare kosten in de IB", "samenvatting": "Belanghebbende erfde in 2009 van haar broer een kapitaalverzekering met lijfrenteclausule; zij bracht de clausule niet tot uitvoering, zodat het kapitaal van EUR 186.337,94 werd uitgekeerd en als afkoopsom in de IB-heffing 2009 werd betrokken. Bij de aanslag in het recht van successie (SW zoals die tot 2010 luidde) was al rekening gehouden met de forfaitaire latentie-aftrek van 30 percent op de voet van art. 20, leden 5 en 6, SW. In geschil was of het aan die verkrijging toe te rekenen successierecht daarnaast aftrekbare kosten vormt in de zin van art. 3.108 Wet IB 2001. De Hoge Raad oordeelt van niet: het niet uitvoeren van de lijfrenteclausule is geen wilsrecht in de zin van art. 45, lid 3, SW, en buiten het geval waarin opbrengsten zijn toe te rekenen aan een op de sterfdag reeds verstreken periode voorziet het wettelijke stelsel niet in enige aftrek wegens samenloop van successierecht en inkomstenbelasting, behoudens de bewust forfaitair vormgegeven latentie-aftrek, ook niet als de werkelijk verschuldigde inkomstenbelasting meer dan 30 percent bedraagt.", "rechtsregel": "Behoudens de forfaitaire aftrek van latente inkomstenbelasting van art. 20, leden 5 en 6, SW 1956 voorziet het wettelijke stelsel niet in aftrek wegens samenloop van erf-/successiebelasting en inkomstenbelasting voor opbrengsten die niet zijn toe te rekenen aan een op de sterfdag reeds verstreken periode; het forfait laat geen tegenbewijs toe.", "wetsartikelen": ["art. 20 SW 1956 (tekst 2009)", "art. 45 SW 1956", "art. 3.108 Wet IB 2001"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2015:2241", "ECLI:NL:GHAMS:2015:1091"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2016:430"}, {"ecli": "ECLI:NL:HR:2016:354", "instantie": "Hoge Raad", "datum": "2016-03-04", "gepubliceerd": "2026-02-18", "zaaknummer": "14/05821", "onderwerp": "Intrekking ANBI-status met terugwerkende kracht; vertrouwensbeginsel", "samenvatting": "Een in 2005 opgerichte oldtimermuseumstichting was bij brief van 9 februari 2006 en bij beschikking van 7 december 2007 als ANBI aangemerkt; na een boekenonderzoek trok de Inspecteur die status bij beschikking van 21 november 2011 in met terugwerkende kracht tot 1 januari 2008, met als gevolg een aanslag recht van successie over een verkrijging van € 2.381.671 (bedrag ontleend aan de conclusie ECLI:NL:PHR:2015:2204 en aan ECLI:NL:RBDHA:2013:7035). In geschil was of het vertrouwensbeginsel aan die terugwerkende kracht in de weg stond. De Hoge Raad oordeelt dat art. 6.33, lid 3, Wet IB 2001 (oud) de inspecteur uitdrukkelijk toestaat een instelling niet meer als ANBI aan te merken vanaf een tijdstip vóór de intrekkingsbeschikking, tenzij algemene beginselen van behoorlijk bestuur zich daartegen verzetten, dat aan een op een ingevuld standaardaanvraagformulier gebaseerde ANBI-beschikking geen gerechtvaardigd vertrouwen van een weloverwogen standpuntbepaling kan worden ontleend, en dat noch de wettekst noch de wetsgeschiedenis de eis stelt dat de instelling kwade trouw kan worden verweten. Het oordeel dat de feitelijke werkzaamheden niet voor ten minste 50 percent het algemeen belang dienden blijft in stand; de zaak wordt verwezen naar Hof Amsterdam voor het beroep op het gelijkheidsbeginsel.", "rechtsregel": "Een ANBI-beschikking kan met terugwerkende kracht worden ingetrokken zonder dat kwade trouw van de instelling is vereist, en aan een beschikking die uitsluitend berust op een ingevuld standaardaanvraagformulier kan de instelling geen in rechte te beschermen vertrouwen op een weloverwogen standpuntbepaling ontlenen.", "wetsartikelen": ["art. 6.33 Wet IB 2001 (oud)", "art. 41a Uitvoeringsregeling inkomstenbelasting 2001", "art. 41b Uitvoeringsregeling inkomstenbelasting 2001", "art. 41c Uitvoeringsregeling inkomstenbelasting 2001", "art. 41d Uitvoeringsregeling inkomstenbelasting 2001"], "belang": "hoog", "oordeel": "verwijzing", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2016:354"}, {"ecli": "ECLI:NL:HR:2016:319", "instantie": "Hoge Raad", "datum": "2016-02-26", "gepubliceerd": "2025-08-04", "zaaknummer": "15/01396", "onderwerp": "Kwijtschelding koopsom woning: object van de schenking is de kwijtschelding", "samenvatting": "Een vader leverde op 26 juli 2010 een woning aan zijn dochter en schoonzoon voor EUR 250.000, gelijk aan de waarde in het economische verkeer, en schold in de akte EUR 40.000 van de koopsom kwijt; de WOZ-waarde voor 2010 bedroeg EUR 258.000. De inspecteur en het Hof stelden de schenking op EUR 48.000 door het waarderingsvoorschrift van art. 21, lid 5, SW 1956 op de woning toe te passen. Contrair aan de conclusie van A-G IJzerman oordeelt de Hoge Raad dat verkoop tegen de waarde in het economische verkeer geen verrijking ten koste van het vermogen van de verkoper oplevert en dus geen gift in de zin van art. 1, lid 7, SW en art. 7:186, lid 2, BW is, zodat alleen de kwijtschelding van EUR 40.000 wordt geschonken en het object van die schenking niet de woning is; waardering met art. 21, lid 5, SW is dan niet aan de orde. De samenloopregeling van art. 24, lid 2, SW is niettemin naar haar strekking van toepassing op het samenstel van rechtshandelingen, zodat 6 percent van de belaste schenking van EUR 35.000 in mindering komt en de aanslag wordt verminderd tot EUR 700.", "rechtsregel": "Wordt een woning verkocht tegen de waarde in het economische verkeer met gelijktijdige kwijtschelding van een deel van de koopsom, dan is het object van de schenking de kwijtschelding en niet de woning, zodat het WOZ-waarderingsvoorschrift van art. 21, lid 5, SW 1956 toepassing mist; de samenloopregeling van art. 24, lid 2, SW is wel naar haar strekking van toepassing omdat sprake is van één samenstel van rechtshandelingen.", "wetsartikelen": ["art. 1 SW 1956 (tekst 2010)", "art. 21 SW 1956 (tekst 2010)", "art. 24 SW 1956 (tekst 2010)", "art. 7:186 BW"], "belang": "hoog", "oordeel": "cassatie", "parallelzaken": ["ECLI:NL:HR:2016:320"], "gerelateerd": ["ECLI:NL:PHR:2015:2396"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2016:319"}, {"ecli": "ECLI:NL:HR:2016:115", "instantie": "Hoge Raad", "datum": "2016-01-29", "gepubliceerd": "2025-08-13", "zaaknummer": "15/02619", "onderwerp": "Waarde maatschapsaandeel langstlevende in nalatenschap: liquidatiewaarde", "samenvatting": "Zaak onder de SW zoals die tot 2010 luidde (recht van successie; art. 21, lid 4, SW 1956, tekst 2006). Erflater overleed op 9 mei 2006 in algehele gemeenschap van goederen gehuwd; hij en zijn echtgenote dreven een agrarisch bedrijf in maatschapsverband met een voortzettingsbeding, waarvan de echtgenote na het overlijden gebruik maakte. In geschil was of de waarde van het maatschapsaandeel van de echtgenote meetelt bij het bepalen van de omvang van de nalatenschap en, zo ja, tegen welke waarde. Het Hof oordeelde dat tot de huwelijksgemeenschap de waarde van ieders maatschapsaandeel behoort, dat het maatschapsaandeel van erflater op de overnamesom moet worden gesteld, maar dat het aandeel van de echtgenote op de liquidatiewaarde moet worden gewaardeerd omdat de maatschap door het overlijden was ontbonden en op haar niet langer de verplichting rustte haar onderneming tegen de overnamewaarde te laten overnemen; de Hoge Raad verwerpt de klachten omdat het Hof op goede gronden een juiste beslissing heeft gegeven.", "rechtsregel": "Tot de ontbonden huwelijksgemeenschap behoort de waarde van het maatschapsaandeel van beide echtgenoten; het aandeel van de langstlevende die de onderneming voortzet wordt op de liquidatiewaarde gewaardeerd wanneer op haar na de ontbinding van de maatschap geen verplichting meer rust de onderneming tegen de overnamewaarde te laten overnemen, terwijl het aandeel van de erflater wel naar de contractuele overnamesom wordt gewaardeerd.", "wetsartikelen": ["art. 1 SW 1956", "art. 21 SW 1956 (tekst 2006)"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHARL:2015:3194"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2016:115"}, {"ecli": "ECLI:NL:HR:2015:3491", "instantie": "Hoge Raad", "datum": "2015-12-11", "gepubliceerd": "2025-08-04", "zaaknummer": "14/04115", "onderwerp": "Waardering legaat dat afhankelijk is van de waarde van een woning: WOZ-waarde", "samenvatting": "Erflaatster overleed op 29 oktober 2010 en had belanghebbende onterfd onder toekenning van een legaat van tien percent van het saldo van haar nalatenschap. De tot de nalatenschap behorende woning had een (na bezwaar tot EUR 457.000 verlaagde en onherroepelijk vaststaande) WOZ-waarde voor 2010; de notaris keerde EUR 45.697,84 uit, terwijl de aanslag erfbelasting uitging van een gelegateerde waarde van EUR 62.430. De Hoge Raad oordeelt dat bij de waardering van de nalatenschap voor de erfbelasting de daartoe behorende woning moet worden gewaardeerd met toepassing van art. 21, lid 5, SW 1956 (tekst 2010) en dat die waarderingsmaatstaf ook geldt voor zover de omvang van het legaat van de waarde van die woning afhankelijk is; het feitelijk uitgekeerde bedrag is niet beslissend. De Hoge Raad sluit daarbij aan bij HR 21 februari 2014, ECLI:NL:HR:2014:339, BNB 2014/126, en HR 13 december 1995, ECLI:NL:HR:1995:AA3167, BNB 1996/70.", "rechtsregel": "De wettelijke waarderingsvoorschriften van de Successiewet, waaronder de WOZ-waarde van art. 21, lid 5, SW 1956, gelden ook voor zover de omvang van een legaat afhankelijk is van de waarde van een tot de nalatenschap behorende woning; het door de verkrijger daadwerkelijk ontvangen bedrag is voor de heffing niet beslissend.", "wetsartikelen": ["art. 21 SW 1956 (tekst 2010)", "Wet WOZ"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2015:1978", "ECLI:NL:GHAMS:2014:6146"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2015:3491"}, {"ecli": "ECLI:NL:PHR:2015:2204", "instantie": "Parket bij de Hoge Raad", "datum": "2015-10-22", "gepubliceerd": "2026-07-24", "zaaknummer": "14/05821", "onderwerp": "Conclusie A-G: terugwerkende intrekking ANBI-status en vertrouwensbeginsel", "samenvatting": "A-G Niessen concludeert in de zaak van de oldtimermuseumstichting waarvan de ANBI-status per 1 januari 2008 met terugwerkende kracht is ingetrokken, met als gevolg een aanslag recht van successie over de in 2008 verkregen nalatenschap van € 2.381.671. Nu vaststaat dat niet aan de materiële ANBI-vereisten is voldaan, heeft de instelling nooit recht gehad op de status en kon de beschikking in beginsel met terugwerkende kracht worden ingetrokken; omdat de beschikking berustte op door belanghebbende zelf onjuist verstrekte informatie (alle vragen op het aanvraagformulier waren bevestigend beantwoord) faalt het beroep op het vertrouwensbeginsel, ongeacht of die onjuiste informatie met opzet is verstrekt. De A-G acht de eis van kwade trouw die het Hof stelde onjuist en merkt op dat kwade trouw wel van belang is voor de schenker die giftenaftrek claimt. Zowel het principale als het incidentele beroep zijn volgens de A-G gegrond; verwijzing is nodig voor de beoordeling van het gelijkheidsbeginsel.", "rechtsregel": "Berust een ANBI-beschikking op door de instelling zelf verstrekte onjuiste gegevens, dan kan zij daaraan geen gerechtvaardigd vertrouwen ontlenen en staat het vertrouwensbeginsel niet in de weg aan intrekking met terugwerkende kracht, ook zonder kwade trouw.", "wetsartikelen": ["art. 6.33 Wet IB 2001 (oud)", "art. 41a Uitvoeringsregeling inkomstenbelasting 2001", "art. 5b AWR"], "belang": "hoog", "oordeel": "n.v.t.", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2015:2204"}, {"ecli": "ECLI:NL:RBGEL:2015:4313", "instantie": "Rechtbank Gelderland", "datum": "2015-07-02", "gepubliceerd": "2026-02-24", "zaaknummer": "AWB - 14 _ 8132", "onderwerp": "Partnerbegrip art. 1a SW: notarieel samenlevingscontract en zesmaandstermijn", "samenvatting": "Eiser is enig erfgenaam van zijn in 2013 overleden tweelingbroer met wie hij sinds 19 augustus 2010 op hetzelfde adres stond ingeschreven; hij is aangeslagen naar het tarief van 30% over een belaste verkrijging van EUR 75.260. In geschil is of hij partner is in de zin van art. 1a SW 1956, nu een notarieel samenlevingscontract ontbreekt en de vijfjaarstermijn van het derde lid niet is gehaald. De rechtbank oordeelt dat het Handvest van de grondrechten van de EU niet van toepassing is omdat bij de aanslag erfbelasting geen Unierecht ten uitvoer wordt gebracht, en dat de wetgever binnen zijn ruime beoordelingsmarge is gebleven door het notarieel samenlevingscontract en de zesmaandstermijn te eisen ter voorkoming van misbruik. Dat erflaters korte overlevingstijd na de diagnose het sluiten van een contract onmogelijk maakte, is vanuit de doelstelling van art. 1a SW niet relevant; het beroep is ongegrond.", "rechtsregel": "De eisen van art. 1a SW 1956 van een notarieel samenlevingscontract met wederzijdse zorgverplichting en een voorafgaande periode van zes maanden zijn objectieve, ter voorkoming van misbruik gestelde voorwaarden die binnen de ruime beoordelingsvrijheid van de wetgever vallen en niet in strijd zijn met art. 14 EVRM en art. 26 IVBPR.", "wetsartikelen": ["art. 1a SW 1956", "art. 5a AWR", "art. 14 EVRM", "art. 26 IVBPR", "art. 20 Handvest van de grondrechten van de EU", "art. 21 Handvest van de grondrechten van de EU", "art. 51 Handvest van de grondrechten van de EU"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2015:4313"}, {"ecli": "ECLI:NL:HR:2015:1673", "instantie": "Hoge Raad", "datum": "2015-06-19", "gepubliceerd": "2025-08-13", "zaaknummer": "14/04081", "onderwerp": "Art. 9, lid 2, SW zonder eerbiedigende werking niet in strijd met art. 1 EP EVRM", "samenvatting": "Bij het overlijden van vader in 2003 verkregen de twee kinderen niet-opeisbare vorderingen op de langstlevende, waarover volgens het testament een enkelvoudige rente gelijkwaardig aan 6 percent samengesteld verschuldigd was; bij notariële akte van 12 januari 2005 kwamen zij een enkelvoudige rente van 13 percent per jaar overeen. Bij het overlijden van erflaatster op 19 april 2010 bedroeg de schuld inclusief rente EUR 15.776.399 per kind tegenover EUR 11.815.235 bij 6 percent samengesteld; de inspecteur belastte het verschil van EUR 3.961.164 per kind als fictieve verkrijging op grond van het per 1 januari 2010 ingevoerde art. 9, lid 2, SW, resulterend in aanslagen van (na bezwaar) EUR 626.244. De Hoge Raad oordeelt dat de wetgever een legitiem doel nastreefde (voorkomen van uitholling van de grondslag bij het overlijden van de langstlevende), dat van willekeur of strijd met het vereiste van 'lawfulness' geen sprake is en dat art. 1 EP EVRM niet eist dat de invoering gepaard gaat met eerbiedigende werking. Ook van een individuele en buitensporige last is geen sprake: de last moet mede worden bezien in het licht van de fictief tot de verkrijging gerekende rentevordering die bij het openvallen van de nalatenschap tot uitkering komt, zodat art. 9 SW niet leidt tot heffing over niet-ontvangen bedragen.", "rechtsregel": "Art. 1 van het Eerste Protocol bij het EVRM verplicht de wetgever niet tot eerbiedigende werking bij de invoering van art. 9, lid 2, SW 1956 per 1 januari 2010, en bij de toets aan de individuele en buitensporige last moet de verschuldigde erfbelasting mede worden gerelateerd aan de omvang van de fictief tot de verkrijging gerekende rentevordering die bij het openvallen van de nalatenschap tot uitkering komt.", "wetsartikelen": ["art. 9 SW 1956", "art. 1 Eerste Protocol EVRM"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2015:1673"}, {"ecli": "ECLI:NL:HR:2015:848", "instantie": "Hoge Raad", "datum": "2015-04-10", "gepubliceerd": "2025-08-04", "zaaknummer": "13/05004", "onderwerp": "Overgangsrecht APV-regime: wie kan om vermindering schenkingsrecht verzoeken", "samenvatting": "Zaak over het overgangsrecht van art. XA van de Wet van 17 december 2009, Stb. 2009, 564, bij de invoering van het regime voor afgezonderd particulier vermogen (APV), betreffende verzoeken om vermindering van vóór 2010 geheven recht van schenking (SW zoals die tot 2010 luidde). Belanghebbenden, woonachtig in de Verenigde Staten, verzochten om vermindering van schenkingsrecht dat niet te hunnen name was geheven. De Hoge Raad verwerpt het cassatieberoep zonder eigen motivering, op de gronden vermeld in de onderdelen 4.2 tot en met 4.6 van de conclusie van A-G IJzerman; blijkens de aan het arrest voorafgaande samenvatting komt het verzoek om vermindering uitsluitend toe aan degene te wiens name het recht van schenking is geheven.", "rechtsregel": "Een verzoek om vermindering van geheven recht van schenking op de voet van het overgangsrecht van art. XA van de Wet van 17 december 2009 komt uitsluitend toe aan degene ten name van wie dat recht is geheven; het gaat om uitgewerkt overgangsrecht bij de invoering van het APV-regime.", "wetsartikelen": ["art. XA Wet van 17 december 2009, Stb. 2009, 564", "art. 2.14a Wet IB 2001"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Art. XA van de Wet van 17 december 2009 is uitgewerkt overgangsrecht bij de invoering van het APV-regime per 1 januari 2010 en ziet uitsluitend op vóór die datum geheven recht van schenking.", "gerelateerd": ["ECLI:NL:PHR:2014:1861", "ECLI:NL:GHAMS:2013:2883"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2015:848"}, {"ecli": "ECLI:NL:HR:2015:849", "instantie": "Hoge Raad", "datum": "2015-04-10", "gepubliceerd": "2025-08-04", "zaaknummer": "13/04999", "onderwerp": "Irrevocable fixed trust is geen APV; geen vermindering schenkingsrecht", "samenvatting": "De vader van belanghebbende bracht in december 2000 en januari 2001 participaties met een waarde van fl. 2.382.143 respectievelijk fl. 116.537.902 in een naar het recht van New York opgerichte irrevocable fixed trust, waarvan belanghebbende de enige begunstigde was; van haar is toen recht van schenking geheven (EUR 301.875 en EUR 18.063.414) onder de SW zoals die tot 2010 luidde. Na invoering van het APV-regime verzocht zij op de voet van art. XA van de Wet van 17 december 2009 om vermindering, stellend dat het vermogen per 1 januari 2010 op grond van art. 2.14a Wet IB 2001 (weer) aan de inbrenger moet worden toegerekend. De Hoge Raad oordeelt dat het middel weliswaar terecht betoogt dat het begrip 'economische deelgerechtigdheid' in art. 2.14a, lid 2, letter b, Wet IB 2001 ziet op samenwerkingsverbanden zoals personenvennootschappen en dus enger is dan het Hof aannam, maar dat dit niet tot cassatie leidt: blijkens de wetsgeschiedenis is beslissend of het afgezonderde vermogen discretionair is, en nu de trust uitsluitend strekt tot instandhouding en aanwending van het vermogen ten gunste van belanghebbende als enige rechthebbende, ontbreekt een discretionair deel en kan aan de inbrenger niets worden toegerekend, zodat art. XA geen vermindering biedt.", "rechtsregel": "Voor de toepassing van art. 2.14a Wet IB 2001 is niet de benaming van de rechtsfiguur ('irrevocable', 'fixed') maar de vraag beslissend of het afgezonderde vermogen discretionair is; is één begunstigde als enige rechthebbende aangewezen, dan is van een discretionair deel geen sprake en wordt het vermogen niet aan de inbrenger toegerekend.", "wetsartikelen": ["art. 2.14a Wet IB 2001", "art. 10a.7 Wet IB 2001", "art. XA Wet van 17 december 2009, Stb. 2009, 564"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2014:1860", "ECLI:NL:GHAMS:2013:2884"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2015:849"}, {"ecli": "ECLI:NL:HR:2015:32", "instantie": "Hoge Raad", "datum": "2015-01-09", "gepubliceerd": "2025-08-04", "zaaknummer": "14/00521", "onderwerp": "Recht van overgang: partnervrijstelling op grond van EU-recht", "samenvatting": "Zaak onder de SW zoals die tot 2010 luidde (art. 1 en 32 SW 1956, tekst 2008; recht van overgang). Erflater, Nederlander, overleed in 2008 in Duitsland nadat hij Nederland meer dan tien jaar eerder metterwoon had verlaten; zijn echtgenote verkreeg in Nederland gelegen onroerende zaken met een waarde van EUR 270.799 en werd daarvoor in het recht van overgang aangeslagen, zonder partnervrijstelling. In geschil was of het vrije kapitaalverkeer zich daartegen verzet. De Hoge Raad oordeelt, in het licht van HvJ 17 oktober 2013, Welte, C-181/12, dat het niet toepassen van de partnervrijstelling bij het recht van overgang een niet voor redelijke twijfel vatbare beperking van het kapitaalverkeer oplevert (art. 56 EG), dat verkrijgers in de heffing van recht van overgang en die in de heffing van recht van successie voor art. 58, lid 1, letter a, EG in dezelfde situatie verkeren, en dat de Schumacker-doctrine daaraan niet afdoet; de aanslag is terecht vernietigd.", "rechtsregel": "Het vrije kapitaalverkeer verzet zich ertegen dat bij de heffing van het recht van overgang van een niet-ingezeten verkrijger de partnervrijstelling wordt onthouden die bij het recht van successie wel zou zijn verleend; de regel heeft haar praktische betekenis verloren doordat het recht van overgang per 1 januari 2010 is afgeschaft.", "wetsartikelen": ["art. 1 SW 1956 (tekst 2008)", "art. 3 SW 1956 (tekst 2008)", "art. 32 SW 1956 (tekst 2008)", "art. 56 EG", "art. 58 EG", "art. 63 VWEU", "art. 65 VWEU"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Het recht van overgang is met de herziening van de Successiewet per 1 januari 2010 afgeschaft, zodat de beslissing over de partnervrijstelling in die heffing alleen nog voor oude jaren betekenis heeft.", "gerelateerd": ["ECLI:NL:PHR:2014:585", "ECLI:NL:RBZWB:2013:8767"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2015:32"}, {"ecli": "ECLI:NL:PHR:2014:585", "instantie": "Parket bij de Hoge Raad", "datum": "2014-06-12", "gepubliceerd": "2025-08-01", "zaaknummer": "14/00521", "onderwerp": "Recht van overgang; partnervrijstelling niet-ingezetene en vrij kapitaalverkeer", "samenvatting": "Erflater, Nederlander, overleed in 2008 in Duitsland nadat hij Nederland meer dan tien jaar eerder metterwoon had verlaten; zijn weduwe en enig erfgename verkreeg Nederlandse onroerende zaken met een saldowaarde van € 270.799, zijnde 78% van de gehele verkrijging, waarover een aanslag in het recht van overgang van € 39.144 werd opgelegd onder de SW zoals die tot 2010 luidde, toen nog recht van successie en recht van overgang. In geschil is of het onthouden van de partnervrijstelling van art. 32, lid 1, ten 4e, letter a, SW 1956 aan een beperkt belastingplichtige in strijd is met het vrije kapitaalverkeer; de Rechtbank achtte het geval gelijk aan HvJ EU 17 oktober 2013, C-181/12 (Welte) en vernietigde de aanslag. A-G Wattel meent dat uit Mattner en Welte volgt dat het enkele verschil tussen beperkte en onbeperkte belastingplicht geen grond is de vrijstelling te weigeren, omdat de ratio van de partnervrijstelling losstaat van ingezetenschap, zodat aan belanghebbende 78% van de vrijstelling toekomt; de binnenlandse-boedelmethode zonder vrijstellingen uit HR BNB 2009/209 acht hij na Welte niet meer toegestaan. De conclusie strekt tot ongegrondverklaring van het cassatieberoep van de Staatssecretaris.", "rechtsregel": "Het vrije kapitaalverkeer verzet zich ertegen dat aan de verkrijger van een niet-ingezeten erflater de partnervrijstelling volledig wordt onthouden; de situsstaat moet die vrijstelling fractioneel toekennen naar rato van het door hem belaste deel van de verkrijging, een regel die door de afschaffing van het recht van overgang per 1 januari 2010 haar praktische betekenis heeft verloren.", "wetsartikelen": ["art. 1 SW 1956", "art. 24 SW 1956", "art. 32 SW 1956", "art. 36 SW 1956", "art. 63 VWEU", "art. 65 VWEU", "art. 2.1 Wet IB 2001", "art. 81 RO"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Het recht van overgang is per 1 januari 2010 afgeschaft, zodat de vraag naar toekenning van de partnervrijstelling aan beperkt belastingplichtige verkrijgers zich onder het huidige recht niet meer voordoet.", "gerelateerd": ["ECLI:NL:HR:2015:32"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2014:585"}, {"ecli": "ECLI:NL:HR:2014:687", "instantie": "Hoge Raad", "datum": "2014-03-28", "gepubliceerd": "2025-08-01", "zaaknummer": "13/02363", "onderwerp": "BOF beperkt tot ondernemingsvermogen erflater; geen discriminatie", "samenvatting": "Zaak onder de SW zoals die tot 2010 luidde (recht van successie; bedrijfsopvolgingsfaciliteit van hoofdstuk IIIA, art. 35b en 35c SW, tekst 2007). Erflater overleed op 8 januari 2007; belanghebbende was enig erfgenaam onder de verplichting enkele legaten af te geven en wendde een deel van het verkregen vermogen onmiddellijk aan in zijn eigen onderneming, waardoor het tot zijn verplichte ondernemingsvermogen ging behoren. In geschil was of hij daarom een beroep op de faciliteit kon doen, ook al vormde het verkregene bij de erflater geen ondernemingsvermogen. De Hoge Raad verwerpt het beroep op het discriminatieverbod onder verwijzing naar HR 22 november 2013, ECLI:NL:HR:2013:1212, BNB 2014/31, en oordeelt dat de wetgever met de beperking van de faciliteit tot vermogen dat bij de erflater tot diens ondernemingsvermogen behoorde binnen zijn ruime beoordelingsvrijheid is gebleven; die beperking sluit aan bij het doel van de faciliteit (vergemakkelijking van bedrijfsopvolgingen) en is niet van elke redelijke grond ontbloot. De overige klachten worden met toepassing van art. 81 Wet RO verworpen.", "rechtsregel": "De beperking van de bedrijfsopvolgingsfaciliteit tot vermogen dat bij de erflater tot diens ondernemingsvermogen behoorde is niet in strijd met art. 26 IVBPR en art. 14 EVRM, ook niet indien het verkregene bij de erfgenaam onmiddellijk tot diens (verplichte) ondernemingsvermogen gaat behoren; dit uitgangspunt geldt ook onder de BOR van na 2010.", "wetsartikelen": ["art. 35b SW 1956 (tekst 2007)", "art. 35c SW 1956 (tekst 2007)", "art. 26 IVBPR", "art. 14 EVRM", "art. 81 Wet RO"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2013:1367", "ECLI:NL:GHSHE:2013:BZ7841"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2014:687"}, {"ecli": "ECLI:NL:HR:2014:344", "instantie": "Hoge Raad", "datum": "2014-02-21", "gepubliceerd": "2026-02-18", "zaaknummer": "12/05289", "onderwerp": "Nieuwe aanslag schenkingsrecht na vernietiging wegens gebrekkige tenaamstelling", "samenvatting": "In een gebruiksovereenkomst van 5 oktober 1999 over een woonhuis lag een schenking van belanghebbende en zijn echtgenote aan hun zoon besloten; ter zake daarvan was op 5 november 2004 een gezamenlijke aanslag ten name van '[X] en echtgenote' opgelegd, die bij HR 19 februari 2010, ECLI:NL:HR:2010:BL4316, was vernietigd omdat verkrijgingen van meerdere verkrijgers niet in een gezamenlijke aanslag mogen worden betrokken. In geschil was of de Inspecteur in 2011 alsnog afzonderlijke aanslagen mocht opleggen en of de aanvang van de aanslagtermijn van art. 66 SW 1956 (inschrijving van de akte van overlijden) verenigbaar is met art. 26 IVBPR en art. 14 EVRM. De Hoge Raad oordeelt dat met de vernietigde gezamenlijke aanslag nog geen aanslag ter zake van de eigen verkrijging van belanghebbende was opgelegd, zodat van een tweede aanslag over dezelfde verkrijging geen sprake is, en dat art. 66 SW 1956 geen aanknopingspunt biedt voor een aanvang van de termijn op het moment waarop de inspecteur met de schenking bekend wordt; de wetgever is binnen zijn ruime beoordelingsmarge gebleven.", "rechtsregel": "Een vernietigde, aan meerdere verkrijgers gezamenlijk opgelegde aanslag schenkingsrecht is geen aanslag ter zake van de individuele verkrijging, zodat de inspecteur daarna binnen de termijn van art. 66 SW 1956 alsnog per verkrijger een aanslag mag opleggen.", "wetsartikelen": ["art. 37 SW 1956", "art. 66 SW 1956", "art. 26 IVBPR", "art. 14 EVRM", "art. 81 lid 1 Wet RO"], "belang": "hoog", "oordeel": "ongegrond", "parallelzaken": ["ECLI:NL:HR:2014:345"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2014:344"}, {"ecli": "ECLI:NL:HR:2014:339", "instantie": "Hoge Raad", "datum": "2014-02-21", "gepubliceerd": "2025-08-01", "zaaknummer": "13/00455", "onderwerp": "Art. 21, lid 5, SW; WOZ-waarde woning naar peildatum 1 januari 2009", "samenvatting": "Erflaatster overleed op 1 november 2010; de woning had een WOZ-waarde voor 2010 (peildatum 1 januari 2009) van EUR 395.000, terwijl de WOZ-waarde naar peildatum 1 januari 2010 EUR 350.000 bedroeg en de woning in februari 2011 voor EUR 348.000 werd verkocht. In geschil was of de erfbelasting naar de hogere waarde mocht worden geheven. De Hoge Raad oordeelt dat art. 21, lid 5, SW (tekst 2010) als bijzondere waarderingsregel voorgaat op de hoofdregel van het eerste lid, dat de WOZ-procedure - mede via art. 26 Wet WOZ voor erfgenamen - voldoende procedurele waarborgen biedt in de zin van art. 1 Eerste Protocol EVRM, en dat de wetgever omwille van uitvoeringsvereenvoudiging een zekere ruwheid mocht aanvaarden; van een individuele buitensporige last is geen sprake. Ook het beroep op een bedoelde tegenbewijsmogelijkheid faalt, nu een daartoe strekkend amendement is verworpen.", "rechtsregel": "De waarderingsregel van art. 21, lid 5, SW 1956 gaat als bijzondere regel voor op de hoofdregel van het eerste lid, en het hanteren van de WOZ-waarde naar een aanzienlijk voor het overlijden gelegen waardepeildatum blijft binnen de ruime beoordelingsvrijheid van de wetgever onder art. 1 Eerste Protocol EVRM; de regel geldt in deze vorm alleen voor de tekst van 2010 en 2011.", "wetsartikelen": ["art. 21 SW 1956", "art. 1 Eerste Protocol EVRM", "art. 26 Wet WOZ"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Art. 21, lid 5, SW 1956 is met ingang van 1 januari 2012 gewijzigd (zonder terugwerkende kracht), zodat het arrest slechts ziet op de tekst zoals die in 2010 en 2011 luidde.", "gerelateerd": ["ECLI:NL:PHR:2013:1312", "ECLI:NL:RBSGR:2012:BY8894"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2014:339"}, {"ecli": "ECLI:NL:RBZWB:2013:8767", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2013-12-04", "gepubliceerd": "2026-02-18", "zaaknummer": "AWB-12_4836", "onderwerp": "Recht van overgang; partnervrijstelling en vrij verkeer van kapitaal", "samenvatting": "Erflater had de Nederlandse nationaliteit maar woonde bij zijn overlijden in 2008 al langer dan tien jaar in Duitsland; zijn echtgenote verkreeg in Nederland gelegen onroerende zaken met een waarde van EUR 648.000 (verkrijging na hypotheekschulden EUR 270.799), waarover EUR 39.144 recht van overgang werd geheven. In geschil was of het onthouden van de partnervrijstelling van artikel 32, eerste lid, ten vierde, onderdeel a, SW 1956 bij het recht van overgang verenigbaar is met het Unierecht. De rechtbank oordeelt onder verwijzing naar HvJ EU 17 oktober 2013, C-181/12 (Welte) dat er geen objectief verschil bestaat dat de zwaardere belasting van de niet-inwonersituatie rechtvaardigt, en dat het door de inspecteur benadrukte verschil tussen het Nederlandse en het Duitse stelsel (koppeling tussen omvang heffingsobject en vrijstelling) niet tot een ander oordeel leidt. Het beroep is gegrond en de aanslag wordt vernietigd omdat de vrijstelling de verkrijging overtreft.", "rechtsregel": "Het onthouden van de partnervrijstelling van artikel 32 SW 1956 bij de heffing van het recht van overgang van een niet in Nederland wonende erflater en verkrijger is in strijd met het vrije verkeer van kapitaal.", "wetsartikelen": ["art. 32 SW 1956", "art. 56 EG", "art. 58 EG", "art. 7:15 Awb"], "belang": "hoog", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:HR:2015:32"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2013:8767"}, {"ecli": "ECLI:NL:HR:2013:1210", "instantie": "Hoge Raad", "datum": "2013-11-22", "gepubliceerd": "2025-08-01", "zaaknummer": "13/01161", "onderwerp": "Bedrijfsopvolgingsfaciliteit niet in strijd met discriminatieverbod (tekst 2011)", "samenvatting": "Belanghebbende verkreeg in 2011 als kind een nalatenschap waartoe geen ondernemingsvermogen behoorde en betoogde in deze proefprocedure dat hij niettemin recht had op de bedrijfsopvolgingsfaciliteit van hoofdstuk IIIA SW 1956, omdat het onderscheid met verkrijgers van ondernemingsvermogen discriminerend is. De Hoge Raad oordeelt dat verkrijgingen van ondernemingsvermogen en van ander vermogen voor de erfbelasting wel degelijk gelijke gevallen zijn, zodat het onderscheid rechtvaardiging behoeft, maar dat de wetgever met de faciliteit gerechtvaardigde doelen nastreeft (voorkomen van liquiditeitsproblemen, continuiteit van familiebedrijven, stimulering van ondernemerschap). Dat aan de opeenvolgende verhogingen van het vrijstellingspercentage geen gedegen empirisch onderzoek ten grondslag ligt maakt de keuze niet evident van redelijke grond ontbloot; de wetgever mag zich op veronderstellingen baseren zolang die niet evident onredelijk zijn. Het beroep is ongegrond.", "rechtsregel": "Verkrijgingen van ondernemingsvermogen en van overig vermogen zijn voor de heffing van schenk- en erfbelasting gelijke gevallen, maar de bedrijfsopvolgingsfaciliteit berust op een keuze van de wetgever die niet evident van redelijke grond is ontbloot en levert daarom geen verboden discriminatie op.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 35d SW 1956", "art. 35e SW 1956", "art. 35f SW 1956", "art. 21 SW 1956", "art. 26 IVBPR", "art. 14 EVRM", "art. 1 Eerste Protocol EVRM", "art. 1 Twaalfde Protocol EVRM", "art. 7:1a Awb", "art. 81 Wet RO"], "belang": "hoog", "oordeel": "ongegrond", "parallelzaken": ["ECLI:NL:HR:2013:1206", "ECLI:NL:HR:2013:1209", "ECLI:NL:HR:2013:1211"], "gerelateerd": ["ECLI:NL:PHR:2013:860", "ECLI:NL:RBONE:2013:BZ5236"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2013:1210"}, {"ecli": "ECLI:NL:HR:2013:1212", "instantie": "Hoge Raad", "datum": "2013-11-22", "gepubliceerd": "2025-08-01", "zaaknummer": "13/02453", "onderwerp": "BOR en discriminatieverbod; geen vrijstelling zonder voortzetting (tekst 2009)", "samenvatting": "De in gemeenschap van goederen gehuwde weduwe verkreeg uit de in 2009 opengevallen nalatenschap EUR 2.369.359 en betaalde EUR 436.384 aan recht van successie (SW zoals die tot 2010 luidde); de bedrijfsopvolgingsfaciliteit was niet toegepast omdat de aandelen in 2010 waren verkocht en dus niet aan het voortzettingsvereiste was voldaan. De Rechtbank achtte de verruiming van de faciliteit tot 75 procent per 2007 in strijd met het discriminatieverbod en verminderde de aanslag. De Hoge Raad vernietigt die uitspraak op dezelfde gronden als in zijn arresten van 22 november 2013: de faciliteit dient gerechtvaardigde doelen en de keuze van de wetgever is niet evident van redelijke grond ontbloot. Ook het subsidiaire beroep op art. 1 Eerste Protocol EVRM faalt, omdat de heffing een legitieme wettelijke grondslag heeft, in het algemeen belang plaatsvindt en voor belanghebbende geen buitensporige last oplevert; het beroep bij de Rechtbank wordt alsnog ongegrond verklaard.", "rechtsregel": "Het ontbreken van de bedrijfsopvolgingsfaciliteit bij een verkrijging die niet aan het voortzettingsvereiste voldoet levert geen verboden discriminatie en geen individuele buitensporige last op, nu de wetgever met de faciliteit binnen zijn ruime beoordelingsvrijheid is gebleven.", "wetsartikelen": ["art. 1 SW 1956", "art. 35b SW 1956", "art. 35c SW 1956", "art. 26 IVBPR", "art. 14 EVRM", "art. 1 Eerste Protocol EVRM", "art. 1 Twaalfde Protocol EVRM", "art. 7:1a Awb"], "belang": "hoog", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:PHR:2013:862", "ECLI:NL:RBZWB:2013:BZ8593"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2013:1212"}, {"ecli": "ECLI:NL:PHR:2013:1312", "instantie": "Parket bij de Hoge Raad", "datum": "2013-11-12", "gepubliceerd": "2026-02-20", "zaaknummer": "13/00455", "onderwerp": "Erfbelasting; waardering leegstaande woning naar WOZ-waarde art. 21 lid 5 SW", "samenvatting": "Erflaatster overleed op 1 november 2010; haar woning had voor 2010 een WOZ-waarde van EUR 395.000 (peildatum 1 januari 2009) maar werd op 17 februari 2011 verkocht voor EUR 348.000, waarna de Inspecteur de aangifte corrigeerde naar de WOZ-waarde. A-G IJzerman concludeert dat art. 21, lid 5, SW 1956 (tekst 2010-2012) ook geldt voor een na het overlijden leegstaande, te koop staande woning, omdat maatgevend is hoe de onroerende zaak tot het overlijden werd gebruikt, en dat deze bijzondere waarderingsregel als lex specialis voorgaat op de hoofdregel van art. 21, lid 1, SW 1956. Het ontbreken van een tegenbewijsregeling levert geen schending op van art. 1 Eerste Protocol EVRM - het gaat om een materiele maatstafbepaling met voldoende processuele waarborgen en een effectief tarief van 9,38 procent vormt geen individuele en buitensporige last - en voor anticiperende toepassing van de latere tegenbewijsregeling bestaat geen grond. De conclusie strekt tot ongegrondverklaring.", "rechtsregel": "Voor de erfbelasting geldt het waarderingsvoorschrift van art. 21, lid 5, SW 1956 als lex specialis ook voor een door het overlijden leeggekomen woning, zonder dat een lagere latere verkoopprijs als tegenbewijs kan dienen.", "wetsartikelen": ["art. 21 lid 1 SW 1956", "art. 21 lid 5 SW 1956", "art. 18 lid 2 Wet WOZ", "art. 1 Eerste Protocol EVRM", "art. 11 Wet algemene bepalingen"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2013:1312"}, {"ecli": "ECLI:NL:RBZWB:2013:8011", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2013-11-12", "gepubliceerd": "2026-02-18", "zaaknummer": "AWB-13_2341", "onderwerp": "Successierecht; ontbreken procesbelang na vermindering aanslag tot nihil", "samenvatting": "Aan belanghebbende was wegens een verkrijging in 2006 ambtshalve een aanslag successierecht van € 11.807 opgelegd, die de inspecteur bij uitspraak op bezwaar uit coulance tot nihil verminderde. In beroep betwistte belanghebbende de omvang en de verdeling van de nalatenschap. De rechtbank verklaart het beroep niet-ontvankelijk wegens ontbrekend procesbelang: nu de aanslag al nihil bedraagt kan de rechter belanghebbende niet in een gunstiger positie brengen en mag hij de aanslag niet verhogen; voor een reprimande aan de inspecteur ontbreekt een juridische grondslag.", "rechtsregel": "Procesbelang ontbreekt indien de bestreden belastingaanslag reeds tot nihil is verminderd, omdat de belastingrechter de aanslag niet kan verhogen en de omvang of verdeling van de nalatenschap in de fiscale procedure geen zelfstandig belang oplevert.", "belang": "laag", "oordeel": "n.v.t.", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2013:8011"}, {"ecli": "ECLI:NL:RBZWB:2013:8307", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2013-11-06", "gepubliceerd": "2026-02-18", "zaaknummer": "AWB-12_2356", "onderwerp": "Gedogen van bewoning om niet is geen schenking; geen verarming ouders", "samenvatting": "Belanghebbende bewoonde in 2010 met zijn gezin om niet een woning van zijn ouders, die de volledige beschikkingsmacht behielden en het verblijf op elk moment konden beëindigen; de huurwaarde van € 49.428 was als schenking aangegeven. De rechtbank oordeelt dat weliswaar sprake is van verrijking van belanghebbende, maar niet van de voor een schenking vereiste verarming van de ouders: de waarde in het economische verkeer van de woning wijzigt niet door de gedoogsituatie en de gederfde huur heeft nooit tot hun vermogen behoord (vgl. HR 26 februari 1986, BNB 1986/163, en HR 8 juli 1996, BNB 1996/290). De aanslag wordt verminderd tot een schenking vrij van recht van € 9.802; beroep gegrond.", "rechtsregel": "Het van dag tot dag gedogen van bewoning om niet, waarbij de eigenaar de volledige beschikkingsmacht behoudt, leidt niet tot verarming van de eigenaar en vormt daarom geen belastbare schenking in de zin van de Successiewet 1956.", "wetsartikelen": ["art. 33 SW 1956"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2013:8307"}, {"ecli": "ECLI:NL:GHAMS:2013:2717", "instantie": "Gerechtshof Amsterdam", "datum": "2013-08-29", "gepubliceerd": "2026-02-18", "zaaknummer": "12-00472", "onderwerp": "Art. 7 SW: kwijtgescholden koopsom niet opgeofferd; art. 10 SW huurschuld", "samenvatting": "Erflaatster verkocht in 2002 haar woning aan haar zoon voor EUR 216.000, schold direct EUR 34.025 kwijt en schold de resterende schuld van EUR 181.975 in de jaren 2002 tot en met 2009 volledig kwijt, terwijl zij de woning terughuurde voor EUR 650 per maand en de huur (met rente EUR 71.400) nooit betaalde. In geschil is of het kwijtgescholden bedrag op grond van artikel 7 SW 1956 in mindering komt op de fictieve verkrijging van artikel 10 SW 1956 en of de onbetaalde huur onder artikel 10 SW 1956 valt. Het Hof oordeelt dat, gelet op het rechtstreekse verband tussen de bedongen koopsom en de van meet af aan voorgenomen en volledig uitgevoerde kwijtscheldingen, niets is opgeofferd, zodat aftrek is uitgesloten. De niet betaalde huur is een vruchtgebruik als bedoeld in artikel 10, lid 2, SW 1956; vrijgevigheid is daarvoor niet vereist.", "rechtsregel": "Artikel 7 SW 1956 laat geen aftrek toe voor zover de door de erflater bedongen tegenprestatie door hem is kwijtgescholden en dus niet werkelijk door de verkrijger is opgeofferd; het onbetaald laten van een reele huurschuld levert een genot van vruchtgebruik in de zin van artikel 10 SW 1956 op, ook zonder vrijgevigheid.", "wetsartikelen": ["art. 7 SW 1956", "art. 10 SW 1956"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:HR:2014:2921"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHAMS:2013:2717"}, {"ecli": "ECLI:NL:HR:2013:26", "instantie": "Hoge Raad", "datum": "2013-07-12", "gepubliceerd": "2025-08-01", "zaaknummer": "12/01745", "onderwerp": "BOR; ondernemingsschulden en IB-latentie als tegenprestatie of last", "samenvatting": "Bij de ontbinding van een maatschap in 2004 verkreeg belanghebbende het ondernemingsvermogen van haar ouders inclusief de daartoe behorende schulden (waaronder een hypothecaire schuld van EUR 487.600); van de overbedeling van EUR 1.415.419 werd EUR 1.202.691 geschonken en werd EUR 62.728 voldaan doordat de latente inkomstenbelasting over de stille reserves voor haar rekening kwam. In geschil was of die schulden en die latentie bij de berekening van de voorwaardelijk onbelaste geconserveerde waarde gelden als tegenprestatie of last in de zin van art. 7c Uitvoeringsregeling SW 1956, onder de SW zoals die tot 2010 luidde (art. 35b en 35c SW, tekst 2004). De Hoge Raad oordeelt dat een verkrijging van ondernemingsvermogen niet mag worden gesplitst in bezittingen en daartegenover de overname van de bijbehorende schulden, zodat die schulden geen tegenprestatie of last vormen; het Hof paste het gelijkheidsbeginsel ten onrechte toe op rechtens verschillende gevallen. De voor rekening van de begiftigde komende latente IB-schuld, die normaliter van de schenkers zou zijn geheven, is wel een tegenprestatie; verwijzing volgt voor een hernieuwde berekening.", "rechtsregel": "Tot het overgedragen ondernemingsvermogen behorende schulden die de verkrijger in het kader van de bedrijfsopvolging overneemt vormen geen tegenprestatie of last, maar de door de verkrijger overgenomen latente inkomstenbelastingschuld over de stille reserves wel.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 7c Uitvoeringsregeling SW 1956", "art. 3.63 Wet IB 2001"], "belang": "hoog", "oordeel": "verwijzing", "gerelateerd": ["ECLI:NL:PHR:2013:BZ3560", "ECLI:NL:GHLEE:2012:BV6798"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2013:26"}, {"ecli": "ECLI:NL:HR:2013:31", "instantie": "Hoge Raad", "datum": "2013-07-12", "gepubliceerd": "2025-08-01", "zaaknummer": "12/02319", "onderwerp": "Art. 21 SW; waardering Chinese pot naar later gerealiseerde veilingopbrengst", "samenvatting": "Tot de nalatenschap van de in november 2003 overleden erflater behoorde een zeer zeldzame Chinese pot, in de aangifte begrepen in een post kunstvoorwerpen van EUR 12.500 en op 12 juli 2005 bij Christie's geveild voor EUR 23.000.000; de inspecteur legde navorderingsaanslagen in het recht van successie op naar die veilingopbrengst (SW zoals die tot 2010 luidde). Rechtbank en Hof stelden de waarde op de overlijdensdatum schattenderwijs vast op EUR 10.000.000, uitgaande van de veilingprijs en rekening houdend met een marktstijging van ten minste 100 procent en toenemende schaarste. De Hoge Raad verwerpt de klachten: het Hof mocht bij gebreke van een verkoopprijs op overlijdensdatum en nu geen van beide partijen haar waarde aannemelijk had gemaakt de later gerealiseerde prijs tot uitgangspunt nemen, ook bij een tussenliggende periode van twintig maanden, en de schatting van de invloed van de marktontwikkelingen is aan de feitenrechter voorbehouden.", "rechtsregel": "Ontbreekt een verkoopprijs op de overlijdensdatum en maakt geen van de partijen de door haar verdedigde waarde aannemelijk, dan mag de feitenrechter de waarde in het economische verkeer schattenderwijs bepalen met de later gerealiseerde verkoopprijs als uitgangspunt, gecorrigeerd voor de marktontwikkelingen in de tussenliggende periode.", "wetsartikelen": ["art. 21 SW 1956"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2013:BZ8588"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2013:31"}, {"ecli": "ECLI:NL:RBDHA:2013:7035", "instantie": "Rechtbank Den Haag", "datum": "2013-05-21", "gepubliceerd": "2026-02-18", "zaaknummer": "AWB-12_5986", "onderwerp": "ANBI-status oldtimermuseum ingetrokken per 1 januari 2008", "samenvatting": "Een in 2005 opgerichte stichting die statutair de exploitatie van een oldtimermuseum beoogt, was per 1 januari 2008 als ANBI aangemerkt; na boekenonderzoek is die status bij beschikking van 21 november 2011 met ingang van 1 januari 2008 ingetrokken, waarna op 15 mei 2012 een aanslag recht van successie is opgelegd over de in 2008 verkregen nalatenschap van € 2.381.671. De rechtbank oordeelt dat bij de ANBI-toets niet alleen op de statutaire doelstelling maar ook op hetgeen de instelling in werkelijkheid nastreeft moet worden gelet, en dat de feitelijke werkzaamheden – een nauwelijks ontsloten collectie die enkele uren per week te bezichtigen was – niet voor ten minste 50 percent het algemeen belang dienen. Omdat de beoordeling van de daadwerkelijke handelwijze een toets achteraf impliceert, kan aan de afgifte van de ANBI-beschikking op zichzelf geen vertrouwen worden ontleend en stond het de inspecteur vrij de beschikking met terugwerkende kracht in te trekken; ook het beroep op uitlatingen van de staatssecretaris en op het gelijkheidsbeginsel (muziekverenigingen) faalt.", "rechtsregel": "Of een instelling een ANBI is, wordt beoordeeld aan de hand van zowel de statutaire doelstelling als de feitelijke werkzaamheden, welke toets naar zijn aard achteraf plaatsvindt, zodat aan de afgifte van de ANBI-beschikking op zichzelf geen in rechte te beschermen vertrouwen kan worden ontleend.", "wetsartikelen": ["art. 6.33 Wet IB 2001", "art. 41a Uitvoeringsregeling inkomstenbelasting 2001"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2013:7035"}, {"ecli": "ECLI:NL:HR:2013:BY8161", "instantie": "Hoge Raad", "datum": "2013-05-03", "gepubliceerd": "2026-02-18", "zaaknummer": "12/02197", "onderwerp": "Periodieke gift uitgevoerd door erfgenamen; schenkingsrecht als andere gift", "samenvatting": "Erflaatster schonk in 2001 bij notariele akte aan een ANBI een recht op periodieke uitkeringen van jaarlijks 16.000 certificaten 'vrij van recht'; na haar overlijden in 2002 voerden de erfgenamen de termijn 2002 pas in 2003 uit en werd in 2003 het schenkingsrecht van EUR 182.417 ten laste van de boedel betaald. De Hoge Raad oordeelt dat waardeverschuiving en vrijgevigheid moeten worden beoordeeld naar het moment waarop de schenkingsovereenkomst tot stand komt, dat de op de erfgenamen overgegane verplichting niet van aard verandert en op een notariele akte blijft berusten, en dat voor de eis van vaste en gelijkmatige uitkeringen bepalend zijn de verplichtingen uit de schenkingsovereenkomst en niet de feitelijk verrichte uitkeringen. De verplichting is in 2002 niet rentedragend geworden in de zin van artikel 6.40, letter d, Wet IB 2001, zodat beide termijnen in 2003 aftrekbaar zijn; het betaalde schenkingsrecht is een andere gift in de zin van artikel 6.35 Wet IB 2001, waardoor de persoonsgebonden aftrek op EUR 90.851 wordt gesteld.", "rechtsregel": "Of bij de uitvoering van een schenkingsovereenkomst sprake is van een waardeverschuiving en van vrijgevigheid, en of de uitkeringen vast en gelijkmatig zijn, moet worden beoordeeld naar het moment waarop die overeenkomst tot stand kwam en aan de hand van de daaruit voortvloeiende verplichtingen, ook indien die verplichtingen krachtens erfrecht op de erfgenamen zijn overgegaan.", "wetsartikelen": ["art. 6.32 Wet IB 2001", "art. 6.33 Wet IB 2001", "art. 6.34 Wet IB 2001", "art. 6.35 Wet IB 2001", "art. 6.38 Wet IB 2001", "art. 6.39 Wet IB 2001", "art. 6.40 Wet IB 2001", "art. 81 Wet RO"], "belang": "middel", "oordeel": "cassatie", "parallelzaken": ["ECLI:NL:HR:2013:BY8117"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2013:BY8161"}, {"ecli": "ECLI:NL:HR:2013:BY8780", "instantie": "Hoge Raad", "datum": "2013-04-12", "gepubliceerd": "2026-02-18", "zaaknummer": "12/01402", "onderwerp": "Fideicommissaire nadere verkrijging vormt met eerdere verkrijging een geheel", "samenvatting": "Belanghebbenden verkregen in 1999 ieder EUR 143.393 uit de nalatenschap van hun vader en in 2007, bij het overlijden van de bezwaarde echtgenote, ieder EUR 123.472 uit hoofde van de fideicommissaire making; de inspecteur berekende het successierecht over de nadere verkrijging naar evenredigheid op EUR 17.848. De Hoge Raad oordeelt dat uit de samenhang van de artikelen 1, 5 en 24 SW 1956 volgt dat onder de belaste verkrijging moet worden verstaan al wat de belastingplichtige uit een nalatenschap verkrijgt verminderd met de toepasselijke vrijstellingen, zodat beide verkrijgingen tezamen het tarief bepalen en vrijstellingen niet nogmaals kunnen worden toegepast. Omdat de SW geen voorschrift bevat om dubbele heffing over het reeds eerder verkregene te vermijden, ligt het mede u
