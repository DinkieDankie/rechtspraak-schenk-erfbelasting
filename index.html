klaard en de beroepen zijn met toepassing van artikel 8:54 Awb kennelijk ongegrond.", "rechtsregel": "Tegen een aan een overledene opgelegde belastingaanslag kunnen op grond van artikel 26a AWR alleen de erfgenaam of de executeur rechtsmiddelen aanwenden; een enkele schuldeiser van de nalatenschap kan dat niet.", "wetsartikelen": ["art. 26a AWR", "art. 8:54 Awb", "art. 4:7 BW", "art. 4:80 BW"], "belang": "laag", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:313"}, {"ecli": "ECLI:NL:GHDHA:2026:72", "instantie": "Gerechtshof Den Haag", "datum": "2026-01-22", "gepubliceerd": "2026-05-13", "zaaknummer": "BK-25/483", "onderwerp": "Ambtshalve aanslag erfbelasting; uitstel zitting en gestelde onwaardigheid", "samenvatting": "Na het overlijden van erflater in 2021 zonder testament is geen aangifte erfbelasting gedaan en is aan belanghebbende ambtshalve een aanslag opgelegd, die na bezwaar en beroep is verminderd tot een belaste verkrijging van € 196.622 (€ 26.449 erfbelasting). Het Hof wijst het verzoek om uitstel van de zitting af omdat belanghebbendes vragen rond de doodsoorzaak van erflater zonder nadere toelichting geen invloed hebben op de hoogte van de aanslag, en oordeelt dat ook de Rechtbank het uitstelverzoek op goede gronden en voldoende gemotiveerd heeft afgewezen. Inhoudelijk faalt het beroep: van omkering van de bewijslast is geen sprake, belanghebbende heeft niets aangevoerd waaruit volgt dat de omvang van de nalatenschap te hoog is vastgesteld, voor de stelling dat een broer onwaardig is om te erven (artikel 4:3, lid 1, letter d, BW) is geen begin van bewijs geleverd - en die stelling zou de verkrijging juist vergroten - en advocaatkosten zijn geen schuld van de nalatenschap in de zin van artikel 4:7 BW of last in de zin van artikel 20 SW 1956.", "rechtsregel": "De omvang van de nalatenschap en daarmee de hoogte van de aanslag erfbelasting staat los van de vraag wie als erfgenaam optreedt, zodat een gestelde onwaardigheid van een mede-erfgenaam op zichzelf geen grond is voor vermindering van de aanslag of voor uitstel van de zitting.", "wetsartikelen": ["art. 20 SW 1956", "art. 4:3, lid 1, letter d, BW", "art. 4:7 BW", "art. 4:10 BW", "art. 4:11 BW", "art. 4:13 BW", "art. 8:56 Awb", "art. 6 EVRM"], "belang": "laag", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHDHA:2026:72"}, {"ecli": "ECLI:NL:RBNHO:2026:1201", "instantie": "Rechtbank Noord-Holland", "datum": "2026-01-20", "gepubliceerd": "2026-02-10", "onderwerp": "Erfbelasting: waardering huurrecht, indexatie, metterwoonclausule", "samenvatting": "Erflater verleende eiseres bij huurverklaring een levenslang huurrecht voor €500/maand (niet-zakelijk). Verweerder belastte dit o.g.v. art. 12 SW 1956 als fictieve erfrechtelijke verkrijging. Geschil: (1) moet indexatiemogelijkheid meewegen bij waardering? (2) rechtvaardigt impliciete metterwoonclausule 25% afwaardering? Rechtbank: ja op beide vragen. Verkrijging verminderd van €140.017 naar €96.625. Beroep gegrond.", "rechtsregel": "Bij waardering van een huurrecht ex art. 12 SW 1956 moet rekening worden gehouden met een contractuele indexatiemogelijkheid (huur is periodieke uitkering tot onzeker jaarlijks bedrag); een impliciete metterwoonclausule rechtvaardigt een afwaardering van 25%.", "wetsartikelen": ["art. 12 SW 1956", "art. 21 lid 11 SW 1956", "art. 8 Uitv.besl. SW 1956"], "belang": "hoog", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNHO:2026:1201"}, {"ecli": "ECLI:NL:RBZWB:2026:208", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2026-01-20", "gepubliceerd": "2026-01-22", "zaaknummer": "BRE 24/6930", "onderwerp": "Erfbelasting; beroep niet-ontvankelijk bij ontbrekende machtiging of verklaring van erfrecht", "samenvatting": "Tegen een aanslag erfbelasting is beroep ingesteld door een gestelde gemachtigde die geen machtiging heeft overgelegd en evenmin bewijs, zoals een verklaring van erfrecht, dat zij als executeur van de nalatenschap is aangewezen. De rechtbank heeft bij bericht van 4 november 2025 een hersteltermijn van vier weken geboden, die ongebruikt is verstreken zonder verontschuldiging voor het verzuim. Het beroep is met toepassing van artikel 8:54 Awb zonder zitting kennelijk niet-ontvankelijk verklaard.", "rechtsregel": "Wie namens een ander beroep instelt tegen een aanslag erfbelasting moet op verzoek van de rechtbank een machtiging of een verklaring van erfrecht waaruit het executeurschap blijkt overleggen; blijft herstel van dat verzuim uit, dan is het beroep niet-ontvankelijk.", "wetsartikelen": ["art. 8:54 Awb", "art. 8:24 Awb", "art. 6:6 Awb"], "belang": "laag", "oordeel": "n.v.t.", "parallelzaken": ["ECLI:NL:RBZWB:2026:204"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:208"}, {"ecli": "ECLI:NL:GHDHA:2026:20", "instantie": "Gerechtshof Den Haag", "datum": "2026-01-15", "gepubliceerd": "2026-02-27", "zaaknummer": "BK-24/779", "onderwerp": "Verhoogde kindvrijstelling gehandicapt kind: onderhoudseis niet vervuld", "samenvatting": "Belanghebbende, die door de ziekte van Lyme niet kan werken en bij zijn in 2021 overleden moeder woonde, claimde de verhoogde kindvrijstelling van artikel 32, lid 1, onderdeel 4, sub b, SW 1956; de inspecteur paste de reguliere kindvrijstelling van € 21.282 toe bij een belaste verkrijging van € 29.095. Niet in geschil is dat belanghebbende voldoet aan de arbeidsongeschiktheidseis; het geschil betreft de onderhoudseis. Het Hof bevestigt dat 'grotendeels onderhouden' duidt op 50% of meer en oordeelt dat belanghebbende, op wie de bewijslast rust, niet aannemelijk heeft gemaakt dat erflaatster ten minste de helft van zijn kosten van levensonderhoud van € 6.472,20 in 2021 heeft gedragen; de overgelegde bankafschriften bieden zonder toelichting geen uitsluitsel, en de WSNP-aflossingen en de korting op de bijstandsuitkering wegens de kostendelersnorm doen daaraan niet af.", "rechtsregel": "Voor de verhoogde kindvrijstelling van artikel 32, lid 1, onderdeel 4, sub b, SW 1956 moet de verkrijger aannemelijk maken dat de erflater ten minste 50% van zijn kosten van levensonderhoud droeg; 'grotendeels onderhouden' betekent 50% of meer.", "wetsartikelen": ["art. 32, lid 1, onderdeel 4, sub b, SW 1956", "art. 32, lid 1, onderdeel 4, sub c, SW 1956", "art. 22a Participatiewet"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHDHA:2026:20"}, {"ecli": "ECLI:NL:RBDHA:2025:24087", "instantie": "Rechtbank Den Haag", "datum": "2025-12-09", "gepubliceerd": "2026-02-27", "zaaknummer": "AWB - 24 _ 8016", "onderwerp": "Mondelinge schenking van certificaten; schenkingstijdstip en aangiftebegrip", "samenvatting": "Eiser deed in september 2018 aangifte schenkbelasting van de schenking door zijn vader van 100 certificaten in een stichting administratiekantoor ter waarde van EUR 2.666.767, met 24 januari 2018 als schenkingsdatum; de inspecteur stelde zich later op het standpunt dat de schenking pas op 17 april 2018 (datum notariele akte) had plaatsgevonden en legde een tweede aanslag op naar een waarde van EUR 9.344.098. De rechtbank oordeelt dat eiser, gelet op de inleidende bepalingen en art. 1 van de notariele schenkingsakte en het aan de notaris toegezonden stappenplan, aannemelijk heeft gemaakt dat de schenking op 24 januari 2018 mondeling tot stand is gekomen en dat hij dat juist in zijn eerste aangifte heeft vermeld. De tweede aanslag is daarom, gelet op art. 66, lid 1, SW 1956, ten onrechte opgelegd en wordt vernietigd; ten overvloede overweegt de rechtbank dat een onjuiste vermelding van het schenkingstijdstip niet meebrengt dat geen aangifte is gedaan.", "rechtsregel": "Een schenking kan mondeling tot stand komen en de in een latere notariele akte vastgelegde datum van aanbod en aanvaarding is bepalend voor het belastbare feit; vermelding van een onjuist schenkingstijdstip in een overigens duidelijke aangifte brengt niet mee dat geen aangifte schenkbelasting is gedaan.", "wetsartikelen": ["art. 1 SW 1956", "art. 66 SW 1956", "art. 11 AWR", "art. 16 AWR"], "belang": "middel", "oordeel": "gegrond", "parallelzaken": ["ECLI:NL:RBDHA:2025:24091", "ECLI:NL:RBDHA:2025:24094", "ECLI:NL:RBDHA:2025:24089", "ECLI:NL:RBDHA:2025:24095", "ECLI:NL:RBDHA:2025:24085"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2025:24087"}, {"ecli": "ECLI:NL:GHSHE:2025:2772", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2025-10-08", "gepubliceerd": "2026-01-28", "zaaknummer": "23/970", "onderwerp": "Wederzijdse dwaling bij schenking; vermindering aanslag ex art. 53 SW", "samenvatting": "Belanghebbende ontving in 2014 een van schenkbelasting vrijgestelde eigenwoningschenking van EUR 70.624 en in 2018 een tweede schenking van EUR 29.375, waarvoor de inspecteur de eenmalig verhoogde vrijstelling weigerde en een aanslag van EUR 2.401 oplegde; belanghebbende betaalde de tweede schenking in februari 2021 aan zijn ouders terug. Het hof past het arrest HR 10 januari 2020, ECLI:NL:HR:2020:1 toe en acht voldoende aanknopingspunten verschaft voor wederzijdse rechtsdwaling over de toepasselijkheid van de vrijstelling, mede omdat de belastingadviseur van vader had bevestigd dat ook de tweede schenking vrijgesteld zou zijn en beide schenkingen samen net onder de 'jubelton' van EUR 100.000 bleven. De korte tijd tussen aanslag en terugbetaling maakt niet aannemelijk dat het beroep op vernietiging slechts is voorgewend, zodat de schenkingsovereenkomst rechtsgeldig is vernietigd en de aanslag op grond van artikel 53, lid 1, SW tot nihil moet worden verminderd.", "rechtsregel": "Vernietiging van een schenkingsovereenkomst wegens wederzijdse dwaling in de zin van artikel 6:228, lid 1, letter c, BW doet een ongedaanmakingsverplichting ontstaan waarvan de uitoefening leidt tot vermindering van de aanslag schenkbelasting op grond van artikel 53, lid 1, SW 1956, tenzij het beroep op vernietiging slechts is voorgewend.", "wetsartikelen": ["art. 53 SW 1956", "art. 82a SW 1956", "art. 6:228 BW", "art. 6:265 BW", "art. 6:271 BW"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2025:2772"}, {"ecli": "ECLI:NL:HR:2025:1328", "instantie": "Hoge Raad", "datum": "2025-10-03", "gepubliceerd": "2026-07-08", "zaaknummer": "24/01831", "onderwerp": "Kruislings schenken; eigenwoningvrijstelling art. 33 SW; fraus legis", "samenvatting": "Belanghebbende en zijn zus ontvingen in juli 2017 ieder EUR 100.000 van hun moeder [C] en een dag later ieder EUR 100.000 van [A]; de vier kinderen van [A] ontvingen in dezelfde periode ieder EUR 50.000 van [C], zodat beide ouders in 2017 elk EUR 200.000 aan de kinderen van de ander schonken. Belanghebbende deed voor beide schenkingen een beroep op de eenmalig verhoogde eigenwoningvrijstelling van art. 33, aanhef en onder 5°, letter c, respectievelijk onder 7°, SW 1956; de Inspecteur merkte de schenking van [A] aan als afkomstig van [C] en belastte EUR 94.680. De Hoge Raad verwerpt het cassatieberoep: of sprake is van een gift en wie de gift heeft gedaan wordt in beginsel civielrechtelijk beoordeeld (art. 1, lid 7, SW 1956 jo. art. 7:186, lid 2, BW), maar via wetsontduiking kan de schenking toch als afkomstig van de eigen ouder worden aangemerkt indien het ontgaan van schenkbelasting het doorslaggevende motief was en de kruislingse schenkingen zodanig op elkaar zijn afgestemd dat zij een samenstel van rechtshandelingen vormen.", "rechtsregel": "Bij kruislings schenken kan op grond van fraus legis een schenking van een derde voor de SW 1956 worden aangemerkt als schenking van de eigen ouder indien het ontgaan van schenkbelasting het doorslaggevende motief was en de schenkingen zodanig op elkaar zijn afgestemd - hetgeen behoudens tegenbewijs wordt aangenomen bij (nagenoeg) gelijke geschonken bedragen die gelijktijdig of kort na elkaar zijn gedaan - dat zij een samenstel van rechtshandelingen vormen.", "wetsartikelen": ["art. 33 aanhef en onder 5° letter c SW 1956", "art. 33 aanhef en onder 7° SW 1956", "art. 1 lid 7 SW 1956", "art. 7:186 lid 2 BW", "art. 6:253 BW"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2025:1328"}, {"ecli": "ECLI:NL:HR:2025:1327", "instantie": "Hoge Raad", "datum": "2025-10-03", "gepubliceerd": "2025-10-08", "zaaknummer": "24/01828", "onderwerp": "Schenkbelasting; kruislings schenken, vrijstelling eigen woning (oud)", "samenvatting": "Aan belanghebbende was een aanslag schenkbelasting opgelegd in verband met zogenoemd kruislings schenken met het oog op de verhoogde schenkingsvrijstelling voor de eigen woning van art. 33, onder 7, SW (oud), waarbij tevens een derdenbeding in de zin van art. 6:253 BW, fiscale herkwalificatie en fraus legis aan de orde waren. Het Hof Den Haag had het hoger beroep verworpen en A-G Koopman concludeerde tot ongegrondverklaring. De Hoge Raad verklaart het beroep in cassatie ongegrond op de gronden die zijn vermeld in het op dezelfde dag gewezen arrest in de zaak 24/01831, ECLI:NL:HR:2025:1328; het arrest bevat zelf geen dragende motivering.", "rechtsregel": "Het beroep faalt op de gronden vermeld in het gelijktijdig gewezen arrest in de parallelzaak; de dragende rechtsregel over kruislings schenken en de eigenwoningvrijstelling van art. 33, onder 7, SW (oud) is in dat arrest geformuleerd.", "wetsartikelen": ["art. 33 onder 7 SW 1956 (oud)", "art. 6:253 BW"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "De uitspraak ziet op de inmiddels vervallen verhoogde schenkingsvrijstelling voor de eigen woning van art. 33, onder 7, SW (in de uitspraak zelf aangeduid als oud SW), zodat de regel alleen nog voor oude jaren van belang is.", "gerelateerd": ["ECLI:NL:GHDHA:2024:646", "ECLI:NL:PHR:2024:1055", "ECLI:NL:HR:2025:1328"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2025:1327"}, {"ecli": "ECLI:NL:GHSHE:2025:2709", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2025-10-01", "gepubliceerd": "2026-01-07", "zaaknummer": "23/1458 tot en met 23/1464", "onderwerp": "Art. 82a SW en reikwijdte kennisgroepstandpunt eigenwoningvrijstelling", "samenvatting": "Belanghebbende ontving in 2008 een schenking onder schuldigerkenning van EUR 22.379 waarvoor de eenmalig verhoogde vrijstelling is toegepast; in 2017 verklaarden zij en haar ouders die schenking met wederzijdse toestemming vervallen. Voor schenkingen van EUR 67.500 (2018) en EUR 33.300 (2019) claimde zij de eigenwoningvrijstelling. Het hof oordeelt dat de schenking uit 2008 niet van rechtswege is ontbonden, niet kon worden herroepen (die bevoegdheid was niet bedongen) en niet wegens dwaling is vernietigd, zodat zich geen geval van artikel 53, lid 1, SW voordoet en de eigenwoningvrijstelling voor 2018 op grond van artikel 82a, lid 1, SW is beperkt tot EUR 27.871 en voor 2019 geheel vervalt. Het kennisgroepstandpunt over herleving van de eenmalig verhoogde vrijstelling na herroeping is een goedkeurende beleidsregel die beperkt moet blijven tot de daarin beschreven bijzondere situatie en geldt niet voor belanghebbende.", "rechtsregel": "Een goedkeurend kennisgroepstandpunt moet zoveel mogelijk in overeenstemming met de wet worden uitgelegd en blijft beperkt tot de daarin beschreven bijzondere situatie, zodat een niet-herroepbare en niet onder ontbindende voorwaarde aangegane schenking meetelt voor de beperking van artikel 82a SW 1956.", "wetsartikelen": ["art. 33 SW 1956", "art. 33a SW 1956", "art. 53 SW 1956", "art. 82a SW 1956", "art. 5 Uitvoeringsregeling schenk- en erfbelasting"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2025:2709"}, {"ecli": "ECLI:NL:RBNNE:2025:4125", "instantie": "Rechtbank Noord-Nederland", "datum": "2025-09-30", "gepubliceerd": "2026-02-04", "zaaknummer": "24/2310", "onderwerp": "Samenloop BOR en NSW-invorderingsvrijstelling bij erfbelasting", "samenvatting": "Eiser verkreeg in 2019 als enig erfgenaam alle aandelen in een op grond van art. 7a NSW transparante BV die een opengesteld NSW-landgoed houdt en daarmee een agrarische onderneming drijft, waarop de BOR van toepassing is. In geschil was hoe de NSW-faciliteit van art. 7 NSW moet worden berekend bij samenloop met de BOR: eiser wilde de going-concernwaarde van de NSW-goederen (€ 6.436.174) op de belaste verkrijging in mindering brengen, de inspecteur berekende de faciliteit op € 38.603. De rechtbank oordeelt dat art. 7 NSW twee berekeningen vergt (de volgens de aanslag verschuldigde erfbelasting van € 1.400.876 en de belasting bij een landgoedwaarde van nihil) en dat op grond van art. 21, dertiende lid, SW 1956 ook in die tweede berekening van de hogere liquidatiewaarde moet worden uitgegaan; beroep ongegrond.", "rechtsregel": "Bij samenloop van de BOR en de NSW-faciliteit wordt de invorderingsvrijstelling van art. 7 NSW bepaald door het verschil tussen de volgens de aanslag verschuldigde erfbelasting en de erfbelasting berekend met een op nihil gestelde landgoedwaarde, waarbij in beide berekeningen op grond van art. 21, dertiende lid, SW 1956 de (hogere) liquidatiewaarde van het ondernemingsvermogen geldt.", "wetsartikelen": ["art. 1 SW 1956", "art. 21 SW 1956", "art. 35b SW 1956", "art. 7 Natuurschoonwet 1928", "art. 7a Natuurschoonwet 1928"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNNE:2025:4125"}, {"ecli": "ECLI:NL:RBZWB:2025:6474", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2025-09-29", "gepubliceerd": "2025-10-21", "zaaknummer": "BRE 24/1830", "onderwerp": "Erfbelasting; geen omkering bewijslast, negatieve nalatenschap, aanslag vernietigd", "samenvatting": "Erflater, hoofdverdachte in een drugsonderzoek, overleed op 17 november 2012; de erven aanvaardden beneficiair en er is geen aangifte erfbelasting gedaan. De inspecteur handhaafde na bezwaar een aanslag van € 117.140 uitgaande van een belaste verkrijging van € 643.555, waarbij het positieve saldo van de nalatenschap uitsluitend berustte op een geschat vermogen van € 40.963.552 uit drugsinkomsten 2007-2010 dat in de IB-procedure met omkering van de bewijslast was vastgesteld. De rechtbank oordeelt dat de inspecteur met een schermprint uit een intern systeem niet aannemelijk maakt dat uitnodiging en aanmaning aan een postvervoersbedrijf zijn aangeboden, zodat omkering en verzwaring van de bewijslast in deze erfbelastingprocedure niet aan de orde is; vervolgens maakt hij niet aannemelijk dat dat vermogen ten tijde van het overlijden nog tot de nalatenschap behoorde, mede gelet op de verklaring van de vereffenaar dat het saldo fors negatief eindigt. De uitspraak op bezwaar is bovendien ongemotiveerd gebleven op de EVRM-grond; beroep gegrond, aanslag en heffingsrentebeschikking vernietigd en € 2.000 immateriëleschadevergoeding toegekend wegens een overschrijding van de redelijke termijn met zeven jaar en tien maanden.", "rechtsregel": "Omkering en verzwaring van de bewijslast in een inkomstenbelastingprocedure werkt niet door naar de erfbelastingprocedure; betwist de erfgenaam de ontvangst van de uitnodiging tot aangifte, dan moet de inspecteur de verzending (aanbieding aan een postvervoersbedrijf) aannemelijk maken en moet hij, bij gebreke daarvan, zelf aannemelijk maken dat het gestelde vermogen op de overlijdensdatum nog tot de nalatenschap behoorde.", "wetsartikelen": ["art. 27e AWR", "art. 9 AWR", "art. 6:22 Awb", "art. 1 Eerste Protocol EVRM", "art. 3 Besluit proceskosten bestuursrecht"], "belang": "middel", "oordeel": "gegrond", "parallelzaken": ["ECLI:NL:RBZWB:2025:6475", "ECLI:NL:RBZWB:2025:6473", "ECLI:NL:RBZWB:2025:6472"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2025:6474"}, {"ecli": "ECLI:NL:RBZWB:2025:6471", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2025-09-29", "gepubliceerd": "2025-10-07", "zaaknummer": "BRE 24/4394", "onderwerp": "Erfbelasting conform aangifte; bewijslast nalatenschapskosten en beslistermijn", "samenvatting": "Belanghebbende is voor een vierde gedeelte erfgenaam van zijn op 11 juli 2023 overleden tante; een gemachtigde neef deed aangifte erfbelasting naar een nalatenschap van € 130.915, waarna de inspecteur de verkrijging conform aangifte vaststelde op € 32.728 terwijl belanghebbende feitelijk € 30.000 ontving. In geschil is of de aanslag te hoog is en of overschrijding van de (eenzijdig verlengde) beslistermijn in bezwaar tot vernietiging moet leiden. De rechtbank oordeelt dat de inspecteur bij gebreke van andere informatie terecht conform de aangifte heeft opgelegd, dat de bewijslast van na het overlijden gemaakte, op de nalatenschap drukkende kosten op belanghebbende rust en dat hij die kosten niet met concrete gegevens heeft onderbouwd. Het enkele te laat beslissen op bezwaar maakt de aanslag niet onrechtmatig; het beroep is ongegrond.", "rechtsregel": "De erfgenaam die stelt dat zijn verkrijging lager is dan het uit de namens hem ingediende aangifte volgende bedrag draagt de bewijslast van de op de nalatenschap drukkende kosten, en overschrijding van de beslistermijn in bezwaar leidt op zichzelf niet tot onrechtmatigheid of vernietiging van de aanslag erfbelasting.", "belang": "laag", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2025:6471"}, {"ecli": "ECLI:NL:HR:2025:1389", "instantie": "Hoge Raad", "datum": "2025-09-26", "gepubliceerd": "2026-02-04", "zaaknummer": "24/02647", "onderwerp": "APV-regeling en toerekening aan erfgenamen; art. 1 EP en art. 14 EVRM", "samenvatting": "Belanghebbende is weduwe van de kleinzoon van een broer van de oprichter van een in 1907 opgerichte familiestichting; de inspecteur rekende 1,926% van het stichtingsvermogen aan haar toe in box 3 (2018 en 2019). Het Hof achtte de APV-regeling in een zuiver binnenlandse situatie zonder fiscaal motief in strijd met de fair balance van artikel 1 EP in samenhang met artikel 14 EVRM en beperkte de heffing tot het werkelijk ontvangen voordeel (nihil). De Hoge Raad vernietigt: de wetgever heeft met de keuze voor toerekening aan de erfgenamen naar rato van hun erfdeel, ter voorkoming van een heffingsvacuum bij zwevend vermogen, zijn ruime beoordelingsvrijheid niet overschreden; de regeling is op stelselniveau niet evident van redelijke grond ontbloot. Een individuele en buitensporige last was niet gesteld; verwijzing volgt voor de onbehandelde standpunten.", "rechtsregel": "De APV-regeling van artikel 2.14a Wet IB 2001, met toerekening van het afgezonderde vermogen aan de erfgenamen van de inbrenger naar rato van hun erfdeel, doorstaat op stelselniveau de fair balance-toets van artikel 1 EP en het discriminatieverbod van artikel 14 EVRM, ook indien een erfgenaam feitelijk niets uit het APV ontvangt.", "wetsartikelen": ["art. 2.14a Wet IB 2001", "art. 1 EP EVRM", "art. 14 EVRM", "art. 81 Wet RO"], "belang": "hoog", "oordeel": "verwijzing", "gerelateerd": ["ECLI:NL:RBNHO:2023:1743", "ECLI:NL:GHAMS:2024:1494", "ECLI:NL:PHR:2025:303"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2025:1389"}, {"ecli": "ECLI:NL:GHSHE:2025:2588", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2025-09-24", "gepubliceerd": "2025-12-10", "zaaknummer": "23/1659", "onderwerp": "BOR erfbelasting: vermogensetikettering van woning en spaargelden die kort voor het overlijden in een maatschap zijn ingebracht; nieuw feit", "samenvatting": "Twee broers exploiteerden een legkippenbedrijf in maatschap. Per 1 januari 2016 bracht de ene broer zijn eigen woning met stallen (€ 211.000), spaargelden (€ 146.385) en cultuurgronden (€ 707.541) in de maatschap in, met het oog op een niet uitgewerkt plan voor een scharrel-/biobedrijf. Hij overleed in 2017; zijn broer was enig erfgenaam en claimde de BOR ook over de woning en de spaargelden. Het hof oordeelt eerst dat de inspecteur over een nieuw feit beschikt: bij het regelen van de aanslag erfbelasting hoeft hij niet het inkomstenbelastingdossier van de erflater te raadplegen, en de aankondiging van een boekenonderzoek zag alleen op de omzetbelasting. Inhoudelijk geldt dat de woning sinds 2005 als privévermogen was geëtiketteerd en geen functie had in of dienstbaar was aan de onderneming, zodat inbreng in de maatschap de grenzen der redelijkheid overschrijdt; bijzondere omstandigheden die heretikettering rechtvaardigen ontbreken. Ook de spaargelden waren niet aangewend en er is geen begin van bewijs van concrete gesprekken met bank of gemeente over de nieuwe bedrijfsplannen, zodat ook die niet als ondernemingsvermogen kunnen worden aangemerkt. De BOR is op beide vermogensbestanddelen niet van toepassing.", "rechtsregel": "Voor de vraag of vermogensbestanddelen kwalificeren als ondernemingsvermogen in de zin van art. 35c SW 1956 geldt de inkomstenbelastingrechtelijke vermogensetiketteringsleer: beslissend is de wil van de belastingplichtige zoals in de boekhouding tot uiting gebracht, tenzij daarmee de grenzen der redelijkheid worden overschreden. Een eigen woning die niet dienstbaar is aan de onderneming en overtollige spaargelden kunnen niet door inbreng in een maatschap alsnog tot ondernemingsvermogen worden bestempeld; heretikettering vergt een bijzondere omstandigheid. Bij het regelen van een aanslag erfbelasting is de inspecteur niet gehouden het inkomstenbelastingdossier van de erflater te raadplegen, zodat daaruit later blijkende gegevens een nieuw feit in de zin van art. 16 lid 1 AWR opleveren.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c lid 1 onderdeel d SW 1956", "art. 35e SW 1956", "art. 16 lid 1 AWR", "art. 3.8 Wet IB 2001"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2025:2588"}, {"ecli": "ECLI:NL:GHARL:2025:5898", "instantie": "Gerechtshof Arnhem-Leeuwarden", "datum": "2025-09-23", "gepubliceerd": "2026-01-29", "zaaknummer": "23/2491", "onderwerp": "BOR erfbelasting: bezitseis bij uitbreiding belang; overtollige liquiditeiten", "samenvatting": "Erflaatster overleed op 22 maart 2016 met een aanmerkelijk belang van 37,56% in een familieholding; in geschil was de omvang van het ondernemingsvermogen voor de BOR bij een belaste verkrijging van € 9.761.546. Het Hof oordeelt dat de BOR niet geldt voor de binnen één jaar vóór het overlijden gerealiseerde uitbreidingen van de indirecte belangen (met 40% respectievelijk 50%) in twee deelnemingen, omdat voor die uitgebreide subjectieve gerechtigdheid niet aan de indirecte bezitseis van artikel 35d, lid 1, onderdeel c, SW is voldaan; dat de uitbreiding met kwalificerend ondernemingsvermogen is gefinancierd doet niet ter zake. Voorts merkt het Hof de bij de holding aanwezige liquide middelen en effecten van € 42.708.687 aan als duurzaam overtollig beleggingsvermogen: deze zijn sinds 1999 alleen aangegroeid, nooit voor investeringen of garanties van de werkmaatschappij gebruikt en de gestelde functies (buffer, behoud familiekarakter, eigen kosten van € 200.000 per jaar) zijn niet aannemelijk gemaakt. Het principale hoger beroep van de inspecteur is gegrond, het incidentele hoger beroep ongegrond.", "rechtsregel": "De BOR geldt niet voor de waarde van vermogensbestanddelen voor zover de subjectieve gerechtigdheid tot de objectieve onderneming binnen de bezitsperiode is uitgebreid, en bij een holding kunnen liquide middelen en effecten alleen tot het ondernemingsvermogen worden gerekend als zij niet duurzaam overtollig zijn en dienstbaar zijn aan de toegerekende onderneming.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 35d SW 1956", "art. 3.2 Wet IB 2001"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHARL:2025:5898"}, {"ecli": "ECLI:NL:RBZWB:2025:6059", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2025-09-11", "gepubliceerd": "2025-10-07", "zaaknummer": "23/12260", "onderwerp": "Erfbelasting; omkering bewijslast en redelijke schatting nalatenschap", "samenvatting": "Belanghebbende is voor de helft erfgenaam van zijn in 2018 overleden vader en heeft het uitgereikte aangiftebiljet erfbelasting ook na herinnering en aanmaning niet ingediend, waarna de inspecteur ambtshalve een aanslag oplegde naar een geschat nalatenschapssaldo van € 1.072.241 (woning € 227.000, goud € 159.637 en bank- en contant geld € 685.604) en een verzuimboete van € 385. In geschil is de hoogte van de nalatenschap; belanghebbende bepleit een saldo van € 375.060. De rechtbank oordeelt dat de vereiste aangifte niet is gedaan zodat de bewijslast wordt omgekeerd en verzwaard, dat de schatting redelijk is omdat zij berust op concrete bevindingen uit een strafrechtelijk witwasonderzoek (huiszoeking 2 april 2019, proces-verbaal), en dat belanghebbende met enkel bankafschriften niet heeft doen blijken dat de uitspraak op bezwaar onjuist is. Het beroep is ongegrond; wel constateert de rechtbank een overschrijding van de redelijke termijn voor de boete van afgerond twee jaar, wat bij een boete onder € 1.000 blijft bij de enkele constatering.", "rechtsregel": "Wordt na uitnodiging, herinnering en aanmaning geen aangifte erfbelasting gedaan, dan is de vereiste aangifte niet gedaan en geldt omkering en verzwaring van de bewijslast; de inspecteur mag de belaste verkrijging dan schatten op concrete gegevens uit een strafrechtelijk onderzoek, en de erfgenaam moet overtuigend aantonen dat die schatting onjuist is.", "wetsartikelen": ["art. 27e AWR", "art. 9 AWR"], "belang": "middel", "oordeel": "ongegrond", "parallelzaken": ["ECLI:NL:RBZWB:2025:6060"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2025:6059"}, {"ecli": "ECLI:NL:RBGEL:2025:7333", "instantie": "Rechtbank Gelderland", "datum": "2025-08-29", "gepubliceerd": "2026-07-07", "zaaknummer": "AWB 24/41", "onderwerp": "Samentelling art. 27 SW bij NSW-landgoed; negatieve waarde schenking", "samenvatting": "Belanghebbende ontving in 2018 vijf schenkingen van zijn vader, waaronder 283.620 aandelen (waarde € 1.897.760) in een op grond van art. 7a NSW fiscaal transparante BV die een NSW-landgoed houdt. Doordat de invorderingsvrijstelling van art. 7 NSW de waarde van het opengestelde landgoed op nihil stelt, resteert per saldo een negatief vermogen; belanghebbende wilde die negatieve waarde bij de samentelling van art. 27 SW 1956 verrekenen met de overige schenkingen. De rechtbank verwerpt dat: de schenkbelasting is een tijdstipbelasting, zodat eerst per schenking het belastbare bedrag wordt bepaald (hoofdstukken I en II SW) en pas daarna art. 27 SW wordt toegepast; een schenking met negatieve waarde bestaat niet, zodat met nihil moet worden gerekend. Beroepen ongegrond; wel € 500 immateriële schadevergoeding.", "rechtsregel": "Bij toepassing van de samentelbepaling van art. 27 SW 1956 wordt eerst per afzonderlijke schenking het belastbare bedrag vastgesteld, dat niet negatief kan zijn, zodat een door toepassing van art. 7 NSW ontstane negatieve waarde niet met andere schenkingen kan worden verrekend.", "wetsartikelen": ["art. 27 SW 1956", "art. 7 Natuurschoonwet 1928", "art. 7a Natuurschoonwet 1928", "art. 8:13 Awb", "art. 3 Besluit proceskosten bestuursrecht"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2025:7333"}, {"ecli": "ECLI:NL:RBGEL:2025:7318", "instantie": "Rechtbank Gelderland", "datum": "2025-08-29", "gepubliceerd": "2025-10-23", "zaaknummer": "AWB - 24_123", "onderwerp": "Art. 27 SW: samentelling schenkingen en NSW-invorderingsvrijstelling", "samenvatting": "De schenker heeft aan belanghebbende in 2018 meerdere schenkingen gedaan, waaronder aandelen in een BV die eigenaresse is van een NSW-landgoed en die op grond van art. 7a NSW voor de schenkbelasting als transparant geldt. Doordat het landgoed bij toepassing van de invorderingsvrijstelling van art. 7 NSW buiten beschouwing blijft, overtreffen de schulden van de BV de resterende activa, zodat de aandelenschenking volgens belanghebbende een negatieve waarde heeft die bij de samentelling van art. 27 SW 1956 met de overige schenkingen moet worden verrekend. De rechtbank verwerpt dat: de schenkbelasting is een tijdstipbelasting, zodat eerst per schenking het belastbare feit en het belastbare bedrag worden vastgesteld (hoofdstukken I en II SW) en pas daarna art. 27 SW (hoofdstuk III) aan de orde komt. Een negatieve waarde van een schenking bestaat niet; het belastbare bedrag van de aandelenschenking is terecht op nihil gesteld en met dat bedrag wordt bij de samentelling gerekend.", "rechtsregel": "Omdat de schenkbelasting een tijdstipbelasting is, wordt eerst per afzonderlijke schenking het belastbare bedrag bepaald - dat niet negatief kan zijn - en pas daarna wordt de samentelbepaling van art. 27 SW 1956 toegepast, zodat een door de invorderingsvrijstelling van art. 7 NSW ontstane negatieve waarde niet met andere schenkingen kan worden verrekend.", "wetsartikelen": ["art. 27 SW 1956", "art. 7 Natuurschoonwet 1928", "art. 7a Natuurschoonwet 1928"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2025:7318"}, {"ecli": "ECLI:NL:RBGEL:2025:7275", "instantie": "Rechtbank Gelderland", "datum": "2025-08-28", "gepubliceerd": "2025-11-04", "zaaknummer": "AWB - 24 _ 66", "onderwerp": "Art. 27 SW: samentelling schenkingen en NSW-invorderingsvrijstelling", "samenvatting": "De schenker heeft aan belanghebbende in 2018 meerdere schenkingen gedaan, waaronder aandelen in een BV die eigenaresse is van een NSW-landgoed en die op grond van art. 7a NSW voor de schenkbelasting als transparant geldt. Doordat het landgoed bij toepassing van de invorderingsvrijstelling van art. 7 NSW buiten beschouwing blijft, overtreffen de schulden van de BV de resterende activa, zodat de aandelenschenking volgens belanghebbende een negatieve waarde heeft die bij de samentelling van art. 27 SW 1956 met de overige schenkingen moet worden verrekend. De rechtbank verwerpt dat: de schenkbelasting is een tijdstipbelasting, zodat eerst per schenking het belastbare feit en het belastbare bedrag worden vastgesteld (hoofdstukken I en II SW) en pas daarna art. 27 SW (hoofdstuk III) aan de orde komt. Een negatieve waarde van een schenking bestaat niet; het belastbare bedrag van de aandelenschenking is terecht op nihil gesteld en met dat bedrag wordt bij de samentelling gerekend.", "rechtsregel": "Omdat de schenkbelasting een tijdstipbelasting is, wordt eerst per afzonderlijke schenking het belastbare bedrag bepaald - dat niet negatief kan zijn - en pas daarna wordt de samentelbepaling van art. 27 SW 1956 toegepast, zodat een door de invorderingsvrijstelling van art. 7 NSW ontstane negatieve waarde niet met andere schenkingen kan worden verrekend.", "wetsartikelen": ["art. 27 SW 1956", "art. 7 Natuurschoonwet 1928", "art. 7a Natuurschoonwet 1928", "art. 8:13 Awb"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2025:7275"}, {"ecli": "ECLI:NL:RBGEL:2025:7274", "instantie": "Rechtbank Gelderland", "datum": "2025-08-26", "gepubliceerd": "2025-11-19", "zaaknummer": "AWB - 23 _ 7106", "onderwerp": "Art. 27 SW: samentelling schenkingen en NSW-invorderingsvrijstelling", "samenvatting": "De schenker heeft aan belanghebbende in 2018 meerdere schenkingen gedaan, waaronder aandelen in een BV die eigenaresse is van een NSW-landgoed en die op grond van art. 7a NSW voor de schenkbelasting als transparant geldt. Doordat het landgoed bij toepassing van de invorderingsvrijstelling van art. 7 NSW buiten beschouwing blijft, overtreffen de schulden van de BV de resterende activa, zodat de aandelenschenking volgens belanghebbende een negatieve waarde heeft die bij de samentelling van art. 27 SW 1956 met de overige schenkingen moet worden verrekend. De rechtbank verwerpt dat: de schenkbelasting is een tijdstipbelasting, zodat eerst per schenking het belastbare feit en het belastbare bedrag worden vastgesteld (hoofdstukken I en II SW) en pas daarna art. 27 SW (hoofdstuk III) aan de orde komt. Een negatieve waarde van een schenking bestaat niet; het belastbare bedrag van de aandelenschenking is terecht op nihil gesteld en met dat bedrag wordt bij de samentelling gerekend.", "rechtsregel": "Omdat de schenkbelasting een tijdstipbelasting is, wordt eerst per afzonderlijke schenking het belastbare bedrag bepaald - dat niet negatief kan zijn - en pas daarna wordt de samentelbepaling van art. 27 SW 1956 toegepast, zodat een door de invorderingsvrijstelling van art. 7 NSW ontstane negatieve waarde niet met andere schenkingen kan worden verrekend.", "wetsartikelen": ["art. 27 SW 1956", "art. 7 Natuurschoonwet 1928", "art. 7a Natuurschoonwet 1928"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2025:7274"}, {"ecli": "ECLI:NL:RBGEL:2025:7097", "instantie": "Rechtbank Gelderland", "datum": "2025-08-22", "gepubliceerd": "2025-10-28", "zaaknummer": "AWB - 24_6111", "onderwerp": "Verkapte winstuitdeling van BOR-advieskosten aan de erflater-aandeelhouder", "samenvatting": "In de met de Vpb-zaak van de vennootschap samenhangende procedure van de erven staat vast dat de BV EUR 23.333 (2018) en EUR 14.648 (2019) aan BOR-advieskosten heeft betaald voor de bedrijfsopvolging waarbij de enig aandeelhouder zijn aandelen aan zijn zonen schonk. Omdat die kosten geen zakelijke kosten zijn, is sprake van een vermogensverschuiving met bevoordelingsbedoeling; de rechtbank acht ook de dubbele bewustheid aanwezig, nu erflater en de als bestuurders opgetreden zonen wisten dat de advisering en de fiscale faciliteit op aandeelhoudersniveau speelden en de BV daarbij geen zelfstandig belang had. De correctie is terecht als regulier voordeel uit aanmerkelijk belang belast. Voor 2018 is bovendien sprake van een nieuw feit, omdat pas uit de beantwoording van de vragenbrief van 27 januari 2022 bleek dat de kosten bij de BV in aftrek waren gebracht.", "rechtsregel": "Betaalt de vennootschap advieskosten die uitsluitend zijn gemaakt ter bevrediging van de persoonlijke behoeften van de aandeelhouder bij een bedrijfsopvolging, dan is bij aanwezigheid van bevoordelingsbedoeling en dubbele bewustheid sprake van een verkapte winstuitdeling die als regulier voordeel uit aanmerkelijk belang wordt belast.", "wetsartikelen": ["art. 16 AWR"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBGEL:2025:7096"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2025:7097"}, {"ecli": "ECLI:NL:RBGEL:2025:7096", "instantie": "Rechtbank Gelderland", "datum": "2025-08-20", "gepubliceerd": "2025-12-24", "zaaknummer": "AWB 23/3623", "onderwerp": "Vpb: advieskosten bedrijfsopvolgingsregeling niet aftrekbaar bij de BV", "samenvatting": "Een houdstervennootschap heeft in boekjaar 2018/2019 EUR 31.472 aan advieskosten ten laste van haar resultaat gebracht die zijn gemaakt voor de bedrijfsopvolging waarbij de (inmiddels overleden) enig aandeelhouder zijn aandelen met toepassing van de BOR aan zijn twee zonen schonk. In geschil is of deze BOR-advieskosten zakelijke kosten zijn. De rechtbank oordeelt dat de kosten uitsluitend zijn gemaakt ter bevrediging van de persoonlijke behoeften van de aandeelhouder: de kosten zijn opgeroepen door diens wens de aandelen te schenken en dienden ertoe in prive een belastingvoordeel via de BOR te realiseren, terwijl de schenking de onderneming niet raakt. Noch de aan de BOR ten grondslag liggende continuiteitsgedachte in de parlementaire geschiedenis, noch de gefaciliteerde juridische afsplitsing maakt dat anders; het beroep is ongegrond.", "rechtsregel": "Advieskosten voor een bedrijfsopvolging met toepassing van de bedrijfsopvolgingsregeling die door de vennootschap worden gedragen, ontberen een zakelijk karakter voor zover zij zijn opgeroepen door de wens van de aandeelhouder zijn aandelen te schenken en strekken tot een fiscaal voordeel op aandeelhoudersniveau; de aan de BOR ten grondslag liggende continuiteitsgedachte maakt dergelijke kosten niet zonder meer zakelijk.", "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2025:7096"}, {"ecli": "ECLI:NL:RBGEL:2025:8860", "instantie": "Rechtbank Gelderland", "datum": "2025-07-31", "gepubliceerd": "2025-11-11", "zaaknummer": "AWB 24/127", "onderwerp": "Art. 27 SW: samentelling schenkingen en NSW-invorderingsvrijstelling", "samenvatting": "De schenker heeft aan belanghebbende in 2018 meerdere schenkingen gedaan, waaronder aandelen in een BV die eigenaresse is van een NSW-landgoed en die op grond van art. 7a NSW voor de schenkbelasting als transparant geldt. Doordat het landgoed bij toepassing van de invorderingsvrijstelling van art. 7 NSW buiten beschouwing blijft, overtreffen de schulden van de BV de resterende activa, zodat de aandelenschenking volgens belanghebbende een negatieve waarde heeft die bij de samentelling van art. 27 SW 1956 met de overige schenkingen moet worden verrekend. De rechtbank verwerpt dat: de schenkbelasting is een tijdstipbelasting, zodat eerst per schenking het belastbare feit en het belastbare bedrag worden vastgesteld (hoofdstukken I en II SW) en pas daarna art. 27 SW (hoofdstuk III) aan de orde komt. Een negatieve waarde van een schenking bestaat niet; het belastbare bedrag van de aandelenschenking is terecht op nihil gesteld en met dat bedrag wordt bij de samentelling gerekend. De rechtbank verwerpt daarnaast als tardief de eerst ter zitting ingenomen stelling dat twee aanslagen buiten de aanslagtermijn zijn opgelegd; de tijdigheid van een aanslag is geen ontvankelijkheidskwestie die de rechtbank ambtshalve moet onderzoeken.", "rechtsregel": "Omdat de schenkbelasting een tijdstipbelasting is, wordt eerst per afzonderlijke schenking het belastbare bedrag bepaald - dat niet negatief kan zijn - en pas daarna wordt de samentelbepaling van art. 27 SW 1956 toegepast, zodat een door de invorderingsvrijstelling van art. 7 NSW ontstane negatieve waarde niet met andere schenkingen kan worden verrekend.", "wetsartikelen": ["art. 27 SW 1956", "art. 7 Natuurschoonwet 1928", "art. 7a Natuurschoonwet 1928", "art. 8:13 Awb"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2025:8860"}, {"ecli": "ECLI:NL:GHAMS:2025:2358", "instantie": "Gerechtshof Amsterdam", "datum": "2025-07-29", "gepubliceerd": "2025-11-25", "zaaknummer": "24/212", "onderwerp": "Art. 66 SW: aanvang aanslagtermijn bij eerste overlijden schenker of begiftigde", "samenvatting": "Belanghebbende ontving in 2006 een schenking van € 4.000.000 van haar echtgenoot, die in 2007 overleed; van de schenking werd geen aangifte gedaan. Na een inkeermelding in 2019 legde de inspecteur op 2 februari 2021 alsnog een aanslag in het recht van schenking op van € 1.019.463 (de schenking valt onder de SW zoals die tot 2010 luidde, maar art. 66 wordt toegepast in de per 2010 gewijzigde tekst). Anders dan de rechtbank oordeelt het Hof dat de tekst van art. 66, lid 1, onder 2, SW zich niet anders laat lezen dan dat de driejaarstermijn van art. 11, lid 3, AWR aanvangt bij het eerste overlijden van de schenker of de begiftigde; het voegwoord 'of' geeft twee elkaar uitsluitende mogelijkheden en de wetsgeschiedenis biedt geen steun voor de lezing van de inspecteur dat beiden overleden moeten zijn. De termijn ving dus aan met het overlijden van de schenker in 2007, zodat de bevoegdheid tot het opleggen van de aanslag was vervallen; de aanslag wordt vernietigd. Voor een integrale proceskostenvergoeding ziet het Hof geen aanleiding, reeds omdat de rechtbank het standpunt van de inspecteur had gevolgd.", "rechtsregel": "De termijn van art. 11, lid 3, AWR vangt op grond van art. 66, lid 1, onder 2, SW 1956 - indien geen aangifte is gedaan - aan op de dag van inschrijving van de akte van overlijden van degene van de schenker of de begiftigde die als eerste overlijdt; het feit dat de inspecteur toen niet met de schenking bekend was, verlengt of verlegt die termijn niet.", "wetsartikelen": ["art. 66, lid 1, onder 2, SW 1956", "art. 11, lid 3, AWR", "art. 8:75 Awb", "art. 8:108 Awb"], "belang": "hoog", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHAMS:2025:2358"}, {"ecli": "ECLI:NL:RBZWB:2025:4735", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2025-07-21", "gepubliceerd": "2025-07-29", "zaaknummer": "BRE - 24 _ 8356", "onderwerp": "Herroeping schenking doet eerder benutte eenmalig verhoogde vrijstelling niet herleven", "samenvatting": "Belanghebbende ontving in 2017 € 10.000 van haar ouders onder toepassing van de eenmalig verhoogde vrijstelling en in 2021 € 75.000 ten behoeve van de eigen woning, waarvoor de inspecteur de eigenwoningvrijstelling weigerde. In bezwaar legde zij een verklaring over waarin de schenking uit 2017 werd herroepen en omgezet in een renteloze lening. De rechtbank laat in het midden of in 2017 een herroepelijke schenking is gedaan: ook een rechtsgeldige herroeping doet het belastbare feit niet met terugwerkende kracht teniet, zodat de destijds toegepaste vrijstelling in stand blijft. Het beroep op de goedkeuring van de staatssecretaris (Kamerstukken II 2017/18, nr. 2018D27453) faalt omdat het herroepen en direct groter schenken hier logischerwijs door fiscale redenen was ingegeven.", "rechtsregel": "Herroeping van een schenking werkt fiscaal niet terug; het belastbare feit en de daarop toegepaste eenmalig verhoogde vrijstelling blijven in stand, en de goedkeuring van de staatssecretaris om de herroepen schenking weg te denken geldt alleen bij herroeping om niet-fiscale redenen.", "wetsartikelen": ["art. 33 SW 1956"], "belang": "middel", "oordeel": "ongegrond", "parallelzaken": ["ECLI:NL:RBZWB:2025:4736"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2025:4735"}, {"ecli": "ECLI:NL:RBZWB:2025:4733", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2025-07-21", "gepubliceerd": "2025-07-29", "zaaknummer": "BRE - 24 _ 4435", "onderwerp": "Kruislings schenken; navordering en fiscale herkwalificatie eigenwoningvrijstelling", "samenvatting": "Belanghebbende had in 2014 al € 100.000 van haar vader ontvangen onder de verruimde eigenwoningvrijstelling en ontving op 1 november 2018 € 100.800 van haar oom, terwijl haar vader één dag later hetzelfde bedrag aan de dochter van die oom schonk. De rechtbank oordeelt dat de inspecteur beschikte over een nieuw feit – hij hoefde bij de primitieve aanslag het dossier van de nicht niet te raadplegen – en dat de exact gelijke bedragen, de familieband, het tijdsverloop van één dag en het beroep op de eigenwoningvrijstelling wijzen op de door de wetgever ongewenst geachte figuur van kruislings schenken. Omdat daarmee tweemaal aanspraak wordt gemaakt op een vrijstelling die per ouder-kindrelatie slechts eenmaal kan worden benut, is de eigenwoningvrijstelling op grond van fiscale herkwalificatie terecht nagevorderd.", "rechtsregel": "Onderling afgestemde over-en-weer-schenkingen aan elkaars kinderen (kruislings schenken) worden fiscaalrechtelijk geherkwalificeerd als schenking van de eigen ouder, omdat anders doel en strekking van de eenmalig verhoogde eigenwoningvrijstelling – die per ouder-kindrelatie slechts eenmaal kan worden benut – worden doorkruist.", "wetsartikelen": ["art. 1 SW 1956", "art. 33 SW 1956", "art. 33a SW 1956", "art. 82a SW 1956", "art. 16 AWR", "art. 7:186 BW"], "belang": "hoog", "oordeel": "ongegrond", "parallelzaken": ["ECLI:NL:RBZWB:2025:4732"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2025:4733"}, {"ecli": "ECLI:NL:RBZWB:2025:4738", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2025-07-21", "gepubliceerd": "2025-09-03", "zaaknummer": "BRE - 23 _ 11560", "onderwerp": "Overgangsrecht art. 82a SW 1956 beperkt eigenwoningvrijstelling; geen discriminatie", "samenvatting": "Belanghebbende benutte in 2007 de toenmalige eenmalig verhoogde vrijstelling van € 22.048 en ontving in 2019 en 2020 opnieuw schenkingen van haar vader (€ 20.000 respectievelijk € 50.000) ten behoeve van de eigen woning, waarbij artikel 82a SW 1956 aan volledige toepassing van de eigenwoningvrijstelling in de weg stond. De rechtbank kan het gestelde onderscheid met iemand die pas in 2019 voor het eerst van de vrijstelling gebruikmaakt niet aan artikel 1 Grondwet toetsen wegens het toetsingsverbod, en oordeelt dat toetsing aan artikel 26 IVBPR en artikel 14 EVRM niet slaagt. De wetgever heeft de gevolgen van het overgangsrecht onderkend en de uitvoeringslasten van een controle op vóór 2017 benutte vrijstellingen als rechtvaardiging gegeven, welke keuze binnen zijn ruime beoordelingsmarge valt.", "rechtsregel": "Het overgangsrecht van artikel 82a SW 1956, dat een eerder benutte eenmalig verhoogde vrijstelling in mindering brengt op de latere eigenwoningvrijstelling zonder mogelijkheid van een inhaalschenking, is gerechtvaardigd door uitvoerbaarheidsoverwegingen en levert geen verboden discriminatie op.", "wetsartikelen": ["art. 33 SW 1956", "art. 82a SW 1956", "art. 1 Grondwet", "art. 120 Grondwet", "art. 26 IVBPR", "art. 14 EVRM", "art. 1 EP EVRM", "art. 11 Wet AB"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2025:4738"}, {"ecli": "ECLI:NL:RBZWB:2025:4739", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2025-07-21", "gepubliceerd": "2025-11-04", "zaaknummer": "BRE - 24 _ 5712", "onderwerp": "Belastingverdrag Nederland-Bulgarije is niet van toepassing op schenkbelasting", "samenvatting": "Belanghebbende woont in Bulgarije en ontving in 2022 schenkingen (€ 2.274 en € 75.000) van een in Nederland wonende schenker; hij betoogde dat het belastingverdrag met Bulgarije van 14 september 2020 het heffingsrecht aan Bulgarije toewijst omdat de opsomming in artikel 2, derde lid, blijkens het woord ‘met name’ niet limitatief is. De rechtbank erkent dat de niet-limitatieve lijst rechtsonzekerheid in de hand werkt, maar leidt uit de titel van het verdrag (belastingen naar het inkomen), het OESO-commentaar bij artikel 2, derde lid, het ontbreken van de schenkbelasting in de lijst en de totstandkomingsgeschiedenis af dat verdragspartijen de Successiewet 1956 niet onder het verdrag hebben willen brengen, mede omdat voor successiebelastingen afzonderlijke verdragen worden gesloten. De aanslagen schenkbelasting blijven in stand.", "rechtsregel": "Een belastingverdrag naar het inkomen dat de Successiewet 1956 niet in de opsomming van bestaande belastingen noemt, beperkt de Nederlandse heffingsbevoegdheid ter zake van schenkbelasting niet, ook niet als die opsomming blijkens de tekst niet limitatief is.", "wetsartikelen": ["Successiewet 1956", "art. 2 Verdrag Nederland-Bulgarije 2020", "art. 21 Verdrag Nederland-Bulgarije 2020", "art. 22 Verdrag Nederland-Bulgarije 2020"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2025:4739"}, {"ecli": "ECLI:NL:PHR:2025:785", "instantie": "Parket bij de Hoge Raad", "datum": "2025-07-11", "gepubliceerd": "2026-04-17", "zaaknummer": "25/00767", "onderwerp": "Legitieme portie oud erfrecht en partnervrijstelling voor inwonend kind", "samenvatting": "De vader van belanghebbende overleed in 1995; belanghebbende en zijn broer deden onder het oude erfrecht een beroep op hun legitieme portie, maar de nalatenschap bleef onverdeeld tot het overlijden van de moeder in 2019. In geschil zijn de vraag of bij het overlijden van de moeder een 'schuldig gebleven erfdeel' in aftrek komt en of het weigeren van de partnervrijstelling van art. 1a SW 1956 aan een inwonend kind verboden discriminatie oplevert. A-G Koopman meent dat het hof de goederenrechtelijke aanspraak ten onrechte op art. 128 Overgangswet NBW als 'uitgewerkt' heeft aangemerkt en dat een aandeel in een onverdeelde nalatenschap niet verjaart (art. 3:178 BW), maar dat belanghebbende niet is benadeeld door de standpuntwijziging van de inspecteur; het beroep op discriminatie faalt gelet op EHRM Burden, nu de wetgever bloedverwanten van de partnervrijstelling mocht uitsluiten en de verruimde partnervrijstelling voor mantelzorgers mocht laten vervallen. De conclusie strekt tot ongegrondverklaring.", "rechtsregel": "Een legitimaris die onder het oude erfrecht tijdig een beroep op zijn legitieme portie heeft gedaan verliest zijn goederenrechtelijke aanspraak niet door art. 128 Overgangswet NBW en zijn aandeel in de onverdeelde nalatenschap verjaart niet; de uitsluiting van bloedverwanten in de rechte lijn van de partnervrijstelling van art. 1a SW 1956 levert geen verboden discriminatie op.", "wetsartikelen": ["art. 1a SW 1956", "art. 128 Overgangswet nieuw BW", "art. 3:178 BW", "art. 14 EVRM", "art. 1 Eerste Protocol EVRM"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2025:785"}, {"ecli": "ECLI:NL:GHAMS:2025:2356", "instantie": "Gerechtshof Amsterdam", "datum": "2025-07-08", "gepubliceerd": "2025-10-28", "zaaknummer": "23/719", "onderwerp": "Fiscale woonplaats erflater (art. 4 AWR) en vertrouwensbeginsel", "samenvatting": "Erflater, Nederlander, woonde vanaf 1975 in Londen en verbleef vanaf 5 januari 2015 tot zijn overlijden op 1 april 2019 onafgebroken in een MS-expertisecentrum in Zandvoort, met behoud van zijn Londense woning, inschrijving in de GBA, een Nederlandse zorgverzekering en een Nederlands testament. In geschil was de aanslag erfbelasting van € 85.046 over een verkrijging van € 292.511. Het Hof oordeelt dat erflater ten tijde van zijn overlijden een duurzame band van persoonlijke aard met Nederland had - gelet op het verblijf van ruim vier jaar in een zelfstandig appartement van de zorginstelling, zijn nationaliteit, taal en familie hier - en dat de uit waarneembare feiten blijkende wil om in Nederland te blijven tijdens de behandeling prevaleerde boven de wens terug te keren. Het beroep op het vertrouwensbeginsel op grond van de website van de Belastingdienst faalt: noch aan het kenbaarheidsvereiste noch aan het dispositievereiste is voldaan, nu overlijden een bloot rechtsfeit is en verplicht aangifte doen geen handelen of nalaten oplevert.", "rechtsregel": "Voor de woonplaats van art. 4 AWR is beslissend of op het overlijdensmoment een duurzame band van persoonlijke aard met Nederland bestaat; de wil om terug te keren naar het land van herkomst telt slechts mee voor zover die uit waarneembare feiten blijkt en staat aan zo'n band niet in de weg, ook niet bij een verblijf dat uit medische noodzaak is ontstaan.", "wetsartikelen": ["art. 1, lid 1, onder 1°, SW 1956", "art. 4, lid 1, AWR", "art. 8:75 Awb", "art. 8:108 Awb"], "belang": "middel", "oordeel": "ongegrond", "parallelzaken": ["ECLI:NL:GHAMS:2025:2357"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHAMS:2025:2356"}, {"ecli": "ECLI:NL:GHARL:2025:4296", "instantie": "Gerechtshof Arnhem-Leeuwarden", "datum": "2025-07-08", "gepubliceerd": "2025-10-15", "zaaknummer": "23/2334", "onderwerp": "Erfbelasting; compromis ter zitting over BOR-vrijstelling en waarde onderneming", "samenvatting": "Aan belanghebbende was een aanslag erfbelasting van € 651.514 opgelegd, die na bezwaar en beroep al was verminderd. In hoger beroep van de Inspecteur zijn partijen ter zitting overeengekomen dat de aandelen in een vennootschap niet tot het ondernemingsvermogen behoren en dat de vrijstelling van de bedrijfsopvolgingsregeling (BOR) wordt vastgesteld op € 2.450.000. Het Hof volgt partijen daarin en herrekent de aanslag: na eliminatie van de aandelen uit het ondernemingsvermogen, bijtelling van een periodieke uitkering op grond van art. 13 SW van € 30.609 en toepassing van de BOR-vrijstelling en de basisvrijstelling resteert een belaste verkrijging van € 701.274 en € 268.282 aan erfbelasting. Het Hof vernietigt de uitspraak van de Rechtbank (behoudens de griffierechtbeslissing) en de uitspraak op bezwaar en vermindert de aanslag dienovereenkomstig; de belastingrente wordt volgens de bestaande regels berekend.", "rechtsregel": "Geen zelfstandige rechtsregel: het Hof stelt de aanslag erfbelasting vast overeenkomstig het ter zitting tussen partijen bereikte compromis over de omvang van het ondernemingsvermogen en de hoogte van de BOR-vrijstelling.", "wetsartikelen": ["art. 13 SW 1956"], "belang": "laag", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:RBNNE:2023:2740"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHARL:2025:4296"}, {"ecli": "ECLI:NL:GHARL:2025:4292", "instantie": "Gerechtshof Arnhem-Leeuwarden", "datum": "2025-07-08", "gepubliceerd": "2025-10-15", "zaaknummer": "24/19 t/m 24/22", "onderwerp": "Schenkbelasting; navordering na kenbaar gemaakte misslag in verrekening overdrachtsbelasting", "samenvatting": "Belanghebbende ontving in 2017 van vier broers en zusters elk een aandeel van 5% in een maatschap met onroerende zaken; per schenking was € 18.210 aan overdrachtsbelasting geheven. De Inspecteur verrekende bij de primitieve aanslagen abusievelijk dat volledige bedrag, terwijl op grond van art. 24, lid 2, SW 1956 alleen de overdrachtsbelasting over het bedrag waarover schenkbelasting is verschuldigd (6% van € 63.211 = € 3.793) voor verrekening in aanmerking komt. Nog vóórdat de aanslagbiljetten belanghebbende bereikten, had de Inspecteur de misslag telefonisch en per aangetekende brief kenbaar gemaakt en navordering aangekondigd. Het Hof oordeelt dat de navorderingsaanslagen daarom niet in strijd met art. 16 AWR zijn opgelegd en dat noch het rechtszekerheidsbeginsel noch het vertrouwensbeginsel is geschonden, mede omdat de gemachtigde ter zitting verklaarde van meet af aan te hebben geweten dat de aanslagen fout waren; het hoger beroep is ongegrond.", "rechtsregel": "Op het aan een aanslagbiljet te ontlenen vertrouwen kan een belastingplichtige zich niet met vrucht beroepen indien hem ten tijde van de uitreiking van het biljet vanwege de inspecteur al kenbaar was gemaakt dat de aanslag door een nader aangeduide misslag onjuist was vastgesteld en door navordering zou worden gevolgd; voor de verrekening van art. 24, lid 2, SW 1956 komt alleen de overdrachtsbelasting over het bedrag waarover schenkbelasting is verschuldigd in aanmerking.", "wetsartikelen": ["art. 24 lid 2 SW 1956", "art. 16 AWR", "art. 16 lid 2 letter c AWR"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHARL:2025:4292"}, {"ecli": "ECLI:NL:GHSHE:2025:1856", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2025-07-02", "gepubliceerd": "2025-11-18", "zaaknummer": "23/1673", "onderwerp": "BOR schenkbelasting: indirecte bezitseis van art. 35d lid 1 letter c SW bij uitbreiding van het aandelenbelang van de houdstervennootschap", "samenvatting": "Vader schonk op 3 juli 2019 certificaten van 10% van de aandelen in Beheer BV aan zijn dochter; Beheer hield toen 100% in twee werkmaatschappijen en 33,33% in een derde, die alle een materiële onderneming dreven. Binnen de vijfjaarsperiode was het belang van Beheer uitgebreid: op 23 mei 2016 van 95,05% naar 100% in BV 3 en op 24 december 2014 van 20% naar 33,33% in BV 4. In geschil was of voor die uitbreidingen aan de indirecte bezitseis is voldaan. Het hof oordeelt van niet. HR 29 mei 2020 (ECLI:NL:HR:2020:867) ziet alleen op uitbreidingsinvesteringen in de vorm van activa en passiva die opgaan in de bestaande objectieve onderneming, niet op een vergroting van de gerechtigdheid tot dat ondernemingsvermogen. Uit HR 21 april 2023 (ECLI:NL:HR:2023:647) volgt dat, als de schenker binnen de bezitstermijn een niet met zijn indirecte aandelenbelang overeenstemmend gedeelte van de onderneming heeft verkregen, in zoverre niet aan de indirecte bezitseis is voldaan. Het beroep op een uit een participatieovereenkomst van 2010 voortvloeiend optierecht faalt omdat de bepaling te diffuus is en de opschortende voorwaarde niet is vervuld. De aanslag naar een belaste verkrijging van € 315.967 blijft in stand; de zaken van twee andere kinderen (23/1674 en 23/1675) zijn gelijktijdig behandeld.", "rechtsregel": "De indirecte bezitseis van art. 35d lid 1 aanhef en letter c SW 1956 wordt beoordeeld per objectieve onderneming op het tijdstip van de verkrijging; wordt de gerechtigdheid van de houdstervennootschap tot een (toegerekende) onderneming binnen de vijfjaarstermijn vergroot, dan is voor dat uitgebreide gedeelte niet aan de bezitseis voldaan en geldt de BOR daarvoor niet. De uitzondering voor uitbreidingsinvesteringen uit HR 29 mei 2020 ziet uitsluitend op activa en passiva die opgaan in de bestaande objectieve onderneming, niet op een vergroting van de subjectieve gerechtigdheid.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c lid 1 onderdeel c SW 1956", "art. 35c lid 5 onderdeel a SW 1956", "art. 35d lid 1 onderdeel c SW 1956"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2025:1856"}, {"ecli": "ECLI:NL:RBNHO:2025:10749", "instantie": "Rechtbank Noord-Holland", "datum": "2025-06-27", "gepubliceerd": "2026-05-20", "onderwerp": "APV/trust VS: BvdB-voorkoming ondanks belastingverdrag", "samenvatting": "Mevrouw X is gerechtigd tot een discretionaire trust (opgericht bij testament) die in de VS niet-fiscaal-transparant is en in Nederland als afgezonderd particulier vermogen (APV) ex art. 2.14a Wet IB 2001 wordt toegerekend. Het belastingverdrag VS-NL biedt geen bescherming tegen de economisch dubbele heffing. De Rechtbank oordeelt dat art. 25b BvdB (voorkoming dubbele belasting) wél van toepassing is, ook al bestaat er een belastingverdrag, omdat dit verdrag geen effectieve voorkoming biedt voor de APV-heffing.", "rechtsregel": "Art. 1 lid 2 BvdB staat niet aan toepassing van art. 25b BvdB in de weg indien een belastingverdrag wel hybride entiteiten adresseert maar geen effectieve voorkoming biedt voor de economisch dubbele heffing die door de APV-toerekening (art. 2.14a Wet IB 2001) ontstaat.", "wetsartikelen": ["art. 2.14a Wet IB 2001", "art. 25b BvdB 2001", "art. 25ba BvdB 2001", "art. 1 lid 2 BvdB 2001", "art. 24 lid 4 belastingverdrag VS-NL"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNHO:2025:10749", "annotatie": "NTFR 2025/1847 (dr. R.W.G. Rouwers); NLF 2025/2346 (Loes van Hulten); V-N 2026/23.10"}, {"ecli": "ECLI:NL:RBZWB:2025:3999", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2025-06-26", "gepubliceerd": "2025-08-05", "zaaknummer": "BRE 24/5399", "onderwerp": "Intrekking ANBI-status stichting die dorpshuis verhuurt; hoorplicht geschonden", "samenvatting": "De inspecteur trok per 31 december 2023 de ANBI-status in van een stichting die een dorpshuis in eigendom heeft en dit verhuurt aan een bv die onderverhuurt aan een horeca-exploitant. De rechtbank oordeelt dat de hoorplicht is geschonden omdat de inspecteur in strijd met een tijdens het hoorgesprek gemaakte afspraak uitspraak op bezwaar deed zonder het heroverwogen standpunt te delen, maar laat de rechtsgevolgen in stand: verhuur van onroerende zaken is volgens vaste jurisprudentie op zichzelf geen algemeen nuttige werkzaamheid, ook niet als het met de verhuur beoogde doel maatschappelijk nuttig is, zodat de stichting niet rechtstreeks het algemeen belang dient (kwalitatieve toets van artikel 5b AWR). Het beroep op HR 22 juni 2012 faalt omdat niet aannemelijk is dat de verhuur primair op fondsenwerving voor eigen activiteiten was gericht, en het beroep op het gelijkheidsbeginsel is onvoldoende gemotiveerd.", "rechtsregel": "Een instelling die uitsluitend onroerend goed verhuurt dient daarmee niet rechtstreeks het algemeen belang in de zin van artikel 5b AWR, ook niet als de huurders of het met de verhuur beoogde doel wel algemeen nuttig zijn, tenzij de verhuur primair strekt tot fondsenwerving voor eigen algemeen nuttige activiteiten.", "wetsartikelen": ["art. 5b AWR", "art. 8:72 Awb"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2025:3999"}, {"ecli": "ECLI:NL:RBGEL:2025:2946", "instantie": "Rechtbank Gelderland", "datum": "2025-04-17", "gepubliceerd": "2025-08-27", "zaaknummer": "AWB 23/5047 en 5048", "onderwerp": "Art. 12 SW: 180-dagenfictie bij schenking uit huwelijksgemeenschap", "samenvatting": "Belanghebbende en zijn zus hebben op 31 oktober 2020 ieder EUR 105.515 vrij van recht geschonken gekregen; de vader is in 2021 binnen 180 dagen na de schenking overleden. De inspecteur heeft bij de aanslag erfbelasting de verkrijging verhoogd met een fictieve verkrijging van EUR 52.757 (de helft van de schenking) op grond van art. 12 SW 1956, tot EUR 323.300. Belanghebbende stelt dat uitsluitend de in gemeenschap van goederen gehuwde echtgenote schenker was omdat erflater wegens dementie wilsonbekwaam zou zijn geweest. Omdat de schenkingsovereenkomst niet schriftelijk is vastgelegd, komt het bewijsrisico voor rekening van belanghebbende; een CIZ-indicatiebesluit dat pas vanaf 20 mei 2021 in intensieve dementiezorg voorziet, maakt feitelijke wilsonbekwaamheid ten tijde van de schenking niet aannemelijk, zodat art. 12 SW terecht is toegepast.", "rechtsregel": "Wie zich erop beroept dat bij een schenking uit een huwelijksgemeenschap uitsluitend de langstlevende echtgenoot en niet ook de binnen 180 dagen overleden erflater schenker was, draagt daarvan de bewijslast; bij het ontbreken van een schriftelijke schenkingsovereenkomst komt het bewijsrisico voor zijn rekening en volstaat de enkele stelling van dementie niet.", "wetsartikelen": ["art. 12 SW 1956"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2025:2946"}, {"ecli": "ECLI:NL:GHSHE:2025:989", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2025-04-09", "gepubliceerd": "2025-07-23", "zaaknummer": "23/1851", "onderwerp": "Schenkbelasting: het wilsvereiste als zelfstandige voorwaarde voor een schenking en de vrijstelling voor voldoening aan een natuurlijke verbintenis", "samenvatting": "Verwijzingszaak na HR 8 december 2023. Een echtgenoot droeg in 2010 onroerende zaken aan zijn echtgenote over voor € 233.900 op basis van een in zijn opdracht 'zo laag mogelijk' opgestelde taxatie; de FIOD legde later een aanzienlijk hogere waarde bloot. De Hoge Raad vernietigde de uitspraak van hof Arnhem-Leeuwarden omdat dat hof de wil tot bevoordeling louter had afgeleid uit de bevoordelingsbewustheid, en omdat de enkele omstandigheid dat het gestelde doel ook via overdracht tegen werkelijke waarde bereikbaar was geen toereikende grond is om het bestaan van een natuurlijke verbintenis te verwerpen. Na verwijzing stond de verarming, de verrijking en de wederzijdse bevoordelingsbewustheid vast. Het hof beantwoordt vraag I bevestigend: uit het initiatief van de schenker, de opdracht om laag te taxeren, de huwelijksrelatie, het aanzienlijke waardeverschil, de vrije prijsvorming en de door belanghebbende zelf genoemde bedoeling om haar 'niet onbemiddeld' achter te laten, volgt dat de schenker specifiek háár wilde bevoordelen. Vraag II beantwoordt het hof ontkennend: belanghebbende maakt niet aannemelijk dat sprake was van een dringende morele verplichting in de zin van art. 6:3 lid 1 BW; het op naam van de niet-ondernemende partner zetten van goederen met het oog op dreigend beslag is geen voldoening aan een natuurlijke verbintenis. De belaste verkrijging wordt (na correctie van het dictum voor de vrijstelling van € 2.000) vastgesteld op € 249.782.", "rechtsregel": "De wil tot bevoordeling is een zelfstandig vereiste voor een schenking en kan niet louter uit de bevoordelingsbewustheid worden afgeleid; in de regel zal bij bewustheid van de vermogensverschuiving echter ook aan het wilsvereiste zijn voldaan en slechts in uitzonderingssituaties niet, waarbij van de motieven van de schenker wordt geabstraheerd en de bewijslast op de inspecteur rust. Het beroep op de vrijstelling van art. 33 onder 12° SW 1956 (voldoening aan een natuurlijke verbintenis, art. 6:3 lid 1 BW) moet objectief worden getoetst en rust op de belastingplichtige; het willen beschermen van de partner tegen ondernemersrisico of dreigend beslag levert op zichzelf geen dringende morele verplichting op.", "wetsartikelen": ["art. 1 lid 7 SW 1956", "art. 33 onder 12° SW 1956", "art. 6:3 lid 1 BW", "art. 7:186 lid 2 BW"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2025:989"}, {"ecli": "ECLI:NL:GHSHE:2025:990", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2025-04-09", "gepubliceerd": "2025-08-27", "zaaknummer": "23/1149", "onderwerp": "Partnervrijstelling en partnertarief erfbelasting bij een kort voor het overlijden aangegaan geregistreerd partnerschap; geen fraus legis", "samenvatting": "Erflater (geboren 1930, kinderloos, chronisch ziek) werd verzorgd door belanghebbende, praktijkondersteuner bij zijn huisartsenpraktijk. Hij benoemde haar in maart 2015 tot enig erfgenaam, besprak met de notaris uitdrukkelijk fiscale besparingsmogelijkheden, kocht in april 2015 een woning waar zij hem zou verzorgen; zij liet zich daar inschrijven, haar echtscheiding werd op 17 juli 2015 ingeschreven en op 6 augustus 2015 gingen erflater en belanghebbende een geregistreerd partnerschap aan. Erflater stopte op 7 oktober 2015 met eten en overleed ruim twee maanden na het partnerschap; kort daarna ging belanghebbende weer samenwonen met haar ex-echtgenoot. De inspecteur nam de partnervrijstelling (€ 633.014) en het partnertarief terug met een navorderingsaanslag naar een belaste verkrijging van € 259.032. Het hof bevestigt de rechtbank: het partnerbegrip van art. 5a AWR / SW 1956 berust op objectieve criteria waaraan belanghebbende voldoet, de wetgever heeft bewust géén minimumduur voor het partnerschap in de SW opgenomen, en alleen een schijnhandeling of fraus legis kan een uitzondering rechtvaardigen. Hoewel vaststaat dat erfbelasting is bespaard en dat dit met de notaris was besproken, ontbreekt de tweede voorwaarde van HR 16 februari 2024: het partnerschap was niet van elke reële praktische betekenis ontbloot, gelet op de aankoop en verbouwing van de gezamenlijke woning, de verkoop van erflaters woning, de weekendverblijven, de wederzijdse genegenheid en zorg en de overgelegde correspondentie en foto's. Dat belanghebbende daarnaast feitelijk een band met haar ex-partner had, doet niet af aan de wettelijke zorgverplichting jegens haar geregistreerd partner.", "rechtsregel": "De partnervrijstelling van art. 32 lid 1 onder 4° letter a SW 1956 en het partnertarief van art. 24 lid 1 onder I SW 1956 moeten worden verleend zodra aan de objectieve criteria van het partnerbegrip (art. 5a AWR jo. art. 2 lid 6 AWR) is voldaan; de korte duur van een geregistreerd partnerschap kan daaraan niet afdoen omdat de wetgever bewust geen minimumduur heeft gesteld. Fraus legis kan de faciliteiten alleen wegnemen als de inspecteur bewijst dat het ontgaan van erfbelasting het doorslaggevende motief was én dat het partnerschap voor een zo korte periode is aangegaan dat de daaraan verbonden wettelijke verplichtingen, zoals de wederzijdse zorgplicht, geen reële praktische betekenis konden hebben.", "wetsartikelen": ["art. 32 lid 1 onder 4° letter a SW 1956", "art. 24 lid 1 onder I SW 1956", "art. 1 lid 1 onder 1° SW 1956", "art. 5a lid 1 letter a AWR", "art. 2 lid 6 AWR"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2025:990"}, {"ecli": "ECLI:NL:HR:2025:507", "instantie": "Hoge Raad", "datum": "2025-04-04", "gepubliceerd": "2025-06-04", "zaaknummer": "23/02449", "onderwerp": "Schenkbelasting; waardering certificaten van aandelen in vastgoed-bv", "samenvatting": "Op 24 december 2015 schonk de vader van belanghebbende certificaten van aandelen in een bv met een portefeuille van 66 objecten, waaronder 57 verhuurde (delen van) woningen. Het Hof achtte de waarderingsregels van art. 21, leden 5 en 8, SW in verbinding met art. 10a Uitvoeringsbesluit SW dwingend van toepassing op de in de bv aanwezige woningen. De Hoge Raad vernietigt: bij (certificaten van) aandelen wordt de waardering niet naar haar aard rechtstreeks bepaald door de waarde van vermogensbestanddelen waarvoor de SW een bijzondere waarderingsregeling kent, zodat art. 21, leden 5 en 8, SW niet verplicht van toepassing is, maar hooguit als hulpmiddel of informatiebron kan dienen bij het bepalen van de waarde in het economische verkeer van art. 21, lid 1, SW. Verwijzing volgt voor onderzoek naar het waardedrukkende effect van de verhuurde staat.", "rechtsregel": "De bijzondere waarderingsvoorschriften voor woningen van art. 21, leden 5 en 8, SW 1956 gelden niet voor de waardering van (certificaten van) aandelen in een vennootschap tot wier vermogen woningen behoren; die waardering geschiedt naar de waarde in het economische verkeer van art. 21, lid 1, SW, waarbij de WOZ-waarde en de leegwaarderatio hooguit als hulpmiddel kunnen worden gebruikt.", "wetsartikelen": ["art. 21 lid 1 SW 1956", "art. 21 lid 5 SW 1956", "art. 21 lid 8 SW 1956", "art. 10a Uitvoeringsbesluit SW 1956", "art. 81 lid 1 Wet RO"], "belang": "hoog", "oordeel": "verwijzing", "gerelateerd": ["ECLI:NL:GHAMS:2023:1284", "ECLI:NL:PHR:2024:486"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2025:507"}, {"ecli": "ECLI:NL:GHARL:2025:1435", "instantie": "Gerechtshof Arnhem-Leeuwarden", "datum": "2025-03-11", "gepubliceerd": "2025-11-14", "zaaknummer": "23/1065", "onderwerp": "Recht van schenking: beschikkingsmacht over vermogen van een SPF", "samenvatting": "Grootvader en grootmoeder lieten in 2005 naar het recht van Curaçao een stichting particulier fonds oprichten, brachten daarin vermogen (onder meer € 600.000 en een vordering) in en kregen de bij de oprichting ontstane bevoegdheden van de formele bestuurder overgedragen, die tegen een bescheiden fee optrad en werd gevrijwaard. In 2009 keerde het fonds € 250.000 uit aan belanghebbende, ter zake waarvan een aanslag in het recht van schenking (SW zoals die tot 2010 luidde) van € 56.812 werd opgelegd; de vergrijpboete was al bij uitspraak op bezwaar vernietigd. Het Hof acht op grond van de overdracht van bevoegdheden, de vrijwaring, de volmachten aan de vader van belanghebbende en de gang van zaken rond beleggingsbeslissingen het bewijsvermoeden gerechtvaardigd dat grootvader feitelijk de beschikkingsmacht behield, welk vermoeden niet is ontzenuwd, zodat de uitkering als schenking van grootvader wordt aangemerkt. Het hoger beroep is uitsluitend gegrond wegens een schending van art. 8:42 Awb (weggelakte passages zonder beroep op art. 8:29 Awb), hetgeen met toepassing van art. 8:31 Awb enkel tot vergoeding van proceskosten en griffierecht leidt; de aanslag blijft in stand.", "rechtsregel": "Kan degene die vermogen in een stichting particulier fonds heeft ingebracht daarover blijven beschikken als ware het zijn eigen vermogen, dan wordt door de stichting heen gekeken en gelden uitkeringen aan begunstigden als schenkingen van die persoon; de bewijslast daarvoor rust op de inspecteur, die zich mag bedienen van een op de feiten gebaseerd bewijsvermoeden.", "wetsartikelen": ["Successiewet 1956", "art. 8:29 Awb", "art. 8:31 Awb", "art. 8:42 Awb", "art. 8:75 Awb", "art. 6 EVRM"], "belang": "middel", "oordeel": "gegrond", "parallelzaken": ["ECLI:NL:GHARL:2025:1433", "ECLI:NL:GHARL:2025:1434", "ECLI:NL:GHARL:2025:1436"], "gerelateerd": ["ECLI:NL:HR:2025:1692"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHARL:2025:1435"}, {"ecli": "ECLI:NL:PHR:2025:303", "instantie": "Parket bij de Hoge Raad", "datum": "2025-03-07", "gepubliceerd": "2025-09-29", "zaaknummer": "24/02647", "onderwerp": "Familiestichting als APV; SBBI-kwalificatie; fictieve erfgenaam", "samenvatting": "Een in 1907 opgerichte familiestichting met een vermogen van circa EUR 8 mln keert uitkeringen aan familieleden uit en steunt daarnaast tinnitusonderzoek; in geschil is of zij een sociaal belang behartigende instelling is dan wel afgezonderd particulier vermogen in de zin van art. 2.14a Wet IB 2001, waarvan het aandeel van belanghebbende als fictieve erfgenaam aan haar wordt toegerekend (EUR 156.931 in 2018 en EUR 146.458 in 2019). Het Hof achtte toerekening mogelijk maar oordeelde dat het APV-regime op stelselniveau in strijd is met art. 1 EP EVRM in samenhang met art. 14 EVRM. A-G Koopman concludeert dat de stichting geen SBBI is en dat de kwalificatie als APV en de toerekening aan de erfgenaam berusten op een aan het Hof voorbehouden feitelijke waardering, maar dat de wetgever met de vormgeving van het APV-regime binnen de wide margin of appreciation is gebleven, zodat het principale beroep van de Staatssecretaris slaagt en het incidentele beroep van belanghebbende faalt.", "rechtsregel": "Het APV-regime geldt voor alle discretionaire doelvermogens die meer dan bijkomstig een particulier belang dienen, zonder aanvullende misbruikeis, en is op stelselniveau niet in strijd met art. 1 EP EVRM in samenhang met art. 14 EVRM, ook al kan het aan een (fictieve) erfgenaam toegerekende aandeel afwijken van het door hem daadwerkelijk genoten voordeel.", "wetsartikelen": ["art. 2.14a Wet IB 2001", "art. 5c AWR", "art. 64 AWR", "art. 4:12 BW", "art. 1 EP EVRM", "art. 14 EVRM", "art. 81 Wet RO"], "belang": "middel", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:RBNHO:2023:1743", "ECLI:NL:GHAMS:2024:1494", "ECLI:NL:HR:2025:1389"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2025:303"}, {"ecli": "ECLI:NL:GHDHA:2025:737", "instantie": "Gerechtshof Den Haag", "datum": "2025-03-04", "gepubliceerd": "2026-07-07", "zaaknummer": "BK-24/285", "onderwerp": "BOR: voortzettingseis geschonden; terugname en art. 37, lid 4, SW", "samenvatting": "Bij een met een vaststellingsovereenkomst afgestemde schenking van certificaten van aandelen werd de BOR verleend; binnen vijf jaar verkocht de groep haar via een indirect aanmerkelijk belang gehouden 5%-belang in een buitenlandse beursvennootschap om investeringen te financieren, waarna de inspecteur op grond van artikel 37, lid 3, SW een aanvullende aanslag schenkbelasting oplegde. Het Hof oordeelt dat de bezittingen en schulden van dat lichaam op grond van artikel 35c, leden 1, 5 en 6, SW van rechtswege aan de holding worden toegerekend en dat op dat niveau, aan de hand van de IB-criteria, sprake is van een afzonderlijke objectieve onderneming, zodat de verkoop een (gedeeltelijke) staking oplevert en het voortzettingsvereiste van artikel 35e SW is geschonden; herinvestering van de opbrengst in de groep doet daaraan niet af en het geval valt niet onder de limitatieve uitzonderingen van artikel 10 UR SW. Beroepen op het wettelijke en het ongeschreven evenredigheidsbeginsel falen, mede gelet op artikel 120 Grondwet. Voor de evenredige terugname moet worden aangesloten bij de bij de primitieve aanslag gehanteerde waardering, waartegen op grond van artikel 37, lid 4, SW niet opnieuw kan worden opgekomen; dat levert geen strijd met artikel 1 EP EVRM op. Het hoger beroep van de inspecteur is gegrond, het incidentele hoger beroep en het verzoek om schadevergoeding worden afgewezen.", "rechtsregel": "Vervreemding binnen vijf jaar van een aan de holding toegerekend belang dat op holdingniveau een afzonderlijke objectieve onderneming vormt, schendt het voortzettingsvereiste van artikel 35e SW en leidt tot evenredige terugname van de BOR, waarbij op grond van artikel 37, lid 4, SW de bij de primitieve aanslag vastgestelde waardering van het ondernemingsvermogen niet opnieuw ter discussie kan worden gesteld.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 35e SW 1956", "art. 37
