      "samenvatting": "Belanghebbende (woonachtig in Frankrijk) had gewetensbezwaren tegen de aanwending van Nederlandse belastinggelden voor militaire doeleinden en wenste daarom de aanslagen schenkbelasting (schenking 2021 van €128.750) en erfbelasting (verkrijging 2021 van €206.009) niet te voldoen. Niet in geschil was dat de aanslagen in overeenstemming met de Successiewet 1956 waren vastgesteld. De rechtbank oordeelt dat de aanwending van belastingopbrengsten een politieke en geen rechterlijke kwestie is en dat gewetensbezwaren niet tot vermindering van de aanslagen kunnen leiden. Ook het verzoek om een dwangsom faalt omdat de inspecteur binnen twee weken na ingebrekestelling besliste. Beroepen ongegrond.",
      "rechtsregel": "Gewetensbezwaren tegen de aanwending van belastinggelden vormen geen grond voor vermindering van een conform de Successiewet 1956 vastgestelde aanslag schenk- of erfbelasting; de besteding van belastingopbrengsten is een politieke, niet een rechterlijke aangelegenheid.",
      "wetsartikelen": [
        "Successiewet 1956 (algemeen)",
        "art. 4:17 Awb (dwangsom)"
      ],
      "belang": "laag",
      "oordeel": "ongegrond",

    {
      "ecli": "ECLI:NL:RBZWB:2026:5371",

      "datum": "2026-06-18",
      "gepubliceerd": "2026-06-25",
      "onderwerp": "Fictieve verkrijging art. 13a SW; waardestijging aandelen door overlijden",
      "samenvatting": "Belanghebbende houdt alle aandelen in een BV die (via certificering en een tussenhoudster) een vennootschap bezit waarop een lijfrenteverplichting jegens een derde rustte. Door het overlijden van de lijfrentegerechtigde verviel de verplichting, waardoor de aandelen in waarde stegen. De inspecteur nam op grond van art. 13a SW een fictieve verkrijging in aanmerking. De rechtbank oordeelt dat de omstandigheden binnen het door de wetgever voorziene toepassingsbereik van art. 13a SW vallen; de bepaling kan als wet in formele zin niet aan het evenredigheidsbeginsel worden getoetst en het beroep op art. 1 EP en art. 14 EVRM faalt (de beperking tot de familiekring is niet van redelijke grond ontbloot). Beroep ongegrond.",
      "rechtsregel": "Een waardestijging van aandelen die het gevolg is van het vervallen van een op de vennootschap rustende lijfrenteverplichting door overlijden valt binnen het toepassingsbereik van de fictieve verkrijging van art. 13a SW; de bepaling kan als formele wet niet aan het evenredigheidsbeginsel worden getoetst en is niet in strijd met art. 1 EP / art. 14 EVRM.",

    {
      "ecli": "ECLI:NL:RBZWB:2026:5370",
      "instantie": "Rechtbank Zeeland-West-Brabant",
      "datum": "2026-06-18",
      "gepubliceerd": "2026-06-25",
      "onderwerp": "Erfbelasting; WOZ-waarde woning staat in rechte vast (art. 18a AWR)",
      "samenvatting": "Tot de in 2012 verkregen nalatenschap behoorde een woning waarvan de WOZ-waarde op €534.000 was vastgesteld. In latere jaren erkende de BsGW een te hoge waardering, maar de WOZ-beschikking voor het peiljaar 2012 bleef onherroepelijk. De inspecteur verminderde de (eveneens onherroepelijke) aanslag erfbelasting ambtshalve op grond van art. 18a, lid 1, onderdeel b, AWR uitgaande van €350.000. Belanghebbende wenste een verdere verlaging. De rechtbank oordeelt dat voor de erfbelasting wordt aangesloten bij de in rechte vaststaande WOZ-waarde en dat de aanslag alleen verder kan worden verminderd indien de WOZ-beschikking zelf wordt herzien; dat is hier niet gebeurd. Beroep ongegrond.",
      "rechtsregel": "Voor de waardering van een woning in de erfbelasting wordt aangesloten bij de in rechte vaststaande WOZ-waarde van het verkrijgingsjaar; een onherroepelijke aanslag kan op de voet van art. 18a AWR uitsluitend verder worden verminderd indien de onderliggende WOZ-beschikking wordt herzien.",
      "wetsartikelen": [
        "art. 21, lid 5 SW 1956",
        "art. 18a AWR"
      ],

      "oordeel": "ongegrond",
      "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2026:5370"

      "zaaknummer": "BK-25/795",
      "onderwerp": "Giftenaftrek geweigerd na intrekking ANBI-status; kwade trouw",
      "samenvatting": "Aanslag IB/PVV 2021. Het hof oordeelt dat de hoorplicht en het inzagerecht niet zijn geschonden en dat de uitspraak op bezwaar niet prematuur was. Giftenaftrek wordt geweigerd omdat de ANBI-status van de instelling is ingetrokken en belanghebbende te kwader trouw was. Relevant voor de schenkbelasting via de ANBI-status (art. 5b AWR), die ook bepalend is voor de vrijstellingen van art. 32 en 33 SW 1956.",
      "rechtsregel": "Intrekking van de ANBI-status ontneemt de aftrek van giften aan die instelling; op opgewekt vertrouwen kan geen beroep worden gedaan door een gever die te kwader trouw is.",

    {
      "ecli": "ECLI:NL:RBZWB:2026:5369",

      "datum": "2026-06-18",
      "gepubliceerd": "2026-07-06",
      "zaaknummer": "BRE 25/1623",
      "onderwerp": "Schenkbelasting; eigenwoningvrijstelling geweigerd na eerder benutte verhoogde vrijstelling",
      "samenvatting": "Belanghebbende deed voor een schenking van zijn vader van EUR 25.731 in 2018 een geslaagd beroep op de eenmalig verhoogde vrijstelling en verzocht in 2021 voor een schenking van EUR 75.000 om de eigenwoningvrijstelling van artikel 33, aanhef en onderdeel 5, onder c, SW 1956. De rechtbank oordeelt dat de schenkingsovereenkomst uit 2018 geen herroepingsclausule bevat en dat de gestelde afwijkende partijbedoeling geen steun vindt in verklaringen, gedragingen of de tekst; bovendien zou de schenking pas in 2023 zijn teruggedraaid, ruim na het belastbare feit in 2021, zodat ook het goedkeurende beleid voor herroepen schenkingen niet van toepassing is. Het beroep op het vertrouwensbeginsel wegens de ongelukkig geformuleerde vermelding van EUR 111.906 aan vrijstelling op het aanslagbiljet faalt, omdat belanghebbende gelet op de toelichting en het verschuldigde bedrag niet redelijkerwijs kon menen dat de vrijstelling was verleend. Het beroep is ongegrond.",
      "rechtsregel": "Een eerder benutte eenmalig verhoogde vrijstelling staat toepassing van de eigenwoningvrijstelling in een later jaar in de weg zolang niet aannemelijk is dat de eerdere schenking herroepelijk was en voor het latere belastbare feit rechtsgeldig is herroepen.",

    {
      "ecli": "ECLI:NL:GHARL:2026:4066",
      "instantie": "Gerechtshof Arnhem-Leeuwarden",
      "datum": "2026-06-16",
      "gepubliceerd": "2026-06-26",
      "onderwerp": "Quasi-wettelijke verdeling; leegwaarderatio bij verhuurde woning",
      "samenvatting": "Erflater sloot in zijn testament de wettelijke verdeling uit en legde een quasi-wettelijke verdeling op; alle goederen (waaronder een verhuurde woning) gingen naar de langstlevende echtgenote, de kinderen verkregen een onderbedelingsvordering. Belanghebbende was ten tijde van het overlijden huurder van de woning. De inspecteur paste bij haar de leegwaarderatio niet toe (art. 21, lid 8, laatste volzin SW: verkrijging door huurder), waardoor haar verkrijging hoger uitviel dan die van haar broer en zus. Het Hof oordeelt dat belanghebbende krachtens erfrecht een geldvordering heeft verkregen (art. 1, lid 3, jo. art. 10, lid 5 SW), en niet de woning zelf, zodat de uitzondering voor de verkrijgende huurder niet geldt. De leegwaarderatio (62%) moet ook bij haar worden toegepast; de aanslag wordt verminderd tot een belaste verkrijging van €38.358. Hoger beroep inspecteur ongegrond, bevestiging rechtbank.",
      "rechtsregel": "Bij een quasi-wettelijke verdeling verkrijgt het kind krachtens erfrecht een onderbedelingsvordering (art. 1, lid 3, jo. art. 10, lid 5 SW) en niet de tot de nalatenschap behorende woning zelf; de uitzondering van art. 21, lid 8, laatste volzin SW (geen leegwaarderatio bij verkrijging door de huurder) is daarom niet van toepassing, ook als het kind feitelijk huurder van de woning was.",
      "wetsartikelen": [

        "art. 10, lid 5 SW 1956",
        "art. 21, lid 5 SW 1956",
        "art. 21, lid 8 SW 1956"
      ],

      "oordeel": "ongegrond",

    {
      "ecli": "ECLI:NL:RBDHA:2026:15427",
      "instantie": "Rechtbank Den Haag",
      "datum": "2026-05-29",
      "gepubliceerd": "2026-06-30",
      "zaaknummer": "25/7796",
      "onderwerp": "Afwijzing ANBI-verzoek jeugdvereniging; categorie 'welzijn' art. 5b AWR",
      "samenvatting": "Een uit 1886 stammende vereniging voor lokaal jeugd- en welzijnswerk verzocht in december 2024 om de ANBI-status; de inspecteur wees dat af omdat de activiteiten (clubs, dans, kampen, evenementen) ontspanning en persoonlijke ontwikkeling betreffen en slechts zijdelings het algemeen belang dienen. In geschil is of de vereniging valt onder de categorie 'welzijn' van art. 5b, lid 3, onderdeel a, AWR. De rechtbank verwerpt het standpunt van de inspecteur dat 'welzijn' een afgebakende kwetsbare doelgroep vereist en interpreteert de categorieën ruim, maar oordeelt dat de vereniging de kwalitatieve toets niet haalt: onvoldoende inzichtelijk is hoe de activiteiten het algemeen belang rechtstreeks en (nagenoeg) uitsluitend dienen, mede omdat niet is onderbouwd in hoeverre zij zich richt op een publiek buiten de eigen ledenkring. Het beroep op het gelijkheidsbeginsel faalt omdat stichtingen zonder leden rechtens niet vergelijkbaar zijn met een vereniging en de feitelijke vergelijkbaarheid slechts summier is onderbouwd.",
      "rechtsregel": "De categorie 'welzijn' van art. 5b, lid 3, onderdeel a, AWR vereist geen afgebakende kwetsbare doelgroep, maar een vereniging dient te bewijzen dat haar feitelijke werkzaamheden rechtstreeks en (nagenoeg) uitsluitend het algemeen belang dienen en zich niet beperken tot het particuliere belang van de eigen ledenkring.",
      "wetsartikelen": [

        "art. 1a Uitvoeringsregeling AWR 1994"
      ],
      "belang": "middel",
      "oordeel": "ongegrond",

    {
      "ecli": "ECLI:NL:GHARL:2026:3419",
      "instantie": "Gerechtshof Arnhem-Leeuwarden",
      "datum": "2026-05-27",
      "gepubliceerd": "2026-08-26",
      "onderwerp": "BOR: vastgoed-BV geen materiële onderneming; arbeid+/rendement+-toets",
      "samenvatting": "Tot de nalatenschap behoren alle aandelen in een vastgoed-BV (verhuur bedrijfspanden, drie werknemers onder wie erflater). Het Hof bevestigt dat de BV geen materiële onderneming drijft: de verhuur-, beheer- en onderhoudswerkzaamheden horen bij normaal vermogensbeheer en hebben niet onmiskenbaar ten doel een hoger rendement te behalen dan bij normaal vermogensbeheer. Incidentele huurdersinvesteringen zijn niet aan de BV toe te rekenen; een rendementsvergelijking met de IPD Vastgoedindex baat belanghebbende niet omdat al aan de arbeidstoets niet is voldaan. BOR (art. 35b/35c SW) niet van toepassing; hoger beroep ongegrond.",
      "rechtsregel": "Vastgoedexploitatie is pas een materiële onderneming voor de BOR als de arbeid naar aard en omvang normaal vermogensbeheer te boven gaat én onmiskenbaar gericht is op een bovengemiddeld rendement; de bewijslast rust op de verkrijger die zich op de BOR beroept.",

      "belang": "middel",

    {
      "ecli": "ECLI:NL:GHSHE:2026:1357",
      "instantie": "Gerechtshof 's-Hertogenbosch",
      "datum": "2026-05-27",
      "gepubliceerd": "2026-06-24",
      "onderwerp": "Integrale proceskostenvergoeding na gegrond bezwaar aanslag erfbelasting",
      "samenvatting": "De inspecteur had een aanslag erfbelasting opgelegd naar een geschatte verkrijging van €1.000.000 en het bezwaar daartegen later gegrond verklaard. In geschil is of belanghebbende recht heeft op een integrale (in plaats van forfaitaire) proceskostenvergoeding wegens onzorgvuldig handelen van de inspecteur en wegens een door de rechtbank vastgestelde schending van art. 8:42 Awb. Het hof oordeelt dat geen sprake is van bijzondere omstandigheden in de zin van art. 2, lid 3, Besluit proceskosten bestuursrecht en bevestigt de uitspraak van de rechtbank; het hoger beroep is ongegrond.",
      "rechtsregel": "Het schatten van een verkrijging en een schending van art. 8:42 Awb leveren op zichzelf geen bijzondere omstandigheid op die een integrale proceskostenvergoeding (art. 2, lid 3, Bpb) rechtvaardigt; daarvoor is verdergaande onzorgvuldigheid (tegen beter weten in handelen) vereist.",

    {
      "ecli": "ECLI:NL:GHARL:2026:3418",
      "instantie": "Gerechtshof Arnhem-Leeuwarden",
      "datum": "2026-05-27",
      "gepubliceerd": "2026-06-22",
      "zaaknummer": "23/2564",
      "onderwerp": "BOR erfbelasting: vastgoedexploitatie geen materiële onderneming",
      "samenvatting": "Erflater overleed in 2016 en liet alle aandelen na in een vennootschap met acht onroerende zaken, waarvan een deel werd verhuurd; de aanslag erfbelasting werd na bezwaar en beroep vastgesteld naar een belaste verkrijging van € 1.245.731 zonder toepassing van de BOR. Het Hof beoordeelt per activiteit (aan- en verkoop, bouw en verbouw, verhuur) of sprake is van arbeid die naar aard en omvang meer omvat dan bij normaal vermogensbeheer gebruikelijk is en onmiskenbaar is gericht op een hoger rendement, en beantwoordt die vraag ontkennend: aan- en verkoop ontbrak in 2012-2016, de verbouwingsinvesteringen zijn door huurders gedaan en niet geactiveerd, en verhuur, beheer, toezicht, klein onderhoud en opruiming na een faillissement van een huurder horen bij normaal beheer. Ook de rendementsberekening ten opzichte van de IPD-vastgoedindex baat belanghebbende niet, de getaxeerde waarde van het verhuurde vastgoed van € 1.227.500 blijft in stand en er is geen grond de belastingrente te matigen.",
      "rechtsregel": "Exploitatie van onroerende zaken vormt slechts een materiële onderneming in de zin van artikel 3.2 Wet IB 2001 - en geeft dus alleen dan recht op de BOR - indien de arbeid naar aard en omvang meer omvat dan bij normaal vermogensbeheer gebruikelijk is én onmiskenbaar ten doel heeft een hoger dan normaal rendement te behalen, waarbij de bewijslast rust op degene die zich op de BOR beroept.",
      "wetsartikelen": [

        "art. 3.2 Wet IB 2001"
      ],
      "belang": "middel",
      "oordeel": "ongegrond",

      "onderwerp": "Erfbelasting: beroep buiten termijn, niet-ontvankelijk",
      "samenvatting": "In Spanje wonende erfgenaam stelde beroep in tegen een aanslag erfbelasting. Het beroepschrift is na afloop van de zeswekentermijn ter post bezorgd en ontvangen. De rechtbank verklaart het beroep niet-ontvankelijk; aan een inhoudelijke beoordeling van de aanslag komt zij niet toe.",

    {

      "samenvatting": "Belanghebbende (erfgenaam van een in Frankrijk wonende moeder) claimde de verhoogde kindvrijstelling voor erfbelasting. De verhoogde vrijstelling vereist dat de erflater meer dan 50% heeft bijgedragen aan het levensonderhoud van de verkrijger. De rechtbank oordeelde dat belanghebbende dit niet aannemelijk had gemaakt, gelet op de vermogenspositie van de moeder (saldi vanaf €23k t/m €112k) en de ontvangen schenkingen. Het beroep is ongegrond.",

    {

      "datum": "2026-05-19",
      "gepubliceerd": "2026-05-28",
      "onderwerp": "Erfbelasting: buitensporige last, beneficiaire aanvaarding en art. 1 EP EVRM",
      "samenvatting": "Belanghebbende (dochter) ontving bloot eigendom na overlijden moeder (vader heeft vruchtgebruik via oud testament). Zij aanvaardde beneficiair maar stelde dat de erfbelasting een buitensporige last vormde ex art. 1 EP EVRM, nu zij geen middelen had en de vader de erfbelasting weigerde te betalen. De rechtbank oordeelt dat beneficiaire aanvaarding niet afdoet aan de verschuldigdheid van erfbelasting over de bloot eigendomsverkrijging; de situatie met de vader (vruchtgebruiker die zijn deel niet betaalt) is een civielrechtelijke kwestie. Het beroep is slechts gegrond voor de proceskosten in de bezwaarfase.",
      "rechtsregel": "Beneficiaire aanvaarding van een nalatenschap ontslaat de erfgenaam niet van de verplichting erfbelasting te betalen over zijn verkrijging; het feit dat de vruchtgebruiker zijn aandeel in de erfbelasting niet voldoet, is een civielrechtelijke kwestie die de fiscale verschuldigdheid onverlet laat.",

      "instantie": "Rechtbank Den Haag",
      "datum": "2026-05-19",
      "gepubliceerd": "2026-07-30",
      "onderwerp": "Waardering overbedelingsschuld bij tweede overlijden (langstlevende)",
      "samenvatting": "Bij het tweede overlijden (erflaatster, 2023) moet de overbedelingsschuld/onderbedelingsvordering die is ontstaan door de ouderlijke boedelverdeling na het eerste overlijden (vader, 1999) worden gewaardeerd naar de werkelijke waarde van de woning ten tijde van het eerste overlijden, niet naar de destijds voor de aangifte gehanteerde (lagere WOZ-)waarde. De rechtbank volgt HR 25 september 2009 (ECLI:NL:HR:2009:BI1127). Beroep gegrond; verweerder moet uitgaan van de werkelijke waarde van EUR 269.999 (NLG 595.000), vermeerderd met testamentaire rente.",
      "rechtsregel": "Bij het overlijden van de langstlevende wordt de overbedelingsschuld/onderbedelingsvordering uit de ouderlijke boedelverdeling gewaardeerd naar de werkelijke waarde van het onderliggende goed ten tijde van het eerste overlijden, ook als bij het eerste overlijden een lagere waarde is aangegeven en aanvaard.",

      "samenvatting": "Na drie aanslagen schenkbelasting met onjuiste tenaamstelling legde de inspecteur — na herhaalde pogingen — een correcte aanslag op. Het hof oordeelt dat de heffingsbevoegdheid nog niet was uitgeput: de eerdere aanslagen met onjuiste tenaamstelling waren ongeldig en doorbrekten de verjaringstermijn niet voor de correcte aanslag. Een beroep op dwaling bij de aan de schenking ten grondslag liggende akte van rectificatie — opgemaakt na overlijden van beide partijen — werd verworpen. Het hoger beroep (bekrachtiging van ECLI:NL:RBZWB:2024:342) is ongegrond.",
      "rechtsregel": "Herhaalde onjuiste tenaamstelling door een systeemfout doorbreekt de heffingsbevoegdheid niet; de inspecteur die consequent corrigeert en uiteindelijk een penaanslag op naam stelt, handelt niet ernstig onzorgvuldig en de heffingsbevoegdheid is niet uitgeput.",

      "samenvatting": "Twee zoons schonken na het overlijden van hun vader elk € 250.000 aan de LAT-relatie van de vader (anderhalf jaar samen, niet samenwonend, niet opgenomen in testament). In een vaststellingsovereenkomst erkenden zoons een 'dringende morele verplichting'. Zij claimden de vrijstelling ex art. 33 aanhef en onder 12° SW (voldoening aan een natuurlijke verbintenis ex art. 6:3 BW). Hof bevestigt oordeel rechtbank: niet aannemelijk dat erflater nakoming door zoons verlangde; de zoons ervoeren zelf ook geen dringende morele verplichting naar objectieve maatstaven. Vaststellingsovereenkomst en subjectieve kwalificatie als 'morele verplichting' zijn onvoldoende om vrijstelling te claimen.",

      "onderwerp": "Belastingrente erfbelasting; buitenlandse erfgenaam zonder BSN",
      "samenvatting": "Aan een in Nieuw-Zeeland wonende erfgename (belaste verkrijging €602.821) zonder BSN is belastingrente (art. 30g AWR) opgelegd omdat de aangifte erfbelasting na de achtmaandstermijn werd ingediend. De vertraging kwam voort uit de tijd die nodig was om via een woonplaatsverklaring een BSN te verkrijgen; de Belastingdienst had op haar website de indruk gewekt dat aangifte pas met BSN mogelijk was. De rechtbank oordeelt dat het in rekening brengen van belastingrente in strijd is met het zorgvuldigheidsbeginsel en vernietigt de rentebeschikking. Beroep gegrond.",

      "samenvatting": "De broer van eiseres maakte haar in 2022 en 2023 respectievelijk € 13.873 en € 18.000 over, waarover de inspecteur schenkbelasting naar het derdentarief van 30% heffde. Eiseres stelde dat het ging om compensatie voor jarenlange onbetaalde arbeid en een gebroken belofte over inwoning, zodat sprake was van een rechtens afdwingbare dan wel natuurlijke verbintenis. De rechtbank oordeelt dat geen contractuele verhouding of schadeplichtigheid is ontstaan en dat eiseres, op wie de bewijslast rust, niet aannemelijk heeft gemaakt dat naar maatschappelijke opvattingen een zo dringende morele verplichting bestond dat van een natuurlijke verbintenis kan worden gesproken; beroepen ongegrond.",
      "rechtsregel": "Betalingen binnen familieverband zijn belaste schenkingen tenzij de verkrijger aannemelijk maakt dat naar maatschappelijke opvattingen een zo dringende morele verplichting van de betaler bestond dat de betaling voldoening van een natuurlijke verbintenis vormt.",

      "onderwerp": "BOR-bezitsvereiste bij erfrechtelijke verkrijging aandelenbelang: moeder hield 4",

      "onderwerp": "Schenking aandelen aan bedrijfsopvolger: loon uit dienstbetrekking?",
      "samenvatting": "De enig aandeelhouder van een familieconcern leverde op 17 juni 2022 al zijn aandelen (waarde EUR 7.800.000) ten titel van schenking aan eiser, sinds 2007 werkzaam bij het concern en laatstelijk directeur, onder een herroepingsvoorwaarde die aanknoopt bij de bedrijfsopvolgingsregeling van art. 35b en 35e SW 1956 en onder een doorgeefverplichting. De inspecteur merkte de waarde aan als loon uit dienstbetrekking en corrigeerde het box 1-inkomen tot EUR 8.033.836. De rechtbank oordeelt dat de inspecteur de bewijslast niet heeft voldaan: de aandelen behoorden tot het privevermogen van de schenker, de werkgever is niet gecompenseerd, en een enkel causaal verband met de dienstbetrekking maakt het voordeel nog geen loon. De concernregel voor loon van derden wordt niet uitgebreid tot de aandeelhouder-natuurlijk persoon, en van fooien of dergelijke prestaties van derden is evenmin sprake; het beroep is gegrond.",
      "rechtsregel": "Een schenking van aandelen door een aandeelhouder-natuurlijk persoon aan een werknemer-bedrijfsopvolger vormt geen loon uit dienstbetrekking indien de werkgever het voordeel niet heeft verstrekt en dit niet in opdracht en voor rekening van de werkgever is gekomen; een conditio sine qua non-verband met de dienstbetrekking is daartoe onvoldoende, en de concernregel voor loon van derden strekt zich niet uit tot een natuurlijk persoon-aandeelhouder.",

      "samenvatting": "Eiser erfde in 2001 aandeel in twee NSW-landgoederen; successierecht grotendeels buiten invordering gesteld. In 2019 werden percelen van een landgoed verkocht c.q. onttrokken aan NSW. In 2022 werd aanslag ter invordering erfbelasting opgelegd. Eiser betwist de grondslag; rechtbank oordeelt dat de aanslag terecht is opgelegd: de verminderingsbeschikking van 2009 had alleen betrekking op het terstond invorderbare deel, niet op de totale aanslaggrondslag.",

      "samenvatting": "Eiseres kwam op tegen de aan een overledene opgelegde aanslagen IB/PVV en Zvw 2021; de inspecteur verklaarde haar bezwaren niet-ontvankelijk omdat zij geen belanghebbende is. De rechtbank oordeelt dat bij een overledene alleen een erfgenaam of executeur kan worden aangemerkt als degene van wie inkomens- of vermogensbestanddelen in het voorwerp van de belasting zijn begrepen (art. 26a AWR); eiseres is blijkens het testament geen erfgenaam maar heeft slechts een vordering op de nalatenschap. De bezwaren zijn daarom terecht niet-ontvankelijk verklaard en de beroepen zijn met toepassing van artikel 8:54 Awb kennelijk ongegrond.",

      "zaaknummer": "BK-25/483",
      "onderwerp": "Ambtshalve aanslag erfbelasting; uitstel zitting en gestelde onwaardigheid",
      "samenvatting": "Na het overlijden van erflater in 2021 zonder testament is geen aangifte erfbelasting gedaan en is aan belanghebbende ambtshalve een aanslag opgelegd, die na bezwaar en beroep is verminderd tot een belaste verkrijging van € 196.622 (€ 26.449 erfbelasting). Het Hof wijst het verzoek om uitstel van de zitting af omdat belanghebbendes vragen rond de doodsoorzaak van erflater zonder nadere toelichting geen invloed hebben op de hoogte van de aanslag, en oordeelt dat ook de Rechtbank het uitstelverzoek op goede gronden en voldoende gemotiveerd heeft afgewezen. Inhoudelijk faalt het beroep: van omkering van de bewijslast is geen sprake, belanghebbende heeft niets aangevoerd waaruit volgt dat de omvang van de nalatenschap te hoog is vastgesteld, voor de stelling dat een broer onwaardig is om te erven (artikel 4:3, lid 1, letter d, BW) is geen begin van bewijs geleverd - en die stelling zou de verkrijging juist vergroten - en advocaatkosten zijn geen schuld van de nalatenschap in de zin van artikel 4:7 BW of last in de zin van artikel 20 SW 1956.",
      "rechtsregel": "De omvang van de nalatenschap en daarmee de hoogte van de aanslag erfbelasting staat los van de vraag wie als erfgenaam optreedt, zodat een gestelde onwaardigheid van een mede-erfgenaam op zichzelf geen grond is voor vermindering van de aanslag of voor uitstel van de zitting.",

      "onderwerp": "Erfbelasting: waardering huurrecht, indexatie, metterwoonclausule",
      "samenvatting": "Erflater verleende eiseres bij huurverklaring een levenslang huurrecht voor €500/maand (niet-zakelijk). Verweerder belastte dit o.g.v. art. 12 SW 1956 als fictieve erfrechtelijke verkrijging. Geschil: (1) moet indexatiemogelijkheid meewegen bij waardering? (2) rechtvaardigt impliciete metterwoonclausule 25% afwaardering? Rechtbank: ja op beide vragen. Verkrijging verminderd van €140.017 naar €96.625. Beroep gegrond.",

      "samenvatting": "Belanghebbende, die door de ziekte van Lyme niet kan werken en bij zijn in 2021 overleden moeder woonde, claimde de verhoogde kindvrijstelling van artikel 32, lid 1, onderdeel 4, sub b, SW 1956; de inspecteur paste de reguliere kindvrijstelling van € 21.282 toe bij een belaste verkrijging van € 29.095. Niet in geschil is dat belanghebbende voldoet aan de arbeidsongeschiktheidseis; het geschil betreft de onderhoudseis. Het Hof bevestigt dat 'grotendeels onderhouden' duidt op 50% of meer en oordeelt dat belanghebbende, op wie de bewijslast rust, niet aannemelijk heeft gemaakt dat erflaatster ten minste de helft van zijn kosten van levensonderhoud van € 6.472,20 in 2021 heeft gedragen; de overgelegde bankafschriften bieden zonder toelichting geen uitsluitsel, en de WSNP-aflossingen en de korting op de bijstandsuitkering wegens de kostendelersnorm doen daaraan niet af.",

      "zaaknummer": "AWB - 24 _ 8016",
      "onderwerp": "Mondelinge schenking van certificaten; schenkingstijdstip en aangiftebegrip",
      "samenvatting": "Eiser deed in september 2018 aangifte schenkbelasting van de schenking door zijn vader van 100 certificaten in een stichting administratiekantoor ter waarde van EUR 2.666.767, met 24 januari 2018 als schenkingsdatum; de inspecteur stelde zich later op het standpunt dat de schenking pas op 17 april 2018 (datum notariele akte) had plaatsgevonden en legde een tweede aanslag op naar een waarde van EUR 9.344.098. De rechtbank oordeelt dat eiser, gelet op de inleidende bepalingen en art. 1 van de notariele schenkingsakte en het aan de notaris toegezonden stappenplan, aannemelijk heeft gemaakt dat de schenking op 24 januari 2018 mondeling tot stand is gekomen en dat hij dat juist in zijn eerste aangifte heeft vermeld. De tweede aanslag is daarom, gelet op art. 66, lid 1, SW 1956, ten onrechte opgelegd en wordt vernietigd; ten overvloede overweegt de rechtbank dat een onjuiste vermelding van het schenkingstijdstip niet meebrengt dat geen aangifte is gedaan.",
      "rechtsregel": "Een schenking kan mondeling tot stand komen en de in een latere notariele akte vastgelegde datum van aanbod en aanvaarding is bepalend voor het belastbare feit; vermelding van een onjuist schenkingstijdstip in een overigens duidelijke aangifte brengt niet mee dat geen aangifte schenkbelasting is gedaan.",

      "onderwerp": "Wederzijdse dwaling bij schenking; vermindering aanslag ex art. 53 SW",
      "samenvatting": "Belanghebbende ontving in 2014 een van schenkbelasting vrijgestelde eigenwoningschenking van EUR 70.624 en in 2018 een tweede schenking van EUR 29.375, waarvoor de inspecteur de eenmalig verhoogde vrijstelling weigerde en een aanslag van EUR 2.401 oplegde; belanghebbende betaalde de tweede schenking in februari 2021 aan zijn ouders terug. Het hof past het arrest HR 10 januari 2020, ECLI:NL:HR:2020:1 toe en acht voldoende aanknopingspunten verschaft voor wederzijdse rechtsdwaling over de toepasselijkheid van de vrijstelling, mede omdat de belastingadviseur van vader had bevestigd dat ook de tweede schenking vrijgesteld zou zijn en beide schenkingen samen net onder de 'jubelton' van EUR 100.000 bleven. De korte tijd tussen aanslag en terugbetaling maakt niet aannemelijk dat het beroep op vernietiging slechts is voorgewend, zodat de schenkingsovereenkomst rechtsgeldig is vernietigd en de aanslag op grond van artikel 53, lid 1, SW tot nihil moet worden verminderd.",
      "rechtsregel": "Vernietiging van een schenkingsovereenkomst wegens wederzijdse dwaling in de zin van artikel 6:228, lid 1, letter c, BW doet een ongedaanmakingsverplichting ontstaan waarvan de uitoefening leidt tot vermindering van de aanslag schenkbelasting op grond van artikel 53, lid 1, SW 1956, tenzij het beroep op vernietiging slechts is voorgewend.",

      "onderwerp": "Kruislings schenken; eigenwoningvrijstelling art. 33 SW; fraus legis",
      "samenvatting": "Belanghebbende en zijn zus ontvingen in juli 2017 ieder EUR 100.000 van hun moeder [C] en een dag later ieder EUR 100.000 van [A]; de vier kinderen van [A] ontvingen in dezelfde periode ieder EUR 50.000 van [C], zodat beide ouders in 2017 elk EUR 200.000 aan de kinderen van de ander schonken. Belanghebbende deed voor beide schenkingen een beroep op de eenmalig verhoogde eigenwoningvrijstelling van art. 33, aanhef en onder 5°, letter c, respectievelijk onder 7°, SW 1956; de Inspecteur merkte de schenking van [A] aan als afkomstig van [C] en belastte EUR 94.680. De Hoge Raad verwerpt het cassatieberoep: of sprake is van een gift en wie de gift heeft gedaan wordt in beginsel civielrechtelijk beoordeeld (art. 1, lid 7, SW 1956 jo. art. 7:186, lid 2, BW), maar via wetsontduiking kan de schenking toch als afkomstig van de eigen ouder worden aangemerkt indien het ontgaan van schenkbelasting het doorslaggevende motief was en de kruislingse schenkingen zodanig op elkaar zijn afgestemd dat zij een samenstel van rechtshandelingen vormen.",
      "rechtsregel": "Bij kruislings schenken kan op grond van fraus legis een schenking van een derde voor de SW 1956 worden aangemerkt als schenking van de eigen ouder indien het ontgaan van schenkbelasting het doorslaggevende motief was en de schenkingen zodanig op elkaar zijn afgestemd - hetgeen behoudens tegenbewijs wordt aangenomen bij (nagenoeg) gelijke geschonken bedragen die gelijktijdig of kort na elkaar zijn gedaan - dat zij een samenstel van rechtshandelingen vormen.",

      "onderwerp": "Art. 82a SW en reikwijdte kennisgroepstandpunt eigenwoningvrijstelling",
      "samenvatting": "Belanghebbende ontving in 2008 een schenking onder schuldigerkenning van EUR 22.379 waarvoor de eenmalig verhoogde vrijstelling is toegepast; in 2017 verklaarden zij en haar ouders die schenking met wederzijdse toestemming vervallen. Voor schenkingen van EUR 67.500 (2018) en EUR 33.300 (2019) claimde zij de eigenwoningvrijstelling. Het hof oordeelt dat de schenking uit 2008 niet van rechtswege is ontbonden, niet kon worden herroepen (die bevoegdheid was niet bedongen) en niet wegens dwaling is vernietigd, zodat zich geen geval van artikel 53, lid 1, SW voordoet en de eigenwoningvrijstelling voor 2018 op grond van artikel 82a, lid 1, SW is beperkt tot EUR 27.871 en voor 2019 geheel vervalt. Het kennisgroepstandpunt over herleving van de eenmalig verhoogde vrijstelling na herroeping is een goedkeurende beleidsregel die beperkt moet blijven tot de daarin beschreven bijzondere situatie en geldt niet voor belanghebbende.",
      "rechtsregel": "Een goedkeurend kennisgroepstandpunt moet zoveel mogelijk in overeenstemming met de wet worden uitgelegd en blijft beperkt tot de daarin beschreven bijzondere situatie, zodat een niet-herroepbare en niet onder ontbindende voorwaarde aangegane schenking meetelt voor de beperking van artikel 82a SW 1956.",

      "onderwerp": "Samenloop BOR en NSW-invorderingsvrijstelling bij erfbelasting",
      "samenvatting": "Eiser verkreeg in 2019 als enig erfgenaam alle aandelen in een op grond van art. 7a NSW transparante BV die een opengesteld NSW-landgoed houdt en daarmee een agrarische onderneming drijft, waarop de BOR van toepassing is. In geschil was hoe de NSW-faciliteit van art. 7 NSW moet worden berekend bij samenloop met de BOR: eiser wilde de going-concernwaarde van de NSW-goederen (€ 6.436.174) op de belaste verkrijging in mindering brengen, de inspecteur berekende de faciliteit op € 38.603. De rechtbank oordeelt dat art. 7 NSW twee berekeningen vergt (de volgens de aanslag verschuldigde erfbelasting van € 1.400.876 en de belasting bij een landgoedwaarde van nihil) en dat op grond van art. 21, dertiende lid, SW 1956 ook in die tweede berekening van de hogere liquidatiewaarde moet worden uitgegaan; beroep ongegrond.",
      "rechtsregel": "Bij samenloop van de BOR en de NSW-faciliteit wordt de invorderingsvrijstelling van art. 7 NSW bepaald door het verschil tussen de volgens de aanslag verschuldigde erfbelasting en de erfbelasting berekend met een op nihil gestelde landgoedwaarde, waarbij in beide berekeningen op grond van art. 21, dertiende lid, SW 1956 de (hogere) liquidatiewaarde van het ondernemingsvermogen geldt.",

      "zaaknummer": "24/02647",
      "onderwerp": "APV-regeling en toerekening aan erfgenamen; art. 1 EP en art. 14 EVRM",
      "samenvatting": "Belanghebbende is weduwe van de kleinzoon van een broer van de oprichter van een in 1907 opgerichte familiestichting; de inspecteur rekende 1,926% van het stichtingsvermogen aan haar toe in box 3 (2018 en 2019). Het Hof achtte de APV-regeling in een zuiver binnenlandse situatie zonder fiscaal motief in strijd met de fair balance van artikel 1 EP in samenhang met artikel 14 EVRM en beperkte de heffing tot het werkelijk ontvangen voordeel (nihil). De Hoge Raad vernietigt: de wetgever heeft met de keuze voor toerekening aan de erfgenamen naar rato van hun erfdeel, ter voorkoming van een heffingsvacuum bij zwevend vermogen, zijn ruime beoordelingsvrijheid niet overschreden; de regeling is op stelselniveau niet evident van redelijke grond ontbloot. Een individuele en buitensporige last was niet gesteld; verwijzing volgt voor de onbehandelde standpunten.",
      "rechtsregel": "De APV-regeling van artikel 2.14a Wet IB 2001, met toerekening van het afgezonderde vermogen aan de erfgenamen van de inbrenger naar rato van hun erfdeel, doorstaat op stelselniveau de fair balance-toets van artikel 1 EP en het discriminatieverbod van artikel 14 EVRM, ook indien een erfgenaam feitelijk niets uit het APV ontvangt.",

    {

      "onderwerp": "BOR erfbelasting: bezitseis bij uitbreiding belang; overtollige liquiditeiten",
      "samenvatting": "Erflaatster overleed op 22 maart 2016 met een aanmerkelijk belang van 37,56% in een familieholding; in geschil was de omvang van het ondernemingsvermogen voor de BOR bij een belaste verkrijging van € 9.761.546. Het Hof oordeelt dat de BOR niet geldt voor de binnen één jaar vóór het overlijden gerealiseerde uitbreidingen van de indirecte belangen (met 40% respectievelijk 50%) in twee deelnemingen, omdat voor die uitgebreide subjectieve gerechtigdheid niet aan de indirecte bezitseis van artikel 35d, lid 1, onderdeel c, SW is voldaan; dat de uitbreiding met kwalificerend ondernemingsvermogen is gefinancierd doet niet ter zake. Voorts merkt het Hof de bij de holding aanwezige liquide middelen en effecten van € 42.708.687 aan als duurzaam overtollig beleggingsvermogen: deze zijn sinds 1999 alleen aangegroeid, nooit voor investeringen of garanties van de werkmaatschappij gebruikt en de gestelde functies (buffer, behoud familiekarakter, eigen kosten van € 200.000 per jaar) zijn niet aannemelijk gemaakt. Het principale hoger beroep van de inspecteur is gegrond, het incidentele hoger beroep ongegrond.",
      "rechtsregel": "De BOR geldt niet voor de waarde van vermogensbestanddelen voor zover de subjectieve gerechtigdheid tot de objectieve onderneming binnen de bezitsperiode is uitgebreid, en bij een holding kunnen liquide middelen en effecten alleen tot het ondernemingsvermogen worden gerekend als zij niet duurzaam overtollig zijn en dienstbaar zijn aan de toegerekende onderneming.",

    {
      "ecli": "ECLI:NL:RBGEL:2025:7333",
      "instantie": "Rechtbank Gelderland",
      "datum": "2025-08-29",
      "gepubliceerd": "2026-07-07",
      "zaaknummer": "AWB 24/41",
      "onderwerp": "Samentelling art. 27 SW bij NSW-landgoed; negatieve waarde schenking",
      "samenvatting": "Belanghebbende ontving in 2018 vijf schenkingen van zijn vader, waaronder 283.620 aandelen (waarde € 1.897.760) in een op grond van art. 7a NSW fiscaal transparante BV die een NSW-landgoed houdt. Doordat de invorderingsvrijstelling van art. 7 NSW de waarde van het opengestelde landgoed op nihil stelt, resteert per saldo een negatief vermogen; belanghebbende wilde die negatieve waarde bij de samentelling van art. 27 SW 1956 verrekenen met de overige schenkingen. De rechtbank verwerpt dat: de schenkbelasting is een tijdstipbelasting, zodat eerst per schenking het belastbare bedrag wordt bepaald (hoofdstukken I en II SW) en pas daarna art. 27 SW wordt toegepast; een schenking met negatieve waarde bestaat niet, zodat met nihil moet worden gerekend. Beroepen ongegrond; wel € 500 immateriële schadevergoeding.",
      "rechtsregel": "Bij toepassing van de samentelbepaling van art. 27 SW 1956 wordt eerst per afzonderlijke schenking het belastbare bedrag vastgesteld, dat niet negatief kan zijn, zodat een door toepassing van art. 7 NSW ontstane negatieve waarde niet met andere schenkingen kan worden verrekend.",

    {
      "ecli": "ECLI:NL:PHR:2025:785",
      "instantie": "Parket bij de Hoge Raad",
      "datum": "2025-07-11",
      "gepubliceerd": "2026-04-17",
      "zaaknummer": "25/00767",
      "onderwerp": "Legitieme portie oud erfrecht en partnervrijstelling voor inwonend kind",
      "samenvatting": "De vader van belanghebbende overleed in 1995; belanghebbende en zijn broer deden onder het oude erfrecht een beroep op hun legitieme portie, maar de nalatenschap bleef onverdeeld tot het overlijden van de moeder in 2019. In geschil zijn de vraag of bij het overlijden van de moeder een 'schuldig gebleven erfdeel' in aftrek komt en of het weigeren van de partnervrijstelling van art. 1a SW 1956 aan een inwonend kind verboden discriminatie oplevert. A-G Koopman meent dat het hof de goederenrechtelijke aanspraak ten onrechte op art. 128 Overgangswet NBW als 'uitgewerkt' heeft aangemerkt en dat een aandeel in een onverdeelde nalatenschap niet verjaart (art. 3:178 BW), maar dat belanghebbende niet is benadeeld door de standpuntwijziging van de inspecteur; het beroep op discriminatie faalt gelet op EHRM Burden, nu de wetgever bloedverwanten van de partnervrijstelling mocht uitsluiten en de verruimde partnervrijstelling voor mantelzorgers mocht laten vervallen. De conclusie strekt tot ongegrondverklaring.",
      "rechtsregel": "Een legitimaris die onder het oude erfrecht tijdig een beroep op zijn legitieme portie heeft gedaan verliest zijn goederenrechtelijke aanspraak niet door art. 128 Overgangswet NBW en zijn aandeel in de onverdeelde nalatenschap verjaart niet; de uitsluiting van bloedverwanten in de rechte lijn van de partnervrijstelling van art. 1a SW 1956 levert geen verboden discriminatie op.",

      "instantie": "Rechtbank Noord-Holland",

      "gepubliceerd": "2026-05-20",
      "onderwerp": "APV/trust VS: BvdB-voorkoming ondanks belastingverdrag",
      "samenvatting": "Mevrouw X is gerechtigd tot een discretionaire trust (opgericht bij testament) die in de VS niet-fiscaal-transparant is en in Nederland als afgezonderd particulier vermogen (APV) ex art. 2.14a Wet IB 2001 wordt toegerekend. Het belastingverdrag VS-NL biedt geen bescherming tegen de economisch dubbele heffing. De Rechtbank oordeelt dat art. 25b BvdB (voorkoming dubbele belasting) wél van toepassing is, ook al bestaat er een belastingverdrag, omdat dit verdrag geen effectieve voorkoming biedt voor de APV-heffing.",

      "zaaknummer": "BK-24/285",
      "onderwerp": "BOR: voortzettingseis geschonden; terugname en art. 37, lid 4, SW",
      "samenvatting": "Bij een met een vaststellingsovereenkomst afgestemde schenking van certificaten van aandelen werd de BOR verleend; binnen vijf jaar verkocht de groep haar via een indirect aanmerkelijk belang gehouden 5%-belang in een buitenlandse beursvennootschap om investeringen te financieren, waarna de inspecteur op grond van artikel 37, lid 3, SW een aanvullende aanslag schenkbelasting oplegde. Het Hof oordeelt dat de bezittingen en schulden van dat lichaam op grond van artikel 35c, leden 1, 5 en 6, SW van rechtswege aan de holding worden toegerekend en dat op dat niveau, aan de hand van de IB-criteria, sprake is van een afzonderlijke objectieve onderneming, zodat de verkoop een (gedeeltelijke) staking oplevert en het voortzettingsvereiste van artikel 35e SW is geschonden; herinvestering van de opbrengst in de groep doet daaraan niet af en het geval valt niet onder de limitatieve uitzonderingen van artikel 10 UR SW. Beroepen op het wettelijke en het ongeschreven evenredigheidsbeginsel falen, mede gelet op artikel 120 Grondwet. Voor de evenredige terugname moet worden aangesloten bij de bij de primitieve aanslag gehanteerde waardering, waartegen op grond van artikel 37, lid 4, SW niet opnieuw kan worden opgekomen; dat levert geen strijd met artikel 1 EP EVRM op. Het hoger beroep van de inspecteur is gegrond, het incidentele hoger beroep en het verzoek om schadevergoeding worden afgewezen.",
      "rechtsregel": "Vervreemding binnen vijf jaar van een aan de holding toegerekend belang dat op holdingniveau een afzonderlijke objectieve onderneming vormt, schendt het voortzettingsvereiste van artikel 35e SW en leidt tot evenredige terugname van de BOR, waarbij op grond van artikel 37, lid 4, SW de bij de primitieve aanslag vastgestelde waardering van het ondernemingsvermogen niet opnieuw ter discussie kan worden gesteld.",

      "gepubliceerd": "2025-02-24",
      "onderwerp": "SPF Curaçao; schenkingen aan zoon; formeelrechtelijke aspecten navordering",
      "samenvatting": "Belanghebbende bracht zijn vermogen onder in een SPF op Curaçao en emigreerde naar Bonaire; vanuit de SPF zijn schenkingen aan zijn zoon verricht. Na FIOD-onderzoek zijn navorderingsaanslagen IB/PVV opgelegd. De rechtbank oordeelt dat art. 8:42 Awb niet is geschonden (strafdossier bij contactambtenaar behoort niet tot de op de zaak betrekking hebbende stukken), dat de verlengde navorderingstermijn (art. 16 lid 4 AWR) terecht is toegepast, dat een nieuw feit aanwezig is en dat de bewijslast wordt omgekeerd en verzwaard omdat de trustvraag in de aangiften niet is aangekruist. Belanghebbende kon over het SPF-vermogen beschikken als ware het zijn eigen vermogen (transparantie).",
      "rechtsregel": "Het niet aankruisen van de trustvraag in de aangifte leidt tot omkering en verzwaring van de bewijslast; een transparante SPF verhindert toepassing van de verlengde navorderingstermijn niet.",

      "onderwerp": "Transparantierechtspraak naast APV-regime; art. 8:42 Awb-stukken",
      "samenvatting": "Belanghebbende 2 schonk in 2000 de aandelen in een Antilliaanse NV aan een stichting particulier fonds (SPF) waarover hij een onbeperkte volmacht op de bankrekening had; de inspecteur rekende het SPF-vermogen voor 2011 en 2012 aan belanghebbenden toe. In cassatie betoogden zij dat de transparantierechtspraak (HR 30 oktober 1985, ECLI:NL:HR:1985:AC9086) is achterhaald door invoering per 2010 van artikel 2.14a Wet IB 2001. De Hoge Raad verwerpt dat: artikel 2.14a ziet enkel op gevallen waarin vaststaat dat vermogen is afgezonderd, en de daaraan voorafgaande vraag of van afzondering sprake is wordt beantwoord met de transparantierechtspraak. De uitspraak wordt niettemin vernietigd omdat het Hof het verzoek om overlegging van stukken ten onrechte tardief verklaarde; nieuwe respectievelijk met een beroep op artikel 8:29 Awb geheimgehouden stukken behoren tot de stukken die de inspecteur op grond van artikel 8:42 Awb alsnog onverwijld moet inbrengen.",
      "rechtsregel": "Indien de belastingplichtige over bij een derde ondergebracht vermogen kan beschikken als ware het zijn eigen vermogen, is dat vermogen niet afgezonderd en komt men aan artikel 2.14a Wet IB 2001 niet toe; de transparantierechtspraak is door invoering van het APV-regime niet achterhaald.",

    {
      "ecli": "ECLI:NL:GHDHA:2025:956",

      "onderwerp": "Erfbelasting: legitieme onder oud recht; geen partnervrijstelling voor kind",
      "samenvatting": "De vader van belanghebbende overleed in 1995 onder oud erfrecht met een ouderlijke boedelverdeling; belanghebbende en zijn broer riepen hun legitieme portie in en de nalatenschap werd nooit verdeeld. Na het overlijden van de moeder in 2019 stelde belanghebbende dat hij een (te laag gewaardeerde) overbedelingsvordering met rente had en dat hij recht had op de partnervrijstelling. Het Hof oordeelt dat inroeping van de legitieme naar oud recht een goederenrechtelijke aanspraak opleverde en geen vorderingsrecht, zodat noch herwaardering noch rentebijtelling aan de orde is en die aanspraak ten tijde van het overlijden in 2019 was uitgewerkt (artikel 128 Overgangswet nieuw BW); de aanslag naar een belaste verkrijging van € 92.583 is eerder te laag dan te hoog. De partnervrijstelling is terecht geweigerd omdat belanghebbende bloedverwant in de rechte lijn is (artikel 1a, lid 1, onderdeel d, SW 1956) en de mantelzorguitzondering van artikel 1a, lid 4, SW sinds het vervallen van het mantelzorgcompliment per 2015 geen werking meer heeft; dit levert geen schending op van artikel 1 EP EVRM of artikel 14 EVRM, mede omdat ook een geadopteerd kind bloedverwant in de rechte lijn is.",
      "rechtsregel": "Een bloedverwant in de rechte lijn kan sinds het vervallen van het mantelzorgcompliment per 1 januari 2015 niet als partner in de zin van artikel 1a SW 1956 worden aangemerkt, en een onder oud erfrecht ingeroepen legitieme portie geeft slechts een goederenrechtelijke aanspraak die niet als rentedragende vordering op de nalatenschap in aftrek komt.",

      "samenvatting": "Navorderingsaanslag IB/PVV op grond van art. 4.22 Wet IB 2001 bij een aandelenoverdracht in het kader van bedrijfsopvolging, met discussie over de waardering van onroerende zaken. Het hof vernietigt de navorderingsaanslag: de inspecteur heeft niet aannemelijk gemaakt dat de verkoopprijs is bedongen bij een niet onder normale omstandigheden gesloten overeenkomst, noch dat sprake was van een bevoordelingsbedoeling. Raakvlak met de schenkbelasting via het vereiste van bevoordelingsbedoeling bij bedrijfsopvolging binnen de familie.",

    {

      "onderwerp": "BOR schenkbelasting; bezitsvereiste art. 35d na juridische splitsing",
      "samenvatting": "Moeder schonk op 7 september 2020 - dezelfde dag als een juridische splitsing - alle aandelen in de afgesplitste vennootschap aan haar dochter, met een beroep op de bedrijfsopvolgingsregeling (BOR). De inspecteur beperkte de BOR tot 49%, omdat moeder 51% van de aandelen (afkomstig van de in 2017 overleden vader) binnen vijf jaar voor de schenking had verkregen en daardoor voor dat deel niet aan het bezitsvereiste van art. 35d, lid 1, onderdeel c SW voldeed. De rechtbank verklaart het beroep ongegrond. In hoger beroep bevestigd (ECLI:NL:GHDHA:2026:114).",
      "rechtsregel": "Voor de BOR moet per aandelenpakket aan het bezitsvereiste van art. 35d SW zijn voldaan; aandelen die de schenker binnen de bezitstermijn heeft verkregen (hier via toedeling na overlijden van de mede-aandeelhouder) delen niet in de voorwaardelijke vrijstelling, ook niet na een daaropvolgende juridische splitsing.",

      "zaaknummer": "BRE 20/8064 en BRE 20/8066 tot en met BRE 20/8072",
      "onderwerp": "Toerekening trustvermogen aan erfgename; tegenbewijs art. 2.14a lid 6; boeten",
      "samenvatting": "Vader stelde in 1999 een irrevocable discretionary trust in; na zijn overlijden in 2008 wordt het trustvermogen voor een vierde deel aan belanghebbende, een van de vier dochters en erfgenamen, toegerekend (IB/PVV 2010 tot en met 2017). De 'Deed of exclusion' van 24 december 2009 baat haar niet: doordat de door de trust gehouden vennootschap haar een renteloze, aflossingsvrije lening van EUR 184.018 liet voortduren, genoot zij indirect een voordeel en is zij in feite indirect begunstigde, zodat het verzwaarde tegenbewijs van artikel 2.14a, lid 6, Wet IB 2001 niet is geleverd. Navordering is mogelijk wegens aan haar toe te rekenen kwade trouw van de adviseur die de trustvraag in de aangiften niet aankruiste; de verlengde navorderingstermijn geldt onbeperkt wegens de standstillbepaling van artikel 64 VWEU. De vergrijpboeten worden vernietigd omdat niet is aangetoond dat belanghebbende zelf, die op een deskundige adviseur vertrouwde, opzet of grove schuld kan worden verweten.",
      "rechtsregel": "Een erfgenaam die door het renteloos laten voortbestaan van een lening van een tot het APV behorende vennootschap een voordeel geniet, is in feite indirect begunstigde, zodat de tegenbewijsregeling van artikel 2.14a, lid 6, Wet IB 2001 faalt, ook als hij formeel als begunstigde is uitgesloten.",

      "zaaknummer": "BRE 20/7701 tot en met BRE 20/7708",
      "onderwerp": "Toerekening trustvermogen aan inmiddels overleden erfgename; art. 2.14a lid 6",
      "samenvatting": "In deze zaak van de erven van een in 2021 overleden dochter gaat het om dezelfde in 1999 door vader ingestelde discretionaire trust; een vierde van het trustvermogen is op grond van artikel 2.14a Wet IB 2001 aan erflaatster toegerekend voor de jaren 2010 tot en met 2017. De rechtbank oordeelt dat erflaatster door een renteloze, aflossingsvrije lening van de door de trust gehouden vennootschap in feite indirect begunstigde was, zodat de 'Deed of exclusion' van 2009 niet aan toerekening in de weg staat en het tegenbewijs van artikel 2.14a, lid 6, Wet IB 2001 niet is geleverd. De belastbare inkomens uit sparen en beleggen 2010 tot en met 2016 worden verminderd omdat alsnog rekening moet worden gehouden met de schulden aan die vennootschap en aan de trust; het beroep voor 2017 is ongegrond. De boeten waren na het overlijden al tot nihil verminderd.",

      "onderwerp": "BOR na ruziesplitsing; uitleg verwijzingsarrest en reikwijdte art. 9(2) URSE",
      "samenvatting": "Tweede cassatieronde in de zaak over de schenking in 2013 van aandelen na de ruziesplitsing van 2011 (vervolg op HR BNB 2023/97, ECLI:NL:HR:2023:647); het verwijzingshof oordeelde dat 'horen' en 'zien' meer dan een objectieve onderneming vormden en dat de BOR daarom slechts voor 49% geldt. In geschil zijn de uitleg van het verwijzingsarrest, de vraag of art. 9, lid 2, URSE ook de indirecte bezitseis verzacht, de bewijslastverdeling en de goede procesorde. A-G Wattel acht de uitleg van het hof juist, meent dat art. 9, lid 2, URSE blijkens zijn tekst uitsluitend op aandelen en dus op de directe bezitseis ziet, en acht het aan belanghebbende om aannemelijk te maken dat sprake was van een objectieve onderneming omdat hij zich op een vrijstelling beroept. De conclusie strekt tot ongegrondverklaring van het cassatieberoep van belanghebbende.",
      "rechtsregel": "Art. 9, lid 2, Uitvoeringsregeling schenk- en erfbelasting verzacht bij een juridische splitsing uitsluitend de directe bezitseis ten aanzien van de aandelen en niet de indirecte bezitseis dat het lichaam de onderneming vijf jaren heeft gedreven; wie zich op de bedrijfsopvolgingsvrijstelling beroept draagt de bewijslast dat aan de voorwaarden is voldaan.",

      "instantie": "Rechtbank Gelderland",
      "datum": "2024-10-14",
      "gepubliceerd": "2026-06-24",
      "onderwerp": "Leegwaarderatio woning bij quasi-wettelijke verdeling (erfbelasting)",
      "samenvatting": "Erflater benoemde zijn echtgenote voor 1% en zijn drie kinderen ieder voor 33% tot erfgenaam en stelde de wettelijke verdeling buiten toepassing, met een keuze voor een quasi-wettelijke verdeling. Belanghebbende is huurder van de geërfde woning; de inspecteur paste daarom bij haar (anders dan bij de twee andere kinderen) de leegwaarderatio van art. 21, achtste lid, SW niet toe omdat zij als mede-eigenaar/huurder zou verkrijgen. De rechtbank oordeelt dat de uiterste wilsbeschikking inhoudelijk overeenkomt met de wettelijke verdeling, zodat op grond van art. 1, vijfde lid, SW belanghebbende een geldvordering verkrijgt en niet een aandeel in de woning. Het beroep is gegrond; de belaste verkrijging wordt verminderd tot €38.358.",
      "rechtsregel": "Een quasi-wettelijke verdeling die inhoudelijk overeenkomt met de wettelijke verdeling wordt via art. 1, vijfde lid, SW gelijkgesteld; de niet-langstlevende erfgenaam verkrijgt een geldvordering, zodat de uitsluiting van de leegwaarderatio (art. 21, achtste lid, SW) voor de huurder/verkrijger niet aan de orde is.",

    {

      "zaaknummer": "23/294 en 23/295",
      "onderwerp": "APV-toerekening familiestichting 1907 strijdig met art. 1 EP jo. art. 14 EVRM",
      "samenvatting": "Een in 1907 opgerichte familiestichting met een vermogen van ruim € 8 miljoen, die de stichter tot enig erfgenaam had benoemd, keert uitsluitend aan familieleden tussen 18 en 40 jaar circa € 2.000 per jaar uit; aan belanghebbende, weduwe van een achterkleinzoon van een broer van de oprichter, is voor 2018 en 2019 pro rata 1,926% van het stichtingsvermogen in box 3 toegerekend. Het Hof bevestigt dat de stichting geen SBBI is maar een APV, dat 'onterfd' in art. 2.14a, lid 4, Wet IB 2001 ruim moet worden opgevat en ook impliciete onterving door benoeming van een ander tot enig erfgenaam omvat, en dat belanghebbende rechtens begunstigde is zodat de tegenbewijsregeling van het zesde lid niet slaagt. Toepassing van de APV-regeling levert in dit geval echter strijd op met art. 1 EP jo. art. 14 EVRM: bij een zuiver binnenlandse, in een ver verleden zonder fiscaal motief ingestelde APV waarbij het zicht op de feiten niet is ontnomen, ontbreekt de fair balance tussen het bestrijden van een heffingsvacuüm en de ongelijkheid tussen begunstigden zonder en met uitkering. Het Hof biedt rechtsherstel door de heffing te beperken tot het daadwerkelijk genoten voordeel, dat het op nihil stelt.",
      "rechtsregel": "De toerekeningsregeling voor afgezonderd particulier vermogen schendt art. 1 EP jo. art. 14 EVRM voor zover zij in een zuiver binnenlandse situatie, waarin het vermogen in een ver verleden zonder fiscaal motief en zonder verhulling van de feiten is afgezonderd, belasting heft bij een begunstigde die geen uitkering ontvangt of kan afdwingen; het rechtsherstel bestaat uit beperking van de heffing tot het daadwerkelijk genoten voordeel.",

    {

      "zaaknummer": "23/02449",
      "onderwerp": "Reikwijdte doorkijkbenadering bij waardering certificaten van vastgoed-bv",
      "samenvatting": "Belanghebbende kreeg in december 2015 van haar vader certificaten van aandelen geschonken in een vennootschap met een portefeuille van 66 objecten, waaronder 57 woningen; in geschil zijn de omvang van de BOR en de waardering van de certificaten. Het hof paste bij de waardering de forfaitaire waarderingsregels voor verhuurde woningen (WOZ-waarde en leegwaarderatio) toe; de staatssecretaris bestrijdt dat in het principale beroep. A-G Koopman meent dat de door de Hoge Raad ontwikkelde doorkijkbenadering niet dwingend kan worden voorgeschreven bij de waardering van (certificaten van) aandelen in vastgoedlichamen, omdat de waarde daarvan niet rechtstreeks en niet geheel van de onderliggende woningen afhangt en ficties en forfaits niet extensief behoren te worden uitgelegd; het principale middel slaagt in zoverre. Het incidentele beroep over de BOR faalt omdat het in wezen de feitelijke oordelen over de arbeid-plus- en rendement-plus-toets bestrijdt.",
      "rechtsregel": "De forfaitaire waarderingsvoorschriften voor (verhuurde) woningen in art. 21 SW 1956 gelden niet dwingend bij de waardering van (certificaten van) aandelen in een vastgoedlichaam; de doorkijkbenadering strekt zich niet uit tot een verkrijging waarvan de waarde niet rechtstreeks van de waarde van de onroerende zaken afhangt.",

    {
      "ecli": "ECLI:NL:GHARL:2024:1864",
      "instantie": "Gerechtshof Arnhem-Leeuwarden",
      "datum": "2024-03-12",
      "gepubliceerd": "2026-02-27",
      "zaaknummer": "23/1408",
      "onderwerp": "BOR schenkbelasting: indirecte bezitseis na ruziesplitsing",
      "samenvatting": "Na een ruziesplitsing in 2011 en een afsplitsing in 2012 schonk moeder in 2013 alle aandelen [naam5] B.V. aan belanghebbende; de inspecteur verleende de BOR slechts over 49% van de waarde en stelde de belaste verkrijging op € 1.048.082. In deze procedure na verwijzing (HR 21 april 2023, ECLI:NL:HR:2023:647) moest het Hof beoordelen of de aan de tussenhoudster toegerekende activiteiten van haar dochtermaatschappijen vóór de splitsing één of meer objectieve ondernemingen vormden. Het Hof oordeelt dat belanghebbende, tegenover de gemotiveerde betwisting door de inspecteur, niet aannemelijk heeft gemaakt dat de 'horen'- en 'zien'-activiteiten in drie afzonderlijke dochtervennootschappen (met eigen administratie, klantenkring, personeel en afzetgebied) één objectieve onderneming vormden; de gestelde centrale leiding, doorbelasting van managementfees en synergie zijn niet onderbouwd. Belanghebbende heeft via de uitruil zijn subjectieve gerechtigdheid tot de onderneming 'horen' uitgebreid van 49% naar 100%, zodat de BOR terecht tot 49% is beperkt en het hoger beroep ongegrond is.",
      "rechtsregel": "De indirecte bezitseis van artikel 35d, lid 1, onderdeel c, SW 1956 moet per objectieve onderneming worden beoordeeld, waarbij toerekening op grond van artikel 35c, lid 5, SW plaatsvindt met inachtneming van de omvang van het belang, zodat voor een tijdens de bezitsperiode verkregen uitbreiding van de subjectieve gerechtigdheid tot een objectieve onderneming een nieuwe bezitstermijn aanvangt.",

        "art. 3.2 Wet IB 2001",
        "art. 9, lid 2, Uitvoeringsregeling schenk- en erfbelasting",

    {
      "ecli": "ECLI:NL:RBZWB:2024:342",

      "gepubliceerd": "2026-05-28",
      "onderwerp": "Schenkbelasting: leegwaarderatio, verrekening erfdeel, menselijke maat",
      "samenvatting": "Moeder schonk haar appartement aan haar zoon. De inspecteur legde een aanslag schenkbelasting op zonder toepassing van de leegwaarderatio. Belanghebbende betoogde dat de leegwaarderatio van toepassing was, dat het vaderlijk erfdeel verrekend moest worden, en deed een beroep op de 'menselijke maat'. De rechtbank verwierp alle gronden: de leegwaarderatio geldt niet bij schenkingen van woningen, verrekening van een civielrechtelijk erfdeel is geen fiscale aftrekpost, en de menselijke maat biedt geen zelfstandige grond voor vermindering. Dit vonnis is in hoger beroep bekrachtigd door ECLI:NL:GHSHE:2026:1241.",
      "rechtsregel": "De leegwaarderatio (art. 17a Uitv.reg. IB) is niet van toepassing bij de waardebepaling van een schenking van een woning; verrekening van een vaderlijk erfdeel met de verschuldigde schenkbelasting is fiscaal niet mogelijk.",

    {

      "zaaknummer": "BRE 22/4371",
      "onderwerp": "Schenkbelasting; herroeping schenking en restant eenmalig verhoogde vrijstelling",
      "samenvatting": "Belanghebbende ontving in 2009 een herroepelijke schenking van EUR 22.760 waarop de eenmalig verhoogde vrijstelling is toegepast; in 2017 werd die schenking herroepen en omgezet in een lening die vervolgens werd kwijtgescholden, naast een schenking van EUR 80.000, waarop een beroep op de eigenwoningvrijstelling werd gedaan. De rechtbank oordeelt dat de herroeping geen terugwerkende kracht heeft: het belastbare feit uit 2009 blijft bestaan en de destijds toegepaste vrijstelling blijft in stand, zodat artikel 82a SW 1956 de eigenwoningvrijstelling in 2017 verlaagt tot een restant van EUR 27.650. Het goedkeurende beleid van de staatssecretaris baat belanghebbende niet omdat de inspecteur onweersproken heeft aangevoerd dat aan de herroeping fiscale motieven ten grondslag lagen. Het beroep is ongegrond.",
      "rechtsregel": "De herroeping van een herroepelijke schenking doet het belastbare feit en de daarop toegepaste eenmalig verhoogde vrijstelling niet met terugwerkende kracht teniet, zodat het restant van de verhoogde vrijstelling op grond van artikel 82a SW 1956 beperkt blijft.",

      "samenvatting": "Erflaatster was medebestuurder van een stichting met vier panden die haar statutaire (culturele) doel feitelijk niet nastreefde. Hof en Hoge Raad merken het stichtingsvermogen aan als afgezonderd particulier vermogen (art. 2.14a Wet IB 2001) dat via art. 16 SW krachtens erfrecht door de zoon/enig erfgenaam wordt verkregen. Het cassatiemiddel dat het vermogen deels door belanghebbende zelf zou zijn afgezonderd faalt, omdat dit niet in feitelijke instanties (subsidiair) is aangevoerd; de stelplicht ligt bij belanghebbende.",

      "onderwerp": "Schenkbelasting; vrijstelling natuurlijke verbintenis art. 33 onder 12 SW",
      "samenvatting": "De in Belgie wonende belanghebbende had anderhalf jaar een LAT-relatie met de in 2019 overleden erflater; zijn twee zoons keerden haar bij vaststellingsovereenkomst EUR 500.000 uit ter voldoening aan een gestelde dringende morele verplichting, waarna twee aanslagen schenkbelasting naar een belaste verkrijging van elk EUR 247.827 werden opgelegd. In geschil is of de vrijstelling van artikel 33, aanhef en onder 12, SW 1956 voor schenkingen ter voldoening aan een natuurlijke verbintenis (art. 6:3 BW) van toepassing is. De rechtbank oordeelt dat belanghebbende, op wie de bewijslast rust, naar objectieve maatstaven geen dringende morele verplichting aannemelijk heeft gemaakt: er was geen samenwoning of gezamenlijke kinderen en over haar eigen welstand en behoefte zijn geen objectief verifieerbare gegevens verstrekt; een handgeschreven, niet-ondertekende wilsverklaring is onvoldoende. De beroepen zijn ongegrond.",
      "rechtsregel": "Of een schenking strekt tot voldoening aan een natuurlijke verbintenis in de zin van artikel 33, aanhef en onder 12, SW 1956 moet naar objectieve maatstaven worden beoordeeld, mede aan de hand van de wederzijdse welstand en behoefte ten tijde van de prestatie, en de verkrijger draagt daarvan de bewijslast.",

      "samenvatting": "Erfrechtelijke verkrijging van aandelen in een vastgoed-BV. De rechtbank past de arbeid-plus/rendement-plus-toets toe en oordeelt dat de verhuuractiviteiten (beheer, toezicht, klein onderhoud, debiteurenbeheer) normaal vermogensbeheer niet te boven gaan; de BOR is niet van toepassing. Het beroep is wel gegrond omdat de inspecteur voor één pand een te lage vpb-latentie hanteerde.",

      "zaaknummer": "AWB - 21 _ 3550",
      "onderwerp": "BOR bij vastgoed-bv: materiele onderneming en hoogte vpb-latentie",
      "samenvatting": "Belanghebbende verkreeg in 2016 krachtens erfrecht de helft van de nalatenschap waartoe alle aandelen behoorden in een bv die circa acht in eigendom zijnde onroerende zaken verhuurde met drie werknemers; in geschil is of de bedrijfsopvolgingsregeling van art. 35b e.v. SW 1956 van toepassing is en of de vpb-latentie te laag is vastgesteld. De rechtbank oordeelt dat de beschreven werkzaamheden (verhuur, beheer, klein onderhoud, debiteurenbeheer, klachtenbehandeling) behoren tot normaal vermogensbeheer en dat niet is gebleken van bijzondere kennis of van een rendement boven het bij normaal vermogensbeheer opkomende rendement, zodat geen materiele onderneming wordt gedreven en de BOR niet van toepassing is. Wel is het beroep gegrond omdat partijen het erover eens zijn dat voor een verkocht object de vpb-latentie EUR 6.960 hoger moet zijn; de belaste verkrijging wordt verminderd tot EUR 1.245.731 en het beroep op interne compensatie van de inspecteur faalt bij gebrek aan een controleerbare contantewaardeberekening.",
      "rechtsregel": "Exploitatie van onroerende zaken vormt slechts een materiele onderneming in de zin van art. 35c SW 1956 indien de arbeid naar aard en omvang meer omvat dan bij normaal vermogensbeheer gebruikelijk is en onmiskenbaar ten doel heeft een hoger dan bij normaal vermogensbeheer opkomend rendement te behalen; de latente vennootschapsbelasting over stille reserves in duurzaam verhuurd vastgoed wordt naar de contante waarde op de peildatum in aanmerking genomen.",

      "onderwerp": "APV-stichting toegerekend aan erfgenaam; box 3; art. 16 SW 1956",
      "samenvatting": "Belanghebbende is enig erfgenaam van zijn in 2013 overleden moeder, die in 1993 een stichting oprichtte waarin onroerend goed was afgezonderd. In geschil is of het stichtingsvermogen (voor 2017 geschat op EUR 900.851) als afgezonderd particulier vermogen aan hem kan worden toegerekend en of de box 3-heffing 2014 tot en met 2017 in strijd is met artikel 1 EP en artikel 14 EVRM. Het Hof oordeelt dat de stichting een APV is, dat belanghebbende het tegenbewijs van artikel 2.14a, lid 6, Wet IB 2001 niet heeft geleverd en dat zijn stelling dat een APV niet in een nalatenschap kan vallen geen steun in het recht vindt, gelet op artikel 16, lid 1, SW 1956. Voor 2017 bestaat geen aanleiding voor rechtsherstel omdat de nieuwe berekening (EUR 60.857) hoger uitkomt dan het oorspronkelijke voordeel (EUR 41.400).",

      "samenvatting": "Conclusie A-G in de APV-zaak die leidt tot HR 1 december 2023 (ECLI:NL:HR:2023:1664). Behandelt of de (niet uitgevoerde) statutaire doelstelling en het uitkeringsverbod ex art. 2:285 lid 3 BW aan toepassing van het APV-regime in de weg staan, wie het vermogen heeft ingebracht, en de verhouding tussen het APV-regime en de fiscale-transparantierechtspraak.",

      "onderwerp": "BOR; indirecte bezitseis art. 35d SW na ruziesplitsing; per onderneming toetsen",
      "samenvatting": "De schenker hield via een holding aanvankelijk een indirect belang van 49 procent in een vennootschap waarin via dochtermaatschappijen de activiteiten 'horen' en 'zien' werden gedreven; na een ruziesplitsing in 2011 (art. 2:334cc BW) en een afsplitsing in 2012 schonk zij in 2013 alle aandelen in de resterende vennootschap aan belanghebbende, die om toepassing van de BOR verzocht. De Inspecteur achtte de vijfjaarstermijn van art. 35d, lid 1, letter c, SW 1956 slechts voor 49 procent vervuld; het Hof oordeelde dat geen nieuwe bezitstermijn was aangevangen omdat de verkregen vennootschap ten tijde van de schenking één onderneming dreef. De Hoge Raad casseert: voor de indirecte bezitstermijn is mede van belang of de aan de gesplitste vennootschap toegerekende activiteiten één onderneming vormden en of de schenker bij de splitsing een met haar indirecte belang overeenstemmend gedeelte daarvan heeft verkregen; per (objectieve) onderneming moet worden beoordeeld of aan de indirecte bezitseis is voldaan. Verwijzing volgt omdat het Hof niets heeft vastgesteld over het aantal objectieve ondernemingen vóór de splitsing.",
      "rechtsregel": "Voor de indirecte bezitseis van art. 35d, lid 1, letter c, SW 1956 moet per objectieve onderneming worden beoordeeld of de schenker die onderneming gedurende vijf jaren (middellijk) heeft gedreven, zodat een uitbreiding van het subjectieve belang in een onderneming een nieuwe bezitstermijn kan doen aanvangen.",

      "zaaknummer": "20/6303 en 21/163",
      "onderwerp": "Familiestichting geen SBBI maar APV; fictief erfgenaam en begunstigde",
      "samenvatting": "Een in 1907 opgerichte familiestichting, met een vermogen van ruim EUR 8 miljoen en jaarlijkse uitkeringen van EUR 94.626 tot EUR 154.323 aan familieleden naast donaties aan medisch onderzoek, is volgens de rechtbank geen sociaal belang behartigende instelling in de zin van artikel 5c AWR maar een APV, omdat de doelgroep te beperkt is en meer dan bijkomstig (meer dan 10%) een particulier belang wordt beoogd, zowel voor als na de statutenwijziging van 11 oktober 2018. Belanghebbende, weduwe van de kleinzoon van een broer van de oprichter, is fictief erfgenaam in de zin van artikel 2.14a, lid 4, Wet IB 2001: onder onterven valt ook impliciete onterving doordat een ander (hier de stichting zelf) tot enig erfgenaam is benoemd. Zij is ook begunstigde, nu zij statutair gerechtigd is en tot 2017 jaarlijks EUR 1.000 ontving. De beroepen tegen de navorderingsaanslag 2018 en de aanslag 2019 zijn ongegrond; van strijd met artikel 1 EP, artikel 14 EVRM of algemene beginselen is geen sprake.",
      "rechtsregel": "Een familiestichting die meer dan bijkomstig een particulier belang beoogt kwalificeert niet als SBBI maar als APV, en het begrip 'onterfd' in artikel 2.14a, lid 4, Wet IB 2001 omvat ook de impliciete onterving die ontstaat doordat bij uiterste wil een ander tot enig erfgenaam is benoemd.",

    {

      "onderwerp": "BOR: bezitseis art. 35d SW na ruziesplitsing van 49% naar 100%",
      "samenvatting": "De schenkster hield tot 2011 via een houdstervennootschap indirect 49% in een concern met de activiteiten 'horen' en 'zien'; bij een ruziesplitsing (art. 2:334cc BW) verkreeg zij 100% van 'horen' en op 25 september 2013 schonk zij de aandelen in de nieuwe holding aan haar zoon. De inspecteur paste de BOR slechts toe op 49% van de waarde omdat voor het door de splitsing verkregen 51%-deel niet is voldaan aan de vijfjaarsbezitseis van art. 35d, lid 1, onderdeel c, SW; het hof achtte de BOR voor 100% van toepassing. A-G IJzerman meent dat de waarde van de objectieve onderneming 'horen' bezien vanuit de positie van de schenker is toegenomen van 49% naar 100%, zodat voor die uitbreiding binnen de wetssystematiek een nieuwe bezitstermijn van vijf jaren aanvangt en art. 9, lid 2, URSE daaraan niet afdoet. De conclusie strekt tot gegrondverklaring van het cassatieberoep van de staatssecretaris.",
      "rechtsregel": "Wanneer een schenker zijn gerechtigdheid tot een objectieve onderneming door een ruziesplitsing uitbreidt, neemt daarmee ook de vanuit de positie van de schenker te beoordelen waarde van de objectieve onderneming toe, zodat voor dat uitgebreide deel een nieuwe bezitstermijn van vijf jaren als bedoeld in art. 35d, lid 1, onderdeel c, SW 1956 gaat lopen.",

      "zaaknummer": "BK-21/00839",
      "onderwerp": "Erfbelasting vormt individuele en buitensporige last (art. 1 EP EVRM)",
      "samenvatting": "Belanghebbende is enig erfgename van haar in 2017 overleden vader, maar de door erflater benoemde executeur heeft de nalatenschap verduisterd (naar eigen zeggen vergokt), heeft geen aangifte gedaan en is failliet verklaard zonder uitkering aan schuldeisers; belanghebbende leeft van een bijstandsuitkering en heeft geen vermogen. Het Hof verwerpt haar standpunt dat geen erfrechtelijke verkrijging bestaat: als rechtsopvolger onder algemene titel is zij verkrijger in de zin van de artikelen 1 en 36 SW 1956 en beslissend is de omvang van de nalatenschap ten tijde van het overlijden. Wel oordeelt het Hof dat de door de Rechtbank tot € 261.860 verminderde aanslag, met € 40.144 aan erfbelasting, een individuele en buitensporige last vormt in strijd met artikel 1 EP EVRM: er zal met aan zekerheid grenzende waarschijnlijkheid geen draagkrachtvermeerdering optreden, beneficiaire aanvaarding beschermt niet omdat de erfbelasting een eigen schuld van de erfgenaam is, en kwijtschelding door de ontvanger is niet gewaarborgd. Als rechtsherstel vermindert het Hof de aanslag tot nihil.",
      "rechtsregel": "Heffing van erfbelasting kan een individuele en buitensporige last in de zin van artikel 1 EP EVRM opleveren indien de erfgenaam buiten haar toedoen niets uit de nalatenschap ontvangt en zal ontvangen en geen draagkracht heeft, in welk geval de belastingrechter rechtsherstel biedt door de aanslag tot nihil te verminderen.",

    {
      "ecli": "ECLI:NL:GHAMS:2022:96",
      "instantie": "Gerechtshof Amsterdam",
      "datum": "2022-01-04",
      "gepubliceerd": "2026-08-07",
      "onderwerp": "Huwelijkse voorwaarden in zicht van overlijden; fraus legis en art. 12 SW",
      "samenvatting": "Het beroep van de inspecteur op fraus legis slaagt. De huwelijkse voorwaarden tussen erflater en belanghebbende worden geacht te zijn aangegaan in het zicht van overlijden, waardoor sprake is van een bevoordeling binnen 180 dagen voor het overlijden. Deze wordt gelijkgesteld met een schenking en op grond van art. 12 SW gefingeerd tot een verkrijging krachtens erfrecht; terecht in de aanslag erfbelasting begrepen. Betreft een arrest uit 2022 (gemodificeerd op scandatum).",
      "rechtsregel": "Een via huwelijkse voorwaarden in het zicht van overlijden gecreeerde bevoordeling binnen 180 dagen voor overlijden wordt via fraus legis en art. 12 SW als erfrechtelijke verkrijging in de erfbelasting betrokken.",

      "onderwerp": "BOR: bezitseis art. 35d SW na ruziesplitsing waarbij 49%-belang 100% werd",
      "samenvatting": "De moeder van belanghebbende hield vóór de herstructurering in 2011 middellijk 49% in een concern met de activiteiten 'Horen' en 'Zien'; door een ruziesplitsing verkreeg zij middellijk 100% van de vennootschappen met de activiteit 'Horen', die zij in 2013 aan belanghebbende schonk (belaste verkrijging EUR 1.048.082). De inspecteur paste de BOR slechts toe op 49% van de waarde omdat voor het uitgeruilde 51%-deel niet aan de vijfjaarsbezitseis van artikel 35d, lid 1, letter c, SW zou zijn voldaan. Het hof oordeelt dat beslissend is de situatie op het tijdstip van de verkrijging: nu de vennootschap toen één materiële onderneming dreef en het belang niet meer als gedeeltelijk belang was te identificeren, is niet van belang of de schenker voorheen slechts een gedeeltelijk belang had, zodat de BOR voor 100% geldt (vrijstelling EUR 1.599.733, belaste verkrijging EUR 283.210). Het hof oordeelt voorts dat de aanslag binnen de driejaarstermijn van artikel 11, lid 3, AWR is vastgesteld, uitgaande van de in de aangifte vermelde schenkingsdatum.",
      "rechtsregel": "Voor de bezitseis van artikel 35d, lid 1, letter c, SW 1956 is beslissend de situatie ten tijde van de verkrijging; is het belang dan niet meer als een gedeeltelijk belang in één objectieve onderneming te identificeren, dan staat een eerdere uitbreiding van het subjectieve belang (hier via een ruziesplitsing) niet aan volledige toepassing van de BOR in de weg.",

      "onderwerp": "Conclusie A-G: Liechtensteinse Stiftung als APV; tegenbewijs en art. 1 EP",
      "samenvatting": "De vader van belanghebbende richtte in 2007 een Liechtensteinse Stiftung op waarin aandelen in een B.V., een beleggingsportefeuille en een bankrekening waren ingebracht; na zijn overlijden in 2012 werd het vermogen naar evenredigheid van het erfdeel aan belanghebbende toegerekend (IB/PVV 2011 tot en met 2013). A-G Niessen concludeert dat het vermogen discretionair is en dus als APV kwalificeert, dat de zaak verschilt van HR 10 april 2015, BNB 2015/152 omdat meer dan een begunstigde is aangewezen, en dat het beroep op de tegenbewijsregeling van artikel 2.14a, lid 6, Wet IB 2001 faalt omdat de erfgenamen begunstigden zijn. Ook de beroepen op het vrije verkeer en op artikel 1 EP falen: de regeling is lawful, dient het opheffen van een heffingsvacuum en is niet van redelijke grond ontbloot, terwijl van een individuele en buitensporige last niet is gebleken. De conclusie strekt tot ongegrondverklaring van het cassatieberoep.",

    {

      "zaaknummer": "19/00128-GHK tot en met 19/00133-GHK (T)",
      "onderwerp": "Geheimhoudingsbeslissing: successierechtdossier en intern memo als 8:42-stukken",
      "samenvatting": "In een hoger beroep over navorderingsaanslagen IB/PVV 2004 en 2007-2011 rond een buitenlandse trust verzoekt de inspecteur om geheimhouding van 45 stukken uit het dossier successierecht van de overleden vader en van een intern memo 'Box 2 of box 3?'. De geheimhoudingskamer oordeelt dat ook stukken die bij een ander organisatieonderdeel van de Belastingdienst (het specialistenteam schenk- en erfbelasting) berusten tot de op de zaak betrekking hebbende stukken behoren, nu de aanslagen schenk- en erfbelasting in samenhang met de IB-aanslagen zijn opgelegd. Omdat belanghebbende en zijn zus als enige erfgenamen toestemming hebben gegeven en het memo slechts een algemene inventarisatie bevat die niets prijsgeeft over de controle- of processtrategie, wegen de aangevoerde gewichtige redenen niet aanzienlijk zwaarder dan het belang bij onbeperkte kennisneming; enkel namen van derden en van belastingambtenaren mogen worden geschoond.",

      "samenvatting": "Eiser ontving in 1997 en 2001 van zijn in Belgie wonende moeder schenkingen van EUR 2.042.010 en EUR 907.561 onder de opschortende voorwaarde van haar overlijden; de vorderingen zijn renteloos. In geschil is of bij de waardering in box 3 rekening moet worden gehouden met de kans dat eiser eerder overlijdt dan zijn moeder, en of voor 2012 kon worden nagevorderd. De rechtbank oordeelt dat eiser te kwader trouw was doordat hij de tot en met 2010 voor circa EUR 1.500.000 aangegeven vorderingen in de aangifte 2012 zonder gewijzigde omstandigheden niet meer vermeldde, zodat navordering mogelijk is, en dat de renteloosheid meebrengt dat moeder een genotsrecht heeft, zodat waardering plaatsvindt op de voet van art. 5.22 Wet IB 2001 juncto de artikelen 18 en 19 Uitvoeringsbesluit IB 2001 en niet naar de waarde in het economische verkeer van art. 5.19 Wet IB 2001.",

      "samenvatting": "De schenker hield voor de herstructurering middellijk 49% in een concern met twee activiteiten; door een ruziesplitsing (art. 2:334cc BW) in 2011 verkreeg zij middellijk 100% van de tak 'Horen', waarvan de aandelen in 2013 aan haar zoon werden geschonken met een beroep op de BOR. De rechtbank oordeelt dat de bezitseis van artikel 35d, eerste lid, onderdeel c, SW 1956 per objectieve onderneming of gedeelte daarvan afzonderlijk moet worden toegepast, zodat voor het door de splitsing verkregen 51%-gedeelte niet aan de vijfjaarstermijn is voldaan; artikel 9, tweede lid, Uitvoeringsregeling schenk- en erfbelasting voegt slechts bezitsperioden van aandelen samen en verruimt het begrip 'de daar bedoelde onderneming' niet. Ook het beroep op het gelijkheidsbeginsel faalt; het beroep is ongegrond, met EUR 1.000 immateriele schadevergoeding wegens overschrijding van de redelijke termijn.",

    {
