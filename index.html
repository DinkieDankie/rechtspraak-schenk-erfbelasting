n 32 SW 1956", "samenvatting": "Belanghebbende is krachtens testament erfgenaam van zijn in 2017 overleden biologische vader, met wie hij family life had maar met wie door de twee-ouder-regel geen familierechtelijke betrekking tot stand kon komen; de aanslag erfbelasting is opgelegd naar tariefgroep II (30-40%) met de vrijstelling voor overige verkrijgers van EUR 2.129 in plaats van de kindvrijstelling van EUR 20.209 en tariefgroep I. A-G Ettema concludeert dat de begrippen kind en afstammeling in art. 32(1)4o(c) en art. 24(1) SW 1956 via art. 2(3)i AWR civielrechtelijk moeten worden uitgelegd, zodat een familierechtelijke betrekking in de zin van art. 1:197 en 1:199 BW vereist is en belanghebbende naar nationaal recht geen kind is. Toetsing aan art. 1 EP EVRM in samenhang met de artikelen 8 en 14 EVRM leidt haar er evenwel toe dat de wetgever weliswaar in het algemeen bij de familierechtelijke betrekking mocht aansluiten, maar dat in dit specifieke geval - erkenning bleef achterwege door een samenloop van omstandigheden buiten belanghebbendes invloed en het budgettaire argument schiet tekort - belanghebbende als kind en afstammeling moet worden behandeld, zodat het terecht voorgestelde middel van de Staatssecretaris niet tot cassatie leidt.", "rechtsregel": "De begrippen kind en afstammeling in de Successiewet 1956 worden via art. 2, lid 3, onderdeel i, AWR civielrechtelijk uitgelegd en vereisen een familierechtelijke betrekking, maar art. 1 EP EVRM in samenhang met de artikelen 8 en 14 EVRM kan meebrengen dat een kind dat family life met de erflater had en dat buiten zijn invloed niet kon worden erkend, voor de kindvrijstelling en tariefgroep I toch als kind en afstammeling moet worden behandeld.", "wetsartikelen": ["art. 24 SW 1956", "art. 32 SW 1956", "art. 19 SW 1956", "art. 2 AWR", "art. 1:197 BW", "art. 1:199 BW", "art. 1 EP EVRM", "art. 8 EVRM", "art. 14 EVRM"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBGEL:2021:1347", "ECLI:NL:GHARL:2022:4050", "ECLI:NL:HR:2024:1130"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2023:1201"}, {"ecli": "ECLI:NL:HR:2023:1664", "instantie": "Hoge Raad", "datum": "2023-12-01", "gepubliceerd": "2023-12-01", "onderwerp": "APV: stichtingsvermogen toegerekend aan erflaatster; stelplicht", "samenvatting": "Erflaatster was medebestuurder van een stichting met vier panden die haar statutaire (culturele) doel feitelijk niet nastreefde. Hof en Hoge Raad merken het stichtingsvermogen aan als afgezonderd particulier vermogen (art. 2.14a Wet IB 2001) dat via art. 16 SW krachtens erfrecht door de zoon/enig erfgenaam wordt verkregen. Het cassatiemiddel dat het vermogen deels door belanghebbende zelf zou zijn afgezonderd faalt, omdat dit niet in feitelijke instanties (subsidiair) is aangevoerd; de stelplicht ligt bij belanghebbende.", "rechtsregel": "Toerekening van APV-vermogen aan de erflater blijft in cassatie in stand wanneer een gedeeltelijke eigen inbreng niet in feitelijke instanties is gesteld; de stelplicht daarvoor rust op de belanghebbende.", "wetsartikelen": ["art. 16 SW 1956", "art. 2.14a Wet IB 2001"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2023:1664"}, {"ecli": "ECLI:NL:RBZWB:2023:8170", "instantie": "Rechtbank Zeeland-West-Brabant", "datum": "2023-11-24", "gepubliceerd": "2026-05-12", "zaaknummer": "BRE 21/5020 en BRE 21/5021", "onderwerp": "Schenkbelasting; vrijstelling natuurlijke verbintenis art. 33 onder 12 SW", "samenvatting": "De in Belgie wonende belanghebbende had anderhalf jaar een LAT-relatie met de in 2019 overleden erflater; zijn twee zoons keerden haar bij vaststellingsovereenkomst EUR 500.000 uit ter voldoening aan een gestelde dringende morele verplichting, waarna twee aanslagen schenkbelasting naar een belaste verkrijging van elk EUR 247.827 werden opgelegd. In geschil is of de vrijstelling van artikel 33, aanhef en onder 12, SW 1956 voor schenkingen ter voldoening aan een natuurlijke verbintenis (art. 6:3 BW) van toepassing is. De rechtbank oordeelt dat belanghebbende, op wie de bewijslast rust, naar objectieve maatstaven geen dringende morele verplichting aannemelijk heeft gemaakt: er was geen samenwoning of gezamenlijke kinderen en over haar eigen welstand en behoefte zijn geen objectief verifieerbare gegevens verstrekt; een handgeschreven, niet-ondertekende wilsverklaring is onvoldoende. De beroepen zijn ongegrond.", "rechtsregel": "Of een schenking strekt tot voldoening aan een natuurlijke verbintenis in de zin van artikel 33, aanhef en onder 12, SW 1956 moet naar objectieve maatstaven worden beoordeeld, mede aan de hand van de wederzijdse welstand en behoefte ten tijde van de prestatie, en de verkrijger draagt daarvan de bewijslast.", "wetsartikelen": ["art. 33 SW 1956", "art. 6:3 BW"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBZWB:2023:8170"}, {"ecli": "ECLI:NL:HR:2023:1508", "instantie": "Hoge Raad", "datum": "2023-11-03", "gepubliceerd": "2025-03-21", "zaaknummer": "22/03636", "onderwerp": "Navordering erfbelasting; ambtelijk verzuim en onderzoeksplicht inspecteur", "samenvatting": "Erflaatster overleed in 2013; belanghebbende, haar enig erfgenaam, vermeldde in de aangifte erfbelasting van 3 september 2014 niet dat erflaatster gerechtigd was tot een onverdeeld zevende deel in de nalatenschap van in 2011 overleden oma en tot een legaat. De aanslag werd op 16 december 2014 conform aangifte opgelegd; op 7 mei 2018 kondigde de Inspecteur navordering aan. In geschil was of de Inspecteur beschikte over een nieuw feit in de zin van art. 16, lid 1, AWR, nu voor beide nalatenschappen dezelfde inspecteur bevoegd was. De Hoge Raad verwerpt het beroep: de Inspecteur mocht bij de beoordeling van de aangifte in beginsel volstaan met raadpleging van het voor het overlijden van erflaatster aangelegde dossier en hoefde het dossier van oma niet te raadplegen.", "rechtsregel": "Bij de heffing van erfbelasting kan de inspecteur bij het beoordelen van de aangifte in beginsel volstaan met raadpleging van het ter zake van het desbetreffende overlijden aangelegde dossier; er bestaat in zoverre geen ruimere onderzoeksplicht dan bij de heffing van inkomstenbelasting.", "wetsartikelen": ["art. 16 lid 1 AWR", "art. 81 lid 1 Wet RO"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHSHE:2022:2941"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2023:1508"}, {"ecli": "ECLI:NL:HR:2023:1054", "instantie": "Hoge Raad", "datum": "2023-08-18", "gepubliceerd": "2025-06-17", "zaaknummer": "22/04071", "onderwerp": "BOR; Pottenbakkersarrest zonder betekenis voor omvang ondernemingsvermogen", "samenvatting": "Belanghebbende verkreeg in 2012 als een van vijf erfgenamen (certificaten van) aandelen in vennootschappen die zich bezighielden met projectontwikkeling en verhuur van onroerende zaken. Na verwijzing bij HR 18 juni 2021, ECLI:NL:HR:2021:951, was nog in geschil welke panden aan de projectontwikkelingsactiviteiten kunnen worden toegerekend voor de bedrijfsopvolgingsregeling van art. 35b SW. De Hoge Raad verwerpt het principale beroep, maar acht het incidentele beroep van de Staatssecretaris gegrond: gelet op de strekking van de BOR (continuiteit van de onderneming, liquiditeitsproblemen bij niet-liquide vermogen) behoren tot het verkregen ondernemingsvermogen alleen vermogensbestanddelen die ten tijde van de verkrijging voor ondernemingsdoeleinden worden aangehouden. Het sinds 2006 aan derden verhuurde voormalige kantoorpand met een waarde van EUR 6.800.000 is daarom ten onrechte tot het ondernemingsvermogen gerekend; verwijzing volgt.", "rechtsregel": "Tot het in het kader van een bedrijfsopvolging verkregen ondernemingsvermogen in de zin van art. 35b, lid 1, SW 1956 behoren uitsluitend vermogensbestanddelen die ten tijde van de verkrijging voor ondernemingsdoeleinden worden aangehouden, zodat aan de vermogensetiketteringsregel van het Pottenbakkersarrest voor de BOR geen betekenis toekomt.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 81 lid 1 Wet RO"], "belang": "hoog", "oordeel": "verwijzing", "gerelateerd": ["ECLI:NL:GHDHA:2022:1897", "ECLI:NL:HR:2021:951"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2023:1054"}, {"ecli": "ECLI:NL:RBGEL:2023:4042", "instantie": "Rechtbank Gelderland", "datum": "2023-07-17", "gepubliceerd": "2023-08-01", "onderwerp": "BOR: vastgoedverhuur geen materiële onderneming; vpb-latentie", "samenvatting": "Erfrechtelijke verkrijging van aandelen in een vastgoed-BV. De rechtbank past de arbeid-plus/rendement-plus-toets toe en oordeelt dat de verhuuractiviteiten (beheer, toezicht, klein onderhoud, debiteurenbeheer) normaal vermogensbeheer niet te boven gaan; de BOR is niet van toepassing. Het beroep is wel gegrond omdat de inspecteur voor één pand een te lage vpb-latentie hanteerde.", "rechtsregel": "Werkzaamheden die horen bij het normale beheer van onroerende zaken leveren geen materiële onderneming op voor de BOR, ook niet bij eigen personeel en intensief huurdercontact.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 3.2 Wet IB 2001"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2023:4042"}, {"ecli": "ECLI:NL:RBGEL:2023:4041", "instantie": "Rechtbank Gelderland", "datum": "2023-07-17", "gepubliceerd": "2026-06-08", "zaaknummer": "AWB - 21 _ 3550", "onderwerp": "BOR bij vastgoed-bv: materiele onderneming en hoogte vpb-latentie", "samenvatting": "Belanghebbende verkreeg in 2016 krachtens erfrecht de helft van de nalatenschap waartoe alle aandelen behoorden in een bv die circa acht in eigendom zijnde onroerende zaken verhuurde met drie werknemers; in geschil is of de bedrijfsopvolgingsregeling van art. 35b e.v. SW 1956 van toepassing is en of de vpb-latentie te laag is vastgesteld. De rechtbank oordeelt dat de beschreven werkzaamheden (verhuur, beheer, klein onderhoud, debiteurenbeheer, klachtenbehandeling) behoren tot normaal vermogensbeheer en dat niet is gebleken van bijzondere kennis of van een rendement boven het bij normaal vermogensbeheer opkomende rendement, zodat geen materiele onderneming wordt gedreven en de BOR niet van toepassing is. Wel is het beroep gegrond omdat partijen het erover eens zijn dat voor een verkocht object de vpb-latentie EUR 6.960 hoger moet zijn; de belaste verkrijging wordt verminderd tot EUR 1.245.731 en het beroep op interne compensatie van de inspecteur faalt bij gebrek aan een controleerbare contantewaardeberekening.", "rechtsregel": "Exploitatie van onroerende zaken vormt slechts een materiele onderneming in de zin van art. 35c SW 1956 indien de arbeid naar aard en omvang meer omvat dan bij normaal vermogensbeheer gebruikelijk is en onmiskenbaar ten doel heeft een hoger dan bij normaal vermogensbeheer opkomend rendement te behalen; de latente vennootschapsbelasting over stille reserves in duurzaam verhuurd vastgoed wordt naar de contante waarde op de peildatum in aanmerking genomen.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 3.2 Wet IB 2001"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBGEL:2023:4041"}, {"ecli": "ECLI:NL:GHDHA:2023:1299", "instantie": "Gerechtshof Den Haag", "datum": "2023-06-27", "gepubliceerd": "2026-05-13", "zaaknummer": "BK-22/00499 tot en met BK-22/00502 en BK-23/00363", "onderwerp": "APV-stichting toegerekend aan erfgenaam; box 3; art. 16 SW 1956", "samenvatting": "Belanghebbende is enig erfgenaam van zijn in 2013 overleden moeder, die in 1993 een stichting oprichtte waarin onroerend goed was afgezonderd. In geschil is of het stichtingsvermogen (voor 2017 geschat op EUR 900.851) als afgezonderd particulier vermogen aan hem kan worden toegerekend en of de box 3-heffing 2014 tot en met 2017 in strijd is met artikel 1 EP en artikel 14 EVRM. Het Hof oordeelt dat de stichting een APV is, dat belanghebbende het tegenbewijs van artikel 2.14a, lid 6, Wet IB 2001 niet heeft geleverd en dat zijn stelling dat een APV niet in een nalatenschap kan vallen geen steun in het recht vindt, gelet op artikel 16, lid 1, SW 1956. Voor 2017 bestaat geen aanleiding voor rechtsherstel omdat de nieuwe berekening (EUR 60.857) hoger uitkomt dan het oorspronkelijke voordeel (EUR 41.400).", "rechtsregel": "Bezittingen en schulden van een APV die tot het overlijden aan de erflater werden toegerekend, worden op grond van artikel 16, lid 1, SW 1956 geacht door diens erfgenamen krachtens erfrecht te zijn verkregen, zodat een APV wel degelijk in de heffing over de nalatenschap kan worden betrokken.", "wetsartikelen": ["art. 16 SW 1956", "art. 2.14a Wet IB 2001", "art. 5.2 Wet IB 2001", "art. 1 EP EVRM", "art. 14 EVRM"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHDHA:2021:2071"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHDHA:2023:1299"}, {"ecli": "ECLI:NL:PHR:2023:461", "instantie": "Parket bij de Hoge Raad", "datum": "2023-04-26", "gepubliceerd": "2026-06-09", "onderwerp": "Conclusie A-G — APV-regime; stichting met verhuurde panden (zaak 21/04929)", "samenvatting": "Conclusie A-G in de APV-zaak die leidt tot HR 1 december 2023 (ECLI:NL:HR:2023:1664). Behandelt of de (niet uitgevoerde) statutaire doelstelling en het uitkeringsverbod ex art. 2:285 lid 3 BW aan toepassing van het APV-regime in de weg staan, wie het vermogen heeft ingebracht, en de verhouding tussen het APV-regime en de fiscale-transparantierechtspraak.", "rechtsregel": "Het uitkeringsverbod van art. 2:285 lid 3 BW en een statutair ideëel doel staan niet in de weg aan toepassing van het APV-regime wanneer feitelijk een meer dan bijkomstig particulier belang wordt gediend.", "wetsartikelen": ["art. 16 SW 1956", "art. 2.14a Wet IB 2001"], "belang": "middel", "oordeel": "n.v.t.", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2023:461"}, {"ecli": "ECLI:NL:HR:2023:647", "instantie": "Hoge Raad", "datum": "2023-04-21", "gepubliceerd": "2026-02-27", "zaaknummer": "21/04462", "onderwerp": "BOR; indirecte bezitseis art. 35d SW na ruziesplitsing; per onderneming toetsen", "samenvatting": "De schenker hield via een holding aanvankelijk een indirect belang van 49 procent in een vennootschap waarin via dochtermaatschappijen de activiteiten 'horen' en 'zien' werden gedreven; na een ruziesplitsing in 2011 (art. 2:334cc BW) en een afsplitsing in 2012 schonk zij in 2013 alle aandelen in de resterende vennootschap aan belanghebbende, die om toepassing van de BOR verzocht. De Inspecteur achtte de vijfjaarstermijn van art. 35d, lid 1, letter c, SW 1956 slechts voor 49 procent vervuld; het Hof oordeelde dat geen nieuwe bezitstermijn was aangevangen omdat de verkregen vennootschap ten tijde van de schenking één onderneming dreef. De Hoge Raad casseert: voor de indirecte bezitstermijn is mede van belang of de aan de gesplitste vennootschap toegerekende activiteiten één onderneming vormden en of de schenker bij de splitsing een met haar indirecte belang overeenstemmend gedeelte daarvan heeft verkregen; per (objectieve) onderneming moet worden beoordeeld of aan de indirecte bezitseis is voldaan. Verwijzing volgt omdat het Hof niets heeft vastgesteld over het aantal objectieve ondernemingen vóór de splitsing.", "rechtsregel": "Voor de indirecte bezitseis van art. 35d, lid 1, letter c, SW 1956 moet per objectieve onderneming worden beoordeeld of de schenker die onderneming gedurende vijf jaren (middellijk) heeft gedreven, zodat een uitbreiding van het subjectieve belang in een onderneming een nieuwe bezitstermijn kan doen aanvangen.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c lid 5 SW 1956", "art. 35d lid 1 letter c SW 1956", "art. 9 lid 2 Uitvoeringsregeling schenk- en erfbelasting", "art. 3.2 Wet IB 2001", "art. 2:334cc BW"], "belang": "hoog", "oordeel": "verwijzing", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2023:647"}, {"ecli": "ECLI:NL:RBNHO:2023:1743", "instantie": "Rechtbank Noord-Holland", "datum": "2023-02-14", "gepubliceerd": "2026-07-13", "zaaknummer": "20/6303 en 21/163", "onderwerp": "Familiestichting geen SBBI maar APV; fictief erfgenaam en begunstigde", "samenvatting": "Een in 1907 opgerichte familiestichting, met een vermogen van ruim EUR 8 miljoen en jaarlijkse uitkeringen van EUR 94.626 tot EUR 154.323 aan familieleden naast donaties aan medisch onderzoek, is volgens de rechtbank geen sociaal belang behartigende instelling in de zin van artikel 5c AWR maar een APV, omdat de doelgroep te beperkt is en meer dan bijkomstig (meer dan 10%) een particulier belang wordt beoogd, zowel voor als na de statutenwijziging van 11 oktober 2018. Belanghebbende, weduwe van de kleinzoon van een broer van de oprichter, is fictief erfgenaam in de zin van artikel 2.14a, lid 4, Wet IB 2001: onder onterven valt ook impliciete onterving doordat een ander (hier de stichting zelf) tot enig erfgenaam is benoemd. Zij is ook begunstigde, nu zij statutair gerechtigd is en tot 2017 jaarlijks EUR 1.000 ontving. De beroepen tegen de navorderingsaanslag 2018 en de aanslag 2019 zijn ongegrond; van strijd met artikel 1 EP, artikel 14 EVRM of algemene beginselen is geen sprake.", "rechtsregel": "Een familiestichting die meer dan bijkomstig een particulier belang beoogt kwalificeert niet als SBBI maar als APV, en het begrip 'onterfd' in artikel 2.14a, lid 4, Wet IB 2001 omvat ook de impliciete onterving die ontstaat doordat bij uiterste wil een ander tot enig erfgenaam is benoemd.", "wetsartikelen": ["art. 2.14a Wet IB 2001", "art. 5b AWR", "art. 5c AWR", "art. 64 AWR", "art. 3:4 Awb", "art. 1 EP EVRM", "art. 14 EVRM"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHAMS:2024:1494", "ECLI:NL:GHDHA:2026:2038", "ECLI:NL:HR:2025:1389"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNHO:2023:1743"}, {"ecli": "ECLI:NL:PHR:2022:1234", "instantie": "Parket bij de Hoge Raad", "datum": "2022-12-21", "gepubliceerd": "2025-03-22", "zaaknummer": "21/04634, 21/04635, 21/04638, 21/04641, 21/04642", "onderwerp": "Liechtensteinse Stiftung; discretionair APV; art. 16 SW 1956", "samenvatting": "De in gemeenschap van goederen gehuwde ouders richtten in 1994 een Liechtensteinse Stiftung op en brachten daarin vermogen in; de begunstigden hebben blijkens statuten en Letter of Wishes geen afdwingbare rechten. Na het overlijden van de moeder in 2011 is aan belanghebbende een navorderingsaanslag erfbelasting over 2011 opgelegd naar een belaste verkrijging van EUR 1.220.992, omdat de helft van het Stiftungsvermogen (EUR 2.537.077) als discretionair afgezonderd particulier vermogen op grond van art. 16 SW 1956 juncto art. 2.14a Wet IB 2001 tot haar nalatenschap wordt gerekend. In geschil is of het vermogen non-discretionair is en of de moeder mede-inbrenger was ondanks gesteld ontbreken van bestuursbevoegdheid. A-G IJzerman meent dat het Hof met juistheid heeft aangesloten bij HR 26 maart 2021 (afdwingbare rechten vereist voor non-discretionair vermogen) en dat de ouders door medeondertekening gezamenlijk partij waren bij de inbreng, zodat aan overschrijding van bestuursbevoegdheid niet wordt toegekomen.", "rechtsregel": "Vermogen in een trustachtige rechtsfiguur is slechts non-discretionair, en wordt slechts aan de begunstigden toegerekend, voor zover dezen concrete juridisch afdwingbare rechten op dat vermogen hebben; hebben beide in gemeenschap van goederen gehuwde echtgenoten de inbrengstukken ondertekend, dan zijn zij gezamenlijk inbrenger en kan achteraf geen beroep worden gedaan op overschrijding van bestuursbevoegdheid.", "wetsartikelen": ["art. 16 SW 1956", "art. 17 SW 1956", "art. 2.14a Wet IB 2001", "art. 1:88 BW", "art. 1:89 BW", "art. 1:97 BW"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBGEL:2020:5411", "ECLI:NL:GHARL:2021:9196", "ECLI:NL:HR:2023:948", "ECLI:NL:HR:2023:1069", "ECLI:NL:HR:2023:1074", "ECLI:NL:HR:2023:1078", "ECLI:NL:HR:2023:1080", "ECLI:NL:PHR:2022:1233"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2022:1234"}, {"ecli": "ECLI:NL:PHR:2022:1233", "instantie": "Parket bij de Hoge Raad", "datum": "2022-12-21", "gepubliceerd": "2025-03-21", "zaaknummer": "21/04630, 21/04631, 21/04632, 21/04633, 21/04636, 21/04637, 21/04639", "onderwerp": "Uitkering Liechtensteinse Stiftung aan kleinkinderen; art. 17 SW 1956", "samenvatting": "Uit het door de grootouders in 1994 in een Liechtensteinse Stiftung afgezonderde vermogen is op 24 december 2014 aan elk van de kleinkinderen een bedrag uitgekeerd; aan belanghebbende is een aanslag schenkbelasting 2014 opgelegd naar een belaste verkrijging van EUR 627.008 op grond van art. 17 SW 1956, omdat het vermogen als discretionair APV eerst op de voet van art. 16 SW 1956 aan de ouders als erfgenamen van de inbrengers was toegerekend. Belanghebbende betoogt dat het vermogen vanaf 1994 non-discretionair was en rechtstreeks aan de kleinkinderen moest worden toegerekend. A-G IJzerman concludeert dat de statuten, de brief van 19 augustus 1994 en de Letter of Wishes het bestuur volledige beleidsvrijheid laten en de begunstigden geen afdwingbare rechten geven, zodat het oordeel van het Hof dat sprake is van discretionair vermogen stand houdt en de uitkering als fictieve schenking door de ouders wordt belast.", "rechtsregel": "Een uitkering uit discretionair afgezonderd particulier vermogen wordt op grond van art. 17 SW 1956 aangemerkt als schenking door degene aan wie dat vermogen krachtens art. 16 SW 1956 juncto art. 2.14a Wet IB 2001 is toegerekend; van non-discretionair vermogen is slechts sprake als de begunstigden juridisch afdwingbare rechten hebben, en niet reeds omdat de inbrengers hun voorkeur voor bepaalde begunstigden in een Letter of Wishes hebben vastgelegd.", "wetsartikelen": ["art. 16 SW 1956", "art. 17 SW 1956", "art. 2.14a Wet IB 2001"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBGEL:2020:5410", "ECLI:NL:GHARL:2021:9202", "ECLI:NL:HR:2023:947", "ECLI:NL:HR:2023:1065", "ECLI:NL:HR:2023:1066", "ECLI:NL:HR:2023:1068", "ECLI:NL:HR:2023:1076", "ECLI:NL:HR:2023:1077", "ECLI:NL:HR:2023:1079", "ECLI:NL:PHR:2022:1234"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2022:1233"}, {"ecli": "ECLI:NL:HR:2022:1785", "instantie": "Hoge Raad", "datum": "2022-12-16", "gepubliceerd": "2025-03-21", "zaaknummer": "21/03794", "onderwerp": "Vijf akten van schuldigerkenning; geen periodieke uitkering (art. 18 lid 2 SW)", "samenvatting": "Op 7 maart 2013 zijn vijf afzonderlijke notariele akten verleden waarbij de ouders telkens EUR 10.000 aan belanghebbende schuldig erkennen, renteloos en opeisbaar bij overlijden van de langstlevende schenker, waarbij vier akten de opschortende voorwaarde bevatten dat de langstlevende ouder op 1 januari 2014, 2015, 2016 respectievelijk 2017 in leven is. De inspecteur merkte het geheel aan als de schenking van een periodieke uitkering in de zin van art. 18, lid 2, SW 1956 en legde een aanslag schenkbelasting op naar een verkrijging van EUR 8.969. De Hoge Raad laat het oordeel van het hof in stand dat sprake is van vijf afzonderlijke schenkingen: aan de civielrechtelijke vorm kan betekenis worden toegekend en zelfstandige fiscale kwalificatie ter vermijding van onaanvaardbare gevolgen voor de belastingheffing is hier niet geboden.", "rechtsregel": "Aan de civielrechtelijke vorm van afzonderlijke schenkingsovereenkomsten komt bij de toepassing van art. 18, lid 2, SW 1956 betekenis toe, zodat op hetzelfde moment verleden afzonderlijke akten met opschortende voorwaarden van in leven zijn niet zonder meer als de schenking van een periodieke uitkering worden gekwalificeerd.", "wetsartikelen": ["art. 18 lid 2 SW 1956"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHSHE:2021:2397", "ECLI:NL:PHR:2022:843"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2022:1785"}, {"ecli": "ECLI:NL:HR:2022:1793", "instantie": "Hoge Raad", "datum": "2022-12-02", "gepubliceerd": "2025-03-22", "zaaknummer": "21/03796", "onderwerp": "BOR; voortzettingsvereiste bij verhuur van de voorheen zelf gedreven onderneming", "samenvatting": "De vader schonk op 24 december 2014 alle aandelen in een Holding waarvan een dochtervennootschap eigenaar was van een benzineservicestation dat door een kleindochter werd geexploiteerd; in oktober 2015 werd het station voor vijf jaar aan een derde verhuurd. De inspecteur nam bij navorderingsaanslag in de schenkbelasting de BOR terug wegens schending van het voortzettingsvereiste van art. 35e, lid 1, letter c, ten derde, SW 1956. De Hoge Raad verwerpt het cassatieberoep van de staatssecretaris: het voortzettingsvereiste bij lichamen volgt in beginsel het stakings- en vervreemdingsbegrip van de Wet IB 2001, waarop slechts een uitzondering mogelijk is wanneer de specifieke aard van de BOR daarom vraagt, en de enkele omstandigheid dat de vennootschap de voorheen zelf geexploiteerde onderneming gaat verhuren rechtvaardigt zo'n uitzondering niet.", "rechtsregel": "Voor het voortzettingsvereiste van art. 35e SW 1956 wordt in beginsel aangesloten bij het stakings- en vervreemdingsbegrip van de Wet IB 2001, zodat de verhuur van een voorheen zelf geexploiteerde onderneming niet leidt tot het ophouden winst uit onderneming te genieten.", "wetsartikelen": ["art. 35b SW 1956", "art. 35e lid 1 SW 1956", "art. 3.63 Wet IB 2001", "art. 81 lid 1 Wet RO"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHSHE:2021:2396", "ECLI:NL:PHR:2022:523", "ECLI:NL:RBZWB:2020:316"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2022:1793"}, {"ecli": "ECLI:NL:PHR:2022:964", "instantie": "Parket bij de Hoge Raad", "datum": "2022-10-18", "gepubliceerd": "2025-03-21", "zaaknummer": "22/01789", "onderwerp": "Herziening; onbeperkte navorderingstermijn art. 66, lid 4, SW 1956", "samenvatting": "Belanghebbende verzoekt op de voet van art. 8:119 Awb om herziening van HR BNB 2021/150 (ECLI:NL:HR:2021:1189) over navordering van successierecht ter zake van het via een Edelweiss-route dertien jaar verzwegen buitenlandse vermogen uit de in 2001 opengevallen nalatenschap van zijn partner, dus onder de Successiewet zoals die tot 2010 luidde, met een beroep op het nadien gewezen HvJ-arrest C-788/19 (Commissie/Spanje). A-G Wattel concludeert dat posterieure rechtspraak geen feit of omstandigheid in de zin van art. 8:119 Awb is en dat ook het EU-rechtelijke effectiviteitsbeginsel (arrest Kapferer) niet tot doorbreking van het gezag van gewijsde dwingt. Ten overvloede meent hij dat art. 66, lid 4, SW 1956 door de voortvarendheidseis en de evenredigheidstoets in concreto niet in strijd komt met het vrije kapitaalverkeer, zodat herziening hoe dan ook slechts tot bevestiging van de eerdere ongegrondverklaring zou leiden.", "rechtsregel": "Een na een onherroepelijke uitspraak gewezen arrest van het Hof van Justitie levert geen feit of omstandigheid op in de zin van art. 8:119 Awb en noopt ook op grond van het EU-rechtelijke effectiviteitsbeginsel niet tot herziening; de temporeel onbeperkte navorderingsbevoegdheid van art. 66, lid 4, SW 1956 blijft EU-rechtelijk aanvaardbaar zolang de inspecteur na bekendwording van aanwijzingen voortvarend handelt.", "wetsartikelen": ["art. 66 SW 1956", "art. 8:119 Awb", "art. 4:6 Awb", "art. 29 AWR", "art. 65 AWR"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:HR:2021:1189", "ECLI:NL:HR:2022:1830"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2022:964"}, {"ecli": "ECLI:NL:PHR:2022:903", "instantie": "Parket bij de Hoge Raad", "datum": "2022-10-06", "gepubliceerd": "2026-02-03", "zaaknummer": "21/04462", "onderwerp": "BOR: bezitseis art. 35d SW na ruziesplitsing van 49% naar 100%", "samenvatting": "De schenkster hield tot 2011 via een houdstervennootschap indirect 49% in een concern met de activiteiten 'horen' en 'zien'; bij een ruziesplitsing (art. 2:334cc BW) verkreeg zij 100% van 'horen' en op 25 september 2013 schonk zij de aandelen in de nieuwe holding aan haar zoon. De inspecteur paste de BOR slechts toe op 49% van de waarde omdat voor het door de splitsing verkregen 51%-deel niet is voldaan aan de vijfjaarsbezitseis van art. 35d, lid 1, onderdeel c, SW; het hof achtte de BOR voor 100% van toepassing. A-G IJzerman meent dat de waarde van de objectieve onderneming 'horen' bezien vanuit de positie van de schenker is toegenomen van 49% naar 100%, zodat voor die uitbreiding binnen de wetssystematiek een nieuwe bezitstermijn van vijf jaren aanvangt en art. 9, lid 2, URSE daaraan niet afdoet. De conclusie strekt tot gegrondverklaring van het cassatieberoep van de staatssecretaris.", "rechtsregel": "Wanneer een schenker zijn gerechtigdheid tot een objectieve onderneming door een ruziesplitsing uitbreidt, neemt daarmee ook de vanuit de positie van de schenker te beoordelen waarde van de objectieve onderneming toe, zodat voor dat uitgebreide deel een nieuwe bezitstermijn van vijf jaren als bedoeld in art. 35d, lid 1, onderdeel c, SW 1956 gaat lopen.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 35d SW 1956", "art. 9 Uitvoeringsregeling schenk- en erfbelasting", "art. 3.2 Wet IB 2001", "art. 2:334cc BW"], "belang": "hoog", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2022:903"}, {"ecli": "ECLI:NL:PHR:2022:843", "instantie": "Parket bij de Hoge Raad", "datum": "2022-09-21", "gepubliceerd": "2025-03-22", "zaaknummer": "21/03794, 21/03795", "onderwerp": "Vijf voorwaardelijke schenkingen; periodieke uitkering art. 18 SW 1956", "samenvatting": "Ouders verleden op 7 maart 2013 vijf afzonderlijke notariele schenkingsakten van elk EUR 10.000 ten gunste van hun kind, waarvan vier onder de opschortende voorwaarde dat de langstlevende ouder op 1 januari 2014 tot en met 2017 nog in leven is. De Inspecteur legde over 2013 een aanslag schenkbelasting op naar een belaste verkrijging van EUR 8.969 omdat de vijf schenkingen samen een periodieke uitkering in de zin van art. 18, lid 2, SW 1956 zouden vormen; het Hof volgde belanghebbende dat sprake is van vijf afzonderlijke schenkingen die op grond van art. 1, lid 9, SW 1956 per jaar tot stand komen en telkens binnen de jaarvrijstelling blijven. A-G IJzerman concludeert dat de Successiewet aanknoopt bij de gekozen civielrechtelijke vormgeving, dat s Hofs uitleg van de akten feitelijk en niet onbegrijpelijk is en dat de latere betalingen niet tot een stamrecht zijn te herleiden, zodat voor een zelfstandige fiscaalrechtelijke kwalificatie geen plaats is en het middel van de Staatssecretaris faalt.", "rechtsregel": "Van schenking van een periodieke uitkering in de zin van art. 18, lid 2, SW 1956 is slechts sprake indien in een rechtshandeling een (stam)recht wordt geschonken op grond waarvan de begiftigde zonder nadere beslissing van de schenker recht heeft op terugkerende uitkeringen; afzonderlijk overeengekomen schenkingen onder opschortende voorwaarde komen ingevolge art. 1, lid 9, SW 1956 elk afzonderlijk tot stand op het moment van vervulling van die voorwaarde.", "wetsartikelen": ["art. 1 SW 1956", "art. 18 SW 1956", "art. 7:175 BW", "art. 7:177 BW"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBZWB:2020:1845", "ECLI:NL:RBZWB:2020:1846", "ECLI:NL:GHSHE:2021:2397", "ECLI:NL:GHSHE:2021:2398", "ECLI:NL:HR:2022:1785", "ECLI:NL:HR:2022:1884"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2022:843"}, {"ecli": "ECLI:NL:GHDHA:2022:906", "instantie": "Gerechtshof Den Haag", "datum": "2022-05-25", "gepubliceerd": "2026-05-13", "zaaknummer": "BK-21/00839", "onderwerp": "Erfbelasting vormt individuele en buitensporige last (art. 1 EP EVRM)", "samenvatting": "Belanghebbende is enig erfgename van haar in 2017 overleden vader, maar de door erflater benoemde executeur heeft de nalatenschap verduisterd (naar eigen zeggen vergokt), heeft geen aangifte gedaan en is failliet verklaard zonder uitkering aan schuldeisers; belanghebbende leeft van een bijstandsuitkering en heeft geen vermogen. Het Hof verwerpt haar standpunt dat geen erfrechtelijke verkrijging bestaat: als rechtsopvolger onder algemene titel is zij verkrijger in de zin van de artikelen 1 en 36 SW 1956 en beslissend is de omvang van de nalatenschap ten tijde van het overlijden. Wel oordeelt het Hof dat de door de Rechtbank tot € 261.860 verminderde aanslag, met € 40.144 aan erfbelasting, een individuele en buitensporige last vormt in strijd met artikel 1 EP EVRM: er zal met aan zekerheid grenzende waarschijnlijkheid geen draagkrachtvermeerdering optreden, beneficiaire aanvaarding beschermt niet omdat de erfbelasting een eigen schuld van de erfgenaam is, en kwijtschelding door de ontvanger is niet gewaarborgd. Als rechtsherstel vermindert het Hof de aanslag tot nihil.", "rechtsregel": "Heffing van erfbelasting kan een individuele en buitensporige last in de zin van artikel 1 EP EVRM opleveren indien de erfgenaam buiten haar toedoen niets uit de nalatenschap ontvangt en zal ontvangen en geen draagkracht heeft, in welk geval de belastingrechter rechtsherstel biedt door de aanslag tot nihil te verminderen.", "wetsartikelen": ["art. 1 SW 1956", "art. 36 SW 1956", "art. 72, lid 1, SW 1956", "art. 1 EP EVRM", "art. 27e AWR", "art. 26, lid 1, Invorderingswet 1990", "art. 8:75 Awb"], "belang": "hoog", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHDHA:2022:906"}, {"ecli": "ECLI:NL:HR:2022:661", "instantie": "Hoge Raad", "datum": "2022-04-29", "gepubliceerd": "2025-06-17", "zaaknummer": "21/00232", "onderwerp": "Tijdstip verkrijging na gerechtelijke vaststelling vaderschap (art. 1:207 BW)", "samenvatting": "Erflater overleed in 2008 - de zaak ziet dus op de SW zoals die tot 2010 luidde (recht van successie) - en bij beschikking van 15 januari 2014 stelde de rechtbank vast dat hij de vader van belanghebbende is, waardoor deze met terugwerkende kracht als kind en erfgenaam geldt en uit de nalatenschap van EUR 3.876.028 een geldvordering verkreeg waarop in 2016 EUR 554.729 is uitbetaald. De inspecteur legde een navorderingsaanslag recht van successie van EUR 286.416 op naar een verkrijging in 2008 van EUR 1.292.009. De Hoge Raad oordeelt dat belanghebbende voordat de beschikking kracht van gewijsde kreeg niet als rechthebbende tot de nalatenschap kon worden aangemerkt, zodat niet kan worden aangenomen dat de belastbare verkrijging voor dat tijdstip heeft plaatsgevonden; heffing ter zake van een verkrijging in 2008 is daarom onjuist en de navorderingsaanslag wordt vernietigd.", "rechtsregel": "Bij een gerechtelijke vaststelling van het vaderschap op de voet van art. 1:207 BW vindt de belastbare erfrechtelijke verkrijging niet eerder plaats dan op het tijdstip waarop die beschikking kracht van gewijsde krijgt, ondanks de civielrechtelijke terugwerkende kracht daarvan.", "wetsartikelen": ["art. 1 lid 1 SW 1956", "art. 5 SW 1956", "art. 21 lid 1 SW 1956", "art. 1:207 BW"], "belang": "hoog", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:GHAMS:2020:3767", "ECLI:NL:PHR:2021:835"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2022:661"}, {"ecli": "ECLI:NL:GHAMS:2022:96", "instantie": "Gerechtshof Amsterdam", "datum": "2022-01-04", "gepubliceerd": "2026-08-07", "onderwerp": "Huwelijkse voorwaarden in zicht van overlijden; fraus legis en art. 12 SW", "samenvatting": "Het beroep van de inspecteur op fraus legis slaagt. De huwelijkse voorwaarden tussen erflater en belanghebbende worden geacht te zijn aangegaan in het zicht van overlijden, waardoor sprake is van een bevoordeling binnen 180 dagen voor het overlijden. Deze wordt gelijkgesteld met een schenking en op grond van art. 12 SW gefingeerd tot een verkrijging krachtens erfrecht; terecht in de aanslag erfbelasting begrepen. Betreft een arrest uit 2022 (gemodificeerd op scandatum).", "rechtsregel": "Een via huwelijkse voorwaarden in het zicht van overlijden gecreeerde bevoordeling binnen 180 dagen voor overlijden wordt via fraus legis en art. 12 SW als erfrechtelijke verkrijging in de erfbelasting betrokken.", "wetsartikelen": ["art. 12 SW 1956"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHAMS:2022:96"}, {"ecli": "ECLI:NL:GHDHA:2021:2071", "instantie": "Gerechtshof Den Haag", "datum": "2021-10-20", "gepubliceerd": "2026-06-09", "onderwerp": "APV — afgezonderd particulier vermogen in stichting toegerekend aan erflater", "samenvatting": "Hoger beroep in de APV-zaak (art. 16 SW / art. 2.14a Wet IB 2001) die uitmondt in HR 1 december 2023 (ECLI:NL:HR:2023:1664). Het vermogen van een stichting met vier verhuurde panden wordt als afgezonderd particulier vermogen aan de erflaatster toegerekend; de stichting is geen SBBI en erflaatster beoogde meer dan bijkomstig een particulier belang. Het afzonderingsbegrip ziet ook op het door de stichting zelf aangekochte pand.", "rechtsregel": "Het begrip 'rechtens dan wel in feite, direct of indirect afzonderen van vermogen' (art. 2.14a Wet IB 2001) omvat alle panden, inclusief het door de stichting zelf verworven pand, gelet op doel en strekking (voorkomen heffingsvacuüm).", "wetsartikelen": ["art. 16 SW 1956", "art. 2.14a Wet IB 2001"], "belang": "middel", "oordeel": "verwijzing", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHDHA:2021:2071"}, {"ecli": "ECLI:NL:GHSHE:2021:2883", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2021-09-17", "gepubliceerd": "2026-02-03", "zaaknummer": "19/00378", "onderwerp": "BOR: bezitseis art. 35d SW na ruziesplitsing waarbij 49%-belang 100% werd", "samenvatting": "De moeder van belanghebbende hield vóór de herstructurering in 2011 middellijk 49% in een concern met de activiteiten 'Horen' en 'Zien'; door een ruziesplitsing verkreeg zij middellijk 100% van de vennootschappen met de activiteit 'Horen', die zij in 2013 aan belanghebbende schonk (belaste verkrijging EUR 1.048.082). De inspecteur paste de BOR slechts toe op 49% van de waarde omdat voor het uitgeruilde 51%-deel niet aan de vijfjaarsbezitseis van artikel 35d, lid 1, letter c, SW zou zijn voldaan. Het hof oordeelt dat beslissend is de situatie op het tijdstip van de verkrijging: nu de vennootschap toen één materiële onderneming dreef en het belang niet meer als gedeeltelijk belang was te identificeren, is niet van belang of de schenker voorheen slechts een gedeeltelijk belang had, zodat de BOR voor 100% geldt (vrijstelling EUR 1.599.733, belaste verkrijging EUR 283.210). Het hof oordeelt voorts dat de aanslag binnen de driejaarstermijn van artikel 11, lid 3, AWR is vastgesteld, uitgaande van de in de aangifte vermelde schenkingsdatum.", "rechtsregel": "Voor de bezitseis van artikel 35d, lid 1, letter c, SW 1956 is beslissend de situatie ten tijde van de verkrijging; is het belang dan niet meer als een gedeeltelijk belang in één objectieve onderneming te identificeren, dan staat een eerdere uitbreiding van het subjectieve belang (hier via een ruziesplitsing) niet aan volledige toepassing van de BOR in de weg.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 35d SW 1956", "art. 3.2 Wet IB 2001", "art. 11 AWR", "art. 2:334cc BW"], "belang": "hoog", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2021:2883"}, {"ecli": "ECLI:NL:HR:2021:1328", "instantie": "Hoge Raad", "datum": "2021-09-17", "gepubliceerd": "2025-03-22", "zaaknummer": "20/01707", "onderwerp": "BOF; verhuur van 1.100 garageboxen geen materiele onderneming", "samenvatting": "De vader schonk op 26 juli 2016 aan elk van zijn twee dochters tien aandelen C in een BV die circa 1.100 garageboxen en 57 bedrijfsruimten verhuurt en waarbij de aandeelhouders en beide dochters 10 tot 30 uur per week in loondienst zijn. In geschil was of die BV een materiele onderneming als bedoeld in art. 3.2 Wet IB 2001 drijft, zoals hoofdstuk IIIA SW 1956 voor de bedrijfsopvolgingsfaciliteit vereist. Het hof oordeelde dat belanghebbende, op wie de bewijslast rust, niet aannemelijk heeft gemaakt dat de werkzaamheden meer omvatten dan bij normaal vermogensbeheer gebruikelijk is - ook al kosten zij veel tijd - en evenmin dat aan de rendement-plus-eis is voldaan, nu het gestelde jaarrendement van 20 procent mede autonome marktontwikkelingen omvat. De Hoge Raad verwerpt het middel op de gronden van het op dezelfde dag gewezen arrest in zaak 20/01706.", "rechtsregel": "Bij de vraag of exploitatie van onroerende zaken een materiele onderneming vormt, moet naar objectieve maatstaven worden getoetst of de arbeid naar aard en omvang meer omvat dan bij normaal vermogensbeheer gebruikelijk is en is gericht op een hoger rendement; de omvang van de tijdsbesteding en een rendement waarin autonome waardeontwikkeling is begrepen zijn daarvoor niet beslissend.", "wetsartikelen": ["hoofdstuk IIIA SW 1956", "art. 3.2 Wet IB 2001"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2021:408", "ECLI:NL:GHARL:2020:3247"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2021:1328"}, {"ecli": "ECLI:NL:HR:2021:1189", "instantie": "Hoge Raad", "datum": "2021-08-06", "gepubliceerd": "2026-08-07", "onderwerp": "Onbeperkte navorderingstermijn erfbelasting buitenlands vermogen (art. 66 SW)", "samenvatting": "De onbeperkte navorderingstermijn van art. 66 lid 4 SW 1956 voor in het buitenland aangehouden vermogen vormt niet zonder meer een ongeoorloofde belemmering van het vrije verkeer van kapitaal (art. 63 VWEU). Heruitgegeven/gemodificeerd op de scandatum; betreft een arrest uit 2021.", "rechtsregel": "De onbeperkte navorderingstermijn van art. 66 lid 4 SW 1956 is niet zonder meer een ongeoorloofde belemmering van het vrije kapitaalverkeer (art. 63 VWEU).", "wetsartikelen": ["art. 66 SW 1956", "art. 63 VWEU", "art. 56 VWEU"], "belang": "hoog", "oordeel": "cassatie", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2021:1189"}, {"ecli": "ECLI:NL:HR:2021:951", "instantie": "Hoge Raad", "datum": "2021-06-18", "gepubliceerd": "2025-06-17", "zaaknummer": "20/01485", "onderwerp": "BOR; projectontwikkeling en verhuur van vastgoed als materiele onderneming", "samenvatting": "Tot de nalatenschap van de in november 2012 overleden erflaatster behoorden belangen van 21,46 tot 25 procent in drie vennootschappen die zich bezighielden met projectontwikkeling en verhuur van onroerende zaken. In geschil was of de BOR van art. 35b SW 1956 op de volledige waarde van die belangen van toepassing is, ook voor zover die aan de verhuurde panden is toe te rekenen. De Hoge Raad laat het oordeel in stand dat projectontwikkeling en verhuur niet een zodanige verwevenheid tonen dat sprake is van een onderneming, en dat de verhuuractiviteiten op zichzelf bezien niet voldoen aan de arbeid-plus- en rendement-plus-toets; het hof ging uit van een juiste vooropstelling omtrent art. 35c, lid 3, SW 1956. Het cassatieberoep slaagt wel voor zover het hof de kwalificatie van een aantal panden door de inspecteur zonder motivering heeft gevolgd, zodat verwijzing volgt.", "rechtsregel": "Vormen projectontwikkelings- en verhuuractiviteiten tezamen niet een objectieve onderneming, dan moet afzonderlijk worden onderzocht of de verhuuractiviteiten op zichzelf bezien een materiele onderneming vormen, waarvoor de arbeid naar aard en omvang meer moet omvatten dan normaal vermogensbeheer en gericht moet zijn op een hoger dan daarbij passend rendement.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 3.2 Wet IB 2001", "art. 81 lid 1 Wet RO"], "belang": "middel", "oordeel": "verwijzing", "parallelzaken": ["ECLI:NL:HR:2021:955"], "gerelateerd": ["ECLI:NL:PHR:2020:1205"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2021:951"}, {"ecli": "ECLI:NL:HR:2021:883", "instantie": "Hoge Raad", "datum": "2021-06-11", "gepubliceerd": "2025-03-22", "zaaknummer": "19/04234", "onderwerp": "Schenkbelasting behoort niet tot verkrijgingsprijs aanmerkelijk belang", "samenvatting": "De vader schonk belanghebbende in 2014 alle aandelen in Holding II met doorschuiving van de verkrijgingsprijs van EUR 4.400 (art. 4.17c en 4.39 Wet IB 2001); belanghebbende voldeed EUR 361.907 schenkbelasting en verzocht bij beschikking ex art. 4.36 Wet IB 2001 de verkrijgingsprijs op EUR 952.657 vast te stellen. In geschil was of de betaalde schenkbelasting behoort tot de ten laste van de verkrijger gekomen kosten in de zin van art. 4.21, lid 1, Wet IB 2001. De Hoge Raad oordeelt van niet: schenkbelasting wordt opgeroepen door een bevoordeling uit vrijgevigheid op grond van in de persoonlijke sfeer gelegen motieven en staat op zichzelf los van de wijze waarop die bevoordeling vorm krijgt, zodat zij geen kostenpost vormt die in onmiddellijk verband staat met de verkrijging van de aandelen. De meer subjectieve inslag die de aanmerkelijkbelangregeling in de loop der jaren kreeg, verandert het kostenbegrip niet en verdraagt zich niet met de verzakelijking van de verkrijgingsprijs op de voet van art. 4.22, lid 1, Wet IB 2001.", "rechtsregel": "Schenkbelasting die is geheven ter zake van de verkrijging van tot een aanmerkelijk belang behorende aandelen vormt geen ten laste van de verkrijger gekomen kostenpost in onmiddellijk verband met die verkrijging en behoort dus niet tot de verkrijgingsprijs van art. 4.21, lid 1, Wet IB 2001.", "wetsartikelen": ["art. 4.21 lid 1 Wet IB 2001", "art. 4.22 lid 1 Wet IB 2001", "art. 4.36 Wet IB 2001", "art. 4.42 lid 3 Wet IB 2001", "art. 4.17c Wet IB 2001", "art. 4.39 Wet IB 2001", "art. 4.41 Wet IB 2001", "art. 3.57 lid 2 Wet IB 2001"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2020:428", "ECLI:NL:RBGEL:2019:3623"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2021:883"}, {"ecli": "ECLI:NL:GHSHE:2021:1363", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2021-05-06", "gepubliceerd": "2021-05-28", "onderwerp": "Vernietiging schenking wegens dwaling; vermindering schenkbelasting", "samenvatting": "Verwijzingszaak na HR 10 januari 2020, ECLI:NL:HR:2020:1. Belanghebbende en zijn oudtante hebben de schenkingsovereenkomst (schenking 2015) vernietigd omdat zij dwaalden over de fiscale gevolgen. Belanghebbende verzocht om vermindering van de aanslag schenkbelasting. Het hof oordeelt dat de inspecteur niet aannemelijk heeft gemaakt dat de vernietiging slechts is voorgewend, en vermindert de aanslag tot nihil. (Uitspraak uit 2021; metadata verscheen opnieuw in de scan.)", "rechtsregel": "Een civielrechtelijk geldige vernietiging van een schenkingsovereenkomst wegens dwaling werkt door voor de schenkbelasting, tenzij de inspecteur aannemelijk maakt dat de vernietiging enkel is voorgewend om belasting te ontgaan.", "wetsartikelen": ["art. 53 SW 1956", "art. 1 SW 1956"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2021:1363"}, {"ecli": "ECLI:NL:PHR:2021:408", "instantie": "Parket bij de Hoge Raad", "datum": "2021-04-19", "gepubliceerd": "2025-03-21", "zaaknummer": "20/01706, 20/01707, 20/01709", "onderwerp": "BOR en geruisloze terugkeer: verhuurd vastgoed geen materiële onderneming", "samenvatting": "Een B.V. verhuurde circa 1.100 garageboxen en 57 bedrijfsruimten met een waarde van € 10.000.000 en voerde daarover zelf vrijwel alle property-werkzaamheden uit; vader, moeder en beide dochters stonden op de loonlijst. De Inspecteur wees zowel het verzoek om geruisloze terugkeer (art. 14c Wet Vpb 1969, overgangstijdstip 1 januari 2015) af als het beroep op de bedrijfsopvolgingsfaciliteit van hoofdstuk IIIA SW 1956 bij de schenking van C-aandelen aan de dochters op 26 juli 2016, omdat de B.V. geen materiële onderneming in de zin van art. 3.2 Wet IB 2001 zou drijven. In geschil is de toepassing van de arbeid-plustoets en de rendement-plustoets. A-G IJzerman acht het door het Hof gehanteerde cumulatieve toetsingskader juist, meent dat veel bestede arbeid bij veel belegd vermogen nog steeds normaal vermogensbeheer kan zijn, en acht juist dat het Hof waardestijgingen door autonome marktontwikkelingen uit het rendement heeft geëlimineerd; de conclusie strekt tot ongegrondverklaring van de cassatieberoepen.", "rechtsregel": "Exploitatie van onroerende zaken vormt slechts een materiële onderneming in de zin van art. 3.2 Wet IB 2001, en daarmee kwalificerend ondernemingsvermogen voor art. 35c SW 1956, indien cumulatief de arbeid naar aard en relatieve omvang meer omvat dan bij normaal vermogensbeheer gebruikelijk is en die arbeid onmiskenbaar strekt tot een bovennormaal rendement, waarbij bij de rendement-plustoets waardestijgingen door autonome marktontwikkelingen moeten worden geëlimineerd.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 14c Wet Vpb 1969", "art. 28 Wet Vpb 1969", "art. 3.2 Wet IB 2001", "art. 3.4 Wet IB 2001", "art. 3.91 Wet IB 2001", "art. 7a Uitvoeringsregeling schenk- en erfbelasting", "art. 8:77 Awb"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBGEL:2018:5135", "ECLI:NL:RBGEL:2018:5136", "ECLI:NL:GHARL:2020:3247", "ECLI:NL:GHARL:2020:3248", "ECLI:NL:GHARL:2020:3249", "ECLI:NL:HR:2021:1321", "ECLI:NL:HR:2021:1328", "ECLI:NL:HR:2021:1333"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2021:408"}, {"ecli": "ECLI:NL:HR:2021:263", "instantie": "Hoge Raad", "datum": "2021-02-19", "gepubliceerd": "2025-08-05", "zaaknummer": "19/04003", "onderwerp": "Art. 10 SW 1956; vordering uit verrekenbeding in huwelijkse voorwaarden", "samenvatting": "De vader overleed in 1998 onder huwelijkse voorwaarden met een deelgenootschap waarbij deling bij helfte alleen op verzoek van een echtgenoot kon worden gevorderd; de moeder deed dat verzoek, waardoor de kinderen een vordering van f 1.770.177 op haar kregen, terwijl aan haar het vruchtgebruik van de nalatenschap was gelegateerd. Na het overlijden van de moeder in 2013 rekende de inspecteur die vordering met toepassing van art. 10, lid 1, SW 1956 als fictieve verkrijging tot haar nalatenschap. De Hoge Raad laat het oordeel van het hof in stand dat het verrekenbeding na het overlijden van de vader niet meer kon worden ingeroepen, zodat de vordering niet krachtens huwelijksvermogensrecht is ontstaan; dat oordeel berust op de aan het hof voorbehouden uitleg van de huwelijkse voorwaarden en is niet onbegrijpelijk. De overige klachten worden met art. 81 Wet RO afgedaan.", "rechtsregel": "Of een uit een verrekenbeding voortvloeiende vordering krachtens huwelijksvermogensrecht is ontstaan - en daarmee buiten art. 10, lid 1, SW 1956 blijft - hangt af van de aan de feitenrechter voorbehouden uitleg van de huwelijkse voorwaarden; is verrekening slechts mogelijk bij leven van beide echtgenoten, dan ontbreekt na overlijden een huwelijksvermogensrechtelijke titel.", "wetsartikelen": ["art. 10 lid 1 SW 1956", "art. 81 lid 1 Wet RO"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHDHA:2019:1949"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2021:263"}, {"ecli": "ECLI:NL:PHR:2020:1205", "instantie": "Parket bij de Hoge Raad", "datum": "2020-12-23", "gepubliceerd": "2025-08-05", "zaaknummer": "20/01485, 20/01486, 20/01487, 20/01488, 20/01489", "onderwerp": "BOR erfbelasting: vastgoedonderneming en etikettering verhuurde panden", "samenvatting": "A-G IJzerman neemt één gezamenlijke conclusie in de vijf samenhangende cassatieberoepen (20/01485 tot en met 20/01489) van de erfgenamen van de op 27 november 2012 overleden erflaatster, die (certificaten van) aandelen in drie vastgoedvennootschappen verkregen (circa 300 objecten, 2.800 verhuurbare eenheden, 42 werknemers). In geschil is of de bedrijfsopvolgingsfaciliteit van art. 35b jo. 35c SW 1956 geldt voor de gehele verkrijging van € 46.925.901 per erfgenaam of slechts voor het aan projectontwikkeling toerekenbare deel, met een voorwaardelijke vrijstelling van € 10.861.619. Volgens de A-G heeft het Hof de ontwikkelings- en de verhuuractiviteiten terecht afzonderlijk aan de arbeid-plus- en de rendement-plustoets getoetst en worden de verhuuractiviteiten niet meegetrokken door de ondernemende ontwikkelingsactiviteiten, nu de daarvoor vereiste verwevenheid tot één onderneming ontbreekt. Het Hof heeft echter ten onrechte niet onderzocht of bepaalde verhuurde panden voldoende band met de wel aanwezige bedrijfsuitoefening hebben om via de vermogensetiketteringsregels als keuzevermogen en dus als ondernemingsvermogen te kwalificeren; de conclusie strekt tot gegrondverklaring van de cassatieberoepen en verwijzing.", "rechtsregel": "Voor de bedrijfsopvolgingsregeling moeten vastgoedontwikkelings- en verhuuractiviteiten in beginsel afzonderlijk op materieel ondernemerschap worden getoetst en trekt een ondernemende ontwikkelingsactiviteit de verhuur alleen mee bij zodanige verwevenheid dat sprake is van één onderneming, maar verhuurde panden die op zichzelf geen onderneming vormen moeten voor de toerekening van art. 35c SW 1956 alsnog als ondernemingsvermogen worden aangemerkt voor zover zij voldoende band met de wel aanwezige bedrijfsuitoefening hebben om als keuzevermogen te worden geëtiketteerd.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 35d SW 1956", "art. 3.2 Wet IB 2001", "art. 3.3 Wet IB 2001", "art. 3.91 Wet IB 2001", "art. 4.17a Wet IB 2001", "art. 2 Wet Vpb 1969", "art. 28 Wet Vpb 1969", "art. 8:77 Awb"], "belang": "hoog", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:RBNHO:2018:5637", "ECLI:NL:GHAMS:2020:1168", "ECLI:NL:HR:2021:951", "ECLI:NL:HR:2021:952", "ECLI:NL:HR:2021:953", "ECLI:NL:HR:2021:954", "ECLI:NL:HR:2021:955"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2020:1205"}, {"ecli": "ECLI:NL:HR:2020:1600", "instantie": "Hoge Raad", "datum": "2020-10-09", "gepubliceerd": "2025-08-05", "zaaknummer": "19/05408", "onderwerp": "Verlengde navorderingstermijn recht van schenking; vrij kapitaalverkeer", "samenvatting": "Op 7 juli 1998 werd op naam van belanghebbende een Zwitserse bankrekening geopend waarop haar vader geld schonk; van de schenking werd geen aangifte gedaan en de vader overleed in 2005. Na een melding in april 2015 legde de inspecteur op 15 september 2015 een navorderingsaanslag in het recht van schenking op met toepassing van art. 66, lid 1, onder 2, SW 1956 - de zaak ziet dus op de SW zoals die tot 2010 luidde (recht van schenking). De Hoge Raad oordeelt dat het niet voor redelijke twijfel vatbaar is dat de voor de inkomsten- en vermogensbelasting ontwikkelde voortvarendheidseis ook geldt bij navordering van recht van schenking met de twaalfjaarstermijn van art. 16, lid 4, AWR, en dat het afwijkende aanvangstijdstip van art. 66 SW 1956 gelijkelijk voor binnenlandse en grensoverschrijdende situaties geldt; nu niet is gesteld dat onvoldoende voortvarend is gehandeld, doet zich geen door art. 63 VWEU verboden belemmering voor en behoeft de standstillbepaling van art. 64 VWEU geen behandeling.", "rechtsregel": "De eis dat bij toepassing van de verlengde navorderingstermijn met redelijke voortvarendheid wordt gehandeld geldt ook bij navordering van schenkbelasting (recht van schenking), terwijl het in art. 66, lid 1, onder 2, SW 1956 bepaalde aanvangstijdstip geen door art. 63 VWEU verboden beperking van het vrije kapitaalverkeer vormt omdat het in binnenlandse en grensoverschrijdende gevallen gelijkelijk geldt.", "wetsartikelen": ["art. 66 lid 1 SW 1956", "art. 16 lid 4 AWR", "art. 63 VWEU", "art. 64 VWEU"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2020:657", "ECLI:NL:GHARL:2019:9676"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2020:1600"}, {"ecli": "ECLI:NL:PHR:2020:842", "instantie": "Parket bij de Hoge Raad", "datum": "2020-09-18", "gepubliceerd": "2026-05-13", "zaaknummer": "19/03671", "onderwerp": "Conclusie A-G: Liechtensteinse Stiftung als APV; tegenbewijs en art. 1 EP", "samenvatting": "De vader van belanghebbende richtte in 2007 een Liechtensteinse Stiftung op waarin aandelen in een B.V., een beleggingsportefeuille en een bankrekening waren ingebracht; na zijn overlijden in 2012 werd het vermogen naar evenredigheid van het erfdeel aan belanghebbende toegerekend (IB/PVV 2011 tot en met 2013). A-G Niessen concludeert dat het vermogen discretionair is en dus als APV kwalificeert, dat de zaak verschilt van HR 10 april 2015, BNB 2015/152 omdat meer dan een begunstigde is aangewezen, en dat het beroep op de tegenbewijsregeling van artikel 2.14a, lid 6, Wet IB 2001 faalt omdat de erfgenamen begunstigden zijn. Ook de beroepen op het vrije verkeer en op artikel 1 EP falen: de regeling is lawful, dient het opheffen van een heffingsvacuum en is niet van redelijke grond ontbloot, terwijl van een individuele en buitensporige last niet is gebleken. De conclusie strekt tot ongegrondverklaring van het cassatieberoep.", "rechtsregel": "Van discretionair afgezonderd vermogen waarop de begunstigde geen juridisch afdwingbaar recht heeft is sprake van een APV, en de tegenbewijsregeling van artikel 2.14a, lid 6, Wet IB 2001 baat een erfgenaam niet zolang hij (mede) als begunstigde is aangewezen.", "wetsartikelen": ["art. 2.14a Wet IB 2001", "art. 5.3 Wet IB 2001", "art. 27e AWR", "art. 1 EP EVRM"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:HR:2021:367"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2020:842"}, {"ecli": "ECLI:NL:GHSHE:2020:2213", "instantie": "Gerechtshof 's-Hertogenbosch", "datum": "2020-07-16", "gepubliceerd": "2026-05-13", "zaaknummer": "19/00128-GHK tot en met 19/00133-GHK (T)", "onderwerp": "Geheimhoudingsbeslissing: successierechtdossier en intern memo als 8:42-stukken", "samenvatting": "In een hoger beroep over navorderingsaanslagen IB/PVV 2004 en 2007-2011 rond een buitenlandse trust verzoekt de inspecteur om geheimhouding van 45 stukken uit het dossier successierecht van de overleden vader en van een intern memo 'Box 2 of box 3?'. De geheimhoudingskamer oordeelt dat ook stukken die bij een ander organisatieonderdeel van de Belastingdienst (het specialistenteam schenk- en erfbelasting) berusten tot de op de zaak betrekking hebbende stukken behoren, nu de aanslagen schenk- en erfbelasting in samenhang met de IB-aanslagen zijn opgelegd. Omdat belanghebbende en zijn zus als enige erfgenamen toestemming hebben gegeven en het memo slechts een algemene inventarisatie bevat die niets prijsgeeft over de controle- of processtrategie, wegen de aangevoerde gewichtige redenen niet aanzienlijk zwaarder dan het belang bij onbeperkte kennisneming; enkel namen van derden en van belastingambtenaren mogen worden geschoond.", "rechtsregel": "Tot de op de zaak betrekking hebbende stukken van artikel 8:42 Awb behoren ook stukken die berusten bij een ander organisatieonderdeel van de Belastingdienst dan dat van de inspecteur, omdat andere onderdelen van de Belastingdienst niet als derde kunnen worden beschouwd.", "wetsartikelen": ["art. 8:42 Awb", "art. 8:29 Awb", "art. 8:31 Awb", "art. 67 AWR"], "belang": "middel", "oordeel": "n.v.t.", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHSHE:2020:2213"}, {"ecli": "ECLI:NL:RBDHA:2020:7103", "instantie": "Rechtbank Den Haag", "datum": "2020-07-15", "gepubliceerd": "2026-06-09", "onderwerp": "APV — toerekening stichtingsvermogen aan erflater (eerste aanleg)", "samenvatting": "Eerste aanleg in dezelfde APV-zaak als HR 2023:1664. De rechtbank oordeelt dat een stichting met vier verhuurde panden geen SBBI is en dat erflaatster vermogen in de stichting heeft afgezonderd, mede gelet op niet-marktconforme verhuur aan familie, privé-borgstelling en behoud van zeggenschap binnen de familie. Het vermogen wordt aan erflaatster toegerekend (art. 2.14a Wet IB 2001 jo. art. 16 SW).", "rechtsregel": "Bij een familiestichting zonder reële doelstellingsactiviteiten, met afzondering van vermogen en behoud van zeggenschap en bevoordeling binnen de familiekring, is sprake van afgezonderd particulier vermogen dat aan de erflater wordt toegerekend.", "wetsartikelen": ["art. 16 SW 1956", "art. 2.14a Wet IB 2001"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2020:7103"}, {"ecli": "ECLI:NL:HR:2020:990", "instantie": "Hoge Raad", "datum": "2020-05-29", "gepubliceerd": "2025-08-05", "zaaknummer": "19/00189", "onderwerp": "BOR; bezitseis versus ondernemingseis bij binnen vijf jaar gekochte deelnemingen", "samenvatting": "Belanghebbende verkreeg op 15 januari 2014 alle aandelen in Beheer BV geschonken; Beheer BV had de aandelen in twee werkmaatschappijen pas in 2009 respectievelijk 2010 verworven. In geschil was of de BOR van hoofdstuk IIIA SW 1956 ook geldt voor de waarde die aan die deelnemingen is toe te rekenen. De Hoge Raad onderscheidt de bezitseis van art. 35d, lid 1, letter c, SW 1956 - die in dit geval slechts vereist dat de vader vijf jaar aanmerkelijkbelanghouder van Beheer BV was, waaraan was voldaan - van de eis dat de vennootschap de onderneming vijf jaar dreef. Omdat art. 35c, lid 5, SW 1956 de indirect gehouden ondernemingen aan Beheer BV toerekent en zij daardoor meerdere objectieve ondernemingen drijft, moet de vijfjaarseis per afzonderlijke toegerekende onderneming worden getoetst; het beroep op het gelijkheidsbeginsel in verband met art. 9 Uitvoeringsregeling SW 1956 faalt, omdat koop niet gelijk is aan geruisloze doorschuiving.", "rechtsregel": "Bij toepassing van de bedrijfsopvolgingsregeling moet de vijfjaarstermijn worden getoetst per afzonderlijke (op grond van art. 35c, lid 5, SW 1956 toegerekende) objectieve onderneming van de vennootschap, terwijl de bezitseis uitsluitend ziet op het aanmerkelijk belang van de schenker in de vennootschap zelf.", "wetsartikelen": ["art. 35c SW 1956", "art. 35d SW 1956", "art. 3.2 Wet IB 2001", "art. 9 Uitvoeringsregeling Successiewet 1956", "art. 1 Grondwet"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBZWB:2018:6631", "ECLI:NL:PHR:2019:825"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2020:990"}, {"ecli": "ECLI:NL:HR:2020:993", "instantie": "Hoge Raad", "datum": "2020-05-29", "gepubliceerd": "2025-08-05", "zaaknummer": "19/01695", "onderwerp": "BOR; bezitstermijn bij binnen vijf jaar gekochte activa en passiva", "samenvatting": "Belanghebbende kreeg in 2014 certificaten van aandelen (20 procent) in een Holding geschonken; een kleindochtervennootschap had in 2013 alle activa en passiva van een andere BV gekocht. De rechtbank achtte de BOR van hoofdstuk IIIA SW 1956 niet van toepassing op de aan die aangekochte onderneming toe te rekenen waarde, omdat voor dat deel niet aan de bezitstermijn van art. 35d, lid 1, letter a, SW 1956 was voldaan. De Hoge Raad casseert op de gronden van het op dezelfde dag gewezen arrest in zaak 19/01680 (ECLI:NL:HR:2020:867): niet elke verwerving van (een zelfstandig deel van) een onderneming doet voor dat deel een nieuwe bezitstermijn lopen. De aanslag schenkbelasting wordt overeenkomstig de aangifte verminderd; de overige middelen worden met art. 81 Wet RO afgedaan.", "rechtsregel": "De verwerving van activa en passiva die opgaan in een reeds gedreven onderneming leidt niet zonder meer ertoe dat voor dat verworven gedeelte een nieuwe bezitstermijn in de zin van art. 35d SW 1956 gaat lopen.", "wetsartikelen": ["art. 35d SW 1956", "art. 3.2 Wet IB 2001", "art. 81 lid 1 Wet RO"], "belang": "middel", "oordeel": "gegrond", "parallelzaken": ["ECLI:NL:HR:2020:867"], "gerelateerd": ["ECLI:NL:PHR:2019:827"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2020:993"}, {"ecli": "ECLI:NL:PHR:2020:428", "instantie": "Parket bij de Hoge Raad", "datum": "2020-04-28", "gepubliceerd": "2025-08-05", "zaaknummer": "19/04234", "onderwerp": "Betaalde schenkbelasting geen onderdeel van verkrijgingsprijs aanmerkelijk belang", "samenvatting": "Belanghebbende verkreeg van zijn vader de aandelen in [K] B.V. door schenking en voldeed daarover € 361.907 schenkbelasting. De Inspecteur stelde de verkrijgingsprijs van het aanmerkelijk belang bij beschikking van 30 mei 2018 vast op € 590.750 en weigerde de schenkbelasting mee te tellen; belanghebbende bepleitte € 952.657 en stelde sprongcassatie in tegen de ongegrondverklaring door Rechtbank Gelderland. A-G Niessen concludeert dat de wetsgeschiedenis van de herziening van het aanmerkelijkbelangregime per 1 januari 1997 en van de Wet IB 2001 geen aanleiding geeft de onder het Besluit IB 1941 gewezen jurisprudentie (HR 29 april 1959, BNB 1959/222) als achterhaald te beschouwen. Dragend is dat de schenkbelasting aanknoopt bij de vermogensvermeerdering van de begiftigde als persoon en niet drukt op de grondslag waarnaar de wetgever winst uit aanmerkelijk belang wil heffen; de conclusie strekt tot ongegrondverklaring van het cassatieberoep.", "rechtsregel": "Schenkbelasting die is voldaan ter zake van de verkrijging om niet van aanmerkelijkbelangaandelen behoort niet tot de ten laste van de verkrijger gekomen kosten en dus niet tot de verkrijgingsprijs in de zin van art. 4.21 Wet IB 2001, omdat die heffing is betrokken op de bevoordeling van de verkrijger en niet drukt op de grondslag van de aanmerkelijkbelangheffing.", "wetsartikelen": ["art. 1 SW 1956", "art. 4.21 Wet IB 2001", "art. 4.41 Wet IB 2001", "art. 3.55 Wet IB 2001", "art. 3.56 Wet IB 2001", "art. 4 Wet BRV"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBGEL:2019:3623", "ECLI:NL:HR:2021:883"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2020:428"}, {"ecli": "ECLI:NL:HR:2020:582", "instantie": "Hoge Raad", "datum": "2020-04-03", "gepubliceerd": "2025-08-05", "zaaknummer": "19/00818", "onderwerp": "Verrekening schenkbelasting met erfbelasting bij 180-dagenschenking", "samenvatting": "De moeder schonk belanghebbende in 2015 tweemaal, EUR 5.000 op 31 maart en EUR 80.000 op 23 december, waarover in totaal EUR 7.972 schenkbelasting werd betaald; door haar overlijden op 20 april 2016 werd de schenking van EUR 80.000 op grond van art. 12 SW 1956 geacht krachtens erfrecht te zijn verkregen, bij een totale erfrechtelijke verkrijging van EUR 105.358 en EUR 8.521 erfbelasting. In geschil was tot welk bedrag de schenkbelasting in mindering komt op de erfbelasting: het hof kwam op EUR 7.503 (80.000/85.000 x 7.972), de staatssecretaris bepleitte EUR 6.470 (80.000/105.358 x 8.521) en belanghebbende het volledige bedrag van EUR 7.972. De Hoge Raad verklaart het principale beroep gegrond en het incidentele ongegrond op de gronden van het gelijktijdig gewezen arrest in zaak 19/00817 (ECLI:NL:HR:2020:476) en bevestigt de uitspraak van de rechtbank.", "rechtsregel": "Bij een schenking die op grond van art. 12 SW 1956 wordt geacht krachtens erfrecht te zijn verkregen, wordt de op de erfbelasting in mindering te brengen schenkbelasting bepaald naar de verhouding waarin het fictief geerfde schenkingsbedrag staat tot de totale erfrechtelijke verkrijging, toegepast op de over die verkrijging verschuldigde erfbelasting; de dragende motivering staat in ECLI:NL:HR:2020:476.", "wetsartikelen": ["art. 7 SW 1956", "art. 12 SW 1956", "art. 27 SW 1956"], "belang": "middel", "oordeel": "gegrond", "parallelzaken": ["ECLI:NL:HR:2020:583"], "gerelateerd": ["ECLI:NL:PHR:2019:1357", "ECLI:NL:HR:2020:476"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2020:582"}, {"ecli": "ECLI:NL:HR:2020:476", "instantie": "Hoge Raad", "datum": "2020-04-03", "gepubliceerd": "2025-08-05", "zaaknummer": "19/00817", "onderwerp": "Verrekening schenkbelasting met erfbelasting bij schenking binnen 180 dagen", "samenvatting": "De moeder van belanghebbende schonk in 2015 tweemaal (EUR 5.000 op 31 maart en EUR 80.000 op 23 december) en overleed op 20 april 2016; over beide schenkingen was EUR 7.972 schenkbelasting voldaan. Omdat de schenking van EUR 80.000 binnen 180 dagen voor het overlijden viel, werd zij op grond van art. 12 SW 1956 tot de erfrechtelijke verkrijging van EUR 105.358 gerekend. In geschil was tot welk bedrag de betaalde schenkbelasting op de erfbelasting in mindering komt. De Hoge Raad oordeelt dat art. 27 SW 1956 meebrengt dat de over de samengetelde schenkingen geheven schenkbelasting naar evenredigheid (omslagmethode) over beide delen wordt toegerekend, maar dat de vermindering op grond van art. 12, lid 2, jo. art. 7, lid 2, SW 1956 niet hoger kan zijn dan de over de fictieve verkrijging verschuldigde erfbelasting; door het verschil in vrijstellingen (EUR 20.148 in 2016 tegenover EUR 5.277 in 2015) bedraagt de vermindering EUR 6.470.", "rechtsregel": "Schenkbelasting over in een kalenderjaar samengetelde schenkingen wordt op grond van art. 27 SW 1956 naar evenredigheid aan de afzonderlijke schenkingen toegerekend, en de vermindering van erfbelasting op grond van art. 12, lid 2, jo. art. 7, lid 2, SW 1956 bedraagt ten hoogste de over de fictieve verkrijging verschuldigde erfbelasting.", "wetsartikelen": ["art. 7 lid 2 SW 1956", "art. 12 SW 1956", "art. 27 SW 1956"], "belang": "hoog", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:PHR:2019:1357", "ECLI:NL:GHARL:2019:21"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2020:476"}, {"ecli": "ECLI:NL:HR:2020:1", "instantie": "Hoge Raad", "datum": "2020-01-10", "gepubliceerd": "2025-08-05", "zaaknummer": "19/01199", "onderwerp": "Art. 53 SW: vernietiging schenkingsovereenkomst wegens dwaling", "samenvatting": "Belanghebbende kreeg in december 2015 bij notariele akte EUR 100.000 van zijn oudtante geschonken in verband met de aankoop van haar woning, waarna conform de aangifte een aanslag schenkbelasting werd opgelegd; bij akte van rectificatie van 4 november 2016 werd de schenking wegens dwaling omgezet in een lening, die eind 2017 werd kwijtgescholden. Het hof achtte weliswaar wederzijdse dwaling aannemelijk, maar oordeelde dat belanghebbende niet had bewezen dat hij in vermoedelijke zekerheid verkeerde over het schenkbelastingtarief. De Hoge Raad oordeelt dat vernietiging het belastbare feit niet ongedaan maakt en dus niet tot vernietiging van de aanslag kan leiden, maar wel tot vermindering op grond van art. 53, lid 1, SW 1956, tenzij de inspecteur aannemelijk maakt dat het beroep op vernietiging slechts is voorgewend; voor toepassing van art. 6:228, lid 2, BW is naast die maatstaf geen plaats. Verwijzing volgt zodat belanghebbende alsnog om vermindering kan verzoeken.", "rechtsregel": "Vernietiging van een schenkingsovereenkomst wegens wederzijdse dwaling leidt tot vermindering van de aanslag schenkbelasting op grond van art. 53, lid 1, SW 1956, tenzij de inspecteur aannemelijk maakt dat het beroep op vernietiging slechts is voorgewend; de vernietiging tast het belastbare feit en daarmee de aanslag zelf niet aan.", "wetsartikelen": ["art. 53 SW 1956", "art. 6:228 BW", "art. 81 Wet RO"], "belang": "hoog", "oordeel": "verwijzing", "gerelateerd": ["ECLI:NL:GHARL:2019:414"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2020:1"}, {"ecli": "ECLI:NL:HR:2019:1873", "instantie": "Hoge Raad", "datum": "2019-11-29", "gepubliceerd": "2025-08-05", "zaaknummer": "19/00667", "onderwerp": "Schenking op grondslag van nietige wijziging huwelijkse voorwaarden", "samenvatting": "Belanghebbende, in 1979 gehuwd onder uitsluiting van iedere gemeenschap met een wettelijk deelgenootschap, sloot in 2009 met haar echtgenoot een onderhandse overeenkomst waarin hij haar de helft van de echtelijke woning en EUR 10.000.000 aan te verrekenen overgespaarde inkomsten schuldig erkende; de civiele rechter oordeelde die regeling in 2016 nietig wegens het ontbreken van de vormvereisten voor wijziging van huwelijkse voorwaarden. De inspecteur legde niettemin een aanslag schenkbelasting op naar een verkrijging van EUR 9.998.000 in 2010 en het hof achtte een schenking in de zin van art. 1, lid 1, ten tweede, SW 1956 aanwezig. De Hoge Raad vernietigt en verwijst: op de grondslag van een nietige overeenkomst kan geen schenking worden aangenomen, zodat het oordeel dat die overeenkomst toch een vordering deed ontstaan zonder nadere motivering onbegrijpelijk is.", "rechtsregel": "Van een schenking in de zin van art. 1, lid 1, ten tweede, en lid 7, SW 1956 is slechts sprake indien de begiftigde in het betrokken jaar daadwerkelijk aanspraak op de prestatie heeft gekregen; op de grondslag van een nietige overeenkomst kan die aanspraak, en daarmee een schenking, niet worden aangenomen.", "wetsartikelen": ["art. 1 SW 1956", "art. 1:132 BW", "art. 81 Wet RO"], "belang": "hoog", "oordeel": "verwijzing", "gerelateerd": ["ECLI:NL:GHARL:2019:2", "ECLI:NL:HR:2017:3256"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2019:1873"}, {"ecli": "ECLI:NL:HR:2019:1838", "instantie": "Hoge Raad", "datum": "2019-11-22", "gepubliceerd": "2025-08-05", "zaaknummer": "18/03218", "onderwerp": "Art. 10 SW: ik-oma-making als legaat of als lastbevoordeling", "samenvatting": "Bij het overlijden van de grootmoeder in 1996 verkregen de kleinkinderen krachtens haar testament uit 1994 ieder een onvoorwaardelijke, niet opeisbare vordering op hun moeder (de dochter), die in 1997 bij notariele akte per kleinkind EUR 104.423 schuldig erkende; de vordering werd opeisbaar door het overlijden van de dochter in 2014. In geschil was of de verkrijging viel onder art. 10, lid 1, SW 1956 (standpunt inspecteur, EUR 104.423) dan wel onder art. 10, lid 9, SW 1956 (EUR 10.479). De Hoge Raad oordeelt dat de nalatenschap is opengevallen onder het tot 1 januari 2003 geldende erfrecht, dat de duidelijke bewoordingen 'ik legateer een onvoorwaardelijke vordering' geen uitleg behoeven en dus een legaat inhouden, en dat de dochter geen rechtshandeling in de zin van art. 10, lid 1, SW 1956 heeft verricht; de aanslagen worden verminderd tot een verkrijging van EUR 10.479 per kleinkind.", "rechtsregel": "Wanneer de bewoordingen van een uiterste wilsbeschikking duidelijk een legaat van een vordering inhouden, komt men aan uitleg niet toe en verkrijgt de legataris die vordering krachtens erfrecht, zodat art. 10, lid 1, SW 1956 bij gebreke van een rechtshandeling van de bezwaarde toepassing mist en de fictie van art. 10, lid 9, SW 1956 geldt.", "wetsartikelen": ["art. 10 SW 1956", "art. 4:46 BW"], "belang": "hoog", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:PHR:2019:544"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2019:1838"}, {"ecli": "ECLI:NL:PHR:2019:825", "instantie": "Parket bij de Hoge Raad", "datum": "2019-08-21", "gepubliceerd": "2025-08-05", "zaaknummer": "19/00189", "onderwerp": "BOR: bezitstermijn vijf jaren per afzonderlijk indirect aanmerkelijk belang", "samenvatting": "Belanghebbende verkreeg op 15 januari 2014 door schenking van zijn ouders alle aandelen in Beheer BV (waarde € 472.000); de schenkers hielden die aandelen langer dan vijf jaren, maar Beheer BV hield de indirecte belangen in [E] BV (€ 67.759, op 24 november 2009 gekocht van een van de schenkers) en [F] BV (€ 236.796, verworven op 27 januari 2010) korter dan vijf jaren. In geschil is of de bezitstermijn van art. 35d, lid 1, onderdeel c, SW 1956 ook afzonderlijk geldt voor ieder indirect gehouden aanmerkelijk belang waarin een zelfstandige materiële onderneming wordt gedreven. A-G IJzerman meent dat de via de consolidatiebepaling van art. 35c, lid 5, SW 1956 aan de houdster toegerekende ondernemingen elk afzonderlijk aan de vijfjaarstermijn moeten voldoen, en dat een verhanging krachtens koop van een direct gehouden aanmerkelijk belang naar de eigen holding een nieuwe bezitstermijn doet aanvangen; art. 9 URSE ziet uitsluitend op wijzigingen van de juridische huls en fiscaal geruisloze doorschuifsituaties en biedt daarvoor geen tegemoetkoming. De conclusie strekt tot ongegrondverklaring van het cassatieberoep.", "rechtsregel": "Voor de bedrijfsopvolgingsregeling moet de bezitstermijn van vijf jaren van art. 35d, lid 1, onderdeel c, SW 1956 afzonderlijk worden getoetst voor elke objectieve onderneming die via een indirect gehouden aanmerkelijk belang aan de houdstermaatschappij wordt toegerekend, en bij verwerving van zo'n belang krachtens koop gaat een nieuwe bezitstermijn lopen.", "wetsartikelen": ["art. 33 SW 1956", "art. 35b SW 1956", "art. 35c SW 1956", "art. 35d SW 1956", "art. 35e SW 1956", "art. 7 Uitvoeringsregeling schenk- en erfbelasting", "art. 9 Uitvoeringsregeling schenk- en erfbelasting", "art. 3.2 Wet IB 2001", "afdeling 4.3 Wet IB 2001", "art. 28 AWR", "art. 1 Grondwet"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBZWB:2018:6631", "ECLI:NL:PHR:2019:841"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2019:825"}, {"ecli": "ECLI:NL:PHR:2019:827", "instantie": "Parket bij de Hoge Raad", "datum": "2019-08-21", "gepubliceerd": "2025-08-05", "zaaknummer": "19/01680, 19/01695", "onderwerp": "BOR: nieuwe bezitstermijn voor via indirect ab aangekochte onderneming", "samenvatting": "Op 19 december 2014 schonk de vader aan zoon en dochter ieder 20% van de (certificaten van) aandelen in de Holding, met een totale waarde van € 4.642.763; de indirect gehouden [F] B.V. had op 18 september 2013 de activa en passiva van [G] B.V. gekocht, op dat moment een zelfstandige materiële onderneming, met een aan elk van belanghebbenden toerekenbare waarde van € 43.532. In geschil is of voor die binnen vijf jaren voor de schenking aangekochte onderneming een afzonderlijke bezitstermijn is gaan lopen. A-G IJzerman meent dat de Rechtbank ten onrechte heeft getoetst aan art. 35d, lid 1, onderdeel a, SW 1956 in plaats van aan onderdeel c, maar dat dit belanghebbenden niet baat: de aangekochte zelfstandige onderneming kan niet opgaan in de reeds langer bestaande, meer omvattende onderneming van de Holding, zodat op holdingniveau een eigen vijfjaarstermijn geldt waaraan niet is voldaan, terwijl het ontbreken van misbruik niet afdoet aan de wettekst, die geen afzonderlijke misbruikvoorwaarde stelt. De conclusie strekt tot ongegrondverklaring van de cassatieberoepen van beide verkrijgers.", "rechtsregel": "Wordt binnen de bezitsperiode via een indirect gehouden aanmerkelijk belang een zelfstandige onderneming (activa en passiva) aangekocht, dan gaat voor dat deel op het niveau van de houdstermaatschappij een nieuwe bezitstermijn van art. 35d, lid 1, onderdeel c, SW 1956 lopen, ongeacht of van misbruik sprake is.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 35d SW 1956", "art. 35e SW 1956", "art. 7 Uitvoeringsregeling schenk- en erfbelasting", "art. 9 Uitvoeringsregeling schenk- en erfbelasting", "art. 3.2 Wet IB 2001", "art. 3.4 Wet IB 2001", "art. 3.5 Wet IB 2001", "afdeling 4.3 Wet IB 2001", "art. 28 AWR"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2019:827"}, {"ecli": "ECLI:NL:RBGEL:2019:2909", "instantie": "Rechtbank Gelderland", "datum": "2019-07-02", "gepubliceerd": "2026-05-13", "zaaknummer": "AWB - 17 _ 3896 ev", "onderwerp": "Waardering renteloze voorwaardelijke schenkingsvordering in box 3", "samenvatting": "Eiser ontving in 1997 en 2001 van zijn in Belgie wonende moeder schenkingen van EUR 2.042.010 en EUR 907.561 onder de opschortende voorwaarde van haar overlijden; de vorderingen zijn renteloos. In geschil is of bij de waardering in box 3 rekening moet worden gehouden met de kans dat eiser eerder overlijdt dan zijn moeder, en of voor 2012 kon worden nagevorderd. De rechtbank oordeelt dat eiser te kwader trouw was doordat hij de tot en met 2010 voor circa EUR 1.500.000 aangegeven vorderingen in de aangifte 2012 zonder gewijzigde omstandigheden niet meer vermeldde, zodat navordering mogelijk is, en dat de renteloosheid meebrengt dat moeder een genotsrecht heeft, zodat waardering plaatsvindt op de voet van art. 5.22 We
