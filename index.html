it uitvoerbaarheidsoogpunt voor de hand de belasting over de nadere verkrijging evenredig te bepalen, uitgaande van de tarieven en vrijstellingen ten tijde van die nadere verkrijging.", "rechtsregel": "De oorspronkelijke verkrijging en de nadere verkrijging door het vrijvallen van fideicommissair vermogen vormen voor de heffing samen een belaste verkrijging uit een nalatenschap, waarbij de belasting over de nadere verkrijging wordt gesteld op het evenredige deel van de belasting die ten tijde van die nadere verkrijging over de totale verkrijging verschuldigd zou zijn.", "wetsartikelen": ["art. 1 SW 1956", "art. 5 SW 1956", "art. 21 SW 1956", "art. 24 SW 1956"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2013:BY8780"}, {"ecli": "ECLI:NL:PHR:2013:BZ8588", "instantie": "Parket bij de Hoge Raad", "datum": "2013-03-27", "gepubliceerd": "2025-08-01", "zaaknummer": "12/02319", "onderwerp": "Waardering unieke Chinese pot voor recht van successie; latere veilingprijs", "samenvatting": "Tot de nalatenschap van de op 20 november 2003 overleden erflater behoorde een Chinese pot, in de aangifte voor het recht van successie begrepen in een post van € 12.500 en in november 2004 door een deskundige op € 15.000 getaxeerd; op 12 juli 2005 bracht de pot op een veiling in Londen circa € 23 miljoen op, waarna de Inspecteur in 2008 navorderingsaanslagen van € 1.535.196 per erfgenaam oplegde. De zaak speelt onder de SW zoals die tot 2010 luidde, toen nog recht van successie. Rechtbank en Hof namen de gerealiseerde veilingprijs tot uitgangspunt en stelden de waarde in het economische verkeer op de overlijdensdatum, gelet op een marktstijging van ten minste 100%, schattenderwijs op € 10.000.000. A-G IJzerman meent dat de waarde op grond van art. 21, lid 1, SW 1956 wordt vastgesteld aan de hand van alle feiten en omstandigheden die daarop een licht kunnen werpen, ook indien deze pas na het waarderingstijdstip bekend zijn geworden, en dat de feitenrechter op grond van de vrije bewijsleer niet gehouden is overgelegde deskundigenrapporten te volgen, ook niet bij unieke kunstvoorwerpen; de conclusie strekt tot ongegrondverklaring van het cassatieberoep.", "rechtsregel": "De waarde in het economische verkeer als bedoeld in art. 21, lid 1, SW 1956 wordt bepaald met inachtneming van alle feiten en omstandigheden die licht werpen op de waarde op het verkrijgingstijdstip, ook wanneer die pas nadien bekend zijn geworden zoals een ruim daarna gerealiseerde veilingopbrengst, en de feitenrechter is bij die waardering niet gebonden aan overgelegde deskundigenrapporten; deze waarderingsmaatstaf geldt onder het huidige recht onverminderd.", "wetsartikelen": ["art. 21 SW 1956", "art. 8:77 Awb"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:HR:2013:31"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2013:BZ8588"}, {"ecli": "ECLI:NL:HR:2013:BX9120", "instantie": "Hoge Raad", "datum": "2013-02-01", "gepubliceerd": "2025-08-01", "zaaknummer": "11/05648", "onderwerp": "Art. 24, lid 4, SW; samenloop overdrachtsbelasting en schenkingsrecht", "samenvatting": "De moeder verkocht en leverde in 2009 een door haar gebouwde woning voor EUR 400.000 aan belanghebbende en schold EUR 95.000 van de koopsom kwijt bij wijze van schenking; wegens art. 13 Wbr was de grondslag voor de overdrachtsbelasting verminderd met de bouwkosten van EUR 284.908. In geschil was met welk bedrag aan overdrachtsbelasting het recht van schenking op grond van art. 24, lid 4, SW (tekst 2009, onder de SW zoals die tot 2010 luidde) moest worden verminderd. De Hoge Raad oordeelt dat noch tekst noch strekking van die bepaling ruimte biedt om omzetbelasting of op grond van art. 13 Wbr niet-geheven overdrachtsbelasting als 'betaalde overdrachtsbelasting' aan te merken, en dat het na de vermindering resterende saldo aan overdrachtsbelasting zich naar zijn aard niet leent voor toerekening bij voorrang aan het geschonken deel. Toerekening naar evenredigheid, zoals het Hof toepaste, is juist; het beroep is ongegrond.", "rechtsregel": "De op grond van art. 24, lid 4, SW 1956 in mindering te brengen overdrachtsbelasting omvat niet de op de voet van art. 13 Wbr niet-geheven belasting, en de daadwerkelijk betaalde overdrachtsbelasting moet naar evenredigheid worden toegerekend aan het wel en het niet aan schenkingsrecht onderworpen deel van de verkrijging.", "wetsartikelen": ["art. 24 SW 1956", "art. 13 Wet BRV", "art. 81 Wet RO"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2013:BX9120", "ECLI:NL:GHARN:2011:BU8359"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2013:BX9120"}, {"ecli": "ECLI:NL:PHR:2013:BX9120", "instantie": "Parket bij de Hoge Raad", "datum": "2013-02-01", "gepubliceerd": "2025-08-01", "zaaknummer": "11/05648", "onderwerp": "Samenloop overdrachtsbelasting en recht van schenking; art. 24 lid 4 SW (oud)", "samenvatting": "Belanghebbende kocht in 2009 van haar moeder een nieuwgebouwde woning voor € 400.000; door de vermindering van art. 13 Wet BRV werd slechts over € 115.100 overdrachtsbelasting geheven (€ 6.906), waarna de moeder € 95.000 van de koopsom kwijtschold, belast met € 8.349 recht van schenking. In geschil is welk deel van de betaalde overdrachtsbelasting op grond van art. 24, lid 4, SW 1956 (tekst 2009, dus onder de SW zoals die tot 2010 luidde) in mindering komt: pro rata, zoals Rechtbank en Hof oordeelden (€ 1.562), of door de schenking primair toe te rekenen aan het met overdrachtsbelasting belaste deel. A-G IJzerman acht de pro-rata-benadering het meest redelijk omdat de overdrachtsbelasting op de gehele koopsom drukt, en verwerpt de stelling dat de anticumulatiebepaling ook economische dubbele heffing met omzetbelasting zou voorkomen; zij ziet uitsluitend op samenloop met overdrachtsbelasting. De conclusie strekt tot ongegrondverklaring van het cassatieberoep.", "rechtsregel": "Is over slechts een deel van de tegenprestatie overdrachtsbelasting geheven, dan wordt die overdrachtsbelasting voor de vermindering wegens samenloop pro rata toegerekend aan het met schenkingsrecht belaste deel van de verkrijging, en strekt de anticumulatiebepaling zich niet uit tot eerder geheven omzetbelasting; de regel geldt onder het huidige art. 24, lid 2, SW 1956 onverkort voort.", "wetsartikelen": ["art. 24 SW 1956", "art. 33 SW 1956", "art. 9 Wet BRV", "art. 13 Wet BRV", "art. 15 Wet BRV", "art. 11 Wet AB"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHARN:2011:BU8359", "ECLI:NL:HR:2013:BX9120"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2013:BX9120"}, {"ecli": "ECLI:NL:GHAMS:2013:BY9886", "instantie": "Gerechtshof Amsterdam", "datum": "2013-01-11", "gepubliceerd": "2026-02-18", "zaaknummer": "11/00897", "onderwerp": "Vrijstelling art. 33 lid 1 onder 8 SW bij onvermogen schulden te betalen", "samenvatting": "Vader cedeerde een vordering van EUR 50.075 op zijn zoon aan zijn dochter en schonk de zoon vervolgens datzelfde bedrag onder de voorwaarde de schuld aan de zus af te lossen; over 2009 is een aanslag schenkingsrecht van EUR 2.958 opgelegd. In geschil is of de vrijstelling van artikel 33, lid 1, onder 8, SW 1956 van toepassing is. Het Hof leidt uit de wetsgeschiedenis af dat de vrijstelling restrictief moet worden toegepast en slechts ziet op een benarde financiele positie waarin dringend hulp geboden is; dat de schuld opeisbaar was en werd opgeeist volstaat niet, nu niet aannemelijk is dat belanghebbende failliet dreigde te gaan of andere verstrekkende financiele problemen had. Het hoger beroep is ongegrond; het Hof bevestigt de rechtbank met verbetering van gronden, omdat de rechtbank ten onrechte betekenis toekende aan ingetrokken resoluties.", "rechtsregel": "De vrijstelling van artikel 33, lid 1, onder 8, SW 1956 vereist dat de begiftigde ten tijde van de schenking in een benarde financiele positie verkeert en dringend behoefte heeft aan middelen om schuldeisers te voldoen; enkel een opeisbare en opgeeiste schuld die hij niet kan betalen is onvoldoende.", "wetsartikelen": ["art. 33 SW 1956"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBHAA:2011:BU9888"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHAMS:2013:BY9886"}, {"ecli": "ECLI:NL:PHR:2012:BY8780", "instantie": "Parket bij de Hoge Raad", "datum": "2012-12-14", "gepubliceerd": "2026-02-18", "zaaknummer": "12/01402", "onderwerp": "Successierecht over nadere verkrijging door fideicommissaire verwachters", "samenvatting": "Bij het overlijden van erflater in 1999 verkregen de vijf kinderen ieder rechtstreeks een achtste (EUR 143.393 per kind, belast met f 37.905), terwijl de tweede echtgenote drie achtsten verkreeg onder fideicommis de residuo met de kinderen als verwachters; na haar overlijden in 2007 verkreeg ieder kind nog EUR 123.472 en berekende de Inspecteur de aanslag pro rata (123.472/266.864 x EUR 38.577 = EUR 17.848). A-G IJzerman meent dat sprake is van twee verkrijgingen, maar dat dit niet uitmaakt omdat het successierecht op grond van art. 1, lid 1, onder 1°, en art. 5 SW 1956 wordt geheven over al wat in totaal krachtens erfrecht van de erflater wordt verkregen, zodat de primaire en de nadere verkrijging voor de heffingsgrondslag worden samengevoegd en vrijstellingen en laagste tariefschijven slechts eenmaal kunnen worden benut. Van de denkbare methoden (verrekening, vrijstelling aan de voet, evenredige vrijstelling) acht hij de evenredigheidsmethode juist, mede omdat art. 45, lid 3, SW 1956 materieel bijheffing over de primaire verkrijging mogelijk maakt; de conclusie strekt tot ongegrondverklaring.", "rechtsregel": "De nadere verkrijging door een fideicommissaire verwachter wordt voor de heffingsgrondslag samengevoegd met diens eerdere verkrijging van dezelfde erflater, zodat vrijstellingen en de laagste tariefschijven slechts eenmaal gelden en het over de nadere verkrijging verschuldigde recht naar evenredigheid wordt berekend naar tarief en vrijstellingen van het jaar waarin de opschortende voorwaarde in vervulling gaat.", "wetsartikelen": ["art. 1 lid 1 onder 1° SW 1956", "art. 5 SW 1956", "art. 21 lid 7 SW 1956", "art. 24 SW 1956", "art. 32 SW 1956", "art. 35a SW 1956", "art. 45 lid 3 SW 1956", "art. 53 SW 1956", "art. 83 lid 6 SW 1956"], "belang": "hoog", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2012:BY8780"}, {"ecli": "ECLI:NL:RBLEE:2012:BZ8250", "instantie": "Rechtbank Leeuwarden", "datum": "2012-12-13", "gepubliceerd": "2026-02-18", "zaaknummer": "AWB 12/781", "onderwerp": "Waardering woning; recht van bewoning levensgezellin geen huur (art. 21 lid 8 SW)", "samenvatting": "Erflater overleed in 2010; zijn levensgezellin mocht op grond van een in 2002 met erflater en de kinderen gesloten overeenkomst nog één jaar na het overlijden kosteloos in de woning (WOZ-waarde € 394.000) blijven wonen. Partijen gingen er gezamenlijk van uit dat sprake was van huur, zodat de leegwaarderatio van art. 10a UB SW zou gelden (eiser bepleitte 60%, de inspecteur 79% ofwel € 311.260). De rechtbank wijkt van die gezamenlijke rechtsopvatting af: het gaat om gebruik van woonruimte dat naar zijn aard van korte duur is (art. 7:232, tweede lid, BW), zodat afdeling 5 van titel 4 van Boek 7 BW en daarmee art. 21, achtste lid, SW 1956 niet van toepassing zijn; wegens het verbod van reformatio in peius blijft de waarde niettemin op € 311.260 staan en is het beroep ongegrond.", "rechtsregel": "Het waarderingsvoorschrift van art. 21, achtste lid, SW 1956 geldt alleen bij verhuur waarop afdeling 5 van titel 4 van Boek 7 BW van toepassing is; een naar zijn aard kortdurend recht van bewoning valt daar niet onder, en de rechter is niet gebonden aan een onjuiste gezamenlijke rechtsopvatting van partijen.", "wetsartikelen": ["art. 21 SW 1956", "art. 18 SW 1956", "art. 6 Uitvoeringsbesluit SW 1956", "art. 10 Uitvoeringsbesluit SW 1956", "art. 10a Uitvoeringsbesluit SW 1956", "art. 7:232 BW"], "belang": "middel", "oordeel": "ongegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBLEE:2012:BZ8250"}, {"ecli": "ECLI:NL:PHR:2012:BY8161", "instantie": "Parket bij de Hoge Raad", "datum": "2012-12-11", "gepubliceerd": "2026-02-18", "zaaknummer": "12/02197", "onderwerp": "Giftenaftrek IB bij door erfgenamen voortgezette periodieke schenking aan ANBI", "samenvatting": "Erflaatster schonk in 2001 bij notariele akte 'vrij van recht' aan een ANBI een recht op periodieke uitkeringen van jaarlijks 16.000 certificaten van aandelen gedurende vijf jaren; na haar overlijden in 2002 voldeden de erfgenamen de termijnen over 2002 en 2003 pas in 2003 en droegen zij tevens het schenkingsrecht van EUR 182.417. In geschil is of belanghebbende naar rato van zijn erfdeel giftenaftrek toekomt en op welk moment en naar welke waarde. A-G Niessen concludeert dat art. 6.38 Wet IB 2001 geen eisen stelt aan de persoon die de uitkeringen doet, zodat de rechtsopvolger de aftrek kan toepassen en het uitblijven van betaling in een jaar het karakter van de periodieke gift niet aantast, dat de termijnen niet 'rentedragend' zijn geworden zodat aftrek in 2003 (terbeschikkingstelling) plaatsvindt naar de waarde op dat moment, maar dat de betaling van het schenkingsrecht als boedelschuld geen andere gift oplevert.", "rechtsregel": "Art. 6.38 Wet IB 2001 stelt geen eisen aan de persoon die de termijnen voldoet, zodat een erfgenaam die een door de erflater bij notariele akte aangegane periodieke schenkingsverplichting nakomt giftenaftrek geniet op het tijdstip van terbeschikkingstelling en naar de waarde op dat tijdstip.", "wetsartikelen": ["art. 6.32 Wet IB 2001", "art. 6.33 Wet IB 2001", "art. 6.34 Wet IB 2001", "art. 6.35 Wet IB 2001", "art. 6.38 Wet IB 2001", "art. 6.40 Wet IB 2001", "art. 3.144 Wet IB 2001", "art. 7:175 BW", "art. 7:186 BW"], "belang": "middel", "oordeel": "gegrond", "parallelzaken": ["ECLI:NL:PHR:2012:BY8117"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2012:BY8161"}, {"ecli": "ECLI:NL:RBHAA:2012:BY9896", "instantie": "Rechtbank Haarlem", "datum": "2012-12-07", "gepubliceerd": "2026-02-18", "zaaknummer": "12/1977, 12/1978, 12/1979, 12/1980", "onderwerp": "BOR successierecht; bungalowpark als onderneming; vertrouwensbeginsel", "samenvatting": "Tot de nalatenschap van de op 29 januari 2009 overleden erflater behoorden 9.000 certificaten (50%) in een BV die een bungalowpark exploiteert; in geschil zijn de waardering van de certificaten en de toepassing van de bedrijfsopvolgingsfaciliteiten van hoofdstuk IIIA SW 1956. De rechtbank honoreert het beroep op het vertrouwensbeginsel: aan de brief van de inspecteur van 1 april 2010, die uitdrukkelijk zag op de aangifte recht van successie en berustte op het overgelegde taxatierapport, mochten de erfgenamen het vertrouwen ontlenen dat een aankooprisico van 30% in aftrek kwam, ook al miskende die brief mogelijk de liquidatiewaarderegel van art. 21 lid 4 SW 1956. Omdat de BV met eigen personeel alle beheer-, verhuur-, renovatie- en onderhoudswerkzaamheden verricht en de bezettingsgraad hoog is, gaan de werkzaamheden normaal vermogensbeheer te boven en drijft de BV een materiele onderneming, zodat de beroepen gegrond zijn en de belaste verkrijging per erfgenaam op EUR 71.907 wordt gesteld.", "rechtsregel": "Van een materiele onderneming in de zin van de bedrijfsopvolgingsfaciliteiten van de Successiewet 1956 is bij verhuur van onroerende zaken sprake indien de daadwerkelijk verrichte arbeid naar aard en omvang normaal vermogensbeheer te boven gaat; aan een concrete, op de aangifte voor het recht van successie betrekking hebbende standpuntbepaling van de bevoegde inspecteur mag de verkrijger vertrouwen ontlenen tenzij de onjuistheid daarvan voor hem kenbaar was.", "wetsartikelen": ["art. 20 SW 1956", "art. 21 lid 4 SW 1956", "art. 35b SW 1956", "art. 35c SW 1956", "art. 53b SW 1956"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBHAA:2012:BY9896"}, {"ecli": "ECLI:NL:HR:2012:BX7158", "instantie": "Hoge Raad", "datum": "2012-09-14", "gepubliceerd": "2025-08-01", "zaaknummer": "11/02188", "onderwerp": "Art. 52 SW; termijn voor navordering na vermindering aanslag mede-erfgenaam", "samenvatting": "Na het overlijden van erflaatster in 2001 waren in 2003 aan de echtgenoot en de zoon aanslagen in het recht van successie opgelegd (SW zoals die tot 2010 luidde); nadat de aanslag van de zoon op 2 januari 2009 naar aanleiding van diens bezwaar over de testamentuitleg was verminderd, is de echtgenoot op 17 februari 2009 een navorderingsaanslag op de voet van art. 52 SW opgelegd. In geschil was of die navorderingsaanslag tijdig was. De Hoge Raad oordeelt dat een navorderingsaanslag ex art. 52 SW naar de tekst van die bepaling pas kan worden opgelegd nadat de aanslag van de andere verkrijger is verminderd, en dat voor de tijdigheid daarom aansluiting moet worden gezocht bij de termijn van art. 66, lid 2, SW; daarbij weegt mee dat de heffing zich richt naar hetgeen uiteindelijk krachtens de erfrechtelijke overgang wordt verkregen. Het cassatieberoep wordt ongegrond verklaard.", "rechtsregel": "Voor de vraag of een navorderingsaanslag op de voet van art. 52 SW 1956 tijdig is opgelegd, geldt de termijn van art. 66, lid 2, SW 1956, die pas gaat lopen nadat de aan de andere verkrijger opgelegde aanslag is verminderd.", "wetsartikelen": ["art. 52 SW 1956", "art. 66 SW 1956", "art. 81 Wet RO"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHSHE:2011:BQ9030"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2012:BX7158"}, {"ecli": "ECLI:NL:HR:2012:BU5651", "instantie": "Hoge Raad", "datum": "2012-01-20", "gepubliceerd": "2025-08-01", "zaaknummer": "10/04493", "onderwerp": "Art. 10 SW; ik-opatestament; is de in gemeenschap gehuwde echtgenote partij?", "samenvatting": "Ter uitvoering van een last uit het testament van de in 1998 overleden grootvader had de in algehele gemeenschap van goederen gehuwde vader aan zijn drie kinderen bedragen schuldig erkend, opeisbaar na het overlijden van hemzelf en zijn echtgenote; na het overlijden van de moeder in 2006 paste de inspecteur art. 10 SW 1956 toe op hun verkrijging (aanslagen in het recht van successie, onder de SW zoals die tot 2010 luidde). Het Hof achtte de moeder mede partij bij de schuldigerkenning omdat de wettelijke gemeenschap van goederen dat zou meebrengen. De Hoge Raad casseert: de enkele omstandigheid dat echtgenoten in algehele gemeenschap zijn gehuwd maakt de ene echtgenoot nog niet (mede) partij bij een door de andere echtgenoot aangegane rechtshandeling, en het Hof heeft geen bijkomende feiten vastgesteld die een rechtsgrond daarvoor opleveren. Voor een van het civiele recht afwijkende, autonome uitleg van het begrip 'partij' in art. 10 SW is geen plaats, ook niet ter voorkoming van een heffingslek; de Hoge Raad doet de zaak zelf af en bevestigt de uitspraak van de Rechtbank.", "rechtsregel": "Het begrip 'partij bij de rechtshandeling' in art. 10 SW 1956 moet naar civielrechtelijke maatstaven worden uitgelegd; het huwelijk in algehele gemeenschap van goederen maakt een echtgenoot niet reeds daardoor partij bij een door de andere echtgenoot verrichte rechtshandeling.", "wetsartikelen": ["art. 10 SW 1956"], "belang": "hoog", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:PHR:2012:BU5651", "ECLI:NL:GHAMS:2010:BN6205"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2012:BU5651"}, {"ecli": "ECLI:NL:PHR:2012:BU5651", "instantie": "Parket bij de Hoge Raad", "datum": "2012-01-20", "gepubliceerd": "2025-07-31", "zaaknummer": "10/04493", "onderwerp": "Art. 10 SW 1956 bij ik-opa-testament: is de echtgenote partij?", "samenvatting": "Grootvader benoemde bij testament zijn in gemeenschap van goederen gehuwde zoon tot enig erfgenaam onder de last aan diens drie kinderen renteloze ik-opa-vorderingen van in totaal EUR 500.280 schuldig te erkennen; die vorderingen werden opeisbaar bij het overlijden van de langstlevende echtgenote in 2006, waarna de inspecteur art. 10 SW 1956 (tekst 2006) toepaste. In geschil is het partij-vereiste: de echtgenote was zelf geen partij bij de aanvaarding van de nalatenschap en de uitvoering van de last door haar man. De A-G concludeert dat in algehele gemeenschap gehuwde echtgenoten niet over en weer mede namens elkaar optreden bij eigen partijhandelingen en dat de bestuursregeling van Boek 1 BW daaraan niet afdoet, zodat extensieve uitleg van deze wetsfictie te ver gaat, temeer nu de wetgever per 1 januari 2010 zelf de echtgenoot in de wettekst heeft opgenomen.", "rechtsregel": "Onder art. 10, lid 1, SW 1956 zoals dat tot 2010 luidde is de in gemeenschap van goederen gehuwde echtgenoot van degene die de rechtshandeling verrichtte niet zelf partij bij die rechtshandeling; een wetsfictie leent zich niet voor extensieve uitleg.", "wetsartikelen": ["art. 10 SW 1956", "art. 21 SW 1956", "art. 1:85 BW", "art. 1:90 BW", "art. 1:94 BW", "art. 1:95 BW", "art. 1:97 BW"], "belang": "middel", "oordeel": "gegrond", "achterhaald": true, "achterhaald_reden": "Art. 10, lid 1, SW 1956 is per 1 januari 2010 uitgebreid tot rechtshandelingen waarbij de erflater of diens echtgenoot partij was, en art. 10, lid 9, SW 1956 vangt de ik-opa-vordering thans afzonderlijk op.", "gerelateerd": ["ECLI:NL:GHAMS:2010:BN6205", "ECLI:NL:HR:2012:BU5651"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2012:BU5651"}, {"ecli": "ECLI:NL:HR:2011:BU8267", "instantie": "Hoge Raad", "datum": "2011-12-16", "gepubliceerd": "2025-07-31", "zaaknummer": "11/01332", "onderwerp": "Voortzettingswaarde onderneming; DCF-methode, schulden en restwaarde quotum", "samenvatting": "Belanghebbende verkreeg in 2002 een derde van een nalatenschap waartoe de helft van een agrarische onderneming behoorde; in geschil was de voortzettingswaarde voor de conserverende aanslag in het recht van successie onder de SW zoals die tot 2010 luidde (art. 35c SW, tekst 2002). Het Hof aanvaardde een DCF-berekening met werkelijke cijfers waarin de ondernemingsschulden wel, maar de restwaarde van het bietenquotum na vijftien jaar niet was meegenomen. De Hoge Raad laat de DCF-methode als zodanig en het meetellen van de aflossingsverplichting van de ondernemingsschulden in stand, maar oordeelt dat ook de liquidatieopbrengst van de aangewende activa, waaronder het productiequotum, als laatste kasstroom moet worden aangemerkt; dat de waarde van het quotum al in de eerdere kasstromen doorwerkt staat daaraan niet in de weg. Verwijzing volgt om te onderzoeken of ten tijde van de verkrijging een zodanige kans op restwaarde bestond dat daarmee rekening moet worden gehouden.", "rechtsregel": "Wordt de voortzettingswaarde van een onderneming bepaald volgens een discounted cash flow-methode, dan moeten zowel de verplichting tot aflossing van de ondernemingsschulden als de liquidatieopbrengst (restwaarde) van de in de onderneming aangewende activa, waaronder een productiequotum, als kasstroom in aanmerking worden genomen.", "wetsartikelen": ["art. 35c SW 1956"], "belang": "middel", "oordeel": "verwijzing", "gerelateerd": ["ECLI:NL:GHSHE:2011:BQ2864", "ECLI:NL:HR:2010:BM5123"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2011:BU8267"}, {"ecli": "ECLI:NL:HR:2011:BQ6141", "instantie": "Hoge Raad", "datum": "2011-11-25", "gepubliceerd": "2025-07-31", "zaaknummer": "10/03773", "onderwerp": "ANBI-status van een stichting die nog geen feitelijke handelingen kan verrichten; gerechtvaardigde verwachting", "samenvatting": "Zaak onder de SW zoals die tot 2010 luidde (recht van successie, overlijden 2004; art. 24 lid 4 SW oud). Erflater benoemde de door hem en zijn echtgenote opgerichte stichting met een charitatieve doelstelling tot enig erfgenaam en legateerde aan de langstlevende het vruchtgebruik van de nalatenschap, met een ongeclausuleerde bevoegdheid tot vervreemding en vertering. Bij de verdeling verkreeg de stichting een renteloze, pas bij het einde van het vruchtgebruik opeisbare vordering van EUR 5.303.923. Het Hof oordeelde dat een rechtspersoon die statutair het algemeen nut beoogt maar krachtens de uitdrukkelijke wil van de oprichters niet conform dat doel zal handelen tot de langstlevende is overleden, tot dat moment geen ANBI kan zijn. De Hoge Raad casseert: die maatstaf is te algemeen. Kan de instelling op het moment van de verkrijging nog geen feitelijke handelingen verrichten, dan moet worden beoordeeld of op dat moment de verwachting gerechtvaardigd is dat daadwerkelijk overeenkomstig de statutaire doelstelling zal worden gehandeld, waarbij alle omstandigheden van het geval een rol kunnen spelen en ook feiten van na de verkrijging licht kunnen werpen op die verwachting. Verwijzing naar Hof Amsterdam. De maatstaf is ook onder het huidige ANBI-regime (art. 5b AWR en art. 32 en 33 SW) van belang.", "rechtsregel": "Kan een instelling met een algemeen nut beogende statutaire doelstelling op het moment van de verkrijging nog geen feitelijke handelingen verrichten, dan is beslissend of op dat moment de gerechtvaardigde verwachting bestaat dat daadwerkelijk overeenkomstig die doelstelling zal worden gehandeld; alle omstandigheden van het geval tellen mee en ook feiten van na de verkrijging kunnen daarop licht werpen.", "wetsartikelen": ["art. 24 lid 4 SW 1956 (tekst 2004)", "art. 32 lid 1 onder 3 SW 1956"], "belang": "hoog", "oordeel": "verwijzing", "gerelateerd": ["ECLI:NL:PHR:2011:BQ6141", "ECLI:NL:GHSGR:2010:BN2741", "ECLI:NL:HR:2011:BU8690"], "vindplaatsen": ["BNB 2012/54 m.nt. J.C. van Straaten", "FED 2012/4 m.nt. J.W. Zwemmer", "V-N 2011/31.26", "NTFR 2011/2845 m.nt. Bom"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2011:BQ6141"}, {"ecli": "ECLI:NL:PHR:2011:BQ6141", "instantie": "Parket bij de Hoge Raad", "datum": "2011-11-25", "gepubliceerd": "2025-03-22", "zaaknummer": "10/03773", "onderwerp": "ANBI-status stichting die haar activiteiten nog niet kan verrichten", "samenvatting": "Onder de SW zoals die tot 2010 luidde was in geschil of een in 2000 opgerichte steunstichting met een charitatief-medische doelstelling ten tijde van de erfrechtelijke verkrijging in 2004 een algemeen nut beogende instelling was in de zin van art. 24, lid 4, SW 1956, zodat het tarief van 11% gold; de stichting had door de verdeling slechts een renteloze, tot het overlijden van de vruchtgebruikster niet opeisbare vordering van EUR 5.303.923 en zou blijkens statuten en testament pas na dat overlijden uitkeringen gaan doen. Het hof oordeelde dat een rechtspersoon die krachtens de uitdrukkelijke wil van de oprichters tot dat moment niet conform haar doel handelt, geen ANBI is. De A-G acht dat oordeel onjuist: onder verwijzing naar HR BNB 1973/36 maakt het niet uit of het uitstel berust op een bestuursbesluit dan wel op testament en statuten, en van feitelijke onmogelijkheid de doelstelling te realiseren is hier geen sprake.", "rechtsregel": "Dat een instelling met een algemeen nuttige statutaire doelstelling haar doelactiviteiten gedurende een reeks van jaren nog niet verricht, staat niet aan de ANBI-status in de weg, tenzij zij feitelijk in de onmogelijkheid verkeert die doelstelling ooit te realiseren.", "wetsartikelen": ["art. 24 SW 1956"], "belang": "hoog", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:GHSGR:2010:BN2741", "ECLI:NL:HR:2011:BQ6141"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2011:BQ6141"}, {"ecli": "ECLI:NL:HR:2011:BP8932", "instantie": "Hoge Raad", "datum": "2011-05-13", "gepubliceerd": "2025-07-31", "zaaknummer": "10/01808", "onderwerp": "Legitimaris is schuldeiser en geen erfgenaam; geen verrekening van tot 2001 bijgeschreven rente op onderbedelingsvordering", "samenvatting": "Formeel-erfrechtelijke zaak in de inkomstenbelasting (aanslag IB/PVV 2005) zonder materiële toepassing van de Successiewet; opgenomen omdat de erfrechtelijke kwalificatie beslissend is. Belanghebbende had uit de ouderlijke boedelverdeling in de nalatenschap van zijn in 1971 overleden vader een onderbedelingsvordering op zijn moeder met 7 percent enkelvoudige, jaarlijks bij te schrijven rente. Bij het overlijden van de moeder in 2005 was zijn zuster enig erfgenaam en was aan belanghebbende zijn legitieme portie toegekend; de vordering werd inclusief EUR 23.136 tot 1 januari 2001 bijgeschreven rente uitbetaald. De Hoge Raad oordeelt dat de legitimaris onder het sinds 1 januari 2003 geldende erfrecht bij het opeisen van zijn legitieme portie niet de positie van erfgenaam maar die van schuldeiser inneemt, zodat verrekening met een corresponderende schuld in de zin van art. I, onderdeel AK, lid 4, letter b, Invoeringswet Wet IB 2001 niet mogelijk was en die bepaling toepassing mist. Dat het nieuwe erfrecht en het testament buiten zijn invloedssfeer lagen, rechtvaardigt geen van de bewoordingen afwijkende uitleg. Bepalend is het moment waarop de rente na het overlijden van de schuldenaar wordt genoten. Beroep in cassatie ongegrond.", "rechtsregel": "Een legitimaris die onder het sinds 2003 geldende erfrecht zijn legitieme portie opeist, is schuldeiser en geen erfgenaam, zodat de verrekeningsvoorwaarde van art. I, onderdeel AK, lid 4, letter b, Invoeringswet Wet IB 2001 niet kan worden vervuld en die overgangsbepaling toepassing mist; voor de toepassing daarvan is het genietingsmoment van de rente na het overlijden van de schuldenaar bepalend.", "wetsartikelen": ["art. I onderdeel AK lid 4 letter b Invoeringswet Wet IB 2001", "art. I onderdeel Aka lid 3 Invoeringswet Wet IB 2001", "art. 4:63 BW", "art. 81 RO"], "belang": "laag", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2011:BP8932", "ECLI:NL:GHSGR:2010:BM2741"], "vindplaatsen": ["BNB 2011/240 m.nt. M.J. Hoogeveen", "V-N 2011/26.9", "NTFR 2011/1195 m.nt. J.P. Boer"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2011:BP8932"}, {"ecli": "ECLI:NL:PHR:2011:BP8932", "instantie": "Parket bij de Hoge Raad", "datum": "2011-05-13", "gepubliceerd": "2025-07-31", "zaaknummer": "10/01808", "onderwerp": "Overgangsrecht rente op onderbedelingsvordering; legitimaris geen erfgenaam", "samenvatting": "Belanghebbende verkreeg bij het overlijden van zijn vader in 1971 uit een ouderlijke boedelverdeling een onderbedelingsvordering met 7% bijgeschreven rente; bij het overlijden van zijn moeder in 2005 was hij door een kort tevoren gemaakt testament geen erfgenaam meer maar legitimaris, en ontving hij van zijn zuster onder meer EUR 23.136 aan tot 1 januari 2001 gerijpte rente. In geschil is of de uitzondering van onderdeel AKa, lid 3, jo. AK, lid 4, letter b, Invoeringswet Wet IB 2001 geldt, die vereist dat de rente pas na het overlijden van de schuldenaar door verrekening in aanmerking wordt genomen. De A-G concludeert dat de duidelijke tekst van deze overgangsbepaling strikt moet worden uitgelegd en dat de legitimaris onder het per 2003 geldende erfrecht slechts schuldeiser is, zodat verrekening ontbreekt en de rente tot het inkomen uit werk en woning behoort. Materiele toepassing van de SW 1956 is in deze zaak niet aan de orde.", "rechtsregel": "De uitzondering van onderdeel AK, lid 4, Invoeringswet Wet IB 2001 moet strikt worden uitgelegd en wordt getoetst op het moment waarop de rente wordt genoten; een legitimaris die geen erfgenaam is, voldoet niet aan het verrekeningsvereiste.", "wetsartikelen": ["art. I, onderdeel AK, Invoeringswet Wet IB 2001", "art. I, onderdeel AKa, Invoeringswet Wet IB 2001", "art. 20b Wet IB 1964", "art. 4:79 BW", "art. 4:80 BW", "art. 8:77 Awb"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHSGR:2010:BM2741", "ECLI:NL:HR:2011:BP8932"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2011:BP8932"}, {"ecli": "ECLI:NL:HR:2011:BN8711", "instantie": "Hoge Raad", "datum": "2011-04-08", "gepubliceerd": "2025-07-31", "zaaknummer": "09/04850", "onderwerp": "Dubbele heffing Nederland-België over aandelen in onroerendezaaklichaam; geen strijd met vrij kapitaalverkeer", "samenvatting": "Zaak onder de SW zoals die tot 2010 luidde (recht van successie, overlijden 2002). Erflater had de Nederlandse nationaliteit, woonde bij overlijden in België en was minder dan tien jaar daarvoor uit Nederland vertrokken, zodat Nederland op grond van de woonplaatsfictie van art. 3 lid 1 SW hief; België hief op grond van de laatste woonplaats. Tot de nalatenschap behoorden aandelen in een Nederlands onroerendezaaklichaam in de zin van art. 4 Wet BRV, die op grond van art. 5 lid 5 SW (oud) met onroerende zaken werden gelijkgesteld, waardoor art. 48 Bvdb 2001 geen vermindering ter voorkoming van dubbele belasting gaf. De Hoge Raad oordeelt dat van directe of indirecte discriminatie geen sprake is omdat de Nederlandse belastingdruk gelijk is aan die in een zuiver binnenlandse situatie; de dubbele heffing vloeit enkel voort uit de parallelle uitoefening van heffingsbevoegdheid door twee lidstaten. Nu het gemeenschapsrecht voor het successierecht geen verdelingscriteria of harmonisatie kent, is Nederland niet verplicht zijn stelsel aan te passen (vgl. HvJ EU Block, C-67/08). Beroep in cassatie ongegrond. Het recht van overgang van art. 5 SW is per 1 januari 2010 afgeschaft.", "rechtsregel": "Dubbele heffing van successierecht die uitsluitend voortvloeit uit de parallelle uitoefening van heffingsbevoegdheid door twee lidstaten - Nederland op grond van de woonplaatsfictie, België op grond van de laatste woonplaats - levert geen verboden (in)directe discriminatie op en verplicht Nederland niet tot aanpassing van zijn stelsel; de destijds via art. 5 lid 5 SW werkende uitsluiting van de Bvdb-vermindering is met de afschaffing van het recht van overgang per 2010 achterhaald.", "wetsartikelen": ["art. 3 lid 1 SW 1956", "art. 5 lid 5 SW 1956 (tekst tot 2010)", "art. 48 lid 1 Bvdb 2001", "art. 4 Wet BRV", "art. 56 EG-Verdrag (thans art. 63 VWEU)"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Het recht van overgang van art. 5 SW, waarop de uitsluiting van de vermindering in art. 48 Bvdb 2001 was geënt, is per 1 januari 2010 afgeschaft; de EU-rechtelijke kern (parallelle heffing is geen verboden discriminatie) en de woonplaatsfictie van art. 3 lid 1 SW gelden nog wel.", "gerelateerd": ["ECLI:NL:PHR:2011:BN8711", "ECLI:NL:RBBRE:2009:BK1994"], "vindplaatsen": ["BNB 2011/168 m.nt. G.T.K. Meussen", "V-N 2011/20.22", "NTFR 2011/1156 m.nt. M. de L. Monteiro"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2011:BN8711"}, {"ecli": "ECLI:NL:PHR:2011:BN8711", "instantie": "Parket bij de Hoge Raad", "datum": "2011-04-08", "gepubliceerd": "2025-07-31", "zaaknummer": "09/04850", "onderwerp": "Geen voorkoming dubbele belasting bij aandelen in onroerendezaaklichaam", "samenvatting": "Erflater met de Nederlandse nationaliteit overleed in 2002 in Belgie binnen tien jaar na emigratie, zodat de woonplaatsfictie van art. 3, lid 1, SW 1956 gold; tot de nalatenschap behoorden aandelen in een Nederlands onroerendezaaklichaam (art. 4 Wet BRV) die Nederland op grond van art. 5, lid 5, SW 1956 als onroerende zaken aanmerkte en Belgie als roerend, waardoor beide staten hieven zonder voorkoming te verlenen (Nederlandse aanslag na bezwaar EUR 174.896). Onder de SW zoals die tot 2010 luidde sluit de laatste volzin van art. 48, lid 1, Bvdb 2001 vermindering uit voor bezittingen waarover zonder de woonplaatsfictie recht van overgang verschuldigd zou zijn. De A-G concludeert dat dit een dispariteit is die slechts door unificatie of een verdrag kan worden opgeheven en dus geen schending van art. 56 EG-Verdrag oplevert.", "rechtsregel": "Dubbele heffing die uitsluitend voortvloeit uit een kwalificatieverschil tussen lidstaten - hier over aandelen in een onroerendezaaklichaam als situsgoed - is een dispariteit en geen door het vrije kapitaalverkeer verboden beperking, nu de eenzijdige voorkomingsregeling het spiegelbeeld van de eigen buitenlandse belastingplicht mag zijn.", "wetsartikelen": ["art. 1 SW 1956", "art. 3 SW 1956", "art. 5 SW 1956", "art. 36 SW 1956", "art. 47 Bvdb 2001", "art. 48 Bvdb 2001", "art. 4 Wet BRV", "art. 56 EG-Verdrag"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Het recht van overgang en art. 5, lid 5, SW 1956 zijn per 1 januari 2010 vervallen en de laatste volzin van art. 48, lid 1, Bvdb 2001 is dienovereenkomstig geschrapt, zodat in dit soort gevallen thans wel verrekening wordt verleend.", "gerelateerd": ["ECLI:NL:RBBRE:2009:BK1994", "ECLI:NL:HR:2011:BN8711"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2011:BN8711"}, {"ecli": "ECLI:NL:GHARN:2011:BP5771", "instantie": "Gerechtshof Arnhem", "datum": "2011-02-15", "gepubliceerd": "2026-02-18", "zaaknummer": "08-00535", "onderwerp": "Successierecht: art. 10 SW bij schuldigerkenning; nietige schenkingen", "samenvatting": "Erflaatster erkende tussen 1994 en 2001 in totaal f 534.070 (€ 242.350) schuldig aan haar dochter, eenmaal bij notariële akte (1994) en verder bij onderhandse akten, telkens tegen een bij leven niet-opeisbare rente. Het Hof oordeelt dat de bij onderhandse akte gedane schenkingen niet bij leven zijn uitgevoerd en daarom op grond van artikel 7:177 BW zijn vervallen, zodat die bedragen niet als schuld op de verkrijging in mindering komen; het eerder geheven schenkingsrecht is niettemin terecht geheven omdat artikel 1, lid 2, SW 1956 (oude tekst) ook bij uitvoering van een nietige schenking heffing voorschreef, en registratie en heffing wekken geen in rechte te beschermen vertrouwen. Voor de notariële schenking uit 1994 acht het Hof, gelet op de geloofwaardige verklaring ter zitting en de overgelegde bankafschriften, aannemelijk dat erflaatster tot 2005 daadwerkelijk rente heeft betaald, zodat artikel 10 SW 1956 toepassing mist. De aanslag wordt verminderd tot € 11.716 na verrekening van het over de onderhandse schenkingen geheven schenkingsrecht van € 11.545.", "rechtsregel": "Een schuldig erkend en geschonken bedrag valt buiten het bereik van artikel 10 SW 1956 indien de erflater over dat bedrag daadwerkelijk jaarlijks rente aan de schuldeiser heeft betaald, ook als het feitelijk vergoede percentage lager is dan het overeengekomen percentage.", "wetsartikelen": ["art. 10 SW 1956", "art. 1, lid 2, SW 1956", "art. 7:177 BW", "art. 81 Overgangswet nieuw BW"], "belang": "middel", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHARN:2011:BP5771"}, {"ecli": "ECLI:NL:RBLEE:2011:BP1955", "instantie": "Rechtbank Leeuwarden", "datum": "2011-01-20", "gepubliceerd": "2026-02-18", "zaaknummer": "AWB 10/1532", "onderwerp": "Art. 24 lid 3 SW naast conserverende aanslag BOR; geschonken bedrijfswoning", "samenvatting": "Ouders schonken bij akte van 26 september 2007 de bedrijfswoning aan hun zoon bij de bedrijfsoverdracht; op de verkrijging is de vrijstelling van art. 15, eerste lid, letter d, WBR toegepast. De inspecteur stelde de belastbare verkrijging vast op € 927.014 en legde naast een conserverende aanslag (te conserveren waarde € 931.426, belasting € 188.788) een gewone aanslag recht van schenking op van € 10.800, zijnde 6% van de waarde van de bedrijfswoning van € 180.000, met een beroep op art. 24, derde lid, SW als zelfstandige heffingsbepaling. De rechtbank oordeelt dat art. 31a SW meebrengt dat de verschuldigde belasting geheel aan de te conserveren waarde wordt toegerekend, zodat bij gewone aanslag over een grondslag van nihil wordt geheven; art. 24, derde lid, SW bewerkstelligt slechts een minimumbedrag aan belasting en levert geen zelfstandig heffingsrecht op, mede omdat het standpunt van de inspecteur bij herziening op de voet van art. 53b SW tot dubbele heffing zou kunnen leiden zonder wettelijke verminderingsregeling. Beroep gegrond; de gewone aanslag wordt verminderd tot nihil.", "rechtsregel": "Art. 24, derde lid, SW 1956 vormt geen zelfstandige heffingsbepaling maar slechts een minimumnorm voor de over onroerende zaken verschuldigde schenkbelasting, zodat over een verkrijging die geheel bestaat uit te conserveren waarde als bedoeld in art. 35c SW 1956 op grond van art. 31a SW 1956 bij gewone aanslag geen belasting kan worden geheven.", "wetsartikelen": ["art. 24 SW 1956", "art. 31a SW 1956", "art. 33 SW 1956", "art. 35b SW 1956", "art. 35c SW 1956", "art. 37 SW 1956", "art. 53b SW 1956", "art. 15 Wet BRV 1970", "art. 7:175 BW", "art. 7:15 Awb"], "belang": "hoog", "oordeel": "gegrond", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBLEE:2011:BP1955"}, {"ecli": "ECLI:NL:HR:2010:BO0407", "instantie": "Hoge Raad", "datum": "2010-10-15", "gepubliceerd": "2025-07-31", "zaaknummer": "09/03561", "onderwerp": "Tariefgroepindeling kleinkind van ongehuwde partner van de erflater; geen discriminatie", "samenvatting": "Zaak onder de SW zoals die tot 2010 luidde (recht van successie, tekst 2003). Belanghebbende is de kleindochter van de man met wie erflaatster meer dan vijf jaar ongehuwd had samengewoond; zij is geen bloed- of aanverwant van erflaatster en werd daarom in tariefgroep III ingedeeld. De Hoge Raad oordeelt dat algemene beschouwingen over doel en strekking van de wet en over maatschappelijke opvattingen onvoldoende grondslag bieden voor een uitleg die zozeer van de wettekst afwijkt; onder 'afstammelingen' vallen overeenkomstig het spraakgebruik slechts bloedverwanten in de rechte neergaande lijn. Het beroep op het discriminatieverbod faalt: de wetgever mocht binnen zijn ruime beoordelingsvrijheid een op verwantschap gebaseerde tariefstructuur hanteren, en de uitzondering van art. 24 lid 2 SW (oud) voor samenwonenden mocht hij beperken tot de onderlinge verhouding van de samenwonenden zelf, mede gelet op het daarin besloten verzorgingselement. Dat de wetgever met ingang van 2010 in de SW is overgegaan op een stelsel waarin belanghebbende wel als aanverwant zou zijn aangemerkt, maakt dit niet anders. Beroep in cassatie ongegrond.", "rechtsregel": "De op verwantschap gebaseerde tariefgroepindeling van art. 24 SW (oud) en de beperking van de uitzondering voor samenwonenden tot hun onderlinge verhouding vallen binnen de ruime beoordelingsvrijheid van de wetgever en leveren geen verboden discriminatie op; het begrip afstammelingen omvat slechts bloedverwanten in de rechte neergaande lijn. De Hoge Raad tekent zelf aan dat de SW per 2010 is overgegaan op een stelsel waarin de verkrijger wel als aanverwant zou gelden.", "wetsartikelen": ["art. 24 SW 1956 (tekst 2003)", "art. 19 SW 1956 (tekst 2003)", "art. 1:3 lid 2 BW", "art. 14 EVRM", "art. 26 IVBPR"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "De Hoge Raad stelt zelf vast dat de SW met ingang van 2010 is overgegaan op een stelsel waarin de verkrijger als aanverwant van de erflaatster zou zijn aangemerkt, zodat de bestreden tariefgroepindeling onder het huidige partner- en verwantschapsbegrip (art. 1a en 19 SW) niet meer speelt.", "gerelateerd": ["ECLI:NL:GHARN:2009:BJ6898"], "vindplaatsen": ["BNB 2011/273 m.nt. R.H. Happé", "V-N 2010/53.29", "NTFR 2010/2825 m.nt. Bom"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2010:BO0407"}, {"ecli": "ECLI:NL:HR:2010:BL0193", "instantie": "Hoge Raad", "datum": "2010-07-09", "gepubliceerd": "2025-07-31", "zaaknummer": "08/05311", "onderwerp": "Bedrijfsopvolgingsfaciliteit niet van toepassing op pensioen- en stamrecht-BV; materieel ondernemingsbegrip", "samenvatting": "Zaak onder de SW zoals die tot 2010 luidde (recht van successie, overlijden 2004). Belanghebbende erfde aandelen in een beheer-BV waarvan de bezittingen onder meer bestonden uit een aan een gelieerde werkmaatschappij verhuurd bedrijfspand en waarvan de schulden onder meer een pensioen- en een stamrechtverplichting omvatten. De Hoge Raad oordeelt dat bij het begrip ondernemingsvermogen van art. 35b lid 3 SW (oud) een onderneming in materiële zin is bedoeld, zodat de ondernemingsficties van art. 4 Wet Vpb 1969 niet van toepassing zijn; dat sluit aan bij de strekking van de faciliteit, namelijk een zoveel mogelijk uniforme behandeling van vermogen dat aan een BV toebehoort en vermogen dat de erflater zelf hield. Beschikt de vennootschap niet over ondernemingsvermogen, dan behoeft de activiteitentoets van art. 35b lid 2 SW (oud) niet meer te worden aangelegd en is voor toepassing van de faciliteit reeds daarom geen plaats; art. 7a Uitvoeringsregeling SW mist dan toepassing omdat een uitsplitsing niet aan de orde is. De oordelen dat de BV met haar pensioen- en stamrechtverplichtingen, met de verhuur van het pand en met haar bestuursactiviteiten geen onderneming drijft, zijn feitelijk en niet onbegrijpelijk. Beroep in cassatie ongegrond. Het materiële ondernemingsbegrip is ook onder de huidige BOR (art. 35b e.v. SW) leidend.", "rechtsregel": "Onder ondernemingsvermogen in de bedrijfsopvolgingsfaciliteit wordt vermogen van een onderneming in materiële zin verstaan; de ondernemingsficties van art. 4 Wet Vpb 1969 werken daarin niet door. Beschikt de vennootschap niet over ondernemingsvermogen, dan wordt aan de activiteitentoets niet toegekomen en mist de faciliteit toepassing - een pensioen- of stamrecht-BV met normaal vermogensbeheer kwalificeert dus niet.", "wetsartikelen": ["art. 35b SW 1956 (tekst 2004)", "art. 7a Uitvoeringsregeling SW 1956", "art. 4 Wet Vpb 1969"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:PHR:2010:BL0193", "ECLI:NL:RBSGR:2008:BG7399"], "vindplaatsen": ["BNB 2010/286 m.nt. J.C. van Straaten", "FED 2010/93 m.nt. J.W. Zwemmer", "V-N 2010/35.18", "PJ 2011/16"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2010:BL0193"}, {"ecli": "ECLI:NL:PHR:2010:BL0193", "instantie": "Parket bij de Hoge Raad", "datum": "2010-07-09", "gepubliceerd": "2025-07-31", "zaaknummer": "08/05311", "onderwerp": "Bedrijfsopvolgingsfaciliteit art. 35b SW niet voor pensioen-/stamrecht-BV", "samenvatting": "Belanghebbende verkreeg in 2004 krachtens erfrecht de aandelen in een beheer-bv met een eigen vermogen van EUR 3.555.631, waarvan de activiteiten bestonden uit een pensioen- en stamrechtverplichting, de verhuur van een bedrijfspand aan de werkmaatschappij en het bestuurderschap daarvan; de inspecteur weigerde voor die aandelen de bedrijfsopvolgingsfaciliteit van art. 35b SW 1956 (tekst 2004). De A-G concludeert dat de activiteitentoets van het tweede lid en de activatoets van het derde lid gezamenlijk feitelijk slechts kunnen worden doorstaan indien de vennootschap een materiele onderneming drijft, en dat de ondernemingsfictie van art. 4, onderdeel b, Wet Vpb 1969 voor pensioenlichamen niet doorwerkt naar de faciliteit omdat art. 35b, lid 2, spreekt van feitelijke werkzaamheid.", "rechtsregel": "De bedrijfsopvolgingsfaciliteit geldt slechts voor zover de vennootschap een materiele onderneming drijft; de vennootschapsbelastingfictie die pensioen- en verzekeringsactiviteiten als het drijven van een onderneming aanmerkt, werkt daarin niet door.", "wetsartikelen": ["art. 35b SW 1956", "art. 35c SW 1956", "art. 7a Uitvoeringsregeling SW 1956", "art. 2 Wet Vpb 1969", "art. 4 Wet Vpb 1969"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBSGR:2008:BG7399", "ECLI:NL:HR:2010:BL0193"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2010:BL0193"}, {"ecli": "ECLI:NL:HR:2010:BL5593", "instantie": "Hoge Raad", "datum": "2010-06-25", "gepubliceerd": "2025-07-31", "zaaknummer": "09/00603", "onderwerp": "Renteovereenkomst tussen langstlevende en kinderen is fictieve erfrechtelijke verkrijging, geen schenking", "samenvatting": "Zaak onder de SW zoals die tot 2010 luidde (aanslagen recht van schenking). Erflater had bij ouderlijke boedelverdeling bepaald dat over de onderbedelingsvorderingen van de kinderen geen rente verschuldigd was. Binnen de aangiftetermijn van art. 45 SW verplichtte de langstlevende echtgenote zich bij overeenkomst tot betaling van een enkelvoudige rente die overeenkomt met 6 percent samengestelde rente. De inspecteur zag daarin een schenking. De Hoge Raad oordeelt dat de tekst van art. 1 lid 2 SW (oud) zich er niet tegen verzet dat ook een dergelijke overeenkomst valt onder 'een overeenkomst met betrekking tot rentevergoeding als bedoeld in art. 4:13 lid 4 BW': die woorden verwijzen naar elke rentevergoeding - de wettelijke, een testamentair bepaalde of een overeengekomen rente. Ook de wetsgeschiedenis dwingt niet tot een beperktere uitleg; een overeengekomen rente die afwijkt van de testamentair bepaalde rente wordt in beginsel op dezelfde wijze behandeld als een bij testament bepaalde rente, en de wetgever heeft alleen de termijn willen beperken waarbinnen zulke overeenkomsten met erfrechtelijk gevolg kunnen worden gesloten. De verkrijging is dus een (fictieve) verkrijging krachtens erfrecht en geen schenking. De Hoge Raad doet de zaak zelf af en bevestigt de uitspraak van de Rechtbank die de aanslagen had vernietigd. Deze lijn geldt onder het huidige recht onverkort via art. 1 lid 3 SW.", "rechtsregel": "Een binnen de aangiftetermijn gesloten overeenkomst tussen de langstlevende en de kinderen over de rente op de onderbedelingsvordering wordt, ook als die rente afwijkt van de testamentair bepaalde rente, aangemerkt als een overeenkomst met betrekking tot rentevergoeding als bedoeld in art. 4:13 lid 4 BW; de daaruit voortvloeiende verkrijging is een fictieve verkrijging krachtens erfrecht en geen schenking.", "wetsartikelen": ["art. 1 lid 2 SW 1956 (tekst 2004)", "art. 1 lid 5 SW 1956 (tekst 2004)", "art. 45 SW 1956", "art. 4:13 lid 4 BW", "art. 1 lid 3 SW 1956"], "belang": "hoog", "oordeel": "cassatie", "gerelateerd": ["ECLI:NL:PHR:2010:BL5593", "ECLI:NL:GHAMS:2009:BH0142"], "vindplaatsen": ["BNB 2010/274 m.nt. J.C. van Straaten", "FED 2010/87 m.nt. J.W. Zwemmer", "V-N 2010/30.19", "NTFR 2010/1500 m.nt. F.A.M. Schoenmaker"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2010:BL5593"}, {"ecli": "ECLI:NL:PHR:2010:BL5593", "instantie": "Parket bij de Hoge Raad", "datum": "2010-06-25", "gepubliceerd": "2025-07-31", "zaaknummer": "09/00603", "onderwerp": "Renteovereenkomst die afwijkt van testamentaire rente: erfrecht of schenking", "samenvatting": "Erflater had in 1983 een ouderlijke boedelverdeling gemaakt waarbij de overbedelingsvorderingen van de kinderen renteloos waren; binnen acht maanden na zijn overlijden in 2004 kwamen de langstlevende en de kinderen alsnog een rente van 6% overeen, waarop de inspecteur aanslagen recht van schenking naar verkrijgingen van EUR 219.362 per kind oplegde. De A-G concludeert dat art. 1, lid 5, SW 1956 de ouderlijke boedelverdeling gelijkstelt met de wettelijke verdeling, zodat art. 4:13, lid 4, BW van toepassing is, en dat de daarin opgenomen tenzij-bepaling blijkens de parlementaire geschiedenis de testeervrijheid en de contractsvrijheid onverkort laat. De renteovereenkomst valt daarom onder art. 1, lid 2, SW 1956, zodat de aanslagen schenkingsrecht ten onrechte zijn opgelegd.", "rechtsregel": "Een binnen de aangiftetermijn tussen de langstlevende en de kinderen gesloten renteovereenkomst is ook een overeenkomst als bedoeld in art. 4:13, lid 4, BW - en dus een verkrijging krachtens erfrecht in de zin van art. 1, lid 2, SW 1956 - indien daarmee wordt afgeweken van een door de erflater testamentair bepaalde rente.", "wetsartikelen": ["art. 1 SW 1956", "art. 9 SW 1956", "art. 45 SW 1956", "art. 4:13 BW", "art. 4:1167 BW (oud)"], "belang": "hoog", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:GHAMS:2009:BH0142", "ECLI:NL:HR:2010:BL5593"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2010:BL5593"}, {"ecli": "ECLI:NL:HR:2010:BM5123", "instantie": "Hoge Raad", "datum": "2010-05-21", "gepubliceerd": "2025-07-31", "zaaknummer": "09/02715", "onderwerp": "Voortzettingswaarde art. 35c SW (oud): DCF-rekenmodel sluit aftrek van schulden uit; passeren bewijsaanbod", "samenvatting": "Zaak onder de SW zoals die tot 2010 luidde (conserverende aanslag recht van successie, overlijden 2002). De inspecteur berekende de voortzettingswaarde van een agrarische onderneming met het op de discounted cash flow-methode gebaseerde rekenmodel uit het Besluit van 22 februari 2004, nr. CPP2004/322M, en hield daarbij geen rekening met langlopende schulden van EUR 690.729. De Hoge Raad oordeelt dat het Besluit een goedkeuring bevat die van aangenomen gemiddelden uitgaat en dat het onjuist is het rekenmodel buiten die goedkeuring om aan te vullen met gegevens die er nadrukkelijk buiten zijn gehouden: naar de bewoordingen van het Besluit sluit het model aftrek van deze schulden uitdrukkelijk uit. Wel staat het de belastingplichtige vrij de voortzettingswaarde in afwijking van het rekenmodel op andere wijze te berekenen. De opmerking van belanghebbende ter zitting dat zij haar berekening graag zou willen onderbouwen maar 'met de rug tegen de muur' stond, kan bezwaarlijk anders worden opgevat dan als een bewijsaanbod; het Hof was gehouden daarop inhoudelijk in te gaan, ook al werd het aan het slot van de zitting gedaan (vgl. HR 9 mei 2008, BNB 2008/182). Cassatie met verwijzing naar Hof 's-Hertogenbosch. De processuele regel over het gemotiveerd passeren van een bewijsaanbod geldt onverkort onder het huidige recht.", "rechtsregel": "Het in het Besluit van 22 februari 2004, nr. CPP2004/322M, goedgekeurde DCF-rekenmodel voor de voortzettingswaarde van art. 35c SW (oud) mag niet buiten de goedkeuring om worden aangevuld met langlopende schulden die het model uitdrukkelijk buiten beschouwing laat; het staat de belastingplichtige wel vrij de voortzettingswaarde op andere wijze te berekenen, en de rechter moet gemotiveerd ingaan op een ook aan het slot van de zitting gedaan bewijsaanbod. De materiële regel over de voortzettingswaarde is achterhaald door de herziening per 2010.", "wetsartikelen": ["art. 35c SW 1956 (tekst 2002)", "art. 21 lid 4 SW 1956 (tekst 2002)", "art. 8:77 Awb"], "belang": "middel", "oordeel": "verwijzing", "achterhaald": true, "achterhaald_reden": "De voortzettingswaarde van art. 35c SW (oud) en het daarbij horende DCF-rekenmodel zijn per 1 januari 2010 vervallen; de bedrijfsopvolgingsregeling gaat sindsdien uit van de goingconcernwaarde (art. 21 lid 12 en 13 SW) - de processuele regel over het bewijsaanbod blijft wel gelden.", "gerelateerd": ["ECLI:NL:GHARN:2009:BI7470"], "vindplaatsen": ["BNB 2010/261 m.nt. J.C. van Straaten", "V-N 2010/25.6", "NTFR 2010/1855 m.nt. B.B.A. de Kroon"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2010:BM5123"}, {"ecli": "ECLI:NL:HR:2010:BM3294", "instantie": "Hoge Raad", "datum": "2010-05-07", "gepubliceerd": "2025-07-31", "zaaknummer": "09/03967", "onderwerp": "Een conserverende aanslag voor zowel de voorwaardelijk onbelaste als de belaste geconserveerde waarde", "samenvatting": "Zaak onder de SW zoals die tot 2010 luidde (recht van successie, tekst 2004). Belanghebbende verkreeg aandelen in een BV; de waarde werd deels aangemerkt als voorwaardelijk onbelaste geconserveerde waarde (art. 35c lid 2 SW oud) en deels als belaste geconserveerde waarde (art. 35c lid 3 SW oud), en beide werden in een conserverende aanslag begrepen. De Hoge Raad oordeelt dat art. 37 lid 2 in verbinding met art. 31a lid 2 SW (oud) geen onderscheid maakt tussen de soorten geconserveerde waarde en dat art. 35c SW (oud) geen aanwijzing bevat dat voor ieder deel een afzonderlijke aanslag moet worden opgelegd; een gezamenlijke conserverende aanslag voldoet dus aan de wettelijke voorschriften. Wel overweegt de Hoge Raad dat die aanslag mede strekt tot afzonderlijke vaststelling van de aan elk van beide waarden toe te rekenen belasting, zodat een klacht die alleen tot verschuiving tussen die delen strekt niet wegens gebrek aan belang buiten behandeling mag blijven. Beroep in cassatie ongegrond.", "rechtsregel": "Voor de voorwaardelijk onbelaste en de belaste geconserveerde waarde van art. 35c SW (oud) hoefde geen afzonderlijke conserverende aanslag te worden opgelegd; die aanslag strekt wel mede tot afzonderlijke vaststelling van de aan elk deel toe te rekenen belasting, zodat belang bestaat bij een klacht die enkel tot verschuiving tussen beide delen strekt. De regeling is per 1 januari 2010 vervangen door de voorwaardelijke vrijstelling van art. 35b SW.", "wetsartikelen": ["art. 31a SW 1956 (tekst 2004)", "art. 35c SW 1956 (tekst 2004)", "art. 37 SW 1956 (tekst 2004)"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "De bedrijfsopvolgingsregeling van art. 31a en 35c SW (oud), met haar onderscheid tussen voorwaardelijk onbelaste en belaste geconserveerde waarde, is per 1 januari 2010 vervangen door de voorwaardelijke vrijstelling van art. 35b SW.", "gerelateerd": ["ECLI:NL:GHAMS:2009:BJ6176"], "vindplaatsen": ["BNB 2010/249", "V-N 2010/23.16", "NTFR 2010/1148 m.nt. B.B.A. de Kroon"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2010:BM3294"}, {"ecli": "ECLI:NL:HR:2010:BL0105", "instantie": "Hoge Raad", "datum": "2010-04-09", "gepubliceerd": "2025-07-31", "zaaknummer": "08/04248", "onderwerp": "Waardering woning die door de verkrijger werd gehuurd; art. 21 lid 11 SW (oud)", "samenvatting": "Zaak onder de SW zoals die tot 2010 luidde (recht van successie, tekst 2006). Belanghebbende bewoonde ten tijde van het overlijden van zijn moeder de tot de nalatenschap behorende woning; in cassatie moest veronderstellenderwijs worden aangenomen dat die bewoning op een huurovereenkomst berustte. De Hoge Raad oordeelt dat de in algemene bewoordingen gestelde eerste volzin van art. 21 lid 11 SW (oud) ook geldt wanneer de bewoning op huur berust, en dat bij de waardering niet alleen de bewoning zelf, maar ook de persoonlijke rechtsverhouding waarop die bewoning berust buiten beschouwing blijft: gewaardeerd wordt naar de waarde in vrij opleverbare staat. De opmerking in de parlementaire toelichting dat de regeling slechts een verduidelijking van het geldende recht zou zijn, weegt daartegen onvoldoende op. Het beroep op discriminatie faalt: de inwonende erfgenaam en zijn niet-inwonende zuster zijn geen gelijke gevallen omdat hij de waarde in vrij opleverbare staat door verkoop kan realiseren, en evenmin is hij vergelijkbaar met een vruchtgebruiker die de blote eigendom verkrijgt. Beroep in cassatie ongegrond.", "rechtsregel": "Onder art. 21 lid 11 SW (oud) bleef bij een door de verkrijger bewoonde woning niet alleen de bewoning zelf, maar ook de daaraan ten grondslag liggende persoonlijke rechtsverhouding (zoals een huurovereenkomst) buiten beschouwing, zodat naar de waarde in vrij opleverbare staat werd gewaardeerd. Deze bepaling is per 1 januari 2010 vervallen; woningen worden sindsdien op de WOZ-waarde gewaardeerd.", "wetsartikelen": ["art. 21 lid 11 SW 1956 (tekst 2006)", "art. 21 SW 1956", "art. 26 IVBPR", "art. 14 EVRM"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Art. 21 lid 11 SW (oud) is bij de herziening per 1 januari 2010 vervallen: woningen worden sindsdien gewaardeerd op de WOZ-waarde (art. 21 lid 5 SW), met een afzonderlijke regeling voor verhuurde woningen.", "gerelateerd": ["ECLI:NL:PHR:2010:BL0105", "ECLI:NL:RBSGR:2008:BF0152"], "vindplaatsen": ["BNB 2010/219 m.nt. I.J.F.A. van Vijfeijken", "FED 2010/67 m.nt. J.W. Zwemmer", "V-N 2010/18.29"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2010:BL0105"}, {"ecli": "ECLI:NL:PHR:2010:BL0105", "instantie": "Parket bij de Hoge Raad", "datum": "2010-04-09", "gepubliceerd": "2025-07-31", "zaaknummer": "08/04248", "onderwerp": "Art. 21, lid 11, SW 1956: waardering woning die de verkrijger huurde", "samenvatting": "Belanghebbende bewoonde krachtens huurovereenkomst de woning van zijn in 2006 overleden moeder en verkreeg die woning (waarde bij compromis EUR 780.000) voor de helft krachtens erfrecht; in geschil is of bij de waardering voor het recht van successie rekening mag worden gehouden met de waardedruk van zijn huurrecht. De A-G concludeert dat de eerste volzin van art. 21, lid 11, SW 1956 ongeclausuleerd op feitelijke bewoning ziet en dat uit de vierde nota van wijziging bij het Belastingplan 2006 uitdrukkelijk blijkt dat ook bewoning krachtens huurcontract door de verkrijger geen waardedrukkende factor is. Dat de wetgever daarmee een subjectief waarderingsvoorschrift heeft gekozen waardoor broer en zus verschillend worden belast, levert geen verboden discriminatie op.", "rechtsregel": "Bij de verkrijging van een woning door degene die deze woning ten tijde van de verkrijging zelf bewoont, wordt geen waardedrukkend effect van die bewoning in aanmerking genomen, ook niet indien aan de bewoning een huurrecht ten grondslag ligt.", "wetsartikelen": ["art. 21 SW 1956", "art. 26 IVBPR", "art. 14 EVRM"], "belang": "hoog", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:RBSGR:2008:BF0152", "ECLI:NL:HR:2010:BL0105"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2010:BL0105"}, {"ecli": "ECLI:NL:HR:2010:BG1180", "instantie": "Hoge Raad", "datum": "2010-02-26", "gepubliceerd": "2025-07-31", "zaaknummer": "44064", "onderwerp": "Gelijkheidsbeginsel en doorlopende kwijtschelding schenkingsrecht voor Prins Bernhard Cultuurfonds en Rode Kruis", "samenvatting": "Zaak onder de SW zoals die tot 2010 luidde. Een als instelling in de zin van art. 24 lid 4 SW (oud) aangemerkte stichting verkreeg in 2001 een recht op periodieke uitkeringen ter waarde van fl. 15.000.000 en werd daarvoor in het recht van schenking betrokken. Zij beriep zich op het gelijkheidsbeginsel omdat het Prins Bernhard Cultuurfonds en het Nederlandse Rode Kruis op grond van besluiten uit 1946 en 1947 een doorlopende kwijtschelding van schenkingsrecht genoten. De Hoge Raad stelt voorop dat een beroep op het gelijkheidsbeginsel niet kan slagen voor zover de belanghebbende gelijk wil worden behandeld met een instelling die wel voor kwijtschelding op grond van art. 67 SW (oud) in aanmerking komt: de ongelijke behandeling heeft dan een grondslag in de wet die op zichzelf geen ontoelaatbare ongelijke behandeling inhoudt en berust niet op een oogmerk van begunstiging. De stelling dat het kwijtscheldingsbeleid een toereikende wettelijke grondslag mist, was niet voor het Hof aangevoerd en vergt feitelijk onderzoek; daarop kan in cassatie geen acht worden geslagen. Beroep in cassatie ongegrond. Het bijzondere ANBI-tarief van art. 24 lid 4 SW en de kwijtscheldingsbevoegdheid van art. 67 SW zijn per 1 januari 2010 vervangen door de algehele ANBI-vrijstelling, zodat de concrete context van dit arrest is achterhaald; de algemene regel over het gelijkheidsbeginsel bij een in de wet verankerd onderscheid geldt nog wel.", "rechtsregel": "Een beroep op het gelijkheidsbeginsel faalt indien de ongelijke behandeling haar grondslag vindt in de wet zelf, die op dat punt geen ontoelaatbaar onderscheid bevat en niet berust op een oogmerk van begunstiging; de destijds voor het Prins Bernhard Cultuurfonds en het Rode Kruis geldende doorlopende kwijtschelding is per 1 januari 2010 achterhaald door de algehele ANBI-vrijstelling.", "wetsartikelen": ["art. 24 lid 4 SW 1956 (tekst 2001)", "art. 67 SW 1956 (tekst tot 2010)", "art. 81 RO"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Het ANBI-tarief van art. 24 lid 4 SW en de kwijtscheldingsregeling van art. 67 SW (oud), waarop het geschil berustte, zijn per 1 januari 2010 vervangen door de algehele vrijstelling voor ANBI's in art. 32 en 33 SW.", "parallelzaken": ["ECLI:NL:HR:2010:BG1171", "ECLI:NL:HR:2010:BG1120", "ECLI:NL:HR:2010:BG1168"], "gerelateerd": ["ECLI:NL:PHR:2010:BG1180", "ECLI:NL:GHSHE:2007:BA7481"], "vindplaatsen": ["BNB 2010/282 m.nt. I.J.F.A. van Vijfeijken", "FED 2010/32", "V-N 2010/12.6"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2010:BG1180"}, {"ecli": "ECLI:NL:PHR:2010:BG1171", "instantie": "Parket bij de Hoge Raad", "datum": "2010-02-26", "gepubliceerd": "2025-07-30", "zaaknummer": "43475", "onderwerp": "Gelijkheidsbeginsel en kwijtschelding schenkingsrecht ANBI's (PBCF/NRK)", "samenvatting": "Een als algemeen nut beogende instelling gerangschikte stichting die in 2002 een periodieke uitkering geschonken kreeg, werd onder de SW zoals die tot 2010 luidde aangeslagen voor EUR 102.894 recht van schenking (tarief 11%) en beriep zich op het gelijkheidsbeginsel wegens de sinds 1946 respectievelijk 1963 aan het Nederlandse Rode Kruis en het Prins Bernhard Cultuurfonds verleende algehele kwijtschelding. De A-G oordeelt in een gemeenschappelijke bijlage bij vijf conclusies dat die resoluties gepubliceerd begunstigend beleid vormen waarvoor geen afzonderlijk oogmerk van begunstiging is vereist, zodat andere ANBI's zich in beginsel op het gelijkheidsbeginsel kunnen beroepen, maar dat de vergelijking van feitelijke werkzaamheden beslissend is. Omdat het feitelijke oordeel van het hof dat belanghebbendes werkzaamheden niet gelijk zijn aan die van PBCF en NRK het eindoordeel zelfstandig draagt, strekt de conclusie tot ongegrondverklaring.", "rechtsregel": "Bij gepubliceerd begunstigend beleid geldt geen zelfstandig oogmerkvereiste, zodat ook een op een discretionaire kwijtscheldingsbevoegdheid berustend beleid via het gelijkheidsbeginsel kan worden ingeroepen, mits de feitelijke werkzaamheden van de instellingen vergelijkbaar zijn.", "wetsartikelen": ["art. 24 SW 1956", "art. 67 SW 1956", "art. 68 SW 1956", "art. 33 SW 1956", "art. 63 AWR", "art. 4:81 Awb"], "belang": "middel", "oordeel": "ongegrond", "achterhaald": true, "achterhaald_reden": "Verkrijgingen door ANBI's zijn per 1 januari 2006 volledig vrijgesteld, waardoor de kwijtscheldingspraktijk van art. 67 SW 1956 en het daarop gebaseerde onderscheid hun betekenis hebben verloren.", "parallelzaken": ["ECLI:NL:PHR:2010:BG1168", "ECLI:NL:PHR:2010:BG1180", "ECLI:NL:PHR:2010:BG1120"], "gerelateerd": ["ECLI:NL:GHAMS:2006:AY0093", "ECLI:NL:HR:2010:BG1171"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2010:BG1171"}, {"ecli": "ECLI:NL:HR:2010:BL4316", "instantie": "Hoge Raad", "datum": "2010-02-19", "gepubliceerd": "2025-07-31", "zaaknummer": "08/02696", "onderwerp": "Schenking aan twee of meer verkrijgers: geen gezamenlijke aanslag toegestaan", "samenvatting": "Zaak onder de SW zoals die tot 2010 luidde (recht van schenking). Ter zake van een gezamenlijke schenking aan twee belanghebbenden was aan hen gezamenlijk een aanslag opgelegd. De Hoge Raad oordeelt dat bij een schenking aan twee of meer natuurlijke of rechtspersonen ieder van hen afzonderlijk als verkrijger moet worden aangemerkt voor hetgeen door hem wordt verkregen. Omdat de aanslag aan de verkrijger moet worden opgelegd, is het niet toegestaan de verkrijgingen van deze personen in een aan hen gezamenlijk opgelegde aanslag te betrekken. Nu belanghebbenden tegen die handelwijze waren opgekomen, had het Hof de aanslag moeten vernietigen. De Hoge Raad doet de zaak zelf af en vernietigt de aanslag in het recht van schenking. Het uitgangspunt dat per verkrijger wordt geheven en dat de aanslag op naam van de individuele verkrijger moet staan, geldt onverkort onder de huidige Successiewet.", "rechtsregel": "Bij een schenking aan twee of meer verkrijgers geldt ieder van hen afzonderlijk als verkrijger voor hetgeen hij verkrijgt; de aanslag moet aan die individuele verkrijger worden opgelegd, zodat een aan hen gezamenlijk opgelegde aanslag op daartegen gericht bezwaar of beroep moet worden vernietigd.", "wetsartikelen": ["art. 5 AWR", "art. 1 SW 1956 (tekst tot 2010)"], "belang": "hoog", "oordeel": "cassatie", "gerelateerd": ["ECLI:NL:GHARN:2008:BD2376"], "vindplaatsen": ["BNB 2010/270 m.nt. I.J.F.A. van Vijfeijken", "V-N 2010/12.24", "NTFR 2010/1803 m.nt. M.J. Hamer"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2010:BL4316"}, {"ecli": "ECLI:NL:HR:2010:BL3589", "instantie": "Hoge Raad", "datum": "2010-02-12", "gepubliceerd": "2025-07-31", "zaaknummer": "09/00193", "onderwerp": "Schenkingsbegrip: overnameprijs afgestemd op nog juist lonende exploitatie", "samenvatting": "Belanghebbende dreef vanaf 1982 met zijn vader een agrarische maatschap; na ontbinding daarvan zette hij de onderneming voort en verkreeg hij op 3 december 2001 de bedrijfsonroerende zaken voor EUR 651.720,05 (waarvan EUR 22.689,01 werd kwijtgescholden) en het melkquotum om niet. De inspecteur nam een schenking aan voor het verschil met de waarde in het economische verkeer van EUR 1.952.187 en legde een (navorderings)aanslag in het recht van schenking op (SW zoals die tot 2010 luidde). Het Hof onderschreef het oordeel van de rechtbank dat de vader de wil en bewustheid tot bevoordeling had, juist met het oogmerk een rendabele exploitatie mogelijk te maken. De Hoge Raad casseert: uit HR 13 februari 2004, NJ 2004, 653, en HR 20 maart 2009, BNB 2009/179 en 180, volgt dat voor zover waardering beneden de economische waarde noodzakelijk is om voortgezette bedrijfsuitoefening te verzekeren, in het algemeen sprake is van nakoming van een verplichting en niet van de voor een schenking vereiste bevoordelingsbedoeling. Verwijzing volgt voor onderzoek naar de stelling dat de overnameprijs op een nog juist lonende exploitatie was afgestemd.", "rechtsregel": "Voor zover een overdrachtsprijs beneden de waarde in het economische verkeer noodzakelijk is om de voortgezette bedrijfsuitoefening te verzekeren, is in het algemeen sprake van nakoming van een verplichting en ontbreekt de voor een schenking vereiste bedoeling tot bevoordeling.", "wetsartikelen": ["art. 1 lid 2 SW 1956", "art. 81 Wet RO"], "belang": "hoog", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:GHLEE:2008:BG7012"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2010:BL3589"}, {"ecli": "ECLI:NL:HR:2009:BI1127", "instantie": "Hoge Raad", "datum": "2009-09-25", "gepubliceerd": "2025-07-30", "zaaknummer": "07/11028", "onderwerp": "Art. 21 SW: minnelijke waardering bindt niet bij het tweede overlijden", "samenvatting": "Bij het overlijden van de vader in 1998 (ouderlijke boedelverdeling, art. 4:1167 BW oud) werd de echtelijke woning bij minnelijke taxatie op f 1.350.000 gewaardeerd; in augustus 1998 werd zij voor f 2.156.000 verkocht en stelden de erfgenamen de erfdelen en de onderbedelingsvorderingen op dat hogere bedrag vast. Na het overlijden van de moeder in 2003 hield de inspecteur voor de overbedelingsschuld toch de getaxeerde f 1.350.000 aan. De Hoge Raad casseert en doet de zaak zelf af: uit de minnelijke-waarderingsovereenkomst volgt dat partijen zich uitsluitend hebben gebonden aan die waarde voor de heffing van het recht van successie over de nalatenschap van de eerststervende, zodat zij niet eraan in de weg staat dat de erfgenamen bij de uitvoering van de boedelverdeling van de hogere werkelijke waarde uitgaan en dat de overbedelingsschuld bij het tweede overlijden voor dat werkelijke bedrag in aanmerking wordt genomen. Het arrest ziet op het recht van successie onder de SW zoals die tot 2010 luidde.", "rechtsregel": "Een met de inspecteur gesloten overeenkomst tot minnelijke waardering bindt partijen slechts voor de heffing over de nalatenschap waarvoor zij is aangegaan, zodat de erfgenamen bij de uitvoering van de ouderlijke boedelverdeling van de hogere werkelijke waarde mogen uitgaan en de aldus vastgestelde overbedelingsschuld bij het overlijden van de langstlevende voor haar werkelijke bedrag in aftrek komt.", "wetsartikelen": ["art. 21 SW 1956", "art. 4:1167 BW (oud)"], "belang": "hoog", "oordeel": "gegrond", "gerelateerd": ["ECLI:NL:PHR:2009:BI1127", "ECLI:NL:GHARN:2007:BB1493"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2009:BI1127"}, {"ecli": "ECLI:NL:HR:2009:BD0236", "instantie": "Hoge Raad", "datum": "2009-09-25", "gepubliceerd": "2025-07-30", "zaaknummer": "43874", "onderwerp": "Bedrijfsopvolgingsfaciliteiten IW ook voor buitenlandse erfgenaam (art. 56 EG)", "samenvatting": "Belanghebbende, wonend in Canada, erfde in 2001 van zijn in Nederland wonende vader (certificaten van) aandelen die bij hem samen met zijn eigen pakket 4,13 percent uitmaakten en dus geen aanmerkelijk belang vormden. De ontvanger weigerde daarom de bedrijfsopvolgingsfaciliteiten van art. 25 lid 11 en art. 26 lid 4 IW 1990 (tekst 2001) voor het recht van successie, terwijl de in Nederland wonende mede-erfgenamen die faciliteiten via een fictief aanmerkelijk belang wel kregen. De Hoge Raad verwerpt het beroep op art. 4.10 en 4.11 Wet IB 2001, maar oordeelt dat de weigering een beperking van het kapitaalverkeer van art. 56 EG vormt waarvoor geen rechtvaardigingsgrond bestaat: het doel van de faciliteiten - voorkomen dat bedrijfsopvolging door de heffing van successie- of schenkingsrecht wordt bemoeilijkt - maakt de woonplaats van de verkrijger irrelevant, en het verschil in positie in de inkomstenbelasting kan het onderscheid bij de invordering van successierecht niet rechtvaardigen. Verwijzing volgt voor de omvang van de faciliteiten. Het arrest ziet op de bedrijfsopvolgingsregeling zoals die tot 2010 in de Invorderingswet 1990 was geregeld.", "rechtsregel": "Het onthouden van de bedrijfsopvolgingsfaciliteiten voor het successierecht aan een buiten Nederland wonende erfgenaam op de grond dat de verkregen aandelen bij hem niet tot een aanmerkelijk belang zijn gaan behoren, vormt een niet gerechtvaardigde beperking van het vrije kapitaalverkeer van art. 56 EG; het verschil in positie in de inkomstenbelasting tussen binnen- en buitenlandse verkrijgers levert geen rechtvaardigingsgrond op. Deze regel is toegesneden op de tot 2010 in de Invorderingswet 1990 geregelde faciliteiten, die per 1 januari 2010 zijn vervangen door de bedrijfsopvolgingsregeling van art. 35b e.v. SW 1956.", "wetsartikelen": ["art. 25 lid 11 IW 1990", "art. 26 lid 4 IW 1990", "art. 4.6 Wet IB 2001", "art. 4.10 Wet IB 2001", "art. 4.11 Wet IB 2001", "art. 4.16 lid 1 letter e Wet IB 2001", "art. 4.17 Wet IB 2001", "art. 56 EG", "art. 58 lid 1 letter a EG", "art. 20a lid 3 Wet IB 1964", "art. 20a lid 4 Wet IB 1964"], "belang": "middel", "oordeel": "verwijzing", "achterhaald": true, "achterhaald_reden": "De beoordeelde bedrijfsopvolgingsfaciliteiten van art. 25 lid 11 en art. 26 lid 4 IW 1990, met de eis dat de verkregen aandelen bij de verkrijger tot een aanmerkelijk belang gaan behoren, zijn per 1 januari 2010 vervangen door de bedrijfsopvolgingsregeling van art. 35b e.v. SW 1956, die deze eis aan de verkrijger niet meer stelt.", "gerelateerd": ["ECLI:NL:PHR:2009:BD0236"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2009:BD0236"}, {"ecli": "ECLI:NL:PHR:2009:BD0236", "instantie": "Parket bij de Hoge Raad", "datum": "2009-09-25", "gepubliceerd": "2025-03-22", "zaaknummer": "43874", "onderwerp": "Bedrijfsopvolgingsfaciliteit successierecht geweigerd aan in Canada wonende erfgenaam", "samenvatting": "Belanghebbende, wonend in Canada, erfde in 2001 uit de nalatenschap van zijn vader certificaten van aandelen die bij de erflater tot een aanmerkelijk belang behoorden maar bij hem samen met zijn eigen pakket slechts 4,13% vormden; hem is over de aanslag successierecht van EUR 166.742 de voorwaardelijke kwijtschelding en het uitstel van betaling van art. 26, lid 4, en art. 25, lid 11, IW 1990 geweigerd, terwijl zijn in Nederland wonende broers en zusters die faciliteiten wel kregen via een fictief aanmerkelijk belang. De A-G acht het onderscheid niet in strijd met art. 26 IVBPR - de wetgever mag omwille van eenvoud en uitvoerbaarheid differentieren - maar wel een belemmering van het vrije kapitaalverkeer van art. 56 EG-Verdrag: het argument van doeltreffende fiscale controle bij een derde land is disproportioneel nu niet-ingezetenen met een gewoon aanmerkelijk belang de faciliteit wel krijgen.", "rechtsregel": "Het uitsluiten van een niet in Nederland wonende erfgenaam van de bedrijfsopvolgingsfaciliteiten in het successierecht, enkel omdat hij als buitenlands belastingplichtige geen fictief aanmerkelijk belang kan verkrijgen, vormt een disproportionele en dus verboden belemmering van het vrije kapitaalverkeer, ook in verhouding tot derde landen.", "wetsartikelen": ["art. 25 Invorderingswet 1990", "art. 26 Invorderingswet 1990", "art. 35b SW 1956", "art. 35c SW 1956", "art. 4.6 Wet IB 2001", "art. 4.10 Wet IB 2001", "art. 4.11 Wet IB 2001", "art. 4.16 Wet IB 2001", "art. 4.17 Wet IB 2001", "art. 56 EG-Verdrag", "art. 57 EG-Verdrag", "art. 58 EG-Verdrag", "art. 26 IVBPR", "art. 14 EVRM", "art. 1 Eerste Protocol EVRM"], "belang": "middel", "oordeel": "gegrond", "achterhaald": true, "achterhaald_reden": "De eis dat de verkregen aandelen bij de verkrijger aansluitend tot een aanmerkelijk belang gaan behoren is per 1 januari 2002 vervallen en de bedrijfsopvolgingsregeling is sindsdien in art. 35b e.v. SW 1956 ondergebracht, waarin nog slechts eisen aan de erflater en aan voortzetting worden gesteld.", "gerelateerd": ["ECLI:NL:HR:2009:BD0236"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2009:BD0236"}, {"ecli": "ECLI:NL:PHR:2009:BI1127", "instantie": "Parket bij de Hoge Raad", "datum": "2009-09-25", "gepubliceerd": "2025-07-30", "zaaknummer": "07/11028", "onderwerp": "Waardering onderbedelingsvorderingen; binding aan minnelijke waardering", "samenvatting": "Onder de SW zoals die tot 2010 luidde (recht van successie) verkregen de kinderen uit een ouderlijke boedelverdeling in 1998 onderbedelingsvorderingen op erflaatster; de waarde van de tot de eerste nalatenschap behorende woning was toen bij vaststellingsovereenkomst met de Belastingdienst minnelijk bepaald op f 1.350.000, terwijl het pand kort daarna voor f 2.156.000 werd verkocht. Bij het overlijden van erflaatster in 2003 wilden de erfgenamen de overbedelingsschulden in mindering brengen naar de hogere verkoopwaarde (EUR 510.326) in plaats van naar de door de inspecteur gehanteerde EUR 370.367. De A-G concludeert dat art. 21 SW 1956 weliswaar waardering naar de waarde in het economische verkeer ten tijde van de verkrijging vergt, maar dat partijen door de vaststellingsovereenkomst de facto ook de omvang van de overbedelingsvorderingen hebben bepaald, zodat zij daaraan op grond van art. 7:902 BW ook bij het tweede overlijden gebonden zijn.", "rechtsregel": "Een met de inspecteur gesloten vaststellingsovereenkomst (minnelijke waardering) over de waarde van een tot de eerste nalatenschap behorende woning bindt de erfgenamen ook bij de bepaling van de omvang van de daarvan afgeleide overbedelingsvorderingen en -schulden in de nalatenschap van de langstlevende.", "wetsartikelen": ["art. 21 SW 1956", "art. 7:902 BW", "art. 4:1167 BW (oud)"], "belang": "middel", "oordeel": "ongegrond", "gerelateerd": ["ECLI:NL:GHARN:2007:BB1493", "ECLI:NL:HR:2009:BI1127"], "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:PHR:2009:BI1127"}, {"ecli": "ECLI:NL:PHR:2009:BD0239", "instantie": "Parket bij de Hoge Raad", "datum": "2009-09-25", "gepubliceerd": "2025-07-30", "zaaknummer": "43875", "onderwerp": "Bedrijfsopvolgingsfaciliteit IW 1990 en vrij kapitaalverkeer (Canada)", "samenvatting": "Onder de SW zoals die tot 2010 luidde is aan een in Canada wonende zoon ter zake van de verkrijging in 2001 van een pakket van minder dan 5% in een Nederlandse bv een aanslag recht van successie van EUR 166.742 opgelegd; de ontvanger weigerde de bedrijfsopvolgingsfaciliteiten van art. 25, lid 11, en art. 26, lid 4, IW 1990 omdat de aandelen bij hem niet tot een aanmerkelijk belang gingen behoren. De A-G oordeelt dat een fictief aanmerkelijk belang (art. 4.11 Wet IB 2001) een ander niet kan meetrekken in de zin van art. 4.10 Wet IB 2001, en dat van verboden discriminatie geen sprake is, maar dat het niet verlenen van de faciliteit aan een niet-ingezetene die geen fictief aanmerkelijk belang kan verkrijgen een belemmering van het vrije kap
